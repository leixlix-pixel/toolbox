<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>희망을 노래해 — 수어로, 핸드벨로</title>
<!--
  음악 5학년 2학기 4단원 「음악으로 행복을 나누어요」 78~79쪽
  「꿈꾸지 않으면」 — 수어로 표현하기 + 핸드벨 연주

  수어 다섯 개의 동작은 국립국어원 한국수어사전의 「수형 설명」을 그대로 옮긴 것이다.
    배우다   https://sldict.korean.go.kr/front/sign/signContentsView.do?origin_no=9131
    꿈       https://sldict.korean.go.kr/front/sign/signContentsView.do?origin_no=4530
    가르치다 https://sldict.korean.go.kr/front/sign/signContentsView.do?origin_no=11915
    희망     https://sldict.korean.go.kr/front/sign/signContentsView.do?origin_no=19491
    노래     https://sldict.korean.go.kr/front/sign/signContentsView.do?origin_no=5520
  (사전 영상은 CC BY-NC-ND 라 파일로 담지 않고 링크만 걸었다.)

  교과서 사진은 4단원 PDF 12쪽(교과서 79쪽)에서 잘라냈다.
  악보의 핸드벨 색 순서는 PDF 11쪽(78쪽)을 400dpi 로 렌더해 아이콘 위치와 RGB 를 픽셀로 읽은 것이다.
-->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#22203a; --navy:#3b2a6b; --deep:#4a3288;
  --sky:#7a5cc4; --wind:#2f9e8f; --gold:#d09a2c; --red:#c0392b; --plum:#a24a8e;
  --paper:#f7f4fb; --line:#ddd6ea; --muted:#645d77;
}

html,body{height:100%;background:#140f22;font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}

#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;background:var(--paper);overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}

.slide{position:absolute;inset:0;padding:26px 40px;display:none;
  flex-direction:column;background:var(--paper);--acc:var(--deep)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 8% 4%,rgba(122,92,196,.12),transparent 46%),
             radial-gradient(circle at 96% 97%,rgba(162,74,142,.10),transparent 46%)}
.slide>*{position:relative;z-index:1}

.eyebrow{display:inline-block;font-size:18px;font-weight:700;color:#fff;
  background:var(--acc);padding:4px 16px;border-radius:999px;margin-bottom:6px;align-self:flex-start}
h1.title{font-size:52px;font-weight:900;color:var(--deep);line-height:1.16;letter-spacing:-.02em}
h2.stitle{font-size:34px;font-weight:900;color:var(--acc);line-height:1.2;letter-spacing:-.02em}
.rule{width:84px;height:6px;border-radius:4px;
  background:linear-gradient(90deg,var(--sky),var(--plum));margin:6px 0 12px}
p.body{font-size:23px;line-height:1.5;color:var(--ink);font-weight:500}
p.body+p.body{margin-top:8px}
p.small{font-size:18.5px;line-height:1.45;color:var(--muted);font-weight:500}
b.hl{background:linear-gradient(transparent 58%,rgba(122,92,196,.30) 58%);font-weight:900;color:var(--deep)}
b.hn{background:linear-gradient(transparent 58%,rgba(47,158,143,.30) 58%);font-weight:900;color:#1c7169}
b.hr{background:linear-gradient(transparent 58%,rgba(192,57,43,.24) 58%);font-weight:900;color:var(--red)}
.sp{flex:1;min-height:0}

.cover{justify-content:center;align-items:center;text-align:center;
  background:linear-gradient(155deg,#7a5cc4,#4a3288 55%,#2a1b52)}
.cover h1{color:#fff;font-size:64px}
.cover .sub{color:#ddd0f5;font-size:25px;font-weight:700;margin-top:12px}
.cover .kr{font-family:'Gaegu',sans-serif;font-size:32px;color:#fff;opacity:.95;margin-top:22px;
  border-top:3px solid rgba(255,255,255,.3);padding-top:16px;line-height:1.4}
.cover::after{display:none}

.act{background:#fff;border:3px solid var(--acc);border-radius:15px;padding:13px 18px}
.term{background:#fff8e8;border-left:8px solid var(--gold);border-radius:0 12px 12px 0;
  padding:10px 16px;font-size:19px;line-height:1.45}
.cols{display:flex;gap:16px;flex:1;min-height:0}
.card{background:#fff;border:2px solid var(--line);border-radius:13px;padding:12px 15px;
  box-shadow:0 3px 10px rgba(50,30,90,.07)}

.btn{font-family:inherit;font-size:19px;font-weight:700;border:0;border-radius:11px;
  padding:10px 20px;min-height:46px;background:var(--acc);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--acc);border:3px solid var(--acc)}
.btn.on{background:var(--wind)}
.btn:active{transform:translateY(2px)}
.btn.sm{font-size:17px;padding:8px 14px;min-height:40px;border-radius:9px}
.btnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.nums{display:flex;flex-direction:column;gap:9px}
.numrow{display:flex;gap:13px;align-items:flex-start;background:#fff;border:2px solid var(--line);
  border-radius:13px;padding:10px 15px}
.numrow .nn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;
  font-size:20px;font-weight:900;display:grid;place-items:center}
.numrow .nt{font-size:20.5px;line-height:1.38;font-weight:500;color:var(--ink);padding-top:3px}
.numrow .nt b{font-weight:900;color:var(--deep)}

table.cmp{width:100%;border-collapse:collapse;font-size:17.5px}
table.cmp th,table.cmp td{border:2px solid var(--line);padding:5px 9px;text-align:left;line-height:1.32}
table.cmp th{background:var(--acc);color:#fff;font-weight:700;font-size:18px}
table.cmp td.k{font-weight:900;color:var(--navy);white-space:nowrap;background:#f1ecf9}

.ph{background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;min-height:0}
.ph img{width:100%;flex:1;min-height:0;display:block;object-fit:contain}
.ph .cap{font-size:16px;color:var(--muted);font-weight:700;padding:5px 8px;text-align:center;
  background:#f4f0fa;border-top:2px solid var(--line)}

/* ===== 수어 연습기 ===== */
.signwrap{display:flex;gap:15px;flex:1;min-height:0}
.signpad{position:relative;flex:none;width:400px;background:#fff;border:3px solid var(--line);
  border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.signpad svg.fig{flex:1;min-height:0;width:100%;display:block}
.signpad .handtag{position:absolute;top:8px;left:10px;font-size:15.5px;font-weight:900;
  color:#fff;background:var(--plum);padding:3px 10px;border-radius:999px}
.signpad .mirrortag{position:absolute;top:8px;right:10px;font-size:15px;font-weight:900;
  color:var(--muted)}
.signside{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.steps{display:flex;flex-direction:column;gap:7px}
.steprow{display:flex;gap:11px;align-items:flex-start;background:#fff;border:2px solid var(--line);
  border-radius:12px;padding:8px 13px;transition:background .12s,border-color .12s}
.steprow.on{background:#efe8fc;border-color:var(--sky)}
.steprow .sn{flex:none;width:31px;height:31px;border-radius:50%;background:var(--line);color:var(--muted);
  font-size:17px;font-weight:900;display:grid;place-items:center;transition:background .12s,color .12s}
.steprow.on .sn{background:var(--sky);color:#fff}
.steprow .st{font-size:19.5px;line-height:1.35;font-weight:500;color:var(--ink);padding-top:3px}
.steprow .st b{font-weight:900;color:var(--deep)}
.dictbox{background:#fff8e8;border-left:8px solid var(--gold);border-radius:0 12px 12px 0;
  padding:9px 14px;font-size:17.5px;line-height:1.42;color:#5b4a22}
.dictbox .src{display:block;font-size:14.5px;color:#8a7440;font-weight:700;margin-top:3px}
.whybox{background:#eef8f6;border:2px solid #9dd5cc;border-radius:12px;padding:9px 14px;
  font-size:18.5px;line-height:1.4;color:#1f5f58}
.whybox b{color:#12746a;font-weight:900}

/* ===== 핸드벨 ===== */
.bells{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.bellbtn{position:relative;border:0;background:transparent;cursor:pointer;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.bellbtn svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 5px rgba(40,20,80,.25))}
.bellbtn .nm{font-size:19px;font-weight:900;color:var(--ink);line-height:1}
.bellbtn .nm small{display:block;font-size:14.5px;color:var(--muted);font-weight:700;margin-top:2px}
.bellbtn:active svg,.bellbtn.ring svg{transform:translateY(3px) rotate(-6deg)}
.bellbtn svg{transition:transform .09s}
.bellbtn.dim{opacity:.32}

.beadrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.bead{width:46px;height:46px;border-radius:50%;border:3px solid rgba(0,0,0,.14);
  display:grid;place-items:center;font-size:18px;font-weight:900;color:rgba(0,0,0,.5)}
.linelab{font-size:19px;font-weight:900;color:var(--muted);width:88px;flex:none}

.bar{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;
  gap:12px;padding:0 16px;background:rgba(22,14,40,.93);color:#fff;z-index:20}
.bar button{font-family:inherit;font-size:17px;font-weight:700;border:0;border-radius:8px;
  padding:6px 14px;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;min-height:32px}
.bar .cnt{font-size:16px;font-weight:700;opacity:.85;margin-left:auto}
.prog{position:absolute;left:0;bottom:44px;height:5px;background:var(--acc);z-index:19;transition:width .2s}
#zl,#zr{position:absolute;top:0;bottom:44px;width:78px;z-index:15;cursor:pointer}
#zl{left:0}#zr{right:0}
.no-print{}
@media print{.bar,#zl,#zr,.prog{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="prog" id="prog"></div>
<div class="bar no-print">
  <button id="pv">◀ 이전</button>
  <button id="nx">다음 ▶</button>
  <button id="fs">⛶ 전체화면</button>
  <span class="cnt"><span id="cn">1</span> / <span id="tn">17</span></span>
</div>
<div id="zl"></div><div id="zr"></div>

/* ============================================================
   수어 그림 엔진
   ------------------------------------------------------------
   사람을 정면(마주 보는 방향)으로 그린다. 손목 위치를 키프레임으로
   주고 어깨→팔꿈치→손목을 2관절로 풀어 팔을 그린다.
   ============================================================ */
const FIG = {
  headC:[180,86], headR:[45,53],
  nose:[180,102], mouth:[180,122], chin:[180,139],
  shoulderR:[100,186], shoulderL:[260,186],   // R = 그림 속 사람의 오른쪽(화면 왼쪽)
  reach:120
};

/* 손 모양 — 손목이 원점(0,0), 손가락이 위(-y)를 향한 상태로 그린다 */
function handPath(shape, bend, tone){
  bend = bend||0;
  const skin = tone==='sub' ? '#e7bb9d' : '#f6d3ba';
  const line = tone==='sub' ? '#b47c5c' : '#c99070';
  const lw=3;
  const g=[];
  const palm=`<rect x="-19" y="-40" width="38" height="44" rx="15" fill="${skin}" stroke="${line}" stroke-width="${lw}"/>`;
  const fing=(x,y1,y2,w,rot)=>`<rect x="${x-w/2}" y="${y2}" width="${w}" height="${y1-y2}" rx="${w/2}"
      fill="${skin}" stroke="${line}" stroke-width="${lw}" transform="rotate(${rot||0} ${x} ${y1})"/>`;
  const thumb=(dir)=>`<rect x="${dir>0?12:-26}" y="-22" width="14" height="30" rx="7"
      fill="${skin}" stroke="${line}" stroke-width="${lw}" transform="rotate(${dir>0?38:-38} ${dir>0?19:-19} -8)"/>`;

  if(shape==='point'){
    // 검지만 편 주먹. bend 가 크면 검지가 구부러진다.
    const len = 40 - 17*bend;
    g.push(palm);
    g.push(fing(-7, -34, -34-len, 15, 0 + 26*bend));
    g.push(thumb(1));
    g.push(`<path d="M -19 -20 q 8 -6 16 0" fill="none" stroke="${line}" stroke-width="2.4" opacity=".5"/>`);
  } else if(shape==='pinky'){
    // 새끼손가락만 편 주먹
    g.push(palm);
    g.push(fing(12, -34, -74, 14, 0));
    g.push(thumb(-1));
  } else if(shape==='flat'){
    // 손바닥을 편 손
    g.push(`<rect x="-21" y="-38" width="42" height="42" rx="14" fill="${skin}" stroke="${line}" stroke-width="${lw}"/>`);
    g.push(fing(-14,-32,-74,14,-6));
    g.push(fing(-1,-34,-80,14,0));
    g.push(fing(12,-32,-76,14,4));
    g.push(fing(23,-28,-62,13,10));
    g.push(thumb(-1));
  } else if(shape==='curved'){
    // 다섯 손가락을 약간 구부려 손끝을 모은 손
    g.push(palm);
    g.push(fing(-13,-32,-62,13,-20));
    g.push(fing(-1,-34,-66,13,-8));
    g.push(fing(10,-32,-62,13,6));
    g.push(fing(20,-28,-54,12,18));
    g.push(thumb(-1));
  } else if(shape==='two'){
    // 검지·중지를 반쯤 구부린 손
    g.push(palm);
    g.push(fing(-9,-34,-66,14,-30));
    g.push(fing(4,-34,-66,14,-16));
    g.push(thumb(1));
  }
  return g.join('');
}

/* 팔 — 어깨에서 손목까지 한 번 굽은 곡선으로 그린다.
   2관절로 풀면 손이 얼굴 가까이 올 때 팔꿈치가 몸 한가운데로 들어가 버린다.
   가까울수록 더 굽는 곡선이 만화에서는 훨씬 자연스럽다. */
function armPath(S,W,side){
  // 팔꿈치는 늘 어깨 바로 아래 바깥에 둔다. 손이 올라가면 팔꿈치도 따라 올라간다.
  const oy=Math.max(12, 44 + (W[1]-S[1])*0.45);
  const E=[S[0]+side*10, S[1]+oy];
  return { d:`M ${S[0]} ${S[1]} L ${E[0]} ${E[1]} L ${W[0]} ${W[1]}`, e:E };
}

function easeIO(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

/* 수어 연습기 하나를 만든다 */
function makeSign(host, key){
  const S = SIGNS[key];
  const pad = host.querySelector('svg.fig');
  const stepEls = [...host.querySelectorAll('.steprow')];
  let mirror=false, speed=1, playing=true, t0=performance.now();

  pad.innerHTML = `
    <g id="world">
      ${bodySVG()}
      ${marksSVG(S.marks)}
      <path id="trail" fill="none" stroke="#a24a8e" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="2 9" opacity=".55"/>
      <g id="armL"></g><g id="armR"></g>
      <g id="handL"></g><g id="handR"></g>
    </g>`;

  const world=pad.querySelector('#world');
  const trail=pad.querySelector('#trail');

  // 손이 지나가는 길을 미리 그려 둔다 — 어디로 움직이는지 한눈에 보인다
  if(S.right){
    const pts=S.right.kf.map(k=>`${k.x},${k.y}`);
    trail.setAttribute('d','M '+pts.join(' L '));
  }

  function sample(arm, u){
    const kf=arm.kf;
    let i=0; while(i<kf.length-2 && u>kf[i+1].t) i++;
    const a=kf[i], b=kf[Math.min(i+1,kf.length-1)];
    const span=Math.max(.0001,b.t-a.t);
    const e=easeIO(Math.min(1,Math.max(0,(u-a.t)/span)));
    return {
      x:a.x+(b.x-a.x)*e, y:a.y+(b.y-a.y)*e,
      rot:a.rot+(b.rot-a.rot)*e, bend:a.bend+(b.bend-a.bend)*e,
      s:a.s
    };
  }

  function drawArm(g, S0, W, side, color){
    const a=armPath(S0,W,side);
    g.innerHTML=`
      <path d="${a.d}" fill="none" stroke="#6a48a4" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${a.d}" fill="none" stroke="${color}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>`;
  }

  function frame(now){
    if(!host.isConnected) return;
    const u = playing ? ((now-t0)/1000*speed/S.dur)%1 : 0;
    if(S.right){
      const r=sample(S.right,u);
      drawArm(pad.querySelector('#armR'), FIG.shoulderR, [r.x,r.y], S.right.side, '#f6d3ba');
      pad.querySelector('#handR').innerHTML =
        `<g transform="translate(${r.x},${r.y}) rotate(${r.rot}) scale(.9)">${handPath(S.right.shape,r.bend)}</g>`;
      stepEls.forEach((el,i)=>el.classList.toggle('on', i===r.s));
    }
    if(S.left){
      const l=sample(S.left,u);
      drawArm(pad.querySelector('#armL'), FIG.shoulderL, [l.x,l.y], S.left.side, '#f6d3ba');
      pad.querySelector('#handL').innerHTML =
        `<g transform="translate(${l.x},${l.y}) rotate(${l.rot}) scale(.9)">${handPath(S.left.shape,l.bend,'sub')}</g>`;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 조작
  const bSlow=host.querySelector('[data-a=slow]'), bPlay=host.querySelector('[data-a=play]'),
        bMir=host.querySelector('[data-a=mirror]');
  if(bSlow) bSlow.onclick=()=>{ speed = speed===1?0.45:1;
    bSlow.classList.toggle('on',speed!==1); bSlow.textContent = speed===1?'🐢 느리게':'🐢 느리게 (켜짐)'; };
  if(bPlay) bPlay.onclick=()=>{ playing=!playing; t0=performance.now();
    bPlay.textContent = playing?'⏸ 멈춤':'▶ 다시'; };
  if(bMir) bMir.onclick=()=>{ mirror=!mirror;
    world.setAttribute('transform', mirror?'translate(360,0) scale(-1,1)':'');
    bMir.classList.toggle('on',mirror);
    host.querySelector('.mirrortag').textContent = mirror?'거울 (마주 보고 시범)':'';
  };
}

/* ============================================================
   핸드벨 — 웹오디오로 소리를 만든다 (파일 없음)
   ============================================================ */
let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume(); return AC; }

function ding(freq, vol){
  const c=ac(), t=c.currentTime, out=c.createGain();
  out.connect(c.destination);
  out.gain.setValueAtTime(0,t);
  out.gain.linearRampToValueAtTime((vol||0.5),t+0.004);
  out.gain.exponentialRampToValueAtTime(0.0001,t+3.4);
  // 금속 종소리 — 배음이 정수배가 아니다
  const parts=[[1,1],[2.0,.55],[3.01,.34],[4.17,.2],[5.43,.12],[6.79,.07]];
  parts.forEach(([m,a],i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=freq*m;
    g.gain.setValueAtTime(a,t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.4/(1+i*0.55));
    o.connect(g); g.connect(out); o.start(t); o.stop(t+3.5);
  });
  // 때리는 순간의 쇳소리
  const n=c.createBufferSource(), buf=c.createBuffer(1,1400,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<1400;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/1400,3);
  n.buffer=buf;
  const nf=c.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=freq*3.2; nf.Q.value=2;
  const ng=c.createGain(); ng.gain.value=0.18;
  n.connect(nf); nf.connect(ng); ng.connect(out); n.start(t);
}

      <p class="body" style="font-size:22px;font-weight:900;color:#1c7169">잘했는지 보는 기준</p>
      <div class="term" style="margin-top:9px;font-size:18px;border-left-color:var(--wind);background:#eef8f6">
        <b>①</b> 수어의 <b>자리와 방향</b>이 맞았는가<br>
        <span style="font-size:16px;color:#4a7a74">(빠르기·예쁨은 보지 않는다)</span></div>
      <div class="term" style="margin-top:7px;font-size:18px;border-left-color:var(--wind);background:#eef8f6">
        <b>②</b> 종을 <b>제때 멈추었는가</b></div>
      <div class="term" style="margin-top:7px;font-size:18px;border-left-color:var(--wind);background:#eef8f6">
        <b>③</b> 셋이 <b>같은 빠르기</b>로 갔는가</div>
      <p class="small" style="margin-top:10px;font-size:17px">누가 더 잘하나가 아니라
        <b style="color:#12746a">셋이 하나로 들리는가</b>를 본다.</p>
    </div>
  </div>
  <div class="sp"></div>
  <div class="term">마지막에 한 번 — <b>소리를 아예 내지 않고</b> 수어로만 한 절을 해 본다.
    소리가 없어도 노래가 전해지는지 느껴 보는 것이 이 차시의 끝이다.</div>
</section>`
];

/* ============================================================
   무대
   ============================================================ */
const stage=document.getElementById('stage');
stage.innerHTML=SLIDES.join('');
const slides=[...stage.querySelectorAll('.slide')];
document.getElementById('tn').textContent=slides.length;

// 이미지 주입
stage.querySelectorAll('img[data-img]').forEach(im=>{
  const k=im.dataset.img; if(IMG[k]) im.src=IMG[k];
});

let cur=0, built={};
function show(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,n)=>s.classList.toggle('on',n===cur));
  document.getElementById('cn').textContent=cur+1;
  document.getElementById('prog').style.width=((cur+1)/slides.length*100)+'%';
  history.replaceState(null,'','#'+(cur+1));
  const sl=slides[cur];
  if(!built[cur]){
    built[cur]=1;
    const k=sl.dataset.sign;
    if(k && SIGNS[k]) makeSign(sl,k);
    if(k==='chain') buildChain(sl);
    if(sl.querySelector('#bellrow')) makeBells(sl.querySelector('#bellrow'),
      ['C','D','E','F','G','A','B','C2']);
  }
}

/* 다섯 동작을 이어서 재생하는 화면 */
function buildChain(sl){
  const order=['learn','dream','teach','hope','sing'];
  const pad=sl.querySelector('svg.fig');
  const stepEls=[...sl.querySelectorAll('#chainsteps .steprow')];
  let speed=1, playing=true, t0=performance.now(), mirror=false;

  pad.innerHTML=`<g id="world">${bodySVG()}
    <g id="armL"></g><g id="armR"></g><g id="handL"></g><g id="handR"></g></g>`;
  const world=pad.querySelector('#world');

  const total=order.reduce((a,k)=>a+SIGNS[k].dur,0);
  function drawArm(g,S0,W,side){
    const a=armPath(S0,W,side);
    g.innerHTML=`<path d="${a.d}" fill="none" stroke="#6a48a4" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${a.d}" fill="none" stroke="#f6d3ba" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  function sample(arm,u){
    const kf=arm.kf; let i=0; while(i<kf.length-2&&u>kf[i+1].t)i++;
    const a=kf[i],b=kf[Math.min(i+1,kf.length-1)];
    const e=easeIO(Math.min(1,Math.max(0,(u-a.t)/Math.max(.0001,b.t-a.t))));
    return {x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e,rot:a.rot+(b.rot-a.rot)*e,bend:a.bend+(b.bend-a.bend)*e};
  }
  function frame(now){
    if(!sl.isConnected) return;
    let el = playing ? ((now-t0)/1000*speed)%total : 0;
    let idx=0, acc=0;
    for(let i=0;i<order.length;i++){
      if(el < acc+SIGNS[order[i]].dur){ idx=i; break; }
      acc+=SIGNS[order[i]].dur; idx=i;
    }
    const S=SIGNS[order[idx]];
    const u=Math.min(1,(el-acc)/S.dur);
    const r=sample(S.right,u);
    drawArm(pad.querySelector('#armR'),FIG.shoulderR,[r.x,r.y],S.right.side);
    pad.querySelector('#handR').innerHTML=
      `<g transform="translate(${r.x},${r.y}) rotate(${r.rot}) scale(.9)">${handPath(S.right.shape,r.bend)}</g>`;
    if(S.left){
      const l=sample(S.left,u);
      drawArm(pad.querySelector('#armL'),FIG.shoulderL,[l.x,l.y],S.left.side);
      pad.querySelector('#handL').innerHTML=
        `<g transform="translate(${l.x},${l.y}) rotate(${l.rot}) scale(.9)">${handPath(S.left.shape,l.bend,'sub')}</g>`;
    } else {
      pad.querySelector('#armL').innerHTML='';
      pad.querySelector('#handL').innerHTML='';
    }
    stepEls.forEach((e2,i)=>e2.classList.toggle('on',i===idx));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  sl.querySelector('[data-a=slow]').onclick=e=>{ speed=speed===1?0.45:1;
    e.target.classList.toggle('on',speed!==1);
    e.target.textContent=speed===1?'🐢 느리게':'🐢 느리게 (켜짐)'; };
  sl.querySelector('[data-a=play]').onclick=e=>{ playing=!playing; t0=performance.now();
    e.target.textContent=playing?'⏸ 멈춤':'▶ 다시'; };
  sl.querySelector('[data-a=mirror]').onclick=e=>{ mirror=!mirror;
    world.setAttribute('transform',mirror?'translate(360,0) scale(-1,1)':'');
    e.target.classList.toggle('on',mirror);
    sl.querySelector('.mirrortag').textContent=mirror?'거울 (마주 보고 시범)':''; };
}

function fit(){
  const s=Math.min(innerWidth/1280,(innerHeight-46)/720);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize',fit); fit();

document.getElementById('pv').onclick=()=>show(cur-1);
document.getElementById('nx').onclick=()=>show(cur+1);
document.getElementById('zl').onclick=()=>show(cur-1);
document.getElementById('zr').onclick=()=>show(cur+1);
document.getElementById('fs').onclick=()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};
addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown'].includes(e.key)){show(cur+1);e.preventDefault();}
  else if(['ArrowLeft','PageUp'].includes(e.key)){show(cur-1);e.preventDefault();}
  else if(e.key==='Home')show(0);
  else if(e.key==='End')show(slides.length-1);
  else if(e.key==='f'||e.key==='F')document.getElementById('fs').click();
});
let tx=0;
addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
addEventListener('touchend',e=>{
  const d=e.changedTouches[0].clientX-tx;
  if(Math.abs(d)>60) show(cur + (d<0?1:-1));
},{passive:true});

show(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
</script>
