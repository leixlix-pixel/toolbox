<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이모티콘 만들기 — 움직이는 3컷</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1c2430; --navy:#123a63; --navy2:#1d5b95; --red:#c0392b;
  --gold:#c8963e; --green:#2e7d5b; --plum:#7d4a86; --line:#d9d2c4; --muted:#6d6b66;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:#0d1520;color:var(--ink);
  touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;
  display:flex;flex-direction:column}

/* 상단 */
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;
  padding:8px 12px;flex:0 0 auto;flex-wrap:wrap}
.top .ttl{font-size:17px;font-weight:900;margin-right:4px}
.cuts{display:flex;gap:6px}
.cut{background:#1d3350;color:#c7d4e6;border:2px solid transparent;border-radius:9px;
  min-width:52px;min-height:42px;font-size:15px;font-weight:900;font-family:inherit;cursor:pointer}
.cut.on{background:#fff;color:var(--navy);border-color:var(--gold)}
.cut .dot{display:block;font-size:10px;font-weight:700;opacity:.75}
.tbtn{background:#1d3350;color:#e8eef7;border:0;border-radius:9px;padding:0 14px;
  min-height:42px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.tbtn.play{background:var(--green)}
.tbtn.save{background:var(--gold);color:#3a2c10}
.tbtn.gif{background:var(--plum);color:#fff}
.tbtn.rst{background:#7a3b34;color:#fff}
.tbtn.on{background:#fff;color:var(--navy)}
.spacer{margin-left:auto}

/* 무대 */
.mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
.stage{position:relative;width:300px;height:300px;background:#fff;
  border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage canvas.hide{display:none}
.stage canvas.onion{opacity:.22}
.pframe{position:absolute;border:3px dashed var(--navy2);border-radius:6px;display:none;
  pointer-events:none;box-shadow:0 0 0 9999px rgba(18,58,99,.10)}
.pframe.on{display:block}
.hintbox{position:absolute;left:0;right:0;bottom:10px;text-align:center;pointer-events:none}
.hintbox span{background:rgba(18,58,99,.82);color:#fff;font-size:14px;font-weight:700;
  padding:6px 14px;border-radius:999px}

/* 하단 도구 */
.tools{flex:0 0 auto;background:#f6f2e9;padding:8px 10px 10px;display:flex;
  flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row.photo{background:#eef3f8;border:2px solid var(--navy2);border-radius:10px;padding:6px 8px;display:none}
.row.photo.on{display:flex}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.3);flex:0 0 auto}
.sw.on{border-color:var(--navy);transform:scale(1.14)}
.tool{background:#fff;border:2px solid var(--line);border-radius:10px;min-height:44px;
  padding:0 13px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--ink)}
.tool.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.tool.warn{color:var(--red)}
.sz{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.sz.on{border-color:var(--navy2);background:#eaf1f8}
.sz i{display:block;background:var(--ink);border-radius:50%}
.txtin{border:2px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;
  font-size:16px;font-family:inherit;width:150px}
.lab{font-size:13px;font-weight:900;color:var(--muted);margin-right:2px}
.lab.b{color:var(--navy2);font-size:14px}
input[type=file]{display:none}
input[type=range]{width:150px;height:44px;accent-color:var(--navy2)}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--navy)}
.chk input{width:22px;height:22px;accent-color:var(--navy2)}

/* QR */
.qrbtn{background:#fff;border:0;border-radius:9px;padding:4px;cursor:pointer;
  width:44px;height:44px;flex:0 0 auto;line-height:0}
.qrbtn svg{width:100%;height:100%;display:block}
.qrmodal{position:fixed;inset:0;background:rgba(10,18,30,.93);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px}
.qrmodal.on{display:flex}
.qrcard{background:#fff;border-radius:22px;padding:26px 26px 20px;text-align:center;max-width:96vw}
.qrcard svg{width:min(66vmin,460px);height:min(66vmin,460px);display:block;margin:0 auto}
.qrcard .qu{font-size:17px;font-weight:700;color:var(--navy);margin-top:14px;word-break:break-all}
.qrcard .qh{font-size:15px;color:var(--muted);font-weight:600;margin-top:8px}

/* 만드는 중 가림막 · GIF 미리보기 */
.busy{position:fixed;inset:0;background:rgba(10,18,30,.9);z-index:260;display:none;
  align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:900;text-align:center}
.busy.on{display:flex}
.gifmodal{position:fixed;inset:0;background:rgba(10,18,30,.93);z-index:220;
  display:none;align-items:center;justify-content:center;padding:16px}
.gifmodal.on{display:flex}
.gifcard{background:#fff;border-radius:20px;padding:18px;text-align:center;max-width:96vw}
.gifcard img{width:min(58vmin,380px);height:min(58vmin,380px);display:block;margin:0 auto;
  border-radius:12px;border:2px solid var(--line)}
.gifcard .gh{font-size:15px;font-weight:700;color:var(--navy);margin:12px 0 10px;line-height:1.5}
.gifcard .grow{display:flex;gap:8px;justify-content:center}
.gifcard a.tbtn{display:inline-flex;align-items:center;text-decoration:none}

@media (max-width:900px){ .top .ttl{display:none} }
@media (max-width:700px){
  .txtin{width:104px}
  .tbtn{padding:0 10px;font-size:14px}
  input[type=range]{width:104px}
}
</style>
</head>

  <span class="spacer"></span>
  <button class="tbtn" onclick="pickPhoto()">사진 넣기</button>

<div class="mid">
  <div class="stage" id="stage">
    <canvas id="b0"></canvas>
    <canvas id="b1" class="hide"></canvas>
    <canvas id="b2" class="hide"></canvas>
    <canvas id="c0"></canvas>
    <canvas id="c1" class="hide"></canvas>
    <canvas id="c2" class="hide"></canvas>
    <div class="pframe" id="pframe"></div>
    <div class="hintbox" id="hint"></div>
  </div>
</div>

<div class="tools">
  <div class="row photo" id="photorow">
    <span class="lab b">사진</span>
    <button class="tool" onclick="photoStep(0,-24)">←</button>
    <button class="tool" onclick="photoStep(0,24)">→</button>
    <button class="tool" onclick="photoStep(1,-24)">↑</button>
    <button class="tool" onclick="photoStep(1,24)">↓</button>
    <span class="lab b">크기</span>
    <input type="range" id="pscale" min="15" max="260" value="100" oninput="photoScale(this.value)">
    <button class="tool" onclick="photoFill()">꽉 채우기</button>
    <button class="tool on" id="pmoveBtn" onclick="togglePhotoMode()">옮기기 끝내고 그리기</button>
    <button class="tool warn" onclick="clearBg()">🗑 사진 지우기</button>
  </div>
  <div class="row" id="swatches"></div>
  <div class="row">
    <span class="lab">굵기</span>
    <button class="sz" onclick="setSize(7)" id="z7"><i style="width:7px;height:7px"></i></button>
    <button class="sz on" onclick="setSize(16)" id="z16"><i style="width:16px;height:16px"></i></button>
    <button class="sz" onclick="setSize(34)" id="z34"><i style="width:30px;height:30px"></i></button>
    <button class="tool" id="eraserBtn" onclick="toggleEraser()">지우개</button>
    <button class="tool" onclick="undo()">↩ 되돌리기</button>
    <button class="tool warn" onclick="clearCut()">이 컷 지우기</button>
    <button class="tool warn" onclick="resetAll()">전부 새로 시작</button>
    <span class="spacer"></span>
    <input class="txtin" id="txt" placeholder="넣을 글자" maxlength="10">
    <button class="tool" id="textBtn" onclick="armText()">글자 놓기</button>
  </div>
</div>

m1 0h2m1 0h6M3 29.5h2m1 0h2m1 0h4m4 0h1m2 0h1m2 0h2m2 0h1m4 0h2m4 0h1m1 0h2M1 30.5h1m3 0h1m2 0h1m1 0h1m3 0h1m1 0h5m1 0h1m1 0h2m3 0h1m1 0h2m1 0h1m2 0h1M1 31.5h3m1 0h1m1 0h3m4 0h2m3 0h5m1 0h5m2 0h3m2 0h3m1 0h1M1 32.5h3m1 0h1m5 0h6m1 0h3m1 0h3m1 0h2m1 0h1m3 0h1m1 0h1m3 0h1m1 0h1M1 33.5h3m2 0h2m2 0h2m1 0h1m2 0h5m2 0h1m2 0h1m2 0h2m1 0h8M9 34.5h1m4 0h1m1 0h2m1 0h1m3 0h2m2 0h2m1 0h2m1 0h1m3 0h2m1 0h1M1 35.5h7m1 0h1m2 0h1m2 0h3m1 0h1m1 0h4m2 0h4m1 0h2m1 0h1m1 0h2M1 36.5h1m5 0h1m2 0h2m2 0h1m4 0h2m3 0h3m3 0h1m1 0h2m3 0h2m1 0h2M1 37.5h1m1 0h3m1 0h1m1 0h1m2 0h1m2 0h1m1 0h2m1 0h1m2 0h4m1 0h1m3 0h6m2 0h1M1 38.5h1m1 0h3m1 0h1m1 0h2m1 0h4m1 0h2m4 0h2m2 0h7m2 0h1m3 0h2M1 39.5h1m1 0h3m1 0h1m2 0h1m4 0h2m1 0h5m2 0h5m1 0h1m1 0h2m1 0h2m2 0h2M1 40.5h1m5 0h1m2 0h1m1 0h1m2 0h2m2 0h3m1 0h2m2 0h1m1 0h1m4 0h1m2 0h3m1 0h1M1 41.5h7m4 0h1m3 0h2m2 0h4m1 0h1m3 0h1m3 0h2m2 0h1"/></svg>

<div class="busy" id="busy"><div>GIF 만드는 중…<br><span style="font-size:15px;font-weight:700">잠깐만 기다리세요</span></div></div>

<script>
const N = 700;                       /* 캔버스 실제 해상도 */
const cv = [0,1,2].map(i => document.getElementById("c"+i));   /* 그림 층 */
const bv = [0,1,2].map(i => document.getElementById("b"+i));   /* 사진 층 */
const cx = cv.map(c => { c.width=N; c.height=N; return c.getContext("2d"); });
const bx = bv.map(c => { c.width=N; c.height=N; return c.getContext("2d"); });

/* 사진은 컷마다 따로 둔다 — 컷마다 다른 사진을 넣으면 사진으로도 움직인다 */
const photos = [null,null,null];     /* {img, src, x, y, s} · x,y 는 가운데 자리 */

let cut = 0, color = "#1c2430", size = 16, eraser = false, textMode = false;
let playing = false, playTimer = null, onion = false, photoMode = false;
const hist = [[],[],[]];

/* ── 색 ─────────────────────────────────────────────── */
const COLORS = ["#1c2430","#ffffff","#e74c3c","#e67e22","#f1c40f","#2ecc71",
                "#1d5b95","#7d4a86","#ff8fb1","#8b5a2b","#f6c9a8"];
document.getElementById("swatches").innerHTML =
  '<span class="lab">색</span>' + COLORS.map((c,i) =>
    '<button class="sw' + (i===0?" on":"") + '" id="sw'+i+'" style="background:'+c+'" onclick="setColor(\''+c+'\','+i+')"></button>'
  ).join("");

function setColor(c,i){
  color=c; eraser=false;
  document.getElementById("eraserBtn").classList.remove("on");
  COLORS.forEach((_,n)=>document.getElementById("sw"+n).classList.toggle("on", n===i));
}
function setSize(s){
  size=s;
  [7,16,34].forEach(v=>document.getElementById("z"+v).classList.toggle("on", v===s));
}
function toggleEraser(){
  eraser=!eraser;
  document.getElementById("eraserBtn").classList.toggle("on", eraser);
}

/* ── 컷 ─────────────────────────────────────────────── */
function setCut(i){
  if (playing) togglePlay();
  cut=i;
  [0,1,2].forEach(n=>{
    document.getElementById("k"+n).classList.toggle("on", n===i);
    bv[n].classList.toggle("hide", n!==i);
    cv[n].classList.toggle("hide", n!==i && !(onion && n===i-1));
    cv[n].classList.toggle("onion", onion && n===i-1);
  });
  setPhotoMode(photoMode && !!photos[cut]);
  drawFrame();
  if (i>0 && onion) hint("앞 컷이 흐리게 비친다 — 조금씩 바꿔 그려 보자");
}
function toggleOnion(){
  onion=!onion;
  document.getElementById("onionBtn").classList.toggle("on", onion);
  setCut(cut);
}

/* ── 사진 ───────────────────────────────────────────── */
function pickPhoto(){ document.getElementById("file").click(); }

document.getElementById("file").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{ usePhoto(shrink(im, /png/i.test(f.type||"")), cut, true); };
    im.onerror=()=>hint("사진을 읽지 못했다 — 다른 사진을 골라 보자");
    im.src=rd.result;
  };
  rd.onerror=()=>hint("사진을 읽지 못했다 — 다른 사진을 골라 보자");
  rd.readAsDataURL(f);
  e.target.value="";
});

/* 태블릿 사진은 몇 MB 씩 된다. 무대가 700px 이라 긴 쪽을 900px 로 줄여도 하나도 안 흐려지고,
   줄여야 자동 저장(아래)에 들어가고 그리기도 안 느려진다. */
function shrink(im, keepAlpha){
  const M=900, k=Math.min(1, M/Math.max(im.width,im.height));
  const w=Math.max(1,Math.round(im.width*k)), h=Math.max(1,Math.round(im.height*k));
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(im,0,0,w,h);
  if (keepAlpha){                      /* 투명한 PNG 는 투명을 지켜 준다 — 너무 크면 포기 */
    const png=c.toDataURL("image/png");
    if (png.length < 700000) return png;
  }
  return c.toDataURL("image/jpeg",0.85);
}

/* 줄여 둔 그림 자료(src)를 함께 들고 다녀야 새로고침 뒤에도 사진이 되살아난다 */
function usePhoto(src, at, fresh, x, y, s){
  const img=new Image();
  img.onload=()=>{
    photos[at] = { img:img, src:src,
      x:(x===undefined?N/2:x), y:(y===undefined?N/2:y), s:(s===undefined?1:s) };
    redrawPhoto(at);
    if (at===cut && fresh) setPhotoMode(true); else updatePhotoRow();
    if (fresh) hint("사진을 끌어서 옮기고, 두 손가락으로 벌려 크기를 바꿔 보자");
    if (fresh) markDirty();
  };
  img.src=src;
}

/* s = 1 이면 사진의 긴 쪽이 캔버스의 70% */
function photoRect(p){
  const base = N*0.7/Math.max(p.img.width, p.img.height);
  const w = p.img.width*base*p.s, h = p.img.height*base*p.s;
  return { x:p.x-w/2, y:p.y-h/2, w:w, h:h };
}
function redrawPhoto(i){
  bx[i].clearRect(0,0,N,N);
  const p=photos[i]; if(!p) return;
  const r=photoRect(p);
  bx[i].drawImage(p.img, r.x, r.y, r.w, r.h);
  if (i===cut) drawFrame();
}
function drawFrame(){
  const fr=document.getElementById("pframe");
  const p=photos[cut];
  if (!photoMode || !p || playing){ fr.classList.remove("on"); return; }
  const r=photoRect(p), st=document.getElementById("stage");
  const k=st.clientWidth/N;
  fr.style.left=(r.x*k)+"px"; fr.style.top=(r.y*k)+"px";
  fr.style.width=(r.w*k)+"px"; fr.style.height=(r.h*k)+"px";
  fr.classList.add("on");
}
/* 사진이 있으면 이 줄은 늘 보인다.
   예전에는 '옮기기'를 끄면 줄째로 숨어서 사진을 지울 길도 다시 옮길 길도 없었다. */
function updatePhotoRow(){
  const p=photos[cut];
  document.getElementById("photorow").classList.toggle("on", !!p);
  if (p) document.getElementById("pscale").value = Math.round(p.s*100);
  const b=document.getElementById("pmoveBtn");
  b.classList.toggle("on", photoMode);
  b.textContent = photoMode ? "옮기기 끝내고 그리기" : "사진 옮기기";
}
function setPhotoMode(on){
  photoMode = on && !!photos[cut];
  updatePhotoRow();
  drawFrame();
}
function togglePhotoMode(){
  if (!photos[cut]){ hint("먼저 사진을 넣어 보자"); return; }
  setPhotoMode(!photoMode);
  hint(photoMode ? "사진을 끌어서 옮겨 보자" : "이제 사진 위에 그릴 수 있다");
}
function photoScale(v){
  const p=photos[cut]; if(!p) return;
  p.s = v/100; redrawPhoto(cut); markDirty();
}
function photoStep(axis,d){
  const p=photos[cut]; if(!p) return;
  if (axis===0) p.x+=d; else p.y+=d;
  redrawPhoto(cut); markDirty();
}
function photoFill(){
  const p=photos[cut]; if(!p) return;
  const base = N*0.7/Math.max(p.img.width,p.img.height);
  p.s = (N/Math.min(p.img.width,p.img.height))/base;   /* 짧은 쪽이 캔버스를 채운다 */
  p.x=N/2; p.y=N/2;
  document.getElementById("pscale").value=Math.round(p.s*100);
  redrawPhoto(cut); markDirty();
  hint("사진이 화면을 꽉 채웠다");
}
function clearBg(){
  photos[cut]=null; bx[cut].clearRect(0,0,N,N);
  setPhotoMode(false); markDirty();
  hint((cut+1)+"컷의 사진을 지웠다 — 그림은 그대로 남아 있다");
}

/* ── 그리기 · 사진 옮기기 ───────────────────────────── */
function pos(e){
  const r = cv[cut].getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*N, y:(e.clientY-r.top)/r.height*N };
}
function push(){
  const h=hist[cut];
  h.push(cv[cut].toDataURL());
  if (h.length>8) h.shift();
}

const ptrs = new Map();      /* 눌린 손가락들 — 두 개면 크기 조절 */
let drawing=false, pinch=null, dragFrom=null;

function down(e){
  if (playing) return;
  const p=pos(e);

  if (photoMode && photos[cut]){
    ptrs.set(e.pointerId, p);
    if (ptrs.size===2){
      const [a,b]=[...ptrs.values()];
      pinch = { d:Math.hypot(a.x-b.x, a.y-b.y), s:photos[cut].s };
      drawing=false;
    } else {
      dragFrom = { px:photos[cut].x, py:photos[cut].y, x:p.x, y:p.y };
    }
    try { cv[cut].setPointerCapture(e.pointerId); } catch(err) {}
    return;
  }

  if (textMode){ placeText(p); return; }
  push();
  drawing=true;
  const g=cx[cut];
  g.globalCompositeOperation = eraser ? "destination-out" : "source-over";
  g.strokeStyle=color; g.fillStyle=color;
  g.lineWidth=size; g.lineCap="round"; g.lineJoin="round";
  g.beginPath(); g.moveTo(p.x,p.y);
  g.lineTo(p.x+0.01,p.y);
  g.stroke();
  try { cv[cut].setPointerCapture(e.pointerId); } catch(err) {}
}

function move(e){
  const p=pos(e);

  if (photoMode && photos[cut] && ptrs.size){
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, p);
    const ph=photos[cut];
    if (ptrs.size>=2 && pinch){
      const [a,b]=[...ptrs.values()];
      const d=Math.hypot(a.x-b.x, a.y-b.y);
      ph.s = Math.min(2.6, Math.max(0.15, pinch.s * (d/pinch.d)));
      document.getElementById("pscale").value=Math.round(ph.s*100);
    } else if (dragFrom){
      ph.x = dragFrom.px + (p.x-dragFrom.x);
      ph.y = dragFrom.py + (p.y-dragFrom.y);
    }
    redrawPhoto(cut);
    return;
  }

  if (!drawing) return;
  const g=cx[cut];
  g.lineTo(p.x,p.y); g.stroke();
}

function up(e){
  const changed = drawing || !!dragFrom || !!pinch;
  drawing=false;
  if (e && ptrs.has(e.pointerId)) ptrs.delete(e.pointerId);
  if (ptrs.size<2) pinch=null;
  if (ptrs.size===0) dragFrom=null;
  if (changed) markDirty();
}

cv.forEach(c=>{
  c.addEventListener("pointerdown", down);
  c.addEventListener("pointermove", move);
  c.addEventListener("pointerup", up);
  c.addEventListener("pointercancel", up);
  c.addEventListener("pointerleave", up);
});

function undo(){
  const h=hist[cut];
  if (!h.length){ hint("되돌릴 것이 없다"); return; }
  const d=h.pop(), img=new Image();
  const at=cut;
  img.onload=()=>{ cx[at].globalCompositeOperation="source-over";
    cx[at].clearRect(0,0,N,N); cx[at].drawImage(img,0,0); markDirty(); };
  img.src=d;
}
function clearCut(){
  push(); cx[cut].clearRect(0,0,N,N); markDirty();
  hint((cut+1)+"컷의 그림을 지웠다 — 되돌리기로 살릴 수 있다 (사진은 그대로)");
}

/* ── 글자 ───────────────────────────────────────────── */
function armText(){
  const t=document.getElementById("txt").value.trim();
  if (!t){ hint("먼저 넣을 글자를 적어 보자"); return; }
  if (photoMode) setPhotoMode(false);
  textMode=true;
  document.getElementById("textBtn").classList.add("on");
  hint("글자를 놓을 자리를 톡 누르세요");
}
function placeText(p){
  const t=document.getElementById("txt").value.trim();
  if (!t) return;
  push();
  const g=cx[cut];
  g.globalCompositeOperation="source-over";
  g.font="900 " + Math.max(38, size*3.4) + "px 'Noto Sans KR', sans-serif";
  g.textAlign="center"; g.textBaseline="middle";
  g.lineWidth=Math.max(6, size*0.5); g.strokeStyle="#fff"; g.lineJoin="round";
  g.strokeText(t,p.x,p.y);
  g.fillStyle=color; g.fillText(t,p.x,p.y);
  textMode=false;
  document.getElementById("textBtn").classList.remove("on");
  markDirty();
  hint("");
}

/* ── 재생 ───────────────────────────────────────────── */
function togglePlay(){
  playing=!playing;
  const b=document.getElementById("playBtn");
  if (playing){
    b.textContent="■ 멈추기"; b.classList.add("on");
    [0,1,2].forEach(n=>cv[n].classList.remove("onion"));
    drawFrame();
    let i=0;
    playTimer=setInterval(()=>{
      [0,1,2].forEach(n=>{
        bv[n].classList.toggle("hide", n!==i);
        cv[n].classList.toggle("hide", n!==i);
      });
      i=(i+1)%3;
    }, 420);
    hint("세 컷이 차례로 바뀐다 — 이것이 움직이는 이모티콘이다");
  } else {
    b.textContent="▶ 움직여 보기"; b.classList.remove("on");
    clearInterval(playTimer);
    setCut(cut);
    hint("");
  }
}

/* ── 저장 ───────────────────────────────────────────── */
function flat(i, g, ox){
  g.fillStyle="#fff"; g.fillRect(ox,0,N,N);
  g.drawImage(bv[i], ox, 0);
  g.drawImage(cv[i], ox, 0);
}
function download(canvas, name){
  const a=document.createElement("a");
  a.download=name; a.href=canvas.toDataURL("image/png");
  document.body.appendChild(a); a.click(); a.remove();
  hint("그림 파일로 내려받았다");
}
function saveOne(){
  const o=document.createElement("canvas"); o.width=N; o.height=N;
  flat(cut, o.getContext("2d"), 0);
  download(o, "emoticon-cut" + (cut+1) + ".png");
}
function saveStrip(){
  const o=document.createElement("canvas"); o.width=N*3; o.height=N;
  const g=o.getContext("2d");
  [0,1,2].forEach(i=>flat(i,g,i*N));
  g.strokeStyle="#d9d2c4"; g.lineWidth=6;
  g.beginPath(); g.moveTo(N,0); g.lineTo(N,N); g.moveTo(N*2,0); g.lineTo(N*2,N); g.stroke();
  download(o, "emoticon-3cut.png");
}

/* ── 자동 저장 ───────────────────────────────────────
   태블릿에서 새로고침하거나 화면이 잠기면 그리던 것이 통째로 날아간다.
   그래서 바뀔 때마다 이 태블릿 안(localStorage)에 담아 두고 켤 때 되살린다.
   밖으로 나가지 않는다 — 이 태블릿에만 남고, '새로 시작'으로 지운다. */
const KEY="emoji-maker-v1";
let saveTimer=null, saveWarned=false;

function markDirty(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow, 600); }

function snapshot(withPhoto){
  return JSON.stringify({ v:1, cut:cut, cuts:[0,1,2].map(i=>({
    draw: cv[i].toDataURL("image/png"),
    photo: (withPhoto && photos[i])
      ? { src:photos[i].src, x:photos[i].x, y:photos[i].y, s:photos[i].s } : null
  }))});
}
function saveNow(){
  clearTimeout(saveTimer); saveTimer=null;
  try { localStorage.setItem(KEY, snapshot(true)); return; } catch(e){}
  /* 자리가 모자라면 사진을 빼고라도 그림은 지킨다 */
  try {
    localStorage.setItem(KEY, snapshot(false));
    if (!saveWarned){ saveWarned=true; hint("자리가 좁아 그림만 저장했다 — 사진은 다시 넣어야 한다"); }
    return;
  } catch(e){}
  if (!saveWarned){ saveWarned=true; hint("자동 저장이 안 된다 — 다 그리면 바로 저장하자"); }
}
function restore(){
  let st=null;
  try { st=JSON.parse(localStorage.getItem(KEY)||"null"); } catch(e){}
  if (!st || !Array.isArray(st.cuts)) return false;
  if (typeof st.cut==="number" && st.cut>=0 && st.cut<3) cut=st.cut;
  st.cuts.forEach((d,i)=>{
    if (!d || i>2) return;
    if (d.photo && d.photo.src) usePhoto(d.photo.src, i, false, d.photo.x, d.photo.y, d.photo.s);
    if (d.draw){
      const im=new Image();
      im.onload=()=>{ cx[i].globalCompositeOperation="source-over"; cx[i].drawImage(im,0,0); };
      im.src=d.draw;
    }
  });
  return true;
}
/* 화면이 잠기거나 다른 앱으로 넘어갈 때는 0.6초를 기다리지 않고 바로 담는다 */
window.addEventListener("pagehide", ()=>{ if (saveTimer) saveNow(); });
document.addEventListener("visibilitychange", ()=>{ if (document.hidden && saveTimer) saveNow(); });

/* 되살아나는 만큼 지우는 길도 있어야 한다 — 태블릿을 다음 사람이 쓴다 */
function resetAll(){
  if (!confirm("그림과 사진을 모두 지우고 새로 시작할까요?")) return;
  if (playing) togglePlay();
  [0,1,2].forEach(i=>{
    cx[i].globalCompositeOperation="source-over"; cx[i].clearRect(0,0,N,N);
    bx[i].clearRect(0,0,N,N); photos[i]=null; hist[i].length=0;
  });
  try { localStorage.removeItem(KEY); } catch(e){}
  clearTimeout(saveTimer); saveTimer=null;
  photoMode=false; textMode=false;
  document.getElementById("textBtn").classList.remove("on");
  cut=0; setCut(0);
  hint("새로 시작한다");
}

/* ── GIF 저장 ─────────────────────────────────────────
   바깥 라이브러리를 쓰지 않고 GIF89a 를 직접 쓴다(이 파일은 의존성이 없어야 한다).
   세 컷을 한꺼번에 놓고 256색으로 줄인 뒤(중앙값 나누기) LZW 로 눌러 담는다. */
const GIF_W = 420, GIF_DELAY = 42;      /* 42/100초 — 화면 재생(420ms)과 같은 빠르기 */

function gifFrames(){
  return [0,1,2].map(i=>{
    const o=document.createElement("canvas"); o.width=GIF_W; o.height=GIF_W;
    const g=o.getContext("2d");
    g.fillStyle="#fff"; g.fillRect(0,0,GIF_W,GIF_W);
    g.drawImage(bv[i],0,0,GIF_W,GIF_W);
    g.drawImage(cv[i],0,0,GIF_W,GIF_W);
    return g.getImageData(0,0,GIF_W,GIF_W).data;
  });
}
/* 색을 5비트씩(32768칸)으로 먼저 모아 두면 중앙값 나누기가 빨라진다 */
function boxOf(ks, hist){
  let mn=[31,31,31], mx=[0,0,0], n=0;
  for (const k of ks){
    n += hist[k];
    const c=[(k>>10)&31,(k>>5)&31,k&31];
    for (let a=0;a<3;a++){ if (c[a]<mn[a]) mn[a]=c[a]; if (c[a]>mx[a]) mx[a]=c[a]; }
  }
  let ax=0, len=-1;
  for (let a=0;a<3;a++){ const d=mx[a]-mn[a]; if (d>len){ len=d; ax=a; } }
  return { ks:ks, ax:ax, len:len, n:n };
}
function quantize(frames){
  const hist=new Uint32Array(32768);
  const bucket=(d,p)=>((d[p]>>3)<<10) | ((d[p+1]>>3)<<5) | (d[p+2]>>3);
  frames.forEach(d=>{ for (let p=0;p<d.length;p+=4) hist[bucket(d,p)]++; });
  const used=[];
  for (let k=0;k<32768;k++) if (hist[k]) used.push(k);
  let boxes=[boxOf(used,hist)];
  while (boxes.length<256){
    let bi=-1, best=0;
    boxes.forEach((b,i)=>{ if (b.ks.length>1 && b.len>best){ best=b.len; bi=i; } });
    if (bi<0) break;
    const b=boxes[bi], sh = b.ax===0 ? 10 : (b.ax===1 ? 5 : 0);
    b.ks.sort((p,q)=>((p>>sh)&31)-((q>>sh)&31));
    /* 픽셀 수의 절반이 되는 자리에서 자른다.
       흰 바탕처럼 한 칸이 절반을 넘으면 절반 자리를 못 찾는데, 그때 1로 두면
       한 칸씩만 떼어내는 헛 나누기가 되어 256번을 잘라도 큰 상자가 그대로 남는다. */
    let acc=0, at=b.ks.length-1;
    for (let i=0;i<b.ks.length-1;i++){ acc+=hist[b.ks[i]]; if (acc*2>=b.n){ at=i+1; break; } }
    boxes.splice(bi,1, boxOf(b.ks.slice(0,at),hist), boxOf(b.ks.slice(at),hist));
  }
  const pal=new Uint8Array(768), lut=new Uint8Array(32768);
  boxes.forEach((b,i)=>{
    let n=0,r=0,g=0,bl=0;
    for (const k of b.ks){ const w=hist[k];
      n+=w; r+=((k>>10)&31)*w; g+=((k>>5)&31)*w; bl+=(k&31)*w; }
    if (!n) n=1;
    pal[i*3]  = Math.round(r/n*255/31);
    pal[i*3+1]= Math.round(g/n*255/31);
    pal[i*3+2]= Math.round(bl/n*255/31);
    for (const k of b.ks) lut[k]=i;
  });
  const idx = frames.map(d=>{
    const a=new Uint8Array(d.length>>2);
    for (let p=0,q=0;p<d.length;p+=4,q++) a[q]=lut[bucket(d,p)];
    return a;
  });
  return { pal:pal, idx:idx };
}
/* GIF 의 LZW — 코드 길이를 늘리는 차례가 어긋나면 그림이 통째로 깨진다 */
function lzw(px, minCode){
  const clear=1<<minCode, eoi=clear+1, maxmax=1<<12;
  let nBits=minCode+1, maxcode=(1<<nBits)-1, free=clear+2;
  const out=[]; let cur=0, bits=0;
  function emit(c){
    cur |= c<<bits; bits+=nBits;
    while (bits>=8){ out.push(cur&255); cur>>=8; bits-=8; }
    if (free>maxcode){ nBits++; maxcode = (nBits===12) ? maxmax : (1<<nBits)-1; }
  }
  let dict=new Map();
  emit(clear);
  let prefix=px[0];
  for (let i=1;i<px.length;i++){
    const c=px[i], key=prefix*256+c, f=dict.get(key);
    if (f!==undefined){ prefix=f; continue; }
    emit(prefix);
    if (free<maxmax) dict.set(key, free++);
    else { emit(clear); dict=new Map(); free=clear+2; nBits=minCode+1; maxcode=(1<<nBits)-1; }
    prefix=c;
  }
  emit(prefix); emit(eoi);
  if (bits>0) out.push(cur&255);
  return out;
}
function gifBytes(w,h,pal,frames,delay){
  const b=[];
  const put=(...a)=>{ for (const v of a) b.push(v&255); };
  const s16=v=>{ b.push(v&255,(v>>8)&255); };
  const str=t=>{ for (let i=0;i<t.length;i++) b.push(t.charCodeAt(i)); };
  str("GIF89a"); s16(w); s16(h); put(0xF7,0,0);
  for (let i=0;i<768;i++) b.push(pal[i]||0);
  put(0x21,0xFF,0x0B); str("NETSCAPE2.0"); put(0x03,0x01,0x00,0x00,0x00);  /* 끝없이 되풀이 */
  frames.forEach(px=>{
    put(0x21,0xF9,0x04,0x04); s16(delay); put(0x00,0x00);
    put(0x2C); s16(0); s16(0); s16(w); s16(h); put(0x00);
    put(0x08);
    const d=lzw(px,8);
    for (let i=0;i<d.length;i+=255){
      const m=Math.min(255, d.length-i);
      b.push(m);
      for (let j=0;j<m;j++) b.push(d[i+j]);
    }
    put(0x00);
  });
  put(0x3B);
  return new Uint8Array(b);
}
function saveGif(){
  if (playing) togglePlay();
  const busy=document.getElementById("busy");
  busy.classList.add("on");
  /* 가림막을 먼저 그리게 한 뒤에 만든다 — 안 그러면 화면이 멈춘 것처럼 보인다 */
  setTimeout(()=>{
    try {
      const q=quantize(gifFrames());
      const url=URL.createObjectURL(new Blob([gifBytes(GIF_W,GIF_W,q.pal,q.idx,GIF_DELAY)],
                                             {type:"image/gif"}));
      const a=document.getElementById("gifdl");
      a.href=url;
      document.getElementById("gifimg").src=url;
      document.getElementById("gifmodal").classList.add("on");
      a.click();                    /* 되는 태블릿에서는 바로 내려받는다 */
      hint("");
    } catch(err){
      hint("GIF 를 만들지 못했다 — 3컷 저장으로 남겨 두자");
    }
    busy.classList.remove("on");
  }, 40);
}
function gifClose(){ document.getElementById("gifmodal").classList.remove("on"); }

/* ── QR ─────────────────────────────────────────────── */
function qrOpen(){ document.getElementById("qrmodal").classList.add("on"); }
function qrClose(){ document.getElementById("qrmodal").classList.remove("on"); }
document.addEventListener("keydown", e => { if (e.key === "Escape"){ qrClose(); gifClose(); } });

/* ── 안내 ───────────────────────────────────────────── */
let hintTimer=null;
function hint(t){
  const h=document.getElementById("hint");
  h.innerHTML = t ? "<span>" + t + "</span>" : "";
  clearTimeout(hintTimer);
  if (t) hintTimer=setTimeout(()=>{ h.innerHTML=""; }, 4600);
}

/* ── 무대를 언제나 정사각형으로 ─────────────────────────
   CSS aspect-ratio 만으로는 세로 화면에서 눌려 그림이 왜곡된다. */
const mid = document.querySelector(".mid");
function fitStage(){
  const s = Math.max(160, Math.min(mid.clientWidth, mid.clientHeight) - 20);
  const st = document.getElementById("stage");
  st.style.width = s + "px";
  st.style.height = s + "px";
  drawFrame();
}
if (window.ResizeObserver) new ResizeObserver(fitStage).observe(mid);
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", fitStage);
fitStage();

const revived = restore();
setCut(cut);
hint(revived ? "지난번에 그리던 것을 되살렸다 — 처음부터 하려면 '새로 시작'"
             : "1컷을 그린 뒤 2·3컷을 조금씩 바꿔 그리면 움직인다");
</script>
