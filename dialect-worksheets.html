<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>표준어와 방언 학습지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --ink:#1b2a33; --navy:#1a3a52; --acc:#2f7d75; --red:#b83227;
  --line:#c8d3da; --muted:#6b7c88; --tint:#f1f7f6; --tint2:#fdf6ec;
}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans KR',sans-serif; color:var(--ink);
  background:#e9edf0; -webkit-print-color-adjust:exact; print-color-adjust:exact;
}

/* ── 화면 안내 바 ── */
.topbar{
  position:sticky; top:0; z-index:9; background:var(--navy); color:#fff;
  padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}
.topbar h1{margin:0; font-size:17px; font-weight:700; letter-spacing:-.3px}
.topbar p{margin:0; font-size:13px; color:#b9cfdd; flex:1; min-width:240px; line-height:1.5}
.topbar button{
  font-family:inherit; font-size:15px; font-weight:700; color:var(--navy); background:#ffd76e;
  border:0; border-radius:8px; padding:11px 22px; min-height:44px; cursor:pointer;
}
.topbar button:active{transform:translateY(1px)}

/* ── A4 ── */
@page{size:A4; margin:0}
.page{
  width:210mm; height:297mm; overflow:hidden; position:relative;
  padding:13mm 15mm 12mm; background:#fff; margin:18px auto;
  display:flex; flex-direction:column;
  box-shadow:0 3px 14px rgba(0,0,0,.14);
  break-after:page; page-break-after:always;
}
.page:last-of-type{break-after:auto; page-break-after:auto}

/* ── 머리 ── */
.head{flex:0 0 auto; border-bottom:2.5px solid var(--navy); padding-bottom:7px; margin-bottom:11px}
.hrow{display:flex; align-items:flex-end; gap:11px}
.no{
  flex:0 0 auto; width:34px; height:34px; border-radius:9px; background:var(--navy); color:#fff;
  font-size:19px; font-weight:900; display:flex; align-items:center; justify-content:center;
}
.htxt{flex:1; min-width:0}
.unit{font-size:10.5px; color:var(--acc); font-weight:700; letter-spacing:1.5px; margin-bottom:1px}
.ttl{font-size:20px; font-weight:900; letter-spacing:-.7px; line-height:1.15}
.name{flex:0 0 auto; font-size:11px; color:var(--muted); padding-bottom:2px; white-space:nowrap}

/* ── 본문 ── */
.pbody{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:space-between; gap:9px}
.sec{display:flex; flex-direction:column; min-height:0}
.sh{display:flex; align-items:center; gap:7px; margin-bottom:5px; flex:0 0 auto}
.sn{
  width:19px; height:19px; border-radius:50%; background:var(--acc); color:#fff;
  font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.st{font-size:13.5px; font-weight:700; letter-spacing:-.3px}
.time{
  font-size:10px; font-weight:700; color:var(--acc); background:var(--tint);
  border:1px solid #cfe3e0; border-radius:20px; padding:2px 8px; margin-left:auto; white-space:nowrap;
}

.situ{
  font-size:12.5px; line-height:1.62; background:var(--tint2); border-left:3.5px solid #e0b96a;
  padding:8px 11px; border-radius:0 6px 6px 0; margin-bottom:6px; flex:0 0 auto;
}
.situ b{font-weight:700; color:var(--red)}
.ask{font-size:13px; font-weight:700; line-height:1.5; margin-bottom:6px; flex:0 0 auto; color:var(--navy)}

.opts{display:flex; flex-wrap:wrap; gap:5px 14px; margin-bottom:6px; flex:0 0 auto}
.opt{display:flex; align-items:center; gap:5px; font-size:12px; line-height:1.3}
.opt i{
  width:12px; height:12px; border:1.6px solid #8fa0ad; border-radius:2.5px;
  flex:0 0 auto; display:block;
}

.collab{display:flex; font-size:10.5px; color:var(--muted); font-weight:700; margin-bottom:2px; flex:0 0 auto}
.collab span:first-child{width:86px; flex:0 0 auto; padding-left:6px}
.collab span:last-child{padding-left:8px}
.hint{font-size:11px; color:var(--muted); line-height:1.5; margin-bottom:5px; flex:0 0 auto}

svg.grid{flex:1 1 0; width:100%; display:block}

/* 교과서 확인 */
.check{
  border:1.5px dashed #b8ccc9; background:#fafdfc; border-radius:7px;
  padding:8px 11px 9px; flex:0 0 auto;
}
.ci{display:flex; align-items:flex-end; gap:6px; font-size:12px; line-height:1.85; margin-top:1px}
.ci:first-child{margin-top:0}
.ci span{flex:0 0 auto}
.ci u{flex:1; min-width:30px; border-bottom:1px solid #b6c4cc; text-decoration:none; height:15px}
.ci em{flex:0 0 auto; font-style:normal; color:var(--muted); font-size:11px}

.more{
  font-size:11.5px; line-height:1.55; color:var(--navy); background:#f4f7fa;
  border-radius:6px; padding:7px 10px; margin-top:6px; flex:0 0 auto;
}
.more b{color:var(--red)}

/* ── 국어 3단원 ── */
.kcards{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; flex:0 0 auto}
.kc{border:1.4px solid #b6c5cd; border-radius:6px; padding:5px 4px 4px; text-align:center; display:flex; flex-direction:column; gap:1px}
.kc b{font-size:13.5px; letter-spacing:-.4px}
.kc small{font-size:9px; color:var(--muted); line-height:1.25; min-height:22px}
.ox{display:flex; justify-content:center; gap:10px; font-size:13px; color:#8fa0ad}
.ox i{font-style:normal}
.krows{display:flex; flex-direction:column; flex:0 0 auto}
.kr{display:flex; align-items:flex-end; gap:8px; font-size:11.5px; height:29px}
.kr span{flex:0 0 118px; font-weight:700; color:var(--navy); padding-bottom:3px}
.kr u{flex:1; border-bottom:1px solid #b6c4cc; text-decoration:none; height:100%}
.scards{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,1fr); gap:0}
.sc{border:1.5px dashed #9fb2bd; margin:-.75px; padding:10px 12px; display:flex; flex-direction:column; gap:5px}
.sch{display:flex; align-items:center; gap:7px; font-size:14px}
.sg{width:24px; height:24px; border-radius:50%; background:var(--navy); color:#fff; font-weight:900; display:flex; align-items:center; justify-content:center; font-size:13px; flex:0 0 auto}
.sch em{margin-left:auto; font-style:normal; font-size:11px; font-weight:700; color:var(--red); background:var(--tint2); border-radius:12px; padding:2px 8px}
.scs{font-size:12px; font-weight:700; color:var(--acc)}
.scb{font-size:11px; line-height:1.6}
.scb em{font-style:normal; color:var(--muted)}
.dcards{flex:1; display:flex; flex-direction:column; gap:0}
.dc{flex:1; border:1.5px dashed #9fb2bd; margin:-.75px; padding:12px 16px; display:flex; flex-direction:column; gap:5px}
.dch{font-size:18px; font-weight:900; color:var(--navy); display:flex; align-items:baseline; gap:10px}
.dch em{font-style:normal; font-size:10.5px; color:var(--muted); font-weight:500}
.dct{font-size:11px; font-weight:700; color:var(--acc); letter-spacing:1px; margin-top:4px}
.dtb{border-collapse:collapse; width:100%; font-size:12.5px}
.dtb td{border-bottom:1px solid #e1e8ec; padding:4px 6px}
.dtb td.k{font-weight:700; width:30%}
.dtb td.p{color:var(--muted); font-size:10.5px; width:14%; text-align:right}
.dcn{font-size:10.5px; color:var(--muted); margin-top:auto}
.stb{border-collapse:collapse; width:100%; font-size:11.5px}
.stb th{background:var(--tint); font-size:10.5px; padding:4px; border:1px solid #b6c5cd}
.stb td{border:1px solid #b6c5cd; padding:4px 6px; height:44px; vertical-align:middle}
.stb td.c{text-align:center; width:44px}
.stb td small{color:var(--muted); font-size:9.5px}
.stb td:nth-child(2){width:120px}
.stb td:nth-child(3){width:58px; text-align:center; color:#8fa0ad}

.foot{
  flex:0 0 auto; margin-top:9px; padding-top:6px; border-top:1px solid var(--line);
  font-size:10px; color:var(--muted); line-height:1.5; display:flex; justify-content:space-between; gap:12px;
}

@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .page{margin:0; box-shadow:none}
}
</style>
</head>

function optsHTML(list){
  if(!list || !list.length) return '';
  return '<div class="opts">' + list.map(o=>'<span class="opt"><i></i>'+o+'</span>').join('') + '</div>';
}
function checkHTML(list){
  return '<div class="check">' + list.map(c=>
    '<div class="ci"><span>'+c[0]+'</span><u></u><em>'+c[1]+'</em></div>'
  ).join('') + '</div>';
}

function pageHTML(s){
  return '<div class="page">'
  + '<div class="head"><div class="hrow">'
  +   '<div class="no">'+s.no+'</div>'
  +   '<div class="htxt"><div class="unit">'+s.unit+' · 교과서 '+s.pages+'쪽</div><div class="ttl">'+s.title+'</div></div>'
  +   '<div class="name">5학년 ___반 이름 __________</div>'
  + '</div></div>'

  + '<div class="pbody">'

  /* ① 혼자 */
  + '<div class="sec grow" style="flex-grow:'+s.g1+'">'
  +   '<div class="sh"><div class="sn">1</div><div class="st">먼저 혼자 생각하기</div><div class="time">혼자 '+tm(s,0)+'분</div></div>'
  +   '<div class="situ">'+s.situ+'</div>'
  +   '<div class="ask">'+s.ask+'</div>'

  +   '<div class="hint">한 사람씩 돌아가며 자기가 쓴 것을 읽습니다. 그다음 자유롭게 이야기하세요. <b>나와 다른 생각을 한 친구만</b> 적으면 됩니다. 같은 생각은 적지 않아도 괜찮습니다.</div>'
  +   '<div class="collab"><span>친구 이름</span><span>나와 달랐던 생각</span></div>'
  +   '<svg class="grid" data-mode="named" data-pitch="27" style="min-height:54px"></svg>'

/* ── 국어 3단원에서 보탠 것 ── */
function tm(s,i){ const d=[3,7,8,4]; return (s.t&&s.t[i])||d[i]; }

/* 1차시 · 표준어 심사 카드 */
function cardsHTML(list){
  if(!list || !list.length) return '';
  return '<div class="kcards">' + list.map(c=>
    '<div class="kc"><b>'+c[0]+'</b><small>'+c[1]+'</small><span class="ox"><i>○</i><i>×</i></span></div>'
  ).join('') + '</div><div class="ask" style="font-size:12px;margin:6px 0 4px">내가 ○를 준 기준</div>';
}
/* 3·8차시 · 이름 붙은 줄 */
function rowsHTML(list){
  if(!list || !list.length) return '';
  return '<div class="krows">' + list.map(r=>'<div class="kr"><span>'+r+'</span><u></u></div>').join('')
       + '</div><div class="ask" style="font-size:12px;margin:6px 0 4px">'+(list.length===4?'네 가지를 나란히 보면, 무엇이 달라졌나요?':'이 인물들에게 같은 점이 있나요?')+'</div>';
}

function headHTML(s,sub){
  return '<div class="head"><div class="hrow">'
  +   '<div class="no">'+s.no+'</div>'
  +   '<div class="htxt"><div class="unit">'+s.unit+' · 교과서 '+s.pages+'쪽'+(sub?' · '+sub:'')+'</div><div class="ttl">'+s.title+'</div></div>'
  +   '<div class="name">'+(sub==='모둠용'?'___모둠 이름 ______________':'5학년 ___반 이름 __________')+'</div>'
  + '</div></div>';
}
function footHTML(s,left,pg){
  return '<div class="foot"><span>'+left+'</span><span>국어 3단원 '+s.no+'/8'+(pg?' · '+pg:'')+'</span></div>';
}

/* 6차시 · 장면 카드 + 대본 틀 + 말 카드 */

  const G = s.groups;
  /* ① 장면 카드 (자르는 쪽) */

    + '<div class="hint" style="margin-bottom:8px">점선을 따라 잘라 모둠에 한 장씩 나눠 줍니다. <b>가·나</b>와 <b>다·라</b>는 같은 장면입니다 — 한쪽은 방언, 한쪽은 표준어로 합니다.</div>'
    + '<div class="scards">' + G.map(g=>
        '<div class="sc"><div class="sch"><span class="sg">'+g[0]+'</span><b>'+g[1]+'</b><em>'+g[3]+'</em></div>'

        + '<div class="scb">'+s.scenes[g[1]]+'</div></div>').join('') + '</div>'
    + footHTML(s,'장면 요약은 옛이야기와 『어린 왕자』의 줄거리를 새로 쓴 것입니다. 원작의 문장을 옮기지 않았습니다.','1/4')
    + '</div>';
  /* ② 대본 틀 (모둠용) */
  let p2 = '<div class="page">' + headHTML(s,'모둠용')
    + '<div class="pbody">'
    + '<div class="sec"><div class="sh"><div class="sn">1</div><div class="st">우리 모둠이 받은 것</div><div class="time">3분</div></div>'
    +   '<div class="krows"><div class="kr"><span>이야기 · 장면</span><u></u></div><div class="kr"><span>쓸 말</span><u></u></div><div class="kr"><span>역할 나누기</span><u></u></div></div></div>'
    + '<div class="sec grow" style="flex-grow:1"><div class="sh"><div class="sn">2</div><div class="st">대본 쓰기 — 8줄 안팎</div><div class="time">15분</div></div>'
    +   '<div class="hint">방언 모둠은 <b>말끝만 바꾸지 말고</b> 말 카드의 낱말을 두세 개 넣어 보세요. 카드에 없는 말은 <b>우리말샘</b>에서 찾습니다. 표준어 모둠은 <b>가장 자연스러운 표준어</b>로 씁니다.</div>'
    +   '<div class="collab"><span>누가</span><span>대사</span></div>'
    +   '<svg class="grid" data-mode="named" data-pitch="30" style="min-height:250px"></svg></div>'
    + '<div class="sec"><div class="sh"><div class="sn">3</div><div class="st">우리가 넣은 방언 낱말 (표준어 모둠은 빈칸)</div></div>'
    +   '<div class="krows"><div class="kr"><span>낱말 · 뜻 · 찾은 곳</span><u></u></div><div class="kr"><span>낱말 · 뜻 · 찾은 곳</span><u></u></div></div></div>'
    + '<div class="sec"><div class="sh"><div class="sn">4</div><div class="st">연습하며 확인</div><div class="time">10분</div></div>'
    +   '<div class="opts"><span class="opt"><i></i>2분 안에 끝난다</span><span class="opt"><i></i>모두 한 번 이상 말한다</span><span class="opt"><i></i>관객 쪽을 보고 말한다</span><span class="opt"><i></i>다른 모둠에 미리 보여 주지 않았다</span></div></div>'
    + '</div>'
    + footHTML(s,'다음 시간에 공연합니다. 웃어도 되는 공연입니다.','2/4')
    + '</div>';
  /* ③④ 말 카드 — 한 쪽에 두 장 */
  const C = s.cardsDialect, pages=[];
  for(let i=0;i<C.length;i+=2){
    pages.push('<div class="page">' + headHTML(s,'말 카드 · 잘라서 모둠에')
      + '<div class="dcards">' + C.slice(i,i+2).map(c=>
          '<div class="dc"><div class="dch">'+c.region+'<em>'+c.src+'</em></div>'
          + '<div class="dct">말끝</div><table class="dtb">'+c.ends.map(e=>'<tr><td class="k">'+e[0]+'</td><td>'+e[1]+'</td><td class="p">'+e[2]+'</td></tr>').join('')+'</table>'

document.getElementById('out').innerHTML = SHEETS.map(s=> s.special==='script' ? scriptPages(s) : s.special==='stage' ? stagePage(s) : pageHTML(s)).join('');

/* ── 격자는 SVG 선으로 긋는다 (CSS 테두리는 인쇄 시 세로선이 사라진다) ── */
function drawGrid(svg){
  const r = svg.getBoundingClientRect();
  const w = Math.round(r.width), h = Math.round(r.height);
  if(w < 20 || h < 20) return;
  const pitch = +svg.dataset.pitch || 28;
  const rows = Math.max(1, Math.round(h / pitch));
  const rh = h / rows;
  let s = '<rect x="0.8" y="0.8" width="'+(w-1.6)+'" height="'+(h-1.6)+'" rx="5" fill="none" stroke="#b6c5cd" stroke-width="1.6"/>';
  for(let i=1;i<rows;i++){
    const y = +(i*rh).toFixed(2);
    s += '<line x1="1.6" y1="'+y+'" x2="'+(w-1.6)+'" y2="'+y+'" stroke="#dce3e9" stroke-width="1.1"/>';
  }
  if(svg.dataset.mode === 'named'){
    s += '<line x1="86" y1="1.6" x2="86" y2="'+(h-1.6)+'" stroke="#dce3e9" stroke-width="1.1"/>';
  }
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('preserveAspectRatio','none');
  svg.innerHTML = s;
}
function drawAll(){ document.querySelectorAll('svg.grid').forEach(drawGrid); }

drawAll();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);
window.addEventListener('load', drawAll);
window.addEventListener('resize', drawAll);
window.addEventListener('beforeprint', drawAll);
