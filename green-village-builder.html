<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>초록 마을 건설단</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#2f3a2c; --muted:#6e7a68; --paper:#fbfaf3; --card:#ffffff; --line:#dfe3d2;
  --green:#3f9b4f; --green-d:#2e7a3b; --leaf:#e6f3dc; --red:#d9534f; --gold:#c98a12;
  --sky:#e8f4f6; --grass:#bfe0a0; --grass2:#b5d995; --river:#8fcbe8; --hill:#cfc29a;
}
html,body{height:100%; overflow:hidden; background:#dfe9d8}
body{font-family:'Noto Sans KR',sans-serif; color:var(--ink); touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
button{font-family:inherit; color:inherit; border:none; background:none; cursor:pointer}
[hidden]{display:none !important}
#wrap{position:fixed; inset:0; display:flex; align-items:center; justify-content:center}
#stage{position:relative; width:1280px; height:720px; background:var(--paper); transform-origin:center; overflow:hidden; flex:0 0 auto}
.jua{font-family:'Jua','Noto Sans KR',sans-serif; font-weight:400}

/* ---------- 위 칸 ---------- */
#top{position:absolute; left:0; top:0; width:1280px; height:72px; display:flex; align-items:center; gap:10px; padding:0 20px; background:#fff; border-bottom:2px solid var(--line)}
#vname{font-size:30px; flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:300px}
.stat{display:flex; align-items:center; gap:6px; background:var(--paper); border:1.5px solid var(--line); border-radius:999px; padding:6px 14px; font-size:19px; white-space:nowrap}
.stat b{font-weight:900}
.stat small{font-size:14px; color:var(--muted)}
#sCoin b{color:var(--gold)}
#sEnergy.bad{border-color:#f1b5b3; background:#fdeeee}
#sEnergy.bad b{color:var(--red)}
.spacer{flex:1}
.ibtn{width:52px; height:52px; border-radius:14px; background:var(--paper); border:1.5px solid var(--line); font-size:24px}
#lvl{font-size:16px; padding:6px 12px; border-radius:999px; background:var(--leaf); color:var(--green-d); font-weight:700; white-space:nowrap}

/* ---------- 지도 ---------- */
#map{position:absolute; left:20px; top:90px; width:800px; height:600px; border-radius:18px; overflow:hidden; box-shadow:0 0 0 4px #fff, 0 6px 18px rgba(40,60,30,.15); transition:filter .8s}
#map.smog{filter:saturate(.55) brightness(.94)}
.tile{position:absolute; width:100px; height:100px; background:var(--grass)}
.tile.g2{background:var(--grass2)}
.tile.river{background:var(--river)}
.tile.river::before{content:'〰️'; position:absolute; left:24px; top:30px; font-size:26px; opacity:.45}
.tile.hill{background:var(--hill)}
.tile .hillmk{position:absolute; left:6px; bottom:4px; font-size:20px; opacity:.8}
.tile .flower{position:absolute; font-size:16px; opacity:.7}
.tile.fog::after{content:''; position:absolute; inset:0; background:rgba(245,248,240,.62)}
.tile.can{cursor:pointer}
.tile.can::after{content:''; position:absolute; inset:8px; border:3px dashed var(--green); border-radius:16px; background:rgba(63,155,79,.12); animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.bld{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:56px}
.bld .badges{position:absolute; left:4px; top:3px; font-size:15px; letter-spacing:-2px}
.bld.cons{font-size:44px}
.bar{position:absolute; left:10px; right:10px; bottom:10px; height:12px; border-radius:6px; background:rgba(0,0,0,.18); overflow:hidden}
.bar i{display:block; height:100%; background:#f0a53a; width:0}
.left{position:absolute; left:0; right:0; bottom:22px; text-align:center; font-size:15px; font-weight:900; color:#5a4214; text-shadow:0 0 3px #fff, 0 0 3px #fff}
.evb{position:absolute; right:2px; top:0; width:44px; height:44px; border-radius:50%; background:#fff; border:3px solid #f0a53a; display:flex; align-items:center; justify-content:center; font-size:24px; animation:bob 1.2s ease-in-out infinite; box-shadow:0 3px 8px rgba(0,0,0,.2)}
@keyframes bob{50%{transform:translateY(-6px)}}
#fogMsg{position:absolute; left:500px; top:250px; width:300px; text-align:center; font-size:19px; font-weight:700; color:#3d5a6b; background:rgba(255,255,255,.9); border-radius:14px; padding:10px; pointer-events:none}
.turb{width:62px; height:78px}
.turb .blades{transform-origin:31px 26px; animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 오른쪽 칸 ---------- */
#panel{position:absolute; left:840px; top:90px; width:420px; height:610px; display:flex; flex-direction:column; gap:10px}
#goal{background:#fff; border:2px solid var(--line); border-radius:16px; padding:12px 16px}
#goal .gh{font-size:15px; color:var(--muted); font-weight:700}
#goal .gt{font-size:20px; font-weight:900; margin-top:2px; line-height:1.35}
#goal .gp{font-size:15px; color:var(--green-d); margin-top:3px}
.tabs{display:flex; gap:6px}
.tabs button{flex:1; min-height:50px; border-radius:12px; background:#fff; border:2px solid var(--line); font-size:18px; font-weight:700; color:var(--muted); position:relative}
.tabs button.on{background:var(--green); border-color:var(--green); color:#fff}
.tabs .cnt{position:absolute; top:-8px; right:-4px; min-width:26px; height:26px; border-radius:13px; background:#f0a53a; color:#fff; font-size:15px; line-height:26px; padding:0 6px}
#pbody{flex:1; min-height:0; overflow-y:auto; background:#fff; border:2px solid var(--line); border-radius:16px; padding:8px 10px}
.card{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 6px; border-bottom:1px solid var(--line)}
.card:last-child{border-bottom:none}
.card .ce{width:54px; height:54px; flex:0 0 54px; border-radius:14px; background:var(--leaf); display:flex; align-items:center; justify-content:center; font-size:32px}
.card .ct{flex:1; min-width:0}
.card .ct b{display:block; font-size:18px}
.card .ct small{display:block; font-size:14px; color:var(--muted); line-height:1.4; word-break:keep-all}
.card .cc{font-size:17px; font-weight:900; color:var(--gold); white-space:nowrap; text-align:right}
.card .cc small{display:block; font-size:13px; color:var(--muted); font-weight:500}
.card.off{opacity:.45}
.card.lock .cc{color:var(--muted); font-size:14px; font-weight:500; white-space:normal; width:92px}
.todo{display:flex; align-items:center; gap:12px; padding:12px 6px; border-bottom:1px solid var(--line)}
.todo .te{font-size:34px}
.todo .tt{flex:1; font-size:17px; line-height:1.4}
.todo .tt small{display:block; font-size:14px; color:var(--muted)}
.gbtn{min-height:50px; padding:0 18px; border-radius:12px; background:var(--green); color:#fff; font-size:18px; font-weight:700}
.gbtn:disabled{background:#cfd6c7; color:#fff}
.gbtn.ghost{background:#fff; color:var(--ink); border:2px solid var(--line)}
.gbtn.red{background:var(--red)}
.empty{padding:26px 10px; text-align:center; color:var(--muted); font-size:17px; line-height:1.6}
.rule{padding:10px 6px; font-size:16px; line-height:1.6; border-bottom:1px solid var(--line)}
.rule b{font-size:18px}
.rule .ok{color:var(--green-d)} .rule .no{color:#9aa391}
#placing{position:absolute; left:20px; top:90px; width:800px; display:flex; justify-content:center; pointer-events:none; z-index:40}
#placing div{margin-top:10px; pointer-events:auto; background:var(--ink); color:#fff; border-radius:999px; padding:8px 8px 8px 20px; display:flex; align-items:center; gap:12px; font-size:18px; box-shadow:0 4px 12px rgba(0,0,0,.25)}
#placing button{background:rgba(255,255,255,.2); color:#fff; border-radius:999px; min-height:40px; padding:0 16px; font-size:16px; font-weight:700}

/* ---------- 창 ---------- */
#modal{position:absolute; inset:0; background:rgba(30,40,25,.45); z-index:100; display:flex; align-items:center; justify-content:center}
#mbox{width:1000px; max-height:680px; overflow-y:auto; background:#fff; border-radius:24px; padding:26px 30px; box-shadow:0 12px 40px rgba(0,0,0,.3); position:relative; animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94); opacity:.4}}
#mbox h2{font-size:32px; font-weight:400; font-family:'Jua','Noto Sans KR',sans-serif}
#mbox .sub{font-size:18px; color:var(--muted); margin-top:4px; line-height:1.55}
.row{display:flex; gap:12px; align-items:center}
.foot{display:flex; gap:12px; align-items:center; justify-content:flex-end; margin-top:20px}
.foot .grow{flex:1; font-size:18px; line-height:1.5}
.big2{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px}
.pick{border:3px solid var(--line); border-radius:18px; padding:20px; text-align:left; background:#fff; min-height:130px}
.pick b{display:block; font-size:26px; font-family:'Jua','Noto Sans KR',sans-serif; font-weight:400}
.pick span{display:block; font-size:17px; color:var(--muted); margin-top:6px; line-height:1.5}
.cols{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:16px}
.col{background:var(--paper); border:2px solid var(--line); border-radius:18px; padding:12px}
.col h3{font-size:22px; font-weight:400; font-family:'Jua','Noto Sans KR',sans-serif}
.col h3 small{font-family:'Noto Sans KR'; font-size:14px; color:var(--muted); margin-left:4px}
.col.na{opacity:.35}
.opt{display:block; width:100%; text-align:left; margin-top:8px; border:2.5px solid var(--line); background:#fff; border-radius:14px; padding:9px 12px; min-height:64px}
.opt b{font-size:18px}
.opt span{display:block; font-size:14px; color:var(--muted); line-height:1.4; word-break:keep-all}
.opt.on{border-color:var(--green); background:var(--leaf)}
.opt .pr{float:right; font-size:14px; color:var(--gold); font-weight:700}
.msg{margin-top:14px; border-radius:14px; padding:12px 16px; font-size:18px; line-height:1.55}
.msg.bad{background:#fdeeee; color:#9b2c29}
.msg.good{background:var(--leaf); color:var(--green-d)}
.msg.info{background:var(--sky); color:#2f5563}
.stamp{position:absolute; right:60px; top:40px; font-family:'Jua','Noto Sans KR',sans-serif; font-size:56px; padding:4px 22px; border:6px solid; border-radius:16px; transform:rotate(-12deg); animation:stamp .35s ease-out}
.stamp.ok{color:var(--green); border-color:var(--green)}
.stamp.no{color:var(--red); border-color:var(--red)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2); opacity:0}}
.rej{margin-top:16px}
.rej div{display:flex; gap:12px; font-size:19px; line-height:1.55; padding:10px 0; border-bottom:1px solid var(--line)}
.rej b{flex:0 0 100px; color:var(--red)}

/* 미니 게임 */
.item{display:flex; align-items:center; gap:18px; margin-top:16px; background:var(--paper); border-radius:18px; padding:14px 20px}
.item .ie{font-size:72px}
.item .in{font-size:28px; font-weight:900}
.item .in small{display:block; font-size:16px; color:var(--muted); font-weight:500}
.bins{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px}
.bin{min-height:86px; border-radius:16px; border:3px solid var(--line); background:#fff; font-size:18px; font-weight:700}
.bin span{display:block; font-size:30px}
.rooms{display:grid; grid-template-columns:repeat(3,150px); gap:12px; justify-content:center; margin-top:16px; background:#8a8f99; padding:16px; border-radius:18px}
.room{height:110px; border-radius:10px; font-size:44px; display:flex; align-items:center; justify-content:center; background:#3b4150}
.room.lit{background:#ffe9a3; box-shadow:inset 0 0 20px rgba(255,190,60,.8)}
.devs{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px}
.dev{border:3px solid var(--line); border-radius:18px; padding:12px; text-align:center; background:#fff}
.dev .de{font-size:52px}
.dev .dn{font-size:17px; font-weight:700; min-height:48px; line-height:1.4; word-break:keep-all}
.sw{margin-top:8px; width:100%; min-height:54px; border-radius:999px; font-size:19px; font-weight:900; background:#39a14e; color:#fff}
.sw.off{background:#9aa391}
.thermo{display:flex; align-items:center; justify-content:center; gap:30px; margin-top:18px}
.thermo .tv{font-size:90px; font-family:'Jua','Noto Sans KR',sans-serif; min-width:220px; text-align:center}
.thermo button{width:96px; height:96px; border-radius:50%; font-size:44px; background:var(--paper); border:3px solid var(--line)}

/* 재난 · 수리 · 고르기 */
#nowDis{font-size:16px; font-weight:700; color:#9b2c29; background:#fdeeee; border:1.5px solid #f1b5b3; border-radius:999px; padding:6px 14px; white-space:nowrap}
#map.dark{filter:brightness(.62) saturate(.7)}
.tile.hurt{background:#e8d9c9}
.tile.hurt .bld{filter:grayscale(.85) brightness(.9); transform:rotate(-4deg)}
.tile .hurtmk{position:absolute; left:3px; bottom:2px; font-size:22px; z-index:2; filter:drop-shadow(0 1px 2px #fff)}
.tile.hurt::after{content:''; position:absolute; inset:0; background:repeating-linear-gradient(45deg,rgba(217,83,79,.13) 0 10px,transparent 10px 20px)}
.evb.fix{border-color:var(--red); animation:shake .5s ease-in-out infinite}
@keyframes shake{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.todo.fix{background:#fdf2f1; border-radius:12px}
.dishd{display:flex; align-items:center; gap:20px; margin-bottom:6px}
.dishd .dise{font-size:74px; flex:0 0 auto; animation:wob 1.6s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-7deg) scale(1.06)}75%{transform:rotate(7deg) scale(1.06)}}
.disask{margin-top:16px; font-size:23px; font-weight:700; line-height:1.5; background:var(--sky); color:#2f5563; border-radius:14px; padding:14px 18px; word-break:keep-all}
.disopts{display:flex; flex-direction:column; gap:10px; margin-top:14px}
.disopt{text-align:left; border:3px solid var(--line); border-radius:16px; background:#fff; padding:15px 18px; font-size:20px; line-height:1.45; word-break:keep-all; min-height:64px}
.disopt.no{border-color:#f1b5b3; background:#fdeeee; color:#9b2c29; opacity:.65}
.qopts{display:flex; flex-direction:column; gap:10px; margin-top:14px}
.qopt{display:flex; align-items:center; gap:16px; text-align:left; border:3px solid var(--line); border-radius:16px; background:#fff; padding:12px 16px; min-height:74px}
.qopt .qe{font-size:40px; flex:0 0 auto}
.qopt b{font-size:20px; font-weight:700; line-height:1.45; word-break:keep-all}
.qopt.no{border-color:#f1b5b3; background:#fdeeee; opacity:.6}
.pick.fix{min-height:120px}
.pick.fix.on{border-color:var(--green); background:var(--leaf)}
.pick:disabled{opacity:.45}
.panelg{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; background:#2f3d4a; padding:12px; border-radius:16px}
.pcell{height:84px; border-radius:8px; background:#4a7fa5; border:2px solid #395f7c; box-shadow:inset 0 0 12px rgba(255,255,255,.25)}
.pcell.dirty{background:#8d7f63; border-color:#6f6350; box-shadow:inset 0 0 14px rgba(60,48,30,.5)}

#toast{position:absolute; left:50%; top:84px; transform:translate(-50%,-10px); z-index:200; background:var(--ink); color:#fff; font-size:20px; padding:12px 24px; border-radius:999px; opacity:0; transition:all .25s; pointer-events:none; white-space:nowrap}
#toast.on{opacity:1; transform:translate(-50%,0)}

/* 시작 화면 */
#start{position:absolute; inset:0; z-index:300; background:linear-gradient(#e8f4f6,#dff0cf); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px}
#start h1{font-family:'Jua','Noto Sans KR',sans-serif; font-weight:400; font-size:76px; color:var(--green-d)}
#start .sub{font-size:22px; color:var(--muted); text-align:center; line-height:1.6}
#start input{font-family:inherit; font-size:30px; text-align:center; width:420px; padding:12px; border-radius:16px; border:3px solid var(--line); margin-top:10px}
#start .gbtn{min-height:70px; font-size:28px; padding:0 50px; border-radius:18px; margin-top:8px}
#qrBox{position:absolute; right:24px; bottom:22px; width:230px; word-break:keep-all; text-align:center; font-size:15px; color:var(--muted); line-height:1.4}
#qr{width:190px; margin:0 auto 6px; background:#fff; border-radius:14px; padding:8px; box-shadow:0 2px 8px rgba(0,0,0,.08)}
#qr svg{display:block; width:100%; height:auto}
#start .scene{font-size:64px; letter-spacing:8px}
.cert{text-align:center; padding:10px 0}
.cert .ce{font-size:90px}
.cert h2{font-size:48px !important; color:var(--green-d)}
.cert p{font-size:21px; line-height:1.7; margin-top:10px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="top">
    <div id="vname" class="jua">초록 마을</div>
    <div class="stat" id="sCoin">🪙 <b id="vCoin">0</b><small id="vRate"></small></div>
    <div class="stat">👥 <b id="vRes">0</b><small id="vJobs"></small></div>
    <div class="stat" id="sEnergy">⚡ <b id="vEnergy">0</b><small id="vEnergySub"></small></div>
    <div class="stat">🌱 <b id="vActs">0</b></div>
    <div class="spacer"></div>
    <div id="nowDis" hidden></div>
    <div id="lvl"></div>
    <button class="ibtn" id="bSet">⚙️</button>
  </div>
  <div id="map"></div>
  <div id="placing" hidden><div><span id="placeTxt"></span><button data-act="cancelPlace">그만</button></div></div>
  <div id="panel">
    <div id="goal"></div>
    <div class="tabs">
      <button data-tab="build" class="on">🏗️ 짓기</button>
      <button data-tab="todo">🌱 할 일<span class="cnt" id="todoCnt" hidden>0</span></button>
      <button data-tab="rule">📋 기준</button>
    </div>
    <div id="pbody"></div>
  </div>
  <div id="modal" hidden><div id="mbox"></div></div>
  <div id="toast"></div>
  <div id="start">
    <div class="scene">🏠🌳☀️🏫🌉</div>
    <h1>초록 마을 건설단</h1>
    <div class="sub" id="startSub">친환경 건물을 설계해 허가를 받고, 짓고, 주민과 함께 마을을 키워요.</div>

  if (S.powerOff > nw) on.push(['⚡ 정전', S.powerOff]);
  if (S.heatOff > nw) on.push(['🥵 폭염', S.heatOff]);

function renderGoal() {

function renderPanel() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  let h = '';
  if (tab === 'build') {
    for (const k of ORDER) {
      const s = ST[k], lock = lockReason(k);
      if (lock) h += `<div class="card lock"><div class="ce">${icon(k)}</div><div class="ct"><b>${s.n}</b><small>${s.desc}</small></div><div class="cc">🔒 ${lock}</div></div>`;
      else h += `<button class="card" data-act="pick" data-k="${k}" data-cost="${s.cost}"><div class="ce">${icon(k)}</div><div class="ct"><b>${s.n}</b><small>${s.desc}</small></div><div class="cc">🪙${s.cost}~<small>⏱ ${mmss(s.time)}</small></div></button>`;
    }
  } else if (tab === 'todo') {
    if (!S.events.length) h = `<div class="empty">지금은 할 일이 없어요.<br>마을이 돌아가면 조금씩 생겨요.<br><small>(한 번에 ${EV_MAX}개까지 쌓여요 · 고칠 일은 따로 쌓여요)</small></div>`;
    const list = S.events.slice().sort((a, c) => (a.type === 'repair' ? -1 : 0) - (c.type === 'repair' ? -1 : 0));
    for (const ev of list) {
      const b = S.map[ev.at];
      if (ev.type === 'repair') {
        if (!b || !b.hurt) continue;
        const soft = b.hurt.soft;
        h += `<div class="todo fix"><div class="te">${soft ? '🔎' : '🚧'}</div><div class="tt">${ST[b.k].n} — ${soft ? '안전 점검' : '수리'}<small>${soft ? '흔들린 뒤엔 꼭 살펴봐요' : '고칠 때까지 멈춰 있어요'} · 🪙${fmt(b.hurt.cost)} 또는 직접</small></div><button class="gbtn red" data-act="event" data-id="${ev.id}">고치러 가기</button></div>`;
        continue;
      }
      const d = EV[ev.type];
      h += `<div class="todo"><div class="te">${d.e}</div><div class="tt">${b ? ST[b.k].n : ''} — ${d.n}<small>${d.sub} · 보상 🪙${reward(ev.type)}</small></div><button class="gbtn" data-act="event" data-id="${ev.id}">하러 가기</button></div>`;
    }
  } else {
    const L = S.level;
    h += `<div class="rule"><b>친환경 건설 구조물이란?</b><br>지을 때, 이용할 때, 허물 때 <b>모든 과정에서</b> 환경에 주는 피해를 줄이도록 만든 구조물이에요.</div>`;
    h += `<div class="rule"><b class="${L >= 1 ? 'ok' : 'no'}">① 이용할 때 ${L >= 1 ? '✅ 지금 기준' : ''}</b><br>에너지를 만들거나 아끼는 장치가 하나 이상 (태양광 · 옥상 정원 · 단열)</div>`;
    h += `<div class="rule"><b class="${L >= 2 ? 'ok' : 'no'}">② 지을 때 ${L >= 2 ? '✅ 지금 기준' : '🔒 구조물 3개 완공 뒤'}</b><br>환경 피해가 적은 재료 (재활용 재료 · 친환경 목재)</div>`;
    h += `<div class="rule"><b class="${L >= 3 ? 'ok' : 'no'}">③ 허물 때 ${L >= 3 ? '✅ 지금 기준' : '🔒 구조물 6개 완공 뒤'}</b><br>나중에 풀어서 다시 쓸 수 있게 (조립식)</div>`;
    h += `<div class="rule" style="border:none;color:var(--muted)">🌉 다리 · 🚲 자전거 도로 같은 토목 구조물과 발전 시설은 <b>지을 때</b>만 봐요.</div>`;
  }

/* =====================================================================

function review(k, d) {

  if (S.level >= 2 && !OPTM[d.build].eco) r.push(['🔨 지을 때', '새 콘크리트는 만드는 과정에서 이산화 탄소가 많이 나와요. 다시 쓰는 재료를 찾아봐요.']);

}

/* =====================================================================
   친환경 행동
   ===================================================================== */
function reward(type) {
  if (type === 'repair') return 0;
  const t = town();
  let r = Math.min(70, 25 + t.res);
  if (type === 'sort' && countDone('recycle')) r *= 2;
  return r;
}
const evFits = (d, b, i) => d.okAt ? d.okAt(b, i) : d.on.includes(b.k);
const chores = () => S.events.filter(e => e.type !== 'repair').length;
function spawnEvents(now) {
  if (!S.nextEv) S.nextEv = now + 20000;
  while (now >= S.nextEv) {
    if (chores() < EV_MAX) {
      const types = shuffle(Object.keys(EV));
      let made = false;
      for (const ty of types) {
        const spots = [];
        S.map.forEach((b, i) => { if (b && b.done && !b.hurt && evFits(EV[ty], b, i) && !S.events.some(e => e.at === i)) spots.push(i); });
        if (spots.length) { S.events.push({ id: Date.now() + Math.random(), type: ty, at: spots[Math.floor(Math.random() * spots.length)] }); made = true; break; }
      }
      if (!made) { S.nextEv = now + EV_EVERY; break; }
    }
    S.nextEv += EV_EVERY;
    if (chores() >= EV_MAX) { S.nextEv = Math.max(S.nextEv, now + EV_EVERY); break; }
  }
}
function openEvent(id) {
  const ev = S.events.find(e => e.id === id); if (!ev) return;
  const base = { ev: id, wrong: 0, msg: '' };
  if (ev.type === 'repair') { openModal({ view: 'repair', i: ev.at, ev: id }); return; }
  const d = EV[ev.type];
  if (d.view === 'quiz') { openModal(Object.assign(base, { view: 'quiz', mode: 'ev', e: d.e, title: d.n, sub: d.sub, qs: d.qs, n: 0 })); return; }
  if (d.view === 'tap') { openModal(Object.assign(base, { view: 'tap', cells: Array(12).fill(0).map(() => Math.random() < .7 ? 1 : 0) })); return; }
  if (ev.type === 'sort') openModal(Object.assign(base, { view: 'sort', items: shuffle(ITEMS.slice()).slice(0, 3), n: 0 }));
  else if (ev.type === 'light') {
    const rooms = shuffle(['empty', 'empty', 'empty', 'empty', 'people', 'people', 'dark', 'dark', 'dark']);
    openModal(Object.assign(base, { view: 'light', rooms }));
  } else if (ev.type === 'plug') {
    const keep = shuffle(DEVICES.filter(d => d.keep)).slice(0, 1 + (Math.random() < .4 ? 1 : 0));
    const devs = shuffle([...keep, ...shuffle(DEVICES.filter(d => !d.keep)).slice(0, 4 - keep.length)]);
    openModal(Object.assign(base, { view: 'plug', devs, on: devs.map(() => true) }));
  } else {
    const season = Math.random() < .5 ? 'summer' : 'winter';
    openModal(Object.assign(base, { view: 'temp', season, v: season === 'summer' ? 21 : 25 }));
  }
}
function doneFix(i, evId, how) {
  const b = S.map[i]; if (!b || !b.hurt) { closeModal(); renderAll(); return; }
  const back = ST[b.k].res || 0, soft = b.hurt.soft;
  b.hurt = null; S.fixes++;
  S.events = S.events.filter(e => e.id !== evId && e.at !== i);
  SND.get(); save();
  setTimeout(() => {
    closeModal(); renderAll();
    toast(how + (back ? ` · 주민 ${back}명이 돌아왔어요` : (soft ? ' · 이상 없어요' : '')), 4000);
  }, soft ? 200 : 600);
}
function finishEvent(m) {
  const ev = S.events.find(e => e.id === m.ev); if (!ev) return;
  const r = Math.max(5, reward(ev.type) - m.wrong * 5);
  S.events = S.events.filter(e => e.id !== m.ev);
  S.coins += r; S.acts++;
  SND.get(); save();
  setTimeout(() => { closeModal(); toast(`🌱 친환경 행동 완료! 🪙${r}`); renderAll(); }, 1300);
}

/* =====================================================================
   재난 — 갑자기 오지만, 고르기 전에는 아무 일도 일어나지 않는다
   ===================================================================== */
function disPool() {
  const t = town();
  return Object.keys(DIS).filter(k => {
    const d = DIS[k];
    if (t.built < d.need) return false;
    if (d.kind === 'break' && !S.map.some((b, i) => b && b.done && !b.hurt && (!d.can || d.can(b, i)))) return false;
    if (d.kind === 'check' && !S.map.some(b => b && b.done && !b.hurt)) return false;
    if (k === 'smog' && !S.map.some(b => b && b.done && b.d && (b.d.use || []).includes('solar'))) return false;
    if (k === 'heat' && !S.map.some(b => b && b.done && ST[b.k].use)) return false;
    return true;
  });
}
function startDis(now) {
  const pool = disPool();
  if (!pool.length) { S.nextDis = now + 60000; return; }
  const unseen = pool.filter(k => !S.seenDis[k]);      // 안 겪어 본 재난부터
  const p = unseen.length ? unseen : pool;
  const k = p[Math.floor(Math.random() * p.length)];
  S.seenDis[k] = true;
  S.dis = { k, phase: 'warn', first: -1 };
  S.nextDis = now + DIS_EVERY;
  save(); SND.alarm();
  openModal({ view: 'dis' });
}
/* 고른 대응에 따라 실제로 일어난다. good = 첫 판단이 옳았다 */
function applyDis(good) {
  const k = S.dis.k, d = DIS[k], now = Date.now();
  const rp = { hurt: [], safed: [], notes: [] };
  const pickable = [];
  S.map.forEach((b, i) => { if (b && b.done && !b.hurt && (!d.can || d.can(b, i))) pickable.push(i); });
  shuffle(pickable);

  if (d.kind === 'break') {
    let left = good ? Math.max(1, d.hits - 1) : d.hits;
    for (const i of pickable) {
      if (left <= 0) break;
      const b = S.map[i];
      if (d.safe && d.safe(b)) { if (rp.safed.length < 3) rp.safed.push(i); continue; }
      b.hurt = { k, fix: 'break', cost: Math.round(ST[b.k].cost * .25) };
      rp.hurt.push(i); left--;
    }
  } else if (d.kind === 'check') {
    for (const i of pickable.slice(0, good ? 1 : 2)) { S.map[i].hurt = { k, fix: 'check', cost: 40, soft: true }; rp.hurt.push(i); }
  } else if (d.kind === 'power') {
    const t = town();
    if (t.prod >= t.use) rp.notes.push('⚡ 우리가 만든 에너지가 쓰는 만큼 되어서 <b>마을이 그대로 돌아갔어요!</b> 스스로 전기를 만드는 마을은 정전에도 버텨요.');
    else {
      S.powerOff = now + (good ? d.mins - 1 : d.mins) * 60000;
      const pct = t.use ? Math.round(t.prod / t.use * 100) : 100;
      rp.notes.push('전기를 사 오던 만큼이 끊겼어요. 우리가 만드는 에너지가 쓰는 양의 <b>' + pct + '%</b> 라, 그만큼만 돌아가요.');
      rp.notes.push('☀️ 태양광·풍력·수력을 늘리면 다음 정전 때는 더 잘 버텨요.');
    }
  } else if (d.kind === 'heat') {
    S.heatOff = now + (good ? d.mins - 1 : d.mins) * 60000;
    const safeN = S.map.filter(b => b && b.done && ST[b.k].use && d.safe(b)).length;
    rp.notes.push('더위를 식히느라 마을이 쓰는 에너지가 <b>확 늘었어요.</b>');
    if (safeN) rp.notes.push('🌿 그래도 ' + safeN + '곳은 ' + d.safeSay);
    else rp.notes.push('🌿 단열창·옥상 정원·친환경 목재로 지은 건물은 이럴 때 냉방을 훨씬 덜 써요.');
  } else if (d.kind === 'smog') {
    S.smogOff = now + (good ? d.mins - 1 : d.mins) * 60000;
    rp.notes.push('☀️ 태양광 판에 먼지가 앉아 <b>전기가 줄었어요.</b> 할 일에 「판 닦기」가 생겼어요.');
    const dirty = [];
    S.map.forEach((b, i) => { if (b && b.done && !b.hurt && b.d && (b.d.use || []).includes('solar') && !S.events.some(e => e.at === i)) dirty.push(i); });
    shuffle(dirty).slice(0, 2).forEach(i => S.events.push({ id: Date.now() + Math.random(), type: 'panelChk', at: i }));
  }

  // 부서진 곳마다 수리 할 일을 붙인다
  for (const i of rp.hurt) {
    S.events = S.events.filter(e => e.at !== i);
    S.events.push({ id: Date.now() + Math.random(), type: 'repair', at: i });
  }
  rp.gone = rp.hurt.reduce((a, i) => a + (ST[S.map[i].k].res || 0), 0);
  rp.names = rp.hurt.map(i => (ST[S.map[i].k].e || '🌀') + ' ' + ST[S.map[i].k].n);
  rp.soft = rp.hurt.length ? !!S.map[rp.hurt[0]].hurt.soft : false;
  S.survived++;
  S.dis.phase = 'result'; S.dis.rp = rp; S.dis.good = good;
  save();
}

/* =====================================================================
   흐름
   ===================================================================== */
function tick() {
  const now = Date.now();
  let changed = false;
  S.map.forEach((b, i) => { if (b && !b.done && now >= b.endAt) { b.done = true; changed = true; complete(b, i); } });
  const t = town();
  const dt = Math.max(0, Math.min((now - S.last) / 1000, 600));   // 꺼 둔 동안은 10분 치까지만
  S.coins += t.net * dt / 60;
  S.last = now;
  const before = S.events.length;
  spawnEvents(now);
  if (S.events.length !== before) changed = true;
  // 허가 기준 강화
  if (S.level < 3 && t.built >= (S.level === 1 ? 3 : 6)) { S.level++; changed = true; }
  // 목표
  const g = GOALS[S.goal];
  if (g && g.done(t)) {
    S.goal++; S.coins += g.pay; changed = true;
    SND.get();
    if (!GOALS[S.goal]) S.certDue = true;
    else toast(`🎯 목표 달성: ${g.t}${g.pay ? ` · 🪙${g.pay}` : ''}`, 3500);
  }
  for (const [key, msg] of [['powerOff', '💡 전기가 다시 들어왔어요!'], ['heatOff', '🌤️ 더위가 한풀 꺾였어요.'], ['smogOff', '😮‍💨 공기가 맑아졌어요.']]) {
    if (S[key] && S[key] <= now) { S[key] = 0; changed = true; toast(msg, 3500); SND.ding(); }
  }
  if (changed) { renderMap(); renderPanel(); renderGoal(); save(); }
  else updateBars();
  renderTop();
  if (!M) {
    if (S.seenLv < S.level) { S.seenLv = S.level; save(); SND.stamp(); openModal({ view: 'level', lv: S.level }); }
    else if (S.certDue && !S.cert) { S.cert = true; S.certDue = false; save(); SND.ok(); openModal({ view: 'cert' }); }
    else if (S.dis) { openModal({ view: 'dis' }); }
    else if (t.built >= 3) {
      if (!S.nextDis) { S.nextDis = now + DIS_FIRST; save(); }
      else if (now >= S.nextDis) startDis(now);
    }
  } else if (M.view === 'info') {
    const b = S.map[M.i]; if (b && !b.done && !M.armed) drawModal();
  }
}

/* =====================================================================

$('stage').addEventListener('click', e => {

});
function onTile(i) {

  if (placing) {
    if (!canBuildAt(placing, i)) {
      SND.bad();
      if (isEast(i) && !bridgeDone() && !isRiver(i)) toast('🌉 다리를 먼저 놓아야 건너갈 수 있어요');
      else if (ST[placing].on === 'river') toast('💧 강 위에만 지을 수 있어요');
      else if (isRiver(i)) toast('강 위에는 지을 수 없어요');

    }

  }

}
function act(name, el) {
  const m = M;
  switch (name) {
    case 'close': SND.click(); closeModal(); renderAll(); break;
    case 'pick': {
      const k = el.dataset.k;
      if (S.coins < ST[k].cost) { SND.bad(); toast(`🪙${fmt(ST[k].cost - S.coins)} 더 모이면 지을 수 있어요`); return; }
      if (!S.map.some((_, i) => canBuildAt(k, i))) { SND.bad(); toast(ST[k].on === 'river' ? '빈 강 칸이 없어요' : (bridgeDone() ? '빈 땅이 없어요' : '빈 땅이 없어요 — 다리를 놓으면 땅이 늘어나요')); return; }
      SND.click(); placing = k; $('placeTxt').textContent = `${ST[k].e || '🌀'} ${ST[k].n} — 지을 자리를 눌러요`; $('placing').hidden = false; renderMap();
      break;
    }
    case 'cancelPlace': placing = null; $('placing').hidden = true; renderMap(); break;
    case 'cat': {
      if (el.dataset.v === ST[m.k].cat) { SND.ok(); S.catKnown[m.k] = true; save(); m.view = 'design'; m.msg = ''; }
      else { SND.bad(); m.msg = '🤔 ' + ST[m.k].catWhy; }
      drawModal(); break;
    }
    case 'opt': {
      SND.click();
      const col = el.dataset.col, k = el.dataset.k;
      if (col === 'use') m.d.use = m.d.use.includes(k) ? m.d.use.filter(x => x !== k) : [...m.d.use, k];
      else m.d[col] = k;
      drawModal(); break;
    }
    case 'submit': {
      const p = priceOf(m.k, m.d);
      if (S.coins < p) return;
      m.rej = review(m.k, m.d); m.view = 'result';
      SND.stamp(); setTimeout(() => m.rej.length ? SND.bad() : SND.ok(), 250);
      drawModal(); break;
    }
    case 'redesign': SND.click(); m.view = 'design'; drawModal(); break;
    case 'startBuild': {
      const p = priceOf(m.k, m.d);
      if (S.coins < p || S.map[m.i]) { closeModal(); renderAll(); return; }
      S.coins -= p; S.permits++;
      S.map[m.i] = { k: m.k, d: m.d, paid: p, endAt: Date.now() + ST[m.k].time * 1000, done: false };
      SND.get(); save(); closeModal(); renderAll();
      toast(`🏗️ ${ST[m.k].n} 공사를 시작했어요`);
      break;
    }
    case 'arm': SND.click(); m.armed = true; drawModal(); break;
    case 'demolish': {
      const b = S.map[m.i]; if (!b) { closeModal(); return; }
      if (b.k === 'bridge' && b.done && countDone('bridge') === 1 && S.map.some((x, j) => x && isEast(j))) {
        SND.bad(); m.armed = false; m.msg = '강 건너 마을이 이 다리를 쓰고 있어요. 건너편 구조물을 먼저 허물어야 해요.'; m.msgc = 'bad'; drawModal(); return;
      }
      let refund, msg;
      if (!b.done) { refund = b.paid; msg = `공사를 취소했어요. 🪙${refund}을 돌려받았어요.`; }
      else if (b.d && b.d.end === 'prefab') { refund = Math.round(b.paid / 2); msg = `🔩 조립식이라 풀어서 재료를 다시 팔았어요. 🪙${refund}을 돌려받았어요.`; }
      else { refund = 0; msg = b.d ? '💥 통째로 부숴서 쓰레기만 잔뜩 나왔어요. 다시 쓸 수 있는 게 없어요.' : `${ST[b.k].n}을 허물었어요.`; }
      S.coins += refund; S.map[m.i] = null; S.events = S.events.filter(x => x.at !== m.i);
      save(); closeModal(); renderAll(); toast(msg, 4000);
      break;
    }
    /* 분리배출 */
    case 'bin': {
      if (m.lock) return;
      const it = m.items[m.n], k = el.dataset.k;
      if (k === it.bin) {
        SND.ok(); m.msg = `✅ ${BINM[k].e} ${BINM[k].n}! ${it.tip}`; m.msgc = 'good'; m.lock = true; drawModal();
        if (m.n + 1 >= m.items.length) finishEvent(m);
        else setTimeout(() => { if (M === m) { m.n++; m.msg = ''; m.lock = false; drawModal(); } }, 1400);
      } else {
        SND.bad(); m.wrong++;
        m.msg = `🤔 ${BINM[k].n}${josa(BINM[k].n, '이', '가')} 아니에요. ` + ((it.why && it.why[k]) || it.hint); m.msgc = 'bad'; drawModal();
      }
      break;
    }
    /* 불 끄기 */
    case 'room': {
      const i = +el.dataset.i, r = m.rooms[i];
      if (r === 'empty') { SND.click(); m.rooms[i] = 'dark'; m.msg = ''; }
      else if (r === 'people') { SND.bad(); m.wrong++; m.msg = '📖 이 방엔 사람이 있어요! 사람이 쓰는 방은 켜 둬요.'; m.msgc = 'bad'; }
      else { m.msg = '이미 꺼져 있는 방이에요.'; m.msgc = 'info'; }
      if (!m.rooms.includes('empty')) { m.msg = '✅ 빈 방 불을 다 껐어요! 안 쓰는 불을 끄는 것만으로도 에너지를 아껴요.'; m.msgc = 'good'; drawModal(); finishEvent(m); }
      else drawModal();
      break;
    }
    /* 멀티탭 */
    case 'sw': SND.click(); m.on[+el.dataset.i] = !m.on[+el.dataset.i]; m.msg = ''; drawModal(); break;
    case 'plugCheck': {
      const bad = m.devs.map((d, i) => ({ d, on: m.on[i] })).filter(x => x.on !== x.d.keep);
      if (!bad.length) { SND.ok(); m.msg = '✅ 딱 맞아요! 안 쓰는 건 끄고, 필요한 건 켜 뒀어요.'; m.msgc = 'good'; drawModal(); finishEvent(m); }
      else { SND.bad(); m.wrong++; const x = bad[0]; m.msg = `🤔 ${x.d.e} ${x.d.n}: ${x.d.why}`; m.msgc = 'bad'; drawModal(); }
      break;
    }
    /* 온도 */
    case 't': SND.click(); m.v = Math.max(14, Math.min(32, m.v + +el.dataset.v)); m.msg = ''; drawModal(); break;
    case 'tempCheck': {
      const v = m.v, s = m.season === 'summer';
      let ok = false, msg;
      if (s) {
        if (v >= 26 && v <= 28) { ok = true; msg = `✅ ${v}°C! 여름 실내 온도는 26~28°C가 알맞아요. 선풍기를 같이 틀면 더 시원해요.`; }
        else if (v < 26) msg = `🥶 ${v}°C는 너무 차가워요. 온도를 낮출수록 전기가 훨씬 많이 들고 감기에도 걸려요.`;
        else msg = `🥵 ${v}°C는 너무 더워서 공부하기 힘들어요. 조금만 더 낮춰요.`;
      } else {
        if (v >= 18 && v <= 20) { ok = true; msg = `✅ ${v}°C! 겨울 실내 온도는 18~20°C가 알맞아요. 내복을 입으면 따뜻해요.`; }
        else if (v > 20) msg = `🥵 ${v}°C는 너무 더워요. 반팔 입을 만큼 난방하면 에너지가 많이 들어요. 옷을 따뜻하게 입고 낮춰요.`;
        else msg = `🥶 ${v}°C는 너무 추워서 감기에 걸려요. 조금만 올려요.`;
      }
      m.msg = msg; m.msgc = ok ? 'good' : 'bad';
      if (ok) { SND.ok(); drawModal(); finishEvent(m); } else { SND.bad(); m.wrong++; drawModal(); }
      break;
    }
    /* 재난 */
    case 'disPick': {
      const i = +el.dataset.i, o = DIS[S.dis.k].opts[i];
      if (S.dis.first < 0) S.dis.first = i;
      if (o.ok) { SND.ok(); applyDis(S.dis.first === i); m.outI = -1; m.msg = ''; drawModal(); renderAll(); }
      else { SND.bad(); m.outI = i; m.msg = o.why; drawModal(); }
      break;
    }
    case 'disDone': {
      SND.click(); S.dis = null; save(); closeModal(); renderAll();
      break;
    }
    /* 수리 */
    case 'payFix': {
      const b = S.map[m.i]; if (!b || !b.hurt || S.coins < b.hurt.cost) return;
      S.coins -= b.hurt.cost; doneFix(m.i, m.ev, '🚚 업체가 와서 고쳤어요');
      break;
    }
    case 'selfFix': {
      const b = S.map[m.i]; if (!b || !b.hurt) return;
      const f = FIX[b.hurt.fix];
      SND.click();
      openModal({ view: 'quiz', mode: 'fix', i: m.i, ev: m.ev, e: b.hurt.soft ? '🔎' : '🛠️', title: f.n, sub: ST[b.k].n, qs: f.qs, n: 0, wrong: 0, outs: [], msg: '' });
      break;
    }
    /* 고르기 */
    case 'qpick': {
      if (m.lock) return;
      const q = m.qs[m.n], o = q.opts[+el.dataset.i];
      if (!o.ok) { SND.bad(); m.wrong++; (m.outs = m.outs || []).push(+el.dataset.i); m.msg = '🤔 ' + o.why; m.msgc = 'bad'; drawModal(); return; }
      SND.ok(); m.msg = '✅ ' + o.why; m.msgc = 'good'; m.lock = true; drawModal();
      if (m.n + 1 >= m.qs.length) {
        if (m.mode === 'fix') setTimeout(() => { if (M === m) doneFix(m.i, m.ev, '🛠️ 직접 고쳤어요'); }, 1500);
        else finishEvent(m);
      } else setTimeout(() => { if (M === m) { m.n++; m.msg = ''; m.lock = false; m.outs = []; drawModal(); } }, 1600);
      break;
    }
    /* 닦기 */
    case 'rub': {
      const i = +el.dataset.i; if (!m.cells[i]) return;
      m.cells[i] = 0; SND.rub(); drawModal();
      if (!m.cells.some(Boolean)) { SND.ok(); finishEvent(m); }
      break;
    }
    case 'event': SND.click(); openEvent(+el.dataset.id); break;
    case 'snd': S.snd = !S.snd; save(); SND.init(); SND.click(); drawModal(); break;
    case 'armWipe': m.armed = true; drawModal(); break;
    case 'wipe': wiping = true; try { localStorage.removeItem(KEY); } catch (e) { } location.reload(); break;
  }
}
$('bSet').addEventListener('click', e => { e.stopPropagation(); SND.init(); SND.click(); openModal({ view: 'settings' }); });
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' && M && !['result', 'level', 'cert', 'dis'].includes(M.view)) { closeModal(); renderAll(); } });

   화면 맞추기 · 시작

addEventListener('resize', fit); fit();

if (S.name) {
  $('nameIn').hidden = true;
  $('startSub').innerHTML = `<b style="font-size:30px;color:var(--ink)">${S.name.replace(/[<>&]/g, '')}</b><br>마을이 기다리고 있어요.`;
  $('bStart').textContent = '이어하기';
}
$('bStart').addEventListener('click', e => {
  e.stopPropagation();
  SND.init(); SND.ok();
  if (!S.name) { S.name = ($('nameIn').value || '').trim().replace(/[<>&]/g, '') || '초록 마을'; S.last = Date.now(); }
  $('start').hidden = true;
  tick(); renderAll(); save();
});
renderAll();
setInterval(() => { if ($('start').hidden) tick(); }, 1000);
setInterval(save, 10000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else if ($('start').hidden) tick(); });
addEventListener('pagehide', save);
window.__gv = { get S() { return S; }, town, priceOf, ST, EV, DIS, FIX, GOALS, tick, act, onTile, openEvent, openModal, closeModal, startDis, applyDis, disPool, doneFix, effOf, spawnEvents, VIEWS, get M() { return M; } };
