<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>작품 추리 일곱 고개</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --ink:#1d1b18; --navy:#2b3a4a; --red:#b0332b; --gold:#9d7a2b;
  --paper:#f6f1e7; --line:#ddd4c2; --muted:#7c7369;
  --plum:#6b3f66; --teal:#2f6b63; --yes:#2f6b63; --no:#b0332b;
}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:#26231f;color:var(--ink);font-family:'Noto Sans KR',sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:0}

/* ── 시작 화면 ─────────────────────────── */
#start{position:fixed;inset:0;background:var(--paper);z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
#start h1{font-size:clamp(30px,5.4vw,54px);font-weight:900;margin:0;letter-spacing:-.02em;text-align:center}
#start .sub{font-size:clamp(15px,2.1vw,20px);color:var(--muted);text-align:center;margin:0;line-height:1.6}
.modes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:6px;width:100%;max-width:820px}
.mode{flex:1 1 300px;background:#fff;border:3px solid var(--line);border-radius:16px;
  padding:20px 22px;text-align:left;transition:.12s}
.mode:active{transform:scale(.98)}
.mode:hover{border-color:var(--plum)}
.mode .mt{font-size:clamp(19px,2.6vw,24px);font-weight:900;color:var(--plum);margin-bottom:7px}
.mode .md{font-size:clamp(14px,1.8vw,17px);line-height:1.55;color:var(--ink)}
.mode.b .mt{color:var(--teal)}
.mode.b:hover{border-color:var(--teal)}
#start .rule{background:#efe8d8;border-left:5px solid var(--gold);border-radius:0 10px 10px 0;
  padding:12px 18px;font-size:clamp(13px,1.7vw,16px);line-height:1.6;max-width:820px;width:100%}
#start .rule b{color:var(--gold)}

/* ── 상단 바 ──────────────────────────── */
#top{position:fixed;left:0;right:0;top:0;height:54px;background:#312d28;color:#efe8dc;
  display:flex;align-items:center;gap:12px;padding:0 12px;z-index:30}
#top .ttl{font-weight:900;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
#top .mode-tag{background:#514a41;border-radius:16px;padding:3px 11px;font-size:13px;font-weight:700}
#top .sp{flex:1}
#steps{display:flex;gap:5px;align-items:center}
.dot{width:19px;height:19px;border-radius:50%;background:#514a41;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;color:#b3a99c}
.dot.used{background:#c9b384;color:#312d28}
.dot.over{background:var(--red);color:#fff}
#top button{background:#514a41;color:#efe8dc;border-radius:8px;padding:7px 12px;
  font-size:13px;font-weight:700}
#top button:active{background:#6b6156}

/* ── 본문 ─────────────────────────────── */
#main{position:fixed;left:0;right:0;top:54px;bottom:0;display:flex;background:var(--paper)}
#left{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 10px 8px}
#board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(3,1fr);gap:7px}
.card{position:relative;background:#fff;border:2px solid var(--line);border-radius:9px;
  overflow:hidden;display:flex;align-items:center;justify-content:center;padding:4px;
  transition:.14s;cursor:pointer}
.card img{max-width:100%;max-height:100%;object-fit:contain;display:block;pointer-events:none}
.card.off{filter:grayscale(1) brightness(.42);border-color:#bdb4a2}
.card.off::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:min(6vw,44px);font-weight:900;color:rgba(255,255,255,.85)}
.card.mine{border-color:var(--plum);box-shadow:0 0 0 3px rgba(107,63,102,.25)}
.card.hit{border-color:var(--yes);box-shadow:0 0 0 4px rgba(47,107,99,.35)}
.card.miss{border-color:var(--no);box-shadow:0 0 0 4px rgba(176,51,43,.35)}
.card .no{position:absolute;left:3px;top:2px;font-size:11px;font-weight:900;color:var(--muted)}
#boardnote{font-size:12.5px;color:var(--muted);text-align:center;padding:5px 0 1px;line-height:1.4}
#boardnote b{color:var(--ink)}

#right{flex:0 0 clamp(300px,34%,430px);border-left:2px solid var(--line);background:#fdfbf6;
  display:flex;flex-direction:column;min-height:0}
#mine{padding:8px 10px;border-bottom:2px solid var(--line);background:#f2ebda;
  display:flex;align-items:center;gap:10px}
#mine .lb{font-size:12.5px;font-weight:800;color:var(--plum);line-height:1.35}
#mine .thumb{width:46px;height:46px;border:2px solid var(--plum);border-radius:7px;background:#fff;
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;font-size:20px}
#mine .thumb img{max-width:100%;max-height:100%;object-fit:contain}
#mine button{background:var(--plum);color:#fff;border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:800}

#tabs{display:flex;border-bottom:2px solid var(--line)}
#tabs button{flex:1;background:#e9e1cf;color:var(--muted);padding:9px 2px;font-size:12.5px;
  font-weight:800;border-right:1px solid var(--line);line-height:1.3}
#tabs button:last-child{border-right:0}
#tabs button.on{background:#fff;color:var(--navy)}
#qlist{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:7px}
.q{background:#fff;border:2px solid var(--line);border-radius:10px;padding:11px 13px;
  font-size:15.5px;font-weight:700;line-height:1.4;text-align:left;color:var(--ink)}
.q:active{background:#f2ebda}
.q.done{opacity:.42;text-decoration:line-through}
#log{border-top:2px solid var(--line);max-height:31%;overflow-y:auto;padding:7px 9px;background:#f6f1e7}
#log .ll{font-size:12.5px;line-height:1.45;padding:4px 0;border-bottom:1px dashed var(--line);
  display:flex;gap:7px;align-items:flex-start}
#log .ll:last-child{border-bottom:0}
#log .a{font-weight:900;flex:0 0 auto;border-radius:5px;padding:1px 6px;font-size:11.5px;color:#fff}
#log .a.y{background:var(--yes)} #log .a.n{background:var(--no)}
#log .e{font-size:12.5px;color:var(--muted);padding:6px 0;text-align:center}
#pick{padding:8px 9px;border-top:2px solid var(--line);background:#fdfbf6}
#pick button{width:100%;background:var(--red);color:#fff;border-radius:10px;padding:12px;
  font-size:16px;font-weight:900}
#pick button:disabled{background:#c6bcac;color:#fff}
#pick button.armed{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.18)}}

/* ── 질문 패널 ────────────────────────── */
#panel{position:fixed;inset:0;background:rgba(30,27,24,.72);z-index:40;
  display:none;align-items:center;justify-content:center;padding:20px}
#panel.on{display:flex}
#pbox{background:var(--paper);border-radius:18px;padding:24px 26px;width:min(560px,94vw);
  box-shadow:0 14px 50px rgba(0,0,0,.45)}
#pbox .pq{font-size:clamp(20px,3.4vw,28px);font-weight:900;line-height:1.35;margin-bottom:6px}
#pbox .pv{font-size:13px;font-weight:800;color:var(--plum);letter-spacing:.1em;margin-bottom:12px}
.zone{background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.zone .zt{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:9px}
.reveal{width:100%;background:var(--plum);color:#fff;border-radius:10px;padding:13px;
  font-size:17px;font-weight:900}
.answer{font-size:clamp(28px,6vw,44px);font-weight:900;text-align:center;line-height:1.2;padding:4px 0}
.answer.y{color:var(--yes)} .answer.n{color:var(--no)}
.yn{display:flex;gap:11px}
.yn button{flex:1;border-radius:11px;padding:15px;font-size:20px;font-weight:900;color:#fff}
.yn .by{background:var(--yes)} .yn .bn{background:var(--no)}
.yn button:active{filter:brightness(1.15)}
#pbox .close{width:100%;margin-top:13px;background:#e0d8c6;color:var(--ink);
  border-radius:10px;padding:11px;font-size:15px;font-weight:800}

/* ── 결과 화면 ────────────────────────── */
#result{position:fixed;inset:0;background:var(--paper);z-index:50;display:none;
  flex-direction:column;padding:16px 18px;overflow-y:auto}
#result.on{display:flex}
#result .rh{font-size:clamp(24px,4.4vw,38px);font-weight:900;margin:0 0 4px}
#result .rs{font-size:15px;color:var(--muted);margin:0 0 12px}
.rwrap{display:flex;gap:18px;flex-wrap:wrap;flex:1;min-height:0}
.rfig{flex:0 1 340px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px;
  display:flex;flex-direction:column;align-items:center;max-height:52vh}
.rfig img{max-width:100%;max-height:38vh;object-fit:contain}
.rfig .rc{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:9px;text-align:center}
.rfig .rc b{color:var(--ink);font-size:16px}
.rside{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:10px}
.rlog{background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 13px;
  max-height:32vh;overflow-y:auto}
.rlog .rt{font-size:13px;font-weight:800;color:var(--plum);margin-bottom:7px}
.rlog .ll{font-size:13.5px;line-height:1.5;padding:3px 0;display:flex;gap:7px}
.rlog .a{font-weight:900;flex:0 0 auto;border-radius:5px;padding:1px 6px;font-size:12px;color:#fff}
.rlog .a.y{background:var(--yes)} .rlog .a.n{background:var(--no)}
.rwrite{background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 13px}
.rwrite .rt{font-size:13px;font-weight:800;color:var(--teal);margin-bottom:7px}
.rwrite textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:8px;
  padding:9px;font-family:inherit;font-size:14.5px;line-height:1.6;resize:vertical}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.rbtns button{flex:1 1 130px;border-radius:10px;padding:13px;font-size:15px;font-weight:900;color:#fff}
.rbtns .again{background:var(--plum)} .rbtns .copy{background:var(--teal)}
.rbtns .book{background:var(--gold)}

/* ── 작품 도감 ────────────────────────── */
#dex{position:fixed;inset:0;background:var(--paper);z-index:55;display:none;
  flex-direction:column;padding:14px 16px;overflow-y:auto}
#dex.on{display:flex}
#dex h2{font-size:clamp(20px,3.4vw,30px);font-weight:900;margin:0 0 3px}
#dex .dsub{font-size:14px;color:var(--muted);margin:0 0 12px}
#dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.dcard{background:#fff;border:2px solid var(--line);border-radius:11px;padding:9px;
  display:flex;flex-direction:column;align-items:center}
.dcard img{max-width:100%;max-height:130px;object-fit:contain}
.dcard .dt{font-size:14px;font-weight:900;margin-top:7px;text-align:center;line-height:1.3}
.dcard .di{font-size:12px;color:var(--muted);text-align:center;line-height:1.45;margin-top:3px}
#dex .back{margin-top:14px;align-self:center;background:var(--navy);color:#fff;
  border-radius:10px;padding:12px 30px;font-size:15px;font-weight:900}

/* ── QR ───────────────────────────────── */
#qrbtn{background:#fff;border-radius:7px;padding:3px;line-height:0;flex:0 0 auto}
#qrbtn svg{width:34px;height:34px;display:block}
#qrbig{position:fixed;inset:0;background:rgba(30,27,24,.9);z-index:70;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px}
#qrbig.on{display:flex}
#qrbig .box{background:#fff;padding:18px;border-radius:16px}
#qrbig svg{width:min(58vh,58vw);height:min(58vh,58vw);display:block}
#qrbig .u{color:#e8e2d6;font-size:clamp(13px,2.2vw,18px);font-weight:700;word-break:break-all;text-align:center}

@media (max-width:820px), (orientation:portrait){
  #main{flex-direction:column}
  #right{flex:0 0 auto;max-height:52%;border-left:0;border-top:2px solid var(--line)}
  #board{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr)}
  #left{padding:7px}
  .q{font-size:14.5px;padding:9px 11px}
}
</style>
</head>
<body>

<div id="start">
  <h1>작품 추리 일곱 고개</h1>
  <p class="sub">작품 18점 중 하나를 몰래 고른다.<br>
    <b>"예 / 아니요"로 답할 수 있는 질문</b>만 던져 일곱 번 안에 찾아내자.</p>
  <div class="modes">
    <button class="mode" onclick="begin('solo')">
      <div class="mt">혼자 하기</div>
      <div class="md">앱이 작품 하나를 몰래 고른다.<br>
        질문을 누르면 앱이 바로 답하고, 아닌 작품은 판에서 저절로 지워진다.</div>
    </button>
    <button class="mode b" onclick="begin('pair')">
      <div class="mt">짝과 하기</div>
      <div class="md">태블릿 두 대로 서로 낸다.<br>
        내가 고른 작품의 답을 앱이 알려 주고, 짝의 대답은 내가 눌러 판을 걸러 나간다.</div>
    </button>
  </div>
  <div class="rule">
    <b>답할 수 없는 질문은 못 쓴다.</b> "예쁜가요?" "제일 잘 그린 건가요?" ✕ &nbsp;·&nbsp;
    "먹을 사용했나요?" "우리나라 작가의 작품인가요?" ○<br>
    질문은 <b>주제와 소재 · 재료와 표현 방법 · 조형 요소와 원리 · 시대적·지역적 배경</b>
    네 자리에서 나온다.
  </div>
</div>

<div id="top">
  <span class="ttl">작품 추리 일곱 고개</span>
  <span class="mode-tag" id="modetag"></span>
  <div id="steps"></div>
  <span class="sp"></span>
  <button id="qrbtn" onclick="document.getElementById('qrbig').classList.add('on')"><span data-qr="self"></span></button>
  <button onclick="openDex()">작품 도감</button>
  <button onclick="restart()">다시 하기</button>
</div>

<div id="main">
  <div id="left">
    <div id="board"></div>
    <div id="boardnote"></div>
  </div>
  <div id="right">
    <div id="mine">
      <div class="thumb" id="mthumb">🔒</div>
      <div style="flex:1;min-width:0">
        <div class="lb" id="mlabel"></div>
      </div>
      <button id="mbtn" onclick="peek()">잠깐 보기</button>
    </div>
    <div id="tabs"></div>
    <div id="qlist"></div>
    <div id="log"></div>
    <div id="pick"><button id="pickbtn" onclick="armPick()">이 작품이다! 지목하기</button></div>
  </div>
</div>

<div id="panel" onclick="if(event.target.id==='panel')closePanel()">
  <div id="pbox"></div>
</div>

<div id="result"></div>
<div id="dex"></div>

<div id="qrbig" onclick="this.classList.remove('on')">
  <div class="box"><span data-qr="self"></span></div>
  <div class="u">leixlix-pixel.github.io/toolbox/art-quest/art-detective.html</div>
</div>

(function checkUnique(){
  const sig = w => QS.map(q=>w.p[q.k]).join('');
  const seen = {};
  for(const w of WORKS){
    const s = sig(w);

/* ── 소리 ─────────────────────────────── */
let AC = null;
const SND = {
  tone(f, d, type, vol){
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type||'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(vol||0.16, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + d);
    }catch(e){}
  },
  yes(){ this.tone(660,.1); setTimeout(()=>this.tone(880,.16),95); },
  no(){ this.tone(300,.22,'triangle'); },
  tap(){ this.tone(520,.05,'sine',.09); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,.22),i*105)); },
  lose(){ [392,330,262].forEach((f,i)=>setTimeout(()=>this.tone(f,.26,'triangle'),i*145)); }
};

/* ── 상태 ─────────────────────────────── */
let S = null;
function newState(mode){
  return {
    mode,                       // 'solo' | 'pair'
    target: mode==='solo' ? WORKS[Math.floor(Math.random()*WORKS.length)] : null,
    mine: null,                 // 짝 모드에서 내가 숨긴 작품
    off: new Set(),             // 판에서 지운 작품 key
    asked: [],                  // {q, ans}
    view: 'subject',
    picking: false,
    done: false,
    pickWork: null
  };
}

function begin(mode){
  S = newState(mode);
  document.getElementById('start').style.display = 'none';
  document.getElementById('modetag').textContent = mode==='solo' ? '혼자 하기' : '짝과 하기';
  document.getElementById('mine').style.display = mode==='pair' ? 'flex' : 'none';
  renderTabs();
  render();
  if(mode==='pair') askMine();
}
function restart(){
  document.getElementById('result').classList.remove('on');
  document.getElementById('dex').classList.remove('on');
  document.getElementById('start').style.display = 'flex';
}

/* ── 판 그리기 ────────────────────────── */
function render(){
  const b = document.getElementById('board');
  b.innerHTML = WORKS.map((w,i)=>{
    const cls = ['card'];
    if(S.off.has(w.k)) cls.push('off');
    // 내 작품은 판에 표시하지 않는다(짝이 곁눈질로 알아채므로). 확인은 위쪽 '잠깐 보기'로 한다.
    return `<div class="${cls.join(' ')}" data-k="${w.k}" onclick="tapCard('${w.k}')">
      <span class="no">${i+1}</span><img src="${IMG[w.k]||''}" alt=""></div>`;
  }).join('');

  const left = WORKS.length - S.off.size;
  const note = S.picking
    ? '<b style="color:var(--red)">지목할 작품을 누르세요.</b> 다시 누르면 취소됩니다.'
    : (S.mode==='pair' && !S.mine)
      ? '<b>먼저 내가 숨길 작품 하나</b>를 눌러 고르세요. 짝에게 보이지 않게.'
      : `판에 <b>${left}점</b> 남았다. 카드를 누르면 직접 지우거나 되살릴 수 있다.`;
  document.getElementById('boardnote').innerHTML = note;

  const st = document.getElementById('steps');
  st.innerHTML = Array.from({length:Math.max(7,S.asked.length)},(_,i)=>{
    const c = i<S.asked.length ? (i>=7?'dot over':'dot used') : 'dot';
    return `<span class="${c}">${i+1}</span>`;
  }).join('');

  renderQ();
  renderLog();
  renderMine();
  const pb = document.getElementById('pickbtn');
  pb.classList.toggle('armed', S.picking);
  pb.textContent = S.picking ? '지목 취소' : '이 작품이다! 지목하기';
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = VIEWS.map(v=>
    `<button class="${S.view===v.id?'on':''}" onclick="S.view='${v.id}';render()">${v.n}</button>`).join('');
}
function renderQ(){
  document.getElementById('tabs').querySelectorAll('button').forEach((b,i)=>
    b.classList.toggle('on', VIEWS[i].id===S.view));
  const used = new Set(S.asked.map(a=>a.k));
  document.getElementById('qlist').innerHTML = QS.filter(q=>q.v===S.view).map(q=>
    `<button class="q ${used.has(q.k)?'done':''}" onclick="openQ('${q.k}')">${q.q}</button>`).join('');
}
function renderLog(){
  const l = document.getElementById('log');
  if(!S.asked.length){ l.innerHTML = '<div class="e">주고받은 질문이 여기 쌓인다</div>'; return; }
  l.innerHTML = S.asked.map((a,i)=>
    `<div class="ll"><span class="a ${a.ans?'y':'n'}">${a.ans?'예':'아니요'}</span>
     <span>${i+1}. ${a.q}</span></div>`).join('');
  l.scrollTop = l.scrollHeight;
}
function renderMine(){
  if(S.mode!=='pair') return;
  const t = document.getElementById('mthumb'), lb = document.getElementById('mlabel'),
        bt = document.getElementById('mbtn');
  if(!S.mine){ t.innerHTML='🔒'; lb.textContent='내가 숨길 작품을 판에서 고르세요'; bt.style.display='none'; }
  else { t.innerHTML='🔒'; lb.innerHTML='<b>내 작품이 정해졌다.</b> 짝이 물으면 질문을 눌러 답을 확인하세요.';
         bt.style.display=''; }
}

/* ── 카드 누르기 ──────────────────────── */
function tapCard(k){
  SND.tap();
  if(S.picking){ S.picking=false; confirmPick(k); return; }
  if(S.mode==='pair' && !S.mine){ S.mine = k; render(); return; }
  if(S.off.has(k)) S.off.delete(k); else S.off.add(k);
  render();
}
function armPick(){ S.picking = !S.picking; render(); }
function peek(){
  const w = WORKS.find(x=>x.k===S.mine); if(!w) return;
  const t = document.getElementById('mthumb');
  t.innerHTML = `<img src="${IMG[w.k]}">`;
  setTimeout(()=>{ t.innerHTML='🔒'; }, 2600);
}
function askMine(){
  document.getElementById('mlabel').textContent = '내가 숨길 작품을 판에서 고르세요';
}

/* ── 질문 패널 ────────────────────────── */
let curQ = null;
function openQ(k){
  curQ = QS.find(q=>q.k===k);
  const v = VIEWS.find(v=>v.id===curQ.v);
  const box = document.getElementById('pbox');
  let html = `<div class="pv">${v.n}</div><div class="pq">${curQ.q}</div>`;

  if(S.mode==='solo'){
    const ans = !!S.target.p[curQ.k];
    html += `<div class="zone"><div class="zt">앱의 대답</div>
      <div class="answer ${ans?'y':'n'}" id="ansline">?</div></div>
      <button class="close" onclick="applySolo(${ans?1:0})">대답 듣기</button>`;
  } else {
    html += `<div class="zone"><div class="zt">① 짝이 이 질문을 했다면 — 내 작품의 답</div>
        <button class="reveal" onclick="revealMine()">눌러서 확인하고 소리내어 말하기</button>
        <div class="answer" id="mineans" style="display:none"></div></div>
      <div class="zone"><div class="zt">② 짝이 대답했다면 — 들은 대로 눌러 판 걸러내기</div>
        <div class="yn"><button class="by" onclick="applyPair(1)">예</button>
          <button class="bn" onclick="applyPair(0)">아니요</button></div></div>
      <button class="close" onclick="closePanel()">닫기</button>`;
  }
  box.innerHTML = html;
  document.getElementById('panel').classList.add('on');
}
function closePanel(){ document.getElementById('panel').classList.remove('on'); }
function revealMine(){
  const w = WORKS.find(x=>x.k===S.mine);
  if(!w){ alert('먼저 내가 숨길 작품을 판에서 고르세요.'); return; }
  const ans = !!w.p[curQ.k];
  const el = document.getElementById('mineans');
  el.style.display=''; el.className = 'answer ' + (ans?'y':'n');
  el.textContent = ans ? '예' : '아니요';
  ans ? SND.yes() : SND.no();
}
function applySolo(ans){
  const el = document.getElementById('ansline');
  el.textContent = ans ? '예' : '아니요';
  ans ? SND.yes() : SND.no();
  setTimeout(()=>{ record(ans, true); closePanel(); }, 720);
}
function applyPair(ans){ record(ans, true); closePanel(); }

/* 답 하나가 들어오면 판을 걸러 낸다 — 손으로 지울 필요가 없다. */
function record(ans, filter){
  if(S.asked.some(a=>a.k===curQ.k)){
    S.asked = S.asked.filter(a=>a.k!==curQ.k);      // 같은 질문은 덮어쓴다
  }
  S.asked.push({k:curQ.k, q:curQ.q, ans:!!ans});
  if(filter){
    // 내가 숨긴 작품도 예외 없이 거른다 — 이 판은 "짝이 숨긴 것"을 찾는 판이고,
    // 짝이 우연히 나와 같은 작품을 골랐을 수도 있다. 빼 두면 그 경우를 놓친다.
    for(const w of WORKS){
      if((!!w.p[curQ.k]) !== (!!ans)) S.off.add(w.k);
    }
  }
  render();
}

/* ── 지목 · 결과 ──────────────────────── */
function confirmPick(k){
  const w = WORKS.find(x=>x.k===k);
  if(S.mode==='solo'){
    const ok = (k === S.target.k);
    showResult(ok ? S.target : w, ok, S.target);
  } else {
    S.pickWork = w;
    showResult(w, null, null);
  }
}
function showResult(w, ok, truth){
  const r = document.getElementById('result');
  const n = S.asked.length;
  let head, sub;
  if(ok===true){ head = n<=7 ? `${n}고개 만에 찾았다!` : `찾았다 — ${n}고개 걸렸다`; sub = n<=7 ? '일곱 고개 안에 들어왔다.' : '일곱 고개를 넘겼지만 끝까지 찾아냈다.'; SND.win(); }
  else if(ok===false){ head = '아쉽다, 다른 작품이었다'; sub = `정답은 <b>${truth.a} 「${truth.t}」</b>였다.`; SND.lose(); }
  else { head = '짝이 고른 작품이 이것이었나?'; sub = '짝에게 확인해 보자.'; SND.win(); }

  const card = c => `<div class="rfig"><img src="${IMG[c.k]}">
    <div class="rc"><b>${c.t}</b><br>${c.a}${c.ai?'('+c.ai+')':''}<br>
    ${c.m}${c.s?' · '+c.s:''}${c.y?' · '+c.y:''}</div></div>`;

  r.innerHTML = `
    <h2 class="rh">${head}</h2>
    <p class="rs">${sub}</p>
    <div class="rwrap">
      ${card(ok===false ? truth : w)}
      <div class="rside">
        <div class="rlog"><div class="rt">주고받은 질문 ${n}개 — 감상문을 쓸 때 이걸 그대로 쓰면 된다</div>
          ${S.asked.length ? S.asked.map((a,i)=>
            `<div class="ll"><span class="a ${a.ans?'y':'n'}">${a.ans?'예':'아니요'}</span>
             <span>${i+1}. ${a.q}</span></div>`).join('')
            : '<div class="ll" style="color:var(--muted)">질문 없이 찍었다</div>'}
        </div>
        <div class="rwrite"><div class="rt">이 작품에 대한 감상문 — 공통점·차이점을 넣어 써 보자</div>
          <textarea id="memo" placeholder="나는 「${(ok===false?truth:w).t}」을(를) 감상하였다. 이 작품은 …&#10;주고받은 질문에서 알게 된 것: …&#10;나는 이 작품이 …게 느껴졌다. 왜냐하면 …"></textarea>
        </div>
        <div class="rbtns">
          <button class="again" onclick="begin(S.mode)">한 판 더</button>
          <button class="copy" onclick="copyAll()">기록 복사</button>
          <button class="book" onclick="openDex()">작품 도감 보기</button>
        </div>
      </div>
    </div>`;
  r.classList.add('on');
}
function copyAll(){
  const w = S.mode==='solo' ? S.target : S.pickWork;
  const lines = [`작품: ${w.a} 「${w.t}」 (${w.m}${w.y?' · '+w.y:''})`, '주고받은 질문:'];
  S.asked.forEach((a,i)=>lines.push(`  ${i+1}. ${a.q} → ${a.ans?'예':'아니요'}`));
  const memo = document.getElementById('memo').value.trim();
  if(memo) lines.push('', '감상문:', memo);
  const text = lines.join('\n');
  navigator.clipboard?.writeText(text).then(
    ()=>alert('복사했다. 학습지나 문서에 붙여 넣으면 된다.'),
    ()=>prompt('아래를 길게 눌러 복사하세요', text));
}

/* ── 작품 도감 ────────────────────────── */
function openDex(){
  const d = document.getElementById('dex');
  d.innerHTML = `<h2>작품 도감 — 판에 깔린 18점</h2>
    <p class="dsub">놀이가 끝나면 여기서 작품 정보를 확인한다. 비교 감상문을 쓸 때 캡션을 그대로 옮겨 적자.</p>
    <div id="dexgrid">${WORKS.map(w=>`<div class="dcard"><img src="${IMG[w.k]}">
      <div class="dt">${w.t}</div>
      <div class="di">${w.a}${w.ai?'<br>('+w.ai+')':''}<br>${w.m}${w.s?'<br>'+w.s:''}${w.y?' · '+w.y:''}</div>
    </div>`).join('')}</div>
    <button class="back" onclick="document.getElementById('dex').classList.remove('on')">닫기</button>`;
  d.classList.add('on');
}

/* ── QR ───────────────────────────────── */
document.querySelectorAll('[data-qr]').forEach(el=>{
  const k = el.getAttribute('data-qr');
  if(QR[k]) el.outerHTML = QR[k];
});
</script>
</body>
</html>
