<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정답 없는 세 가지 질문 — 학습지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2430;--navy:#1d3557;--A:#2c5d8f;--B:#c2410c;--line:#cfc9bd;--muted:#6f6a61;--soft:#f6f2ea;--green:#2e7a42}
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:#e9e6e0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tool{position:sticky;top:0;background:#1d3557;color:#fff;padding:10px 16px;display:flex;gap:14px;align-items:center;justify-content:center;font-size:15px;z-index:3}
.tool button{background:#fff;color:#1d3557;border:0;border-radius:8px;padding:10px 20px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;min-height:44px}
.page{width:210mm;height:297mm;margin:16px auto;background:#fff;padding:12mm 14mm 11mm;display:flex;flex-direction:column;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--navy);padding-bottom:7px}
.head .eb{font-size:11pt;font-weight:700;color:var(--navy);letter-spacing:.05em}
.head h1{font-size:21pt;font-weight:900;color:var(--navy);line-height:1.25}
.who{font-size:11.5pt;white-space:nowrap}
.who span{display:inline-block;border-bottom:1px solid #555;min-width:34px;margin:0 3px}
.who span.nm{min-width:110px}
.howto{margin-top:8px;background:var(--soft);border-radius:8px;padding:6px 12px;font-size:10.5pt;line-height:1.5}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding-top:10px}
.grow{flex-grow:var(--g,.5);min-height:0}
.sec{display:flex;flex-direction:column;min-height:0}
.qcard{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px 8px;display:flex;flex-direction:column;min-height:0}
.qh{display:flex;align-items:center;gap:8px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;font-size:12pt;display:flex;align-items:center;justify-content:center}
.qh h2{font-size:14pt;font-weight:900;color:var(--navy)}
.scene{font-size:11pt;line-height:1.55;margin:4px 0 6px}
.scale{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:4px}
.end{font-size:10.5pt;font-weight:700;line-height:1.3}
.end.a{color:var(--A)}
.end.b{color:var(--B);text-align:right}
.end small{display:block;font-weight:400;color:var(--muted);font-size:9pt}
.dots{display:flex;align-items:center;gap:0}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid #8a857c;background:#fff}
.dash{width:20px;height:2px;background:#b9b3a8}
.dot.mA{border-color:var(--A)} .dot.mB{border-color:var(--B)}
.why{display:flex;align-items:stretch;gap:8px;flex:1;min-height:0}
.lw{flex:1;position:relative;min-width:0;min-height:62px}
.lw svg.lines{position:absolute;inset:0;width:100%;height:100%}
.why .lb{flex:none;font-size:10.5pt;font-weight:700;color:var(--muted);padding-top:4px}
svg.lines{display:block;width:100%;flex:1 1 0}
.after{border:1.5px solid var(--green);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-height:0}
.after h2{font-size:13pt;font-weight:900;color:var(--green)}
.row{display:flex;align-items:center;gap:10px;font-size:11pt}
.row .lb{flex:none;font-weight:700}
.box{border:1.5px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0}
.chk{display:inline-flex;align-items:center;gap:4px;margin-right:16px;white-space:nowrap}
.chk i{display:inline-block;width:14px;height:14px;border:1.5px solid #666;border-radius:3px}
.foot{border-top:1.5px solid var(--line);padding-top:6px;margin-top:8px;font-size:9.5pt;color:var(--muted);display:flex;justify-content:space-between}
.foot b{color:var(--navy)}
@media print{
  body{background:#fff}
  .tool{display:none}
  .page{margin:0;box-shadow:none}
}
@media screen{.page{box-shadow:0 2px 12px rgba(0,0,0,.15)}}
</style>
</head>
<body>
<div class="tool no-print">
  <span>A4 한 장 · 인쇄 설정에서 “배경 그래픽”을 켜면 색이 함께 나옵니다.</span>
  <button onclick="window.print()">🖨️ 인쇄</button>
</div>

<div class="page">
  <div class="head">
    <div>
      <div class="eb">학급회의 · 10월 1일</div>
      <h1>정답 없는 세 가지 질문</h1>
    </div>
    <div class="who"><span></span>학년 <span></span>반 <span></span>번 이름 <span class="nm"></span></div>
  </div>
  <div class="howto">
    세 질문 <b>모두</b>에 답해요. ① 내 생각이 <b>A와 B 중 어느 쪽에 더 가까운지</b> 동그라미 네 개 중 하나를 칠하고
    ② <b>왜 그렇게 생각하는지</b> 이유를 적어요. 한가운데는 없어요. 정답도 없어요.
  </div>

  <div class="pbody" id="qs"></div>

  <div class="foot">
    <span>반론은 <b>사람이 아니라 이유</b>에게 — “네 이유 중 ○○ 부분이 나는 걸려. 왜냐하면…”</span>
    <span>학급회의</span>
  </div>
</div>

<script>
const Q = [
  { title:'모둠 과제, 말할까?',
    scene:'넷이서 모둠 과제를 했는데 <b>도헌</b>이는 거의 아무것도 하지 않았다. 발표가 끝나자 선생님이 묻는다. <b>“모둠 모두 함께 했나요?”</b>',
    a:['사실대로 말한다','“도헌이는 거의 안 했어요.”'], b:['말하지 않는다','“네, 다 같이 했어요.”'] },
  { title:'생일 파티, 몇 명만?',
    scene:'<b>소하</b>는 생일에 친구들을 집에 부르고 싶은데, 집이 좁아 <b>다섯 명</b>까지만 된다. 우리 반은 스무 명이 넘는다.',
    a:['몇 명만 불러도 된다','내 생일, 내 집이니 내가 고른다'], b:['몇 명만 부르면 안 된다','못 받은 친구가 마음이 상한다'] },
  { title:'반 대표, 누가 나갈까?',
    scene:'학교 행사에서 반 대표 <b>한 명</b>이 무대에서 발표한다. <b>채율</b>이는 말을 제일 잘하고 작년에도 나갔다. <b>시온</b>이는 한 번도 못 나가 봤지만 꼭 해 보고 싶어 한다.',
    a:['채율이가 나간다','가장 잘하는 사람이 대표로'], b:['시온이가 나간다','기회는 골고루'] },
];
const dots = '<span class="dot mA"></span><span class="dash"></span><span class="dot mA"></span><span class="dash" style="width:34px"></span><span class="dot mB"></span><span class="dash"></span><span class="dot mB"></span>';
document.getElementById('qs').innerHTML = Q.map((q,i)=>`
  <div class="sec qcard grow" style="--g:.22">
    <div class="qh"><div class="num">${i+1}</div><h2>${q.title}</h2></div>
    <p class="scene">${q.scene}</p>
    <div class="scale">
      <div class="end a">A · ${q.a[0]}<small>${q.a[1]}</small></div>
      <div class="dots">${dots}</div>
      <div class="end b">B · ${q.b[0]}<small>${q.b[1]}</small></div>
    </div>
    <div class="why"><div class="lb">왜냐하면</div><div class="lw"><svg class="lines"></svg></div></div>
  </div>`).join('') + `
  <div class="sec after grow" style="--g:.14">
    <h2>회의가 끝나고</h2>
    <div class="row"><span class="lb" style="width:118px">우리가 고른 질문</span><span class="chk"><i></i>1번</span><span class="chk"><i></i>2번</span><span class="chk"><i></i>3번</span></div>
    <div class="row"><span class="lb" style="width:118px">토의 뒤 내 생각</span><span class="chk"><i></i>그대로다</span><span class="chk"><i></i>반대쪽으로 조금 옮겨 갔다</span><span class="chk"><i></i>반대쪽으로 바뀌었다</span></div>
    <div class="row" style="flex:1;min-height:0;align-items:stretch"><span class="lb" style="padding-top:4px;width:118px">마음에 남은<br>친구의 이유</span>
      <div class="box" style="flex:1"><div class="lw" style="min-height:56px"><svg class="lines"></svg></div></div></div>
  </div>`;

const PITCH = 28;
function drawLines(){
  document.querySelectorAll('svg.lines').forEach(svg=>{
    const r = svg.getBoundingClientRect();
    const w = Math.round(r.width), h = Math.round(r.height);
    if(!w || !h) return;
    const rows = Math.max(1, Math.round(h / PITCH));
    const step = h / rows;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    let s = '';
    for(let i=1;i<=rows;i++){
      const y = Math.min(h-0.5, i*step - 0.5);
      if(i===rows && svg.closest('.box')) continue;
      s += `<line x1="4" x2="${w-4}" y1="${y}" y2="${y}" stroke="#d9d3c8" stroke-width="1"/>`;
    }
    svg.innerHTML = s;
  });
}
document.fonts.ready.then(drawLines);
addEventListener('load', drawLines);
addEventListener('resize', drawLines);
addEventListener('beforeprint', drawLines);
</script>
</body>
</html>
