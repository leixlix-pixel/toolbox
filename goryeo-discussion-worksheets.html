<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고려 모둠 토의 학습지 7장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --ink:#1b2a33; --navy:#1a3a52; --acc:#2f7d75; --red:#b83227;
  --line:#c8d3da; --muted:#6b7c88; --tint:#f1f7f6; --tint2:#fdf6ec;
}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans KR',sans-serif; color:var(--ink);
  background:#e9edf0; -webkit-print-color-adjust:exact; print-color-adjust:exact;
}

/* ── 화면 안내 바 ── */
.topbar{
  position:sticky; top:0; z-index:9; background:var(--navy); color:#fff;
  padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}
.topbar h1{margin:0; font-size:17px; font-weight:700; letter-spacing:-.3px}
.topbar p{margin:0; font-size:13px; color:#b9cfdd; flex:1; min-width:240px; line-height:1.5}
.topbar button{
  font-family:inherit; font-size:15px; font-weight:700; color:var(--navy); background:#ffd76e;
  border:0; border-radius:8px; padding:11px 22px; min-height:44px; cursor:pointer;
}
.topbar button:active{transform:translateY(1px)}

/* ── A4 ── */
@page{size:A4; margin:0}
.page{
  width:210mm; height:297mm; overflow:hidden; position:relative;
  padding:13mm 15mm 12mm; background:#fff; margin:18px auto;
  display:flex; flex-direction:column;
  box-shadow:0 3px 14px rgba(0,0,0,.14);
  break-after:page; page-break-after:always;
}
.page:last-of-type{break-after:auto; page-break-after:auto}

/* ── 머리 ── */
.head{flex:0 0 auto; border-bottom:2.5px solid var(--navy); padding-bottom:7px; margin-bottom:11px}
.hrow{display:flex; align-items:flex-end; gap:11px}
.no{
  flex:0 0 auto; width:34px; height:34px; border-radius:9px; background:var(--navy); color:#fff;
  font-size:19px; font-weight:900; display:flex; align-items:center; justify-content:center;
}
.htxt{flex:1; min-width:0}
.unit{font-size:10.5px; color:var(--acc); font-weight:700; letter-spacing:1.5px; margin-bottom:1px}
.ttl{font-size:20px; font-weight:900; letter-spacing:-.7px; line-height:1.15}
.name{flex:0 0 auto; font-size:11px; color:var(--muted); padding-bottom:2px; white-space:nowrap}

/* ── 본문 ── */
.pbody{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:space-between; gap:9px}
.sec{display:flex; flex-direction:column; min-height:0}
.sh{display:flex; align-items:center; gap:7px; margin-bottom:5px; flex:0 0 auto}
.sn{
  width:19px; height:19px; border-radius:50%; background:var(--acc); color:#fff;
  font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.st{font-size:13.5px; font-weight:700; letter-spacing:-.3px}
.time{
  font-size:10px; font-weight:700; color:var(--acc); background:var(--tint);
  border:1px solid #cfe3e0; border-radius:20px; padding:2px 8px; margin-left:auto; white-space:nowrap;
}

.situ{
  font-size:12.5px; line-height:1.62; background:var(--tint2); border-left:3.5px solid #e0b96a;
  padding:8px 11px; border-radius:0 6px 6px 0; margin-bottom:6px; flex:0 0 auto;
}
.situ b{font-weight:700; color:var(--red)}
.ask{font-size:13px; font-weight:700; line-height:1.5; margin-bottom:6px; flex:0 0 auto; color:var(--navy)}

.opts{display:flex; flex-wrap:wrap; gap:5px 14px; margin-bottom:6px; flex:0 0 auto}
.opt{display:flex; align-items:center; gap:5px; font-size:12px; line-height:1.3}
.opt i{
  width:12px; height:12px; border:1.6px solid #8fa0ad; border-radius:2.5px;
  flex:0 0 auto; display:block;
}

.collab{display:flex; font-size:10.5px; color:var(--muted); font-weight:700; margin-bottom:2px; flex:0 0 auto}
.collab span:first-child{width:86px; flex:0 0 auto; padding-left:6px}
.collab span:last-child{padding-left:8px}
.hint{font-size:11px; color:var(--muted); line-height:1.5; margin-bottom:5px; flex:0 0 auto}

svg.grid{flex:1 1 0; width:100%; display:block}

/* 교과서 확인 */
.check{
  border:1.5px dashed #b8ccc9; background:#fafdfc; border-radius:7px;
  padding:8px 11px 9px; flex:0 0 auto;
}
.ci{display:flex; align-items:flex-end; gap:6px; font-size:12px; line-height:1.85; margin-top:1px}
.ci:first-child{margin-top:0}
.ci span{flex:0 0 auto}
.ci u{flex:1; min-width:30px; border-bottom:1px solid #b6c4cc; text-decoration:none; height:15px}
.ci em{flex:0 0 auto; font-style:normal; color:var(--muted); font-size:11px}

.more{
  font-size:11.5px; line-height:1.55; color:var(--navy); background:#f4f7fa;
  border-radius:6px; padding:7px 10px; margin-top:6px; flex:0 0 auto;
}
.more b{color:var(--red)}

.foot{
  flex:0 0 auto; margin-top:9px; padding-top:6px; border-top:1px solid var(--line);
  font-size:10px; color:var(--muted); line-height:1.5; display:flex; justify-content:space-between; gap:12px;
}

@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .page{margin:0; box-shadow:none}
}
</style>
</head>

function optsHTML(list){
  if(!list || !list.length) return '';
  return '<div class="opts">' + list.map(o=>'<span class="opt"><i></i>'+o+'</span>').join('') + '</div>';
}
function checkHTML(list){
  return '<div class="check">' + list.map(c=>
    '<div class="ci"><span>'+c[0]+'</span><u></u><em>'+c[1]+'</em></div>'
  ).join('') + '</div>';
}

document.getElementById('out').innerHTML = SHEETS.map(pageHTML).join('');

/* ── 격자는 SVG 선으로 긋는다 (CSS 테두리는 인쇄 시 세로선이 사라진다) ── */
function drawGrid(svg){
  const r = svg.getBoundingClientRect();
  const w = Math.round(r.width), h = Math.round(r.height);
  if(w < 20 || h < 20) return;
  const pitch = +svg.dataset.pitch || 28;
  const rows = Math.max(1, Math.round(h / pitch));
  const rh = h / rows;
  let s = '<rect x="0.8" y="0.8" width="'+(w-1.6)+'" height="'+(h-1.6)+'" rx="5" fill="none" stroke="#b6c5cd" stroke-width="1.6"/>';
  for(let i=1;i<rows;i++){
    const y = +(i*rh).toFixed(2);
    s += '<line x1="1.6" y1="'+y+'" x2="'+(w-1.6)+'" y2="'+y+'" stroke="#dce3e9" stroke-width="1.1"/>';
  }
  if(svg.dataset.mode === 'named'){
    s += '<line x1="86" y1="1.6" x2="86" y2="'+(h-1.6)+'" stroke="#dce3e9" stroke-width="1.1"/>';
  }
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('preserveAspectRatio','none');
  svg.innerHTML = s;
}
function drawAll(){ document.querySelectorAll('svg.grid').forEach(drawGrid); }

drawAll();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);
window.addEventListener('load', drawAll);
window.addEventListener('resize', drawAll);
window.addEventListener('beforeprint', drawAll);
</script>
