<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>무한 타일 공방 — 합동과 대칭으로 채우는 세상</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1f1a2b;--bg2:#2b2440;--card:#fff;--ink:#231f30;--muted:#6d6780;--line:#e6e2ee;
  --gold:#f2b94b;--red:#e5484d;--good:#12a36b;--blue:#2f7fd8;--violet:#7c5cd6}
html,body{height:100%}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
canvas{display:block;touch-action:none}

/* ── 첫 화면 ── */
#home{align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#homeBg{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
#home .wrap{position:relative;width:100%;max-width:760px;text-align:center;color:#fff}
#home h1{font-size:44px;font-weight:900;letter-spacing:-1.5px;text-shadow:0 3px 18px #000a}
#home .sub{font-size:18px;font-weight:500;margin-top:6px;text-shadow:0 2px 10px #000c}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.door{background:#fffffff2;color:var(--ink);border:0;border-radius:20px;padding:20px 18px;text-align:left;min-height:170px;
  box-shadow:0 10px 30px #0006;display:flex;flex-direction:column;gap:6px}
.door:active{transform:scale(.98)}
.door .ic{font-size:40px;line-height:1}
.door b{font-size:23px;font-weight:900}
.door span{font-size:15px;color:var(--muted);line-height:1.5}
.door .tag{margin-top:auto;font-size:13px;font-weight:700;color:var(--violet)}
.mathline{margin-top:16px;background:#000a;border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.65;text-align:left}
.mathline b{color:#ffd479}
.qrbtn{position:absolute;top:12px;right:12px;background:#fff;border:0;border-radius:14px;padding:7px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:3}
.qrbtn[hidden]{display:none}
.qrbtn svg{width:78px;height:78px;display:block;shape-rendering:crispEdges}
.qrbtn small{font-size:12px;font-weight:700;color:#333}
@media (max-width:620px){.doors{grid-template-columns:1fr}#home h1{font-size:34px}}

/* ── 공통 모달 ── */
.modal{position:fixed;inset:0;background:#0b0814d9;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .card{background:#fff;border-radius:22px;padding:22px;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;text-align:center}
.modal h2{font-size:26px;font-weight:900}
.modal p{font-size:17px;line-height:1.6;margin-top:8px;color:#3a3548}
.modal .big{font-size:44px;letter-spacing:4px;margin:6px 0;color:#f2b94b}
.btn{border:0;border-radius:14px;min-height:54px;padding:12px 22px;font-size:18px;font-weight:900;background:var(--gold);color:#2b1a00}
.btn.gray{background:#ebe8f2;color:var(--ink)}
.btn.blue{background:var(--blue);color:#fff}
.btn:active{filter:brightness(.92)}
.btns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
#qrBig .card{max-width:520px}
#qrBig svg{width:min(440px,78vw,70vh);height:auto;shape-rendering:crispEdges}

/* ── 지도 ── */
#map{overflow-y:auto;align-items:center;padding:14px}
#map .wrap{width:100%;max-width:880px}
.top{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:12px}
.top h2{font-size:25px;font-weight:900;flex:1}
.hb{min-width:48px;height:46px;border:0;border-radius:12px;background:#3b3354;color:#fff;font-size:16px;font-weight:800;padding:0 13px}
.hb:disabled{opacity:.35}
.hb.y{background:#ffd479;color:#3b2500}
.tot{font-size:18px;font-weight:900;color:#ffd479}
.world{background:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px;display:flex;gap:14px;align-items:center}
.world.lock{background:#3b3354;color:#aaa3c2}
.world canvas{width:120px;height:90px;border-radius:12px;flex:0 0 auto}
.world .wi{flex:1;min-width:0}
.world h3{font-size:20px;font-weight:900}
.world .ws{font-size:14px;color:var(--muted);margin:2px 0 8px;line-height:1.45}
.world.lock .ws{color:#8f88a8}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{min-height:62px;border-radius:13px;border:2px solid var(--line);background:#faf9fd;font-weight:900;font-size:18px;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.lv .st{font-size:13px;color:#e6a400;letter-spacing:-1px;min-height:15px}
.lv.boss{background:#fff1dc;border-color:#f3b35a}
.lv.done{border-color:#7fd8ae}
.lv.lk{background:#efedf4;color:#b3aec4}
.lockmsg{font-size:13px;color:#c26a00;font-weight:700;margin-top:6px}
@media (max-width:600px){.world canvas{display:none}}

/* ── 퍼즐 ── */
#play{padding:10px;gap:8px}
.hud{display:flex;align-items:center;gap:7px;color:#fff;flex-wrap:wrap}
.hud .nm{font-size:20px;font-weight:900;margin-right:auto;line-height:1.2}
.hud .nm small{display:block;font-size:13px;font-weight:600;color:#cfc6ea}
.meter{background:#3b3354;border-radius:12px;padding:5px 12px;font-size:14px;font-weight:800;text-align:center;line-height:1.3}
.meter b{color:#ffd479;font-size:16px}
.pbody{flex:1;min-height:0;display:flex;gap:10px}
.boardBox{flex:1;min-width:0;min-height:0;background:#15111f;border-radius:18px;position:relative;overflow:hidden}
.boardBox canvas{width:100%;height:100%}
.side{width:320px;flex:0 0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.panel{background:#fff;border-radius:18px;padding:10px}
.trayBox{flex:1;min-height:0;display:flex;flex-direction:column}
.trayBox h4{font-size:15px;font-weight:900;margin:0 0 4px 2px}
.trayBox h4 small{font-weight:600;color:var(--muted);font-size:13px}
#tray{flex:1;min-height:0;width:100%}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cb{height:64px;border:0;border-radius:14px;background:#efeaff;color:#3a2a80;font-size:26px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cb small{font-size:12px;font-weight:800;margin-top:3px}
.cb.flip{background:#e1f3ff;color:#0b5a93}
.cb:disabled{opacity:.35}
.cb:active{filter:brightness(.9)}
.say{font-size:15px;line-height:1.5;color:#3a3548;min-height:46px;padding:2px 4px}
.say b{color:var(--red)}
.say.ok b{color:var(--good)}
@media (max-aspect-ratio:1/1){
  .pbody{flex-direction:column}
  .side{width:100%;flex:0 0 auto;flex-direction:row;height:220px}
  .trayBox{flex:1}
  .side .panel.c2{width:230px;display:flex;flex-direction:column;justify-content:space-between}
  .boardBox{flex:1}
}

/* ── 공방: 틀 고르기 ── */
#pick{overflow-y:auto;align-items:center;padding:14px}
#pick .wrap{width:100%;max-width:980px}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rec{background:#fff;border:0;border-radius:18px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px}
.rec canvas{width:100%;aspect-ratio:3/2;border-radius:12px;background:#eee}
.rec b{font-size:19px;font-weight:900;margin-top:4px}
.rec span{font-size:14px;color:var(--muted);line-height:1.4}
.rec .mt{font-size:13px;font-weight:800;color:var(--violet)}
.rec:active{transform:scale(.98)}
.mine{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.mi{background:#fff;border-radius:14px;padding:6px;position:relative}
.mi canvas,.mi img{width:100%;aspect-ratio:3/2;border-radius:9px;display:block}
.mi .x{position:absolute;top:2px;right:2px;width:34px;height:34px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:16px}
.mi .d{font-size:12px;color:var(--muted);margin-top:3px;text-align:center}
.sect{color:#fff;font-size:18px;font-weight:900;margin:18px 0 4px}
.sect small{font-weight:500;font-size:14px;color:#cfc6ea;margin-left:6px}
@media (max-width:760px){.recs{grid-template-columns:repeat(2,1fr)}.mine{grid-template-columns:repeat(3,1fr)}}

/* ── 공방 ── */
#studio{padding:10px;gap:8px}
.tabs{display:flex;gap:6px}
.tab{height:46px;border:0;border-radius:12px;padding:0 16px;font-size:16px;font-weight:900;background:#3b3354;color:#d8d0f0}
.tab.on{background:#fff;color:var(--ink)}
.sbody{flex:1;min-height:0;display:flex;gap:10px}
.cvBox{flex:1;min-width:0;min-height:0;border-radius:18px;overflow:hidden;position:relative;background:#f4f1ea}
.cvBox canvas{width:100%;height:100%}
.warn{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:800;font-size:15px;padding:8px 14px;border-radius:12px;display:none;white-space:nowrap}
.warn.on{display:block}
.float{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.sp{width:320px;flex:0 0 auto;background:#fff;border-radius:18px;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.sp h4{font-size:16px;font-weight:900}
.sp p,.sp li{font-size:14.5px;line-height:1.55;color:#3a3548}
.sp ul{padding-left:18px}
.chip{background:#f3f0fb;border-radius:12px;padding:9px 11px;font-size:14px;line-height:1.55}
.chip b{color:#5b3cc4}
.chip.m{background:#fff6e2}
.chip.m b{color:#a15c00}
.row{display:flex;gap:6px;flex-wrap:wrap}
.sb{min-height:46px;border:0;border-radius:12px;background:#efedf4;color:var(--ink);font-size:15px;font-weight:800;padding:0 12px;flex:1 1 auto}
.sb.on{background:var(--ink);color:#fff}
.sb:disabled{opacity:.35}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d0cbe0;flex:0 0 auto}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.pal{display:flex;border-radius:10px;overflow:hidden;height:40px;border:3px solid transparent;flex:1 1 40%;padding:0}
.pal i{flex:1}
.pal.on{border-color:var(--ink)}
.pal span{display:none}
input[type=range]{width:100%;height:36px}
.legend{display:flex;flex-direction:column;gap:4px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend i{width:30px;height:0;border-top:5px solid;flex:0 0 auto}
.legend i.d{border-top-style:dashed}
@media (max-aspect-ratio:1/1){
  .sbody{flex-direction:column}
  .sp{width:100%;height:42%;flex:0 0 auto}
}
.fs .sp,.fs .tabs{display:none}
</style>
</head>
<body>

<!-- ═════════ 첫 화면 ═════════ -->
<section class="screen on" id="home">
  <canvas id="homeBg"></canvas>
  <button class="qrbtn" id="qrBtn" hidden onclick="openM('qrBig')"></button>
  <div class="wrap">
    <h1 id="ttl">무한 타일 공방</h1>
    <div class="sub">에셔처럼 — 똑같은 조각 하나로 빈틈도 겹침도 없이 세상을 채우기</div>
    <div class="doors">
      <button class="door" onclick="go('map')">
        <div class="ic">🧩</div><b>타일 맞추기 훈련소</b>
        <span>구멍 난 타일 무늬에 조각을 <b>돌리고 뒤집어</b> 끼워요. 모양이 살짝 다른 <b>가짜 조각</b>이 섞여 있어요.</span>
        <div class="tag">공방 4곳 · 20판 · 최소 수로 풀면 ★★★</div>
      </button>
      <button class="door" onclick="openPick()">
        <div class="ic">🎨</div><b>나만의 타일 만들기</b>
        <span>한 변을 휘면 <b>짝 변이 똑같이 따라</b> 휘어요. 무늬와 색을 입혀 끝없이 이어지는 그림을 만들어요.</span>
        <div class="tag">모양 틀 6가지 · 그림 저장</div>
      </button>
    </div>
    <div class="mathline">
      📐 <b>합동</b> — 모든 조각은 크기와 모양이 같아 포개면 꼭 맞아요.<br>
      🔁 <b>대칭과 옮기기</b> — 조각을 <b>밀고</b>(옮기기) · <b>돌리고</b>(회전) · <b>뒤집어</b>(대칭) 이어 붙이면 틈이 안 생겨요.
    </div>
  </div>
</section>

<!-- ═════════ 훈련소 지도 ═════════ -->
<section class="screen" id="map">
  <div class="wrap">
    <div class="top"><button class="hb" onclick="go('home')">← 처음</button><h2>🧩 타일 맞추기 훈련소</h2><span class="tot" id="totStar"></span></div>
    <div id="worlds"></div>
  </div>
</section>

<!-- ═════════ 퍼즐 ═════════ -->
<section class="screen" id="play">
  <div class="hud">
    <button class="hb" onclick="leavePlay()">←</button>
    <div class="nm" id="pName"></div>
    <div class="meter">수 <b id="pMoves">0</b><br><span id="pMin"></span></div>
    <div class="meter" id="pStars">★★★</div>
    <button class="hb" onclick="showRule(true)">규칙</button>
    <button class="hb y" onclick="useHint()">💡 힌트</button>
    <button class="hb" onclick="startLevel(PL.wi,PL.li)">↺ 처음부터</button>
  </div>
  <div class="pbody">
    <div class="boardBox"><canvas id="board"></canvas></div>
    <div class="side">
      <div class="panel trayBox"><h4>조각 상자 <small id="trayInfo"></small></h4><canvas id="tray"></canvas></div>
      <div class="panel c2">
        <div class="ctrl">
          <button class="cb" id="bL" onclick="act('L')">↺<small>왼쪽 돌리기</small></button>
          <button class="cb flip" id="bF" onclick="act('F')">⇋<small>뒤집기</small></button>
          <button class="cb" id="bR" onclick="act('R')">↻<small>오른쪽 돌리기</small></button>
        </div>
        <div class="say" id="say">조각을 하나 골라요.</div>
      </div>
    </div>
  </div>
</section>

<!-- ═════════ 공방: 틀 고르기 ═════════ -->
<section class="screen" id="pick">
  <div class="wrap">
    <div class="top"><button class="hb" onclick="go('home')">← 처음</button><h2>🎨 어떤 틀로 시작할까?</h2></div>
    <div class="recs" id="recs"></div>
    <div class="sect" id="mineH">💾 내 타일 <small>이 태블릿에만 남아요</small></div>
    <div class="mine" id="mine"></div>
  </div>
</section>

<!-- ═════════ 공방 ═════════ -->
<section class="screen" id="studio">
  <div class="hud">
    <button class="hb" onclick="leaveStudio()">←</button>
    <div class="nm" id="sName"></div>
    <div class="tabs">
      <button class="tab on" data-t="shape" onclick="setTab('shape')">① 모양</button>
      <button class="tab" data-t="deco" onclick="setTab('deco')">② 무늬</button>
      <button class="tab" data-t="color" onclick="setTab('color')">③ 색·감상</button>
    </div>
  </div>
  <div class="sbody">
    <div class="cvBox"><canvas id="scv"></canvas><div class="warn" id="warn">선이 서로 엇갈렸어요 — 점을 조금 옮겨 봐요</div>
      <div class="float" id="floatBtns"></div></div>
    <div class="sp" id="sp"></div>
  </div>
</section>

<!-- ═════════ 모달 ═════════ -->
<div class="modal" id="msg"><div class="card" id="msgIn"></div></div>
<div class="modal" id="qrBig" onclick="closeM('qrBig')"><div class="card"><div id="qrBigIn"></div><p>태블릿 카메라로 찍으면 열려요</p></div></div>

<script>

  const st = ST.des.strokes, before = st.length;
  for (let i = st.length - 1; i >= 0; i--) { const s = st[i];
    const hit = s.type === 'eye' ? Math.hypot(s.x - b.x, s.y - b.y) < s.r + .03 : s.pts.some(q => Math.hypot(q[0] - b.x, q[1] - b.y) < .05 + s.w / 2);
    if (hit) { if (st.length === before) pushHist(); st.splice(i, 1); } }
  if (st.length !== before) rebuild();
}
let flashT = 0;
function flash(t) { const e = $('#warn'); e.textContent = t; e.classList.add('on'); clearTimeout(flashT);
  flashT = setTimeout(() => { e.textContent = '선이 서로 엇갈렸어요 — 점을 조금 옮겨 봐요'; e.classList.toggle('on', ST.sh.bad); }, 1800); }
let flowRAF = 0, flowT = 0;
function toggleFlow() { ST.flow = !ST.flow; sPanel(); if (ST.flow) { flowT = performance.now(); const loop = t => { if (!ST.flow || screen !== 'studio') return;
  const dt = Math.min(50, t - flowT); flowT = t; ST.pan = P(ST.pan.x + dt * .00035, ST.pan.y + dt * .00012); sDraw(); flowRAF = requestAnimationFrame(loop); };
  flowRAF = requestAnimationFrame(loop); } }
function stopFlow() { ST.flow = false; cancelAnimationFrame(flowRAF); }
function toggleFS() {
  const st = $('#studio'); const on = !st.classList.contains('fs'); st.classList.toggle('fs', on);
  try { if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); else if (!on && document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  $('#floatBtns').innerHTML = on ? `<button class="hb y" onclick="toggleFS()">✕ 작게</button>` : '';
  requestAnimationFrame(sDraw);
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && $('#studio').classList.contains('fs')) { $('#studio').classList.remove('fs'); $('#floatBtns').innerHTML = ''; requestAnimationFrame(sDraw); } });
function renderTo(W, H, span, pal, caption) {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d'), sh = ST.sh;
  const s = W / span, cx = sh.c0.x + ST.pan.x, cy = sh.c0.y + ST.pan.y;
  ctx.fillStyle = '#f4f1ea'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(s, 0, 0, s, W / 2 - cx * s, H / 2 - cy * s);
  sh.walk = ID;
  for (const t of tileSet(sh, { x0: cx - W / 2 / s, x1: cx + W / 2 / s, y0: cy - H / 2 / s, y1: cy + H / 2 / s }))
    drawTile(ctx, sh, t.G, PALS[pal].c[t.col], ST.outline ? Math.max(1.2, W / 900) / s : 0);
  if (caption) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#1c1a26d9'; ctx.fillRect(0, H - 54, W, 54);
    ctx.fillStyle = '#fff'; ctx.font = '700 24px Noto Sans KR'; ctx.textBaseline = 'middle'; ctx.fillText(caption, 20, H - 27); }
  return cv;
}
function saveMine() {
  const mine = LS.get('tess-mine', []), d = new Date();
  const item = { des: ST.des, pal: ST.pal, date: `${d.getMonth() + 1}/${d.getDate()}`, thumb: renderTo(240, 160, 4.2, ST.pal).toDataURL('image/jpeg', .8) };
  if (ST.slot != null && mine[ST.slot]) mine[ST.slot] = item; else { if (mine.length >= 12) mine.pop(); mine.unshift(item); ST.slot = 0; }
  const ok = LS.set('tess-mine', mine);
  showMsg(`<h2>${ok ? '💾 저장했어요' : '저장하지 못했어요'}</h2><p>${ok ? '「나만의 타일 만들기」 첫 화면의 <b>내 타일</b>에서 다시 열 수 있어요. 이 태블릿에만 남아요.' : '이 태블릿의 저장 공간이 모자라요. 「🖼 그림 저장」으로 남겨 두세요.'}</p><div class="btns"><button class="btn" onclick="closeM('msg')">확인</button></div>`);
}
function savePNG() {
  const R = RECIPES[ST.des.rec];
  const cv = renderTo(1800, 1200, 9 / ST.zoom, ST.pal, `무한 타일 공방 · ${R.name} (${R.math})`);
  try { const a = document.createElement('a'); a.download = 'my-tessellation.png'; a.href = cv.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove();
    showMsg(`<h2>🖼 그림을 저장했어요</h2><p>태블릿의 <b>다운로드</b> 폴더를 보세요. 클래스룸에 올려 친구들과 나눠요.</p><div class="btns"><button class="btn" onclick="closeM('msg')">확인</button></div>`);
  } catch (e) { showMsg(`<h2>저장하지 못했어요</h2><p>화면을 캡처해서 남겨 주세요.</p><div class="btns"><button class="btn" onclick="closeM('msg')">확인</button></div>`); }
}

if (QR.main) { const b = $('#qrBtn'); b.hidden = false; b.innerHTML = QR.main + '<small>🔍 크게</small>'; $('#qrBigIn').innerHTML = QR.main; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('.modal.on').forEach(m => m.classList.remove('on')); });
go('home');
</script>
