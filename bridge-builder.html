<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>다리 놓는 사람들</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
  background:#0e1726;color:#e8eef7;
}
:root{
  --bg:#0e1726; --panel:#17243a; --panel2:#1f3050; --line:#2c4269;
  --ink:#e8eef7; --muted:#8fa3c0;
  --road:#f0c86a; --wood:#c98b52; --steel:#9fb6d4; --cable:#7fd8c8;
  --ok:#5ad18a; --bad:#ff6b6b; --gold:#ffd24a;
}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}

/* ---------- 공통 버튼 ---------- */
.btn{
  min-height:48px;padding:10px 18px;border:2px solid var(--line);border-radius:12px;
  background:var(--panel2);color:var(--ink);font-family:inherit;font-size:16px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ok);border-color:#3fae6d;color:#06301a}
.btn.warn{background:var(--gold);border-color:#c79c17;color:#3a2b00}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.38}

/* ---------- 화면 ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:5}
.screen.on{display:flex}

/* 타이틀 */
#title{align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at 50% 35%,#24406b 0%,#0e1726 70%);overflow-y:auto;padding:24px}
#title h1{font-size:44px;font-weight:900;letter-spacing:-1px;margin-bottom:6px}
#title .sub{color:var(--muted);font-size:17px;margin-bottom:6px}
#title .unit{color:#6f86a8;font-size:14px;margin-bottom:26px}
#title .rowb{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* 판 고르기 */
#pick{background:var(--bg)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);
  border-bottom:2px solid var(--line);flex:0 0 auto}
.topbar h2{font-size:19px;font-weight:900;flex:1}
#pickBody{flex:1;overflow-y:auto;padding:14px 14px 40px}
.world{margin-bottom:22px}
.world h3{font-size:16px;color:var(--gold);margin-bottom:4px;font-weight:900}
.world p{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.lv{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;
  display:flex;flex-direction:column;gap:5px;min-height:92px}
.lv:active{transform:translateY(1px)}
.lv .n{font-size:12px;color:var(--muted);font-weight:700}
.lv .t{font-size:15px;font-weight:700;line-height:1.3;flex:1}
.lv .s{font-size:15px;letter-spacing:2px;color:#40506b}
.lv .s b{color:var(--gold);font-weight:400}
.lv.locked{opacity:.4;cursor:default}
.lv.clear{border-color:#3d6b52;background:#162a20}

/* 게임 */
#game{background:#0e1726}
#hud{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:8px;
  padding:8px 10px;background:linear-gradient(#0e1726f0,#0e172600);pointer-events:none}
#hud>*{pointer-events:auto}
#hud .name{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .flex{flex:1;min-width:0}
.money{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;
  background:#17243ad9;border:2px solid var(--line);border-radius:10px;padding:6px 10px;white-space:nowrap}
.money.over{border-color:var(--bad);color:var(--bad)}
.icon{min-height:40px;min-width:40px;padding:6px 10px;font-size:18px;border-radius:10px;
  border:2px solid var(--line);background:#17243ad9;color:var(--ink);font-family:inherit;cursor:pointer}

#tools{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;gap:7px;padding:9px 10px;
  background:linear-gradient(#0e172600,#0e1726e8 32%);align-items:flex-end;flex-wrap:wrap;justify-content:center}
.mat{min-height:52px;border:3px solid var(--line);border-radius:13px;background:var(--panel);
  color:var(--ink);font-family:inherit;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:2px;min-width:74px}
.mat .mn{font-size:14px;font-weight:900}
.mat .mc{font-size:11px;color:var(--muted);font-weight:700}
.mat.on{background:var(--panel2)}
.mat[data-m="road"].on{border-color:var(--road)}  .mat[data-m="road"] .mn{color:var(--road)}
.mat[data-m="wood"].on{border-color:var(--wood)}  .mat[data-m="wood"] .mn{color:var(--wood)}
.mat[data-m="steel"].on{border-color:var(--steel)}.mat[data-m="steel"] .mn{color:var(--steel)}
.mat[data-m="cable"].on{border-color:var(--cable)}.mat[data-m="cable"] .mn{color:var(--cable)}
.mat[data-m="erase"].on{border-color:var(--bad)}  .mat[data-m="erase"] .mn{color:var(--bad)}

/* 말풍선 안내 */
#toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:8;
  background:#0b1220ee;border:2px solid var(--line);border-radius:12px;padding:9px 15px;
  font-size:14px;font-weight:700;max-width:88%;text-align:center;display:none;line-height:1.5}
#toast.on{display:block}

/* 힘 범례 */
#legend{position:absolute;right:10px;top:58px;z-index:6;background:#0b1220e8;border:2px solid var(--line);
  border-radius:12px;padding:9px 11px;font-size:12px;line-height:1.8;display:none}
#legend.on{display:block}
#legend i{display:inline-block;width:20px;height:5px;border-radius:3px;vertical-align:middle;margin-right:6px}

/* 모달 */
.modal{position:absolute;inset:0;z-index:20;background:#060b14cc;display:none;
  align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.card{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:22px;
  max-width:560px;width:100%;max-height:88%;overflow-y:auto}
.card h3{font-size:23px;font-weight:900;margin-bottom:12px}
.card p{font-size:15px;line-height:1.75;color:#cfdcee;margin-bottom:11px}
.card p b{color:var(--gold)}
.card .stars{font-size:38px;text-align:center;letter-spacing:6px;color:#3a4a66;margin:6px 0 12px}
.card .stars b{color:var(--gold);font-weight:400}
.card .rowb{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.card ul{margin:0 0 12px 20px}
.card li{font-size:15px;line-height:1.7;color:#cfdcee;margin-bottom:5px}
.note{background:#0f1a2c;border-left:4px solid var(--gold);border-radius:0 10px 10px 0;
  padding:11px 14px;font-size:14px;line-height:1.7;color:#cfdcee;margin-bottom:12px}
.mini{font-size:13px;color:var(--muted);line-height:1.7}

/* QR — 태블릿 카메라로 찍어서 여는 자리. 작게 줄이지 말 것(교실 뒤에서도 찍는다) */
#qrBox{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:9px}
#qrBox .qr{width:232px;height:232px;background:#fff;border-radius:16px;padding:12px;
  border:4px solid var(--panel2);box-shadow:0 8px 28px #0006}
#qrBox .qr svg{display:block;width:100%;height:auto}
#qrBox .cap{font-size:15px;font-weight:700;color:#cfdcee}
#qrBox .url{font-size:12px;color:#6f86a8;word-break:break-all;max-width:280px}
@media (max-height:620px){ #qrBox .qr{width:150px;height:150px;padding:8px} #qrBox{margin-top:16px} }
</style>
</head>

<script>
/* =======================================================================
   다리 놓는 사람들 — 실과 5단원 「건설과 디지털 기술」
   -----------------------------------------------------------------------
   구조는 딱 셋이다.
     · LV      판 데이터 (땅 · 예산 · 재료 · 차)
     · sim()   물리 — 질량점 + 막대 구속(베를레 적분)
     · draw()  다시 그리기 하나
   ======================================================================= */

/* ---------------- 소리 : 파일 없이 Web Audio 로 ---------------- */
const SND = {
  ctx:null, vol:0.55,
  init(){ if(this.ctx) return; try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  tone(f,dur,type,vol,delay,slide){
    if(!this.ctx||this.vol<=0) return;
    const t0=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime((vol??0.16)*this.vol,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0+dur+0.05);
  },
  noise(dur,vol,delay,freq){
    if(!this.ctx||this.vol<=0) return;
    const t0=this.ctx.currentTime+(delay||0);
    const len=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const g=this.ctx.createGain(); g.gain.value=(vol??0.12)*this.vol;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start(t0);
  },
  click(){ this.tone(680,0.055,'square',0.09); },
  place(){ this.tone(520,0.05,'triangle',0.10); this.tone(780,0.05,'triangle',0.06,0.035); },
  erase(){ this.tone(300,0.07,'square',0.08,0,200); },
  nope(){ this.tone(180,0.13,'sawtooth',0.10,0,120); },
  snap(){ this.noise(0.18,0.20,0,420); this.tone(140,0.16,'sawtooth',0.09,0,60); },  /* 부러짐 */
  splash(){ this.noise(0.5,0.16,0,700); this.tone(90,0.4,'sine',0.10,0,50); },
  motor(){ this.tone(110,0.12,'sawtooth',0.03); },
  win(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,0.17,'triangle',0.15,i*0.075)); },
  star(){ [784,1047,1319].forEach((f,i)=>this.tone(f,0.14,'sine',0.17,i*0.06)); },
  fail(){ this.tone(220,0.24,'sawtooth',0.12,0,110); this.tone(160,0.28,'square',0.08,0.07,90); }
};

/* ---------------- 재료 ----------------
   brk    끊어지는 변형률. 길이가 이 비율만큼 늘거나 줄면 부러진다.

const SAVE_KEY = 'bridge_builders_v1';
let SAVE = {stars:{}, best:{}};
function loadSave(){ try{ const s=localStorage.getItem(SAVE_KEY); if(s) SAVE=JSON.parse(s); }catch(e){}
  if(!SAVE.stars) SAVE.stars={}; if(!SAVE.best) SAVE.best={}; }

function starsOf(id){ return SAVE.stars[id]||0; }
function totalStars(){ let n=0; for(const k in SAVE.stars) n+=SAVE.stars[k]; return n; }
function unlocked(i){ if(i===0) return true;
  /* 앞 판을 깼거나, 그 월드의 첫 판이면 열린다 — 한 판에 막혀 전부 멈추지 않게 */
  if(starsOf(LV[i-1].id)>0) return true;
  for(const w of WORLDS) if(w.a===i) return totalStars()>=Math.max(0,(w.a-2));
  return false;
}

/*==PHYSICS-START== (이 구간만 떼어 node 로 돌려 20판을 검증한다 — search.cjs) */
const G = 15.0;          /* 중력 (칸/s²) */
const CAR_ITER = 8;      /* 차 뼈대를 굳히는 반복 횟수 */
const HIT_ITER = 3;      /* 부딪힘 밀어내기 반복 횟수 */
const SIM_LIMIT = 30;    /* 한 판 시험 최대 초 */
const SMOOTH = 0.975;    /* 변형률 평활 — 아래 6) 참고 */

function segRect(x1,y1,x2,y2,r,pad){
  pad = pad||0.02;
  const rx=r[0]+pad, ry=r[1]+pad, rw=r[2]-pad*2, rh=r[3]-pad*2;
  if(rw<=0||rh<=0) return false;
  let t0=0,t1=1; const dx=x2-x1, dy=y2-y1;
  const p=[-dx,dx,-dy,dy], q=[x1-rx, rx+rw-x1, y1-ry, ry+rh-y1];
  for(let i=0;i<4;i++){
    if(Math.abs(p[i])<1e-9){ if(q[i]<0) return false; }
    else { const t=q[i]/p[i];
      if(p[i]<0){ if(t>t1) return false; if(t>t0) t0=t; }
      else      { if(t<t0) return false; if(t<t1) t1=t; } }
  }
  return t1>t0;
}
function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let t = L2>1e-9 ? ((px-ax)*dx+(py-ay)*dy)/L2 : 0;
  t = t<0?0:(t>1?1:t);
  return {t, x:ax+dx*t, y:ay+dy*t};
}

function makeWorld(lv, nodes, beams){
  const W = {
    lv, ground:lv.ground, water:lv.water, h:lv.h,
    goal:lv._goal, t:0, state:'run', reason:'', shards:[],
    nodes:[], beams:[], cars:[], queue:[]
  };
  /* 절점 — 붙어 있는 막대 무게의 절반씩을 나눠 가진다 */
  W.nodes = nodes.map(n=>({x:n.x, y:n.y, px:n.x, py:n.y, fix:n.fix, m:0.10, inv:0}));
  W.beams = beams.map(b=>{
    const A=W.nodes[b.a], B=W.nodes[b.b];
    const L=Math.hypot(B.x-A.x, B.y-A.y), M=MAT[b.m];
    const mass = L*M.dens*0.22;
    A.m+=mass/2; B.m+=mass/2;
    return {a:b.a, b:b.b, L, m:b.m, brk:M.brk, E:M.E, tension:!!M.tension,
            s:0, cur:0, peak:0, dead:false};
  });
  W.nodes.forEach(n=>{ n.inv = n.fix ? 0 : 1/n.m; });
  (lv.veh||[{t:'car',d:0}]).forEach(v=>W.queue.push({t:v.t, d:v.d||0}));
  return W;
}

function spawnCar(W, kind){
  const V = VEH[kind], x0 = W.lv._startX, gy = W.lv._startY;
  const r=V.r, wb=V.wb, bh=V.bh, M=V.mass;
  const mk=(x,y,m)=>({x,y,px:x,py:y,m,inv:1/m,hit:false});
  const w0=mk(x0, gy-r, M*0.34), w1=mk(x0+wb, gy-r, M*0.34), bd=mk(x0+wb/2, gy-r-bh, M*0.32);
  W.cars.push({kind, V, r, p:[w0,w1,bd], done:false, dead:false,
    cons:[ [0,1,wb], [0,2,Math.hypot(wb/2,bh)], [1,2,Math.hypot(wb/2,bh)] ],
    lastX:x0, stall:0});
}

/* 바퀴(원) 하나를 땅과 도로에서 밀어낸다 */
function pushOut(W, c, pi){
  const p=c.p[pi], rr = pi<2 ? c.r : c.r*0.75, N=W.nodes;
  for(const g of W.ground){
    const cx=Math.max(g[0],Math.min(p.x,g[0]+g[2]));
    const cy=Math.max(g[1],Math.min(p.y,g[1]+g[3]));
    let dx=p.x-cx, dy=p.y-cy, d=Math.hypot(dx,dy);
    if(d<1e-6){ p.y=g[1]-rr; p.py=p.y+(p.py-p.y)*0.2; p.hit=true; continue; }
    if(d<rr){ const n=(rr-d)/d; p.x+=dx*n; p.y+=dy*n; p.hit=true;
      if(dy<0) p.px += (p.x-p.px)*0.06; }
  }
  /* 차는 **도로하고만** 부딪힌다. 나무·강철·케이블은 도로 옆에 선 것으로 친다.
     여기를 모든 막대로 넓히지 말 것 — 제가 세운 탑과 빗변에 제 차가 처박힌다. */
  for(const b of W.beams){
    if(b.dead || !MAT[b.m].drive) continue;
    const A=N[b.a], C=N[b.b];
    const q=closestOnSeg(p.x,p.y,A.x,A.y,C.x,C.y);
    let dx=p.x-q.x, dy=p.y-q.y, d=Math.hypot(dx,dy);
    const R = rr+0.05;
    if(d>=R) continue;
    if(d<1e-6){ dx=0; dy=-1; d=1e-6; }
    const push=(R-d)/d, nx=dx*push, ny=dy*push;
    const wa=(1-q.t)*A.inv, wb=q.t*C.inv, tot=p.inv+wa+wb;
    if(tot<=0) continue;
    p.x += nx*(p.inv/tot); p.y += ny*(p.inv/tot);
    A.x -= nx*(wa/tot);   A.y -= ny*(wa/tot);
    C.x -= nx*(wb/tot);   C.y -= ny*(wb/tot);
    p.hit=true;
    if(dy<0) p.px += (p.x-p.px)*0.05;
  }
}

function step(W, dt){
  if(W.state!=='run') return;
  W.t += dt;
  for(let i=W.queue.length-1;i>=0;i--)
    if(W.t >= W.queue[i].d){ spawnCar(W, W.queue[i].t); W.queue.splice(i,1); }

  const N=W.nodes, B=W.beams, dt2=dt*dt;

  /* 1) 적분 — 베를레 */
  for(const n of N){
    if(n.inv===0){ n.px=n.x; n.py=n.y; continue; }
    const vx=(n.x-n.px)*0.988, vy=(n.y-n.py)*0.988;
    n.px=n.x; n.py=n.y; n.x+=vx; n.y+=vy+G*dt2;
  }
  for(const c of W.cars){
    if(c.dead) continue;
    for(const p of c.p){
      const vx=(p.x-p.px)*0.999, vy=(p.y-p.py)*0.999;
      p.px=p.x; p.py=p.y; p.x+=vx; p.y+=vy+G*dt2; p.hit=false;
    }
  }

  /* 2) 막대 = 용수철. 힘 = 강성 E × 변형률, 그 힘을 제 무게로 나눠 밀린다.
     ── 길이를 곧바로 맞추는 방식(위치 구속)으로 되돌리지 말 것. ──
     그 방식은 밀어내는 양이 두 점의 무게 **비율**로만 갈려서, 다리를 무겁게
     지으면 차가 상대적으로 가벼워져 오히려 튼튼해진다. 실제로 그렇게 짰다가
     「도로만 4칸씩 깐 20칸 다리」가 통과해서 20판이 전부 무의미해졌다. */
  for(const b of B){
    if(b.dead) continue;
    const A=N[b.a], C=N[b.b];
    let dx=C.x-A.x, dy=C.y-A.y;
    let d=Math.hypot(dx,dy); if(d<1e-9) d=1e-9;
    b.cur=(d-b.L)/b.L;
    if(b.tension && b.cur<0) continue;          /* 케이블은 밀지 않는다 */
    const f = b.E*b.cur*dt2/d;
    A.x += dx*f*A.inv; A.y += dy*f*A.inv;
    C.x -= dx*f*C.inv; C.y -= dy*f*C.inv;
  }

  /* 3) 차 뼈대는 단단하다 — 여기는 위치로 맞춘다 */
  for(let it=0; it<CAR_ITER; it++)
    for(const c of W.cars){
      if(c.dead) continue;
      for(const cc of c.cons){
        const A=c.p[cc[0]], C=c.p[cc[1]];
        let dx=C.x-A.x, dy=C.y-A.y, d=Math.hypot(dx,dy); if(d<1e-9) d=1e-9;
        const diff=(d-cc[2])/d, w=A.inv+C.inv;
        const fx=dx*diff*0.5, fy=dy*diff*0.5;
        A.x+=fx*(A.inv/w); A.y+=fy*(A.inv/w);
        C.x-=fx*(C.inv/w); C.y-=fy*(C.inv/w);
      }
    }

  /* 4) 부딪힘 */
  for(let it=0; it<HIT_ITER; it++)
    for(const c of W.cars){ if(c.dead) continue; for(let pi=0;pi<3;pi++) pushOut(W,c,pi); }

  /* 5) 구동 — 땅이나 다리에 닿아 있을 때만 민다 */
  for(const c of W.cars){
    if(c.dead||c.done) continue;
    const target = c.V.speed*dt;
    for(let i=0;i<2;i++){
      const p=c.p[i]; if(!p.hit) continue;
      const vx=p.x-p.px;
      if(vx<target) p.px -= Math.min((target-vx)*0.45, target*0.5);
    }
  }

  /* 6) 부러짐 — 변형률을 **많이** 고르게 편다.
     짧게 잡으면 바퀴가 지나갈 때의 순간 충격이 그대로 잡혀서 제대로 지은
     다리도 한계를 찍고 끊어진다. 그러면 설계를 바꿔도 결과가 다 같아져
     게임이 안 된다(20판 훑어 확인). SMOOTH 를 낮추지 말 것. */
  for(const b of B){
    if(b.dead) continue;
    b.s = b.s*SMOOTH + b.cur*(1-SMOOTH);
    if(Math.abs(b.s)>Math.abs(b.peak)) b.peak=b.s;
    const over = b.tension ? (b.s>b.brk) : (Math.abs(b.s)>b.brk);
    if(over){
      b.dead=true;
      W.shards.push({x1:N[b.a].x,y1:N[b.a].y,x2:N[b.b].x,y2:N[b.b].y,m:b.m,life:0.6});
      W.broke=true;
    }
  }

  /* 7) 끝났나 */
  for(const c of W.cars){
    if(c.dead) continue;
    const fx=Math.max(c.p[0].x, c.p[1].x);
    const fy=Math.max(c.p[0].y, c.p[1].y, c.p[2].y);
    if(fy > W.water+1.2){ c.dead=true; W.sank=true; continue; }
    if(fx > W.goal) c.done=true;
    /* 앞으로 0.4칸 나아갈 때마다 시계를 되돌린다 — 제자리면 쌓인다 */
    if(!c.done){ if(fx > c.lastX+0.4){ c.lastX=fx; c.stall=0; } else c.stall += dt; }
  }
  for(const s of W.shards) s.life-=dt;
  W.shards = W.shards.filter(s=>s.life>0);

  const live = W.cars.filter(c=>!c.dead);
  if(W.queue.length===0 && W.cars.length>0){
    if(live.length===0){ W.state='fail'; W.reason='차가 물에 빠졌다.'; return; }
    if(live.every(c=>c.done)){ W.state='win'; return; }
    if(live.some(c=>c.stall>4.5)){ W.state='fail'; W.reason='차가 멈춰 버렸다.'; return; }
  }
  if(W.t>SIM_LIMIT){ W.state='fail'; W.reason='시간 안에 건너지 못했다.'; }
}
/*==PHYSICS-END==*/

/* ======================= 판 준비 ======================= */
function prep(lv){
  if(lv._ok) return lv;
  const eq=(a,b)=>Math.abs(a-b)<1e-6;
  lv._anchor=(x,y)=>lv.ground.some(g=>eq(g[1],y)&&x>=g[0]-1e-6&&x<=g[0]+g[2]+1e-6);
  lv._inside=(x,y)=>lv.ground.some(g=>x>g[0]+1e-6&&x<g[0]+g[2]-1e-6&&y>g[1]+1e-6&&y<g[1]+g[3]-1e-6);
  const left =lv.ground.reduce((a,g)=>g[0]<a[0]?g:a);
  const right=lv.ground.reduce((a,g)=>(g[0]+g[2])>(a[0]+a[2])?g:a);
  lv._startX=left[0]+left[2]-3.4; lv._startY=left[1];
  lv._goal  =right[0]+2.5;
  lv._ok=true; return lv;
}

let VW={s:1,ox:0,oy:0}, DPR=1;

function key(x,y){ return x+'|'+y; }
function findNode(x,y){ return S.nodes.findIndex(n=>n.x===x&&n.y===y); }
function cost(){ let c=0; for(const b of S.beams) c+=b.c; return c; }

function snapshot(){ S.undo.push(JSON.stringify({n:S.nodes,b:S.beams})); if(S.undo.length>80) S.undo.shift(); }
function undo(){ if(!S.undo.length||S.run) return; const o=JSON.parse(S.undo.pop());
  S.nodes=o.n; S.beams=o.b; S.sel=null; SND.erase(); syncHUD(); }

/* ======================= 판 열기 ======================= */
function openLevel(i){
  S.li=i; S.lv=prep(LV[i]); S.nodes=[]; S.beams=[]; S.sel=null; S.undo=[];
  S.run=false; S.W=null; S.hintN=0; S.fast=false;
  S.mat=S.lv.mats[0];
  document.getElementById('lvName').textContent=(i+1)+'. '+S.lv.name;
  buildTools(); syncHUD(); show('game'); resize();
  const seen = SAVE['t'+S.lv.id];
  if(S.lv.teach && !seen){ SAVE['t'+S.lv.id]=1; putSave(); showTeach(); }
  else toast(S.lv.sub, 2200);
}
function quitLevel(){ S.run=false; show('pick'); renderPick(); }

/* ======================= 도구 막대 ======================= */
function buildTools(){
  const el=document.getElementById('tools'); el.innerHTML='';
  if(S.run){
    el.innerHTML =
      '<button class="btn warn" onclick="stopRun()">■ 멈추고 고치기</button>'+
      '<button class="btn ghost" onclick="toggleFast()" id="fastBtn">'+(S.fast?'▶▶ 2배':'▶ 1배')+'</button>';
    return;
  }
  S.lv.mats.forEach(m=>{
    const M=MAT[m];
    const b=document.createElement('button');
    b.className='mat'+(S.mat===m?' on':''); b.dataset.m=m;
    b.innerHTML='<span class="mn">'+M.name+'</span><span class="mc">'+M.cost+'원/칸</span>';
    b.onclick=()=>{ S.mat=m; S.sel=null; SND.click(); buildTools(); toast(M.tip,2400); };
    el.appendChild(b);
  });
  const e=document.createElement('button');
  e.className='mat'+(S.mat==='erase'?' on':''); e.dataset.m='erase';
  e.innerHTML='<span class="mn">지우개</span><span class="mc">눌러서 지움</span>';
  e.onclick=()=>{ S.mat='erase'; S.sel=null; SND.click(); buildTools(); };
  el.appendChild(e);
  const g=document.createElement('button');
  g.className='btn primary'; g.style.minHeight='52px'; g.textContent='▶ 출발';
  g.onclick=startRun; el.appendChild(g);
}
function toggleFast(){ S.fast=!S.fast; SND.click(); buildTools(); }

function syncHUD(){
  const c=cost(), b=S.lv.budget;
  const m=document.getElementById('money');
  m.textContent = c+' / '+b+'원';
  m.classList.toggle('over', c>b);
  document.getElementById('undoBtn').disabled = !S.undo.length || S.run;
}

let toastT=null;
function toast(msg,ms){
  const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'), ms||1800);
}

/* ======================= 놓기 / 지우기 ======================= */
function canPlaceNode(x,y){
  if(x<0||y<0||x>S.lv.w||y>S.lv.h) return false;
  if(S.lv._anchor(x,y)) return true;
  if(S.lv._inside(x,y)) return false;
  for(const g of S.lv.ground) if(x>g[0]&&x<g[0]+g[2]&&y>=g[1]&&y<g[1]+g[3]) return false;
  return true;
}
function beamBlocked(x1,y1,x2,y2){
  for(const g of S.lv.ground) if(segRect(x1,y1,x2,y2,g,0.06)) return '땅속으로는 놓을 수 없다.';
  for(const nb of (S.lv.noBuild||[])) if(segRect(x1,y1,x2,y2,nb,0)) return '여기는 비워 둬야 하는 곳이다.';
  return null;
}
function addBeam(ax,ay,bx,by){
  const M=MAT[S.mat];
  const L=Math.hypot(bx-ax,by-ay);
  if(L<0.5){ return; }
  if(L>M.maxLen+1e-6){ SND.nope(); toast(M.name+'은(는) <b>'+M.maxLen+'칸</b>까지만 뻗는다.',2200); return; }
  const blocked=beamBlocked(ax,ay,bx,by);
  if(blocked){ SND.nope(); toast(blocked,2000); return; }
  if(!canPlaceNode(ax,ay)||!canPlaceNode(bx,by)){ SND.nope(); toast('거기엔 점을 둘 수 없다.',1800); return; }
  const c=beamCost(S.mat,L);
  if(cost()+c > S.lv.budget){ SND.nope(); toast('예산이 모자란다. <b>'+(cost()+c-S.lv.budget)+'원</b> 넘는다.',2400); return; }
  if(S.beams.length>=240){ SND.nope(); toast('막대가 너무 많다.',1600); return; }
  snapshot();
  let ia=findNode(ax,ay); if(ia<0){ S.nodes.push({x:ax,y:ay,fix:S.lv._anchor(ax,ay)}); ia=S.nodes.length-1; }
  let ib=findNode(bx,by); if(ib<0){ S.nodes.push({x:bx,y:by,fix:S.lv._anchor(bx,by)}); ib=S.nodes.length-1; }
  /* 한 자리에 막대는 하나다. **다른 재료를 덧대는 것을 허용하지 말 것** —
     도로에 나무를 덧대기만 하면 평평한 12칸 다리가 트러스보다 싸게 통과해서
     이 게임의 전부인 「삼각형으로 엮기」가 통째로 필요 없어진다(20판 탐색에서 걸렸다). */
  if(S.beams.some(b=>(b.a===ia&&b.b===ib)||(b.a===ib&&b.b===ia))){ S.undo.pop(); SND.nope(); toast('그 자리엔 이미 놓여 있다.',1500); return; }
  S.beams.push({a:ia,b:ib,m:S.mat,c});
  SND.place(); syncHUD();
}
function eraseAt(wx,wy){
  let best=-1, bd=0.45;
  S.beams.forEach((b,i)=>{
    const A=S.nodes[b.a], B=S.nodes[b.b];
    const q=closestOnSeg(wx,wy,A.x,A.y,B.x,B.y);
    const d=Math.hypot(wx-q.x, wy-q.y);
    if(d<bd){ bd=d; best=i; }
  });
  if(best<0) return false;
  snapshot(); S.beams.splice(best,1); cleanNodes(); SND.erase(); syncHUD(); return true;
}
function cleanNodes(){
  const used=new Set(); S.beams.forEach(b=>{used.add(b.a);used.add(b.b);});
  const map={}, nn=[];
  S.nodes.forEach((n,i)=>{ if(used.has(i)){ map[i]=nn.length; nn.push(n); } });
  S.nodes=nn; S.beams.forEach(b=>{ b.a=map[b.a]; b.b=map[b.b]; });
}

/* ======================= 시험 주행 ======================= */
function startRun(){
  if(!S.beams.length){ SND.nope(); toast('아직 아무것도 놓지 않았다.',1800); return; }
  SND.init(); S.sel=null;
  S.W=makeWorld(S.lv, S.nodes, S.beams);
  S.run=true; document.getElementById('legend').classList.add('on');
  buildTools(); syncHUD(); SND.motor();
}
function stopRun(){
  S.run=false; S.W=null; document.getElementById('legend').classList.remove('on');
  buildTools(); syncHUD();
}

/* ======================= 결과 ======================= */
function finish(win){
  const lv=S.lv, c=cost(), ratio=c/lv.budget;
  if(win){
    let st=1; if(ratio<=lv.star[0]) st=2; if(ratio<=lv.star[1]) st=3;
    const prev=starsOf(lv.id);
    if(st>prev){ SAVE.stars[lv.id]=st; }
    if(!SAVE.best[lv.id]||c<SAVE.best[lv.id]) SAVE.best[lv.id]=c;
    putSave();
    SND.win(); if(st===3) setTimeout(()=>SND.star(),500);
    let extra='';
    if(st<3){
      const need=Math.floor(lv.budget*lv.star[st===1?0:1]);
      extra='<p class="mini">별을 하나 더 받으려면 <b>'+need+'원</b> 아래로 지어야 한다. 지금은 '+c+'원.</p>';
    } else extra='<p class="mini">이 판의 최고 기록은 '+SAVE.best[lv.id]+'원이다.</p>';
    modal('<h3>건넜다!</h3>'+
      '<div class="stars">'+[0,1,2].map(i=>i<st?'<b>★</b>':'☆').join('')+'</div>'+
      '<p>쓴 돈 <b>'+c+'원</b> / 예산 '+lv.budget+'원 · 막대 '+S.beams.length+'개</p>'+extra+
      '<div class="rowb">'+
        '<button class="btn ghost" onclick="closeModal();stopRun()">더 줄여 보기</button>'+
        (S.li+1<LV.length?'<button class="btn primary" onclick="closeModal();openLevel('+(S.li+1)+')">다음 판 →</button>'
                         :'<button class="btn primary" onclick="closeModal();quitLevel()">판 고르기</button>')+
      '</div>');
  } else {
    SND.fail();
    const broke=S.W?S.W.beams.filter(b=>b.dead).length:0;
    let why=S.W?S.W.reason:'';
    if(broke) why='막대 <b>'+broke+'개</b>가 부러졌다.';
    else if(S.W&&S.W.sank) why='차가 물에 빠졌다.';
    modal('<h3>다시 해 보자</h3>'+
      '<p>'+why+'</p>'+
      '<div class="note">부러진 자리를 기억해 둬. <b>출발</b> 을 누르면 막대에 색이 들어온다 — '+
      '<b style="color:#ff8b8b">빨강은 당기는 힘</b>, <b style="color:#89b0ff">파랑은 누르는 힘</b>이고 '+
      '색이 진한 곳이 가장 위험한 곳이다.</div>'+
      '<div class="rowb">'+
        '<button class="btn ghost" onclick="closeModal();openHint()">힌트 보기</button>'+
        '<button class="btn primary" onclick="closeModal();stopRun()">고치러 가기</button>'+
      '</div>');
  }
}

function modal(html){ document.getElementById('modalCard').innerHTML=html;
  document.getElementById('modal').classList.add('on'); }

function openHint(){
  const hs=S.lv.hints||[];
  if(!hs.length){ toast('이 판은 힌트가 없다.',1500); return; }
  S.hintN=Math.min(S.hintN+1, hs.length);
  let body='';
  for(let i=0;i<S.hintN;i++) body+='<p><b>힌트 '+(i+1)+'.</b> '+hs[i]+'</p>';
  const more = S.hintN<hs.length
    ? '<button class="btn ghost" onclick="closeModal();openHint()">다음 힌트</button>' : '';
  const teach = S.lv.teach ? '<button class="btn ghost" onclick="closeModal();showTeach()">설명 다시 보기</button>' : '';

    '<p class="mini">힌트는 마지막 것까지 봐도 답을 그려 주지는 않는다. 직접 놓아야 한다.</p>'+
    '<div class="rowb">'+teach+more+'<button class="btn primary" onclick="closeModal()">닫기</button></div>');
}

/* ======================= 화면 맞추기 ======================= */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1, 2);
  cv.width=Math.floor(cv.clientWidth*DPR); cv.height=Math.floor(cv.clientHeight*DPR);
  if(!S.lv) return;
  const padT=54*DPR, padB=78*DPR, padS=8*DPR;
  const s=Math.min((cv.width-padS*2)/S.lv.w, (cv.height-padT-padB)/S.lv.h);
  VW.s=s;
  VW.ox=(cv.width-S.lv.w*s)/2;
  VW.oy=padT+((cv.height-padT-padB)-S.lv.h*s)/2;
}
window.addEventListener('resize',resize);
const X=x=>VW.ox+x*VW.s, Y=y=>VW.oy+y*VW.s;
const wX=p=>(p-VW.ox)/VW.s, wY=p=>(p-VW.oy)/VW.s;

/* ======================= 그리기 ======================= */
function stressCol(b){
  const r=Math.max(-1,Math.min(1, b.s/b.brk)), a=Math.abs(r);
  const base=[150,165,190];
  const t = r>0 ? [255,64,64] : [72,132,255];
  const k=Math.pow(a,0.65);
  return 'rgb('+base.map((v,i)=>Math.round(v+(t[i]-v)*k)).join(',')+')';
}

function draw(){
  const lv=S.lv; if(!lv) return;
  const w=cv.width, h=cv.height, s=VW.s;
  /* 하늘 */
  const sky=ctx.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#1b3050'); sky.addColorStop(0.55,'#2a4a72'); sky.addColorStop(1,'#37628f');
  ctx.fillStyle=sky; ctx.fillRect(0,0,w,h);

  ctx.save(); ctx.beginPath();
  ctx.rect(VW.ox-6*DPR, VW.oy-6*DPR, lv.w*s+12*DPR, lv.h*s+12*DPR); ctx.clip();

  /* 물 */
  ctx.fillStyle='#1d4d63';
  ctx.fillRect(X(0),Y(lv.water),lv.w*s,(lv.h-lv.water)*s+8*DPR);
  ctx.fillStyle='rgba(255,255,255,.07)';
  for(let i=0;i<4;i++) ctx.fillRect(X(0),Y(lv.water)+i*7*DPR,lv.w*s,1.5*DPR);

  /* 못 놓는 칸 */
  (lv.noBuild||[]).forEach(r=>{
    ctx.save();
    ctx.beginPath(); ctx.rect(X(r[0]),Y(r[1]),r[2]*s,r[3]*s); ctx.clip();
    ctx.fillStyle='rgba(255,90,90,.10)'; ctx.fill();
    ctx.strokeStyle='rgba(255,120,120,.28)'; ctx.lineWidth=2*DPR;
    for(let i=-r[3];i<r[2]+r[3];i+=0.8){
      ctx.beginPath(); ctx.moveTo(X(r[0]+i),Y(r[1])); ctx.lineTo(X(r[0]+i+r[3]),Y(r[1]+r[3])); ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle='rgba(255,120,120,.55)'; ctx.lineWidth=2.5*DPR;
    ctx.strokeRect(X(r[0]),Y(r[1]),r[2]*s,r[3]*s);
    ctx.fillStyle='rgba(255,170,170,.9)'; ctx.font=(11*DPR)+'px "Noto Sans KR",sans-serif';
    ctx.textAlign='center'; ctx.fillText('배가 지나가는 길', X(r[0]+r[2]/2), Y(r[1]+r[3]/2));
  });

  /* 땅 */
  lv.ground.forEach(g=>{
    ctx.fillStyle='#4a3a2a'; ctx.fillRect(X(g[0]),Y(g[1]),g[2]*s,g[3]*s);
    ctx.fillStyle='#3e6b42'; ctx.fillRect(X(g[0]),Y(g[1]),g[2]*s,0.38*s);
    ctx.fillStyle='rgba(0,0,0,.18)';
    for(let i=0;i<g[2]*2;i++){
      const x=g[0]+i*0.5+((i*37)%7)*0.03, y=g[1]+0.7+((i*53)%11)*0.35;
      if(y<g[1]+g[3]) ctx.fillRect(X(x),Y(y),2.5*DPR,2.5*DPR);
    }
  });

  /* 격자 · 고정점 */
  if(!S.run){
    for(let gx=0; gx<=lv.w; gx++) for(let gy=0; gy<=lv.h; gy++){
      if(!canPlaceNode(gx,gy)) continue;
      const an=lv._anchor(gx,gy);
      ctx.beginPath(); ctx.arc(X(gx),Y(gy), an?4.6*DPR:1.6*DPR, 0, 6.2832);
      if(an){ ctx.fillStyle='#fff'; ctx.fill();
        ctx.beginPath(); ctx.arc(X(gx),Y(gy),7.5*DPR,0,6.2832);
        ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2*DPR; ctx.stroke(); }
      else { ctx.fillStyle='rgba(255,255,255,.22)'; ctx.fill(); }
    }
  }

  /* 도착 깃발 */
  const gx=lv._goal;
  ctx.strokeStyle='#eee'; ctx.lineWidth=2.5*DPR;
  ctx.beginPath(); ctx.moveTo(X(gx),Y(lv._gy||groundTopAt(gx))); ctx.lineTo(X(gx),Y((lv._gy||groundTopAt(gx))-2.2)); ctx.stroke();
  ctx.fillStyle='#5ad18a'; ctx.beginPath();
  const fy=(lv._gy||groundTopAt(gx))-2.2;
  ctx.moveTo(X(gx),Y(fy)); ctx.lineTo(X(gx+1.5),Y(fy+0.45)); ctx.lineTo(X(gx),Y(fy+0.9)); ctx.fill();

  /* 막대 */
  const BB = S.run ? S.W.beams : S.beams;
  const NN = S.run ? S.W.nodes : S.nodes;
  BB.forEach(b=>{
    if(b.dead) return;
    const A=NN[b.a], C=NN[b.b], M=MAT[b.m];
    ctx.lineCap='round';
    ctx.lineWidth=M.wv*s;
    ctx.strokeStyle = S.run ? stressCol(b) : M.col;
    ctx.beginPath(); ctx.moveTo(X(A.x),Y(A.y)); ctx.lineTo(X(C.x),Y(C.y)); ctx.stroke();
    if(M.key==='road'){
      ctx.lineWidth=Math.max(1.2*DPR, M.wv*0.14*s); ctx.strokeStyle='rgba(0,0,0,.30)';
      ctx.setLineDash([5*DPR,6*DPR]);
      ctx.beginPath(); ctx.moveTo(X(A.x),Y(A.y)); ctx.lineTo(X(C.x),Y(C.y)); ctx.stroke();
      ctx.setLineDash([]);
    }
  });
  /* 부러진 조각 */
  if(S.run) S.W.shards.forEach(sh=>{
    ctx.globalAlpha=Math.max(0,sh.life/0.6); ctx.lineCap='round';
    ctx.lineWidth=MAT[sh.m].wv*s; ctx.strokeStyle='#ff7b7b';
    ctx.beginPath(); ctx.moveTo(X(sh.x1),Y(sh.y1)); ctx.lineTo(X(sh.x2),Y(sh.y2)); ctx.stroke();
    ctx.globalAlpha=1;
  });
  /* 절점 */
  NN.forEach(n=>{
    ctx.beginPath(); ctx.arc(X(n.x),Y(n.y), (n.fix?4.2:3.0)*DPR, 0, 6.2832);
    ctx.fillStyle=n.fix?'#fff':'#c9d6e8'; ctx.fill();
  });

  /* 고르는 중 · 끄는 중 */
  if(!S.run){
    if(S.sel){ ctx.beginPath(); ctx.arc(X(S.sel.x),Y(S.sel.y),9*DPR,0,6.2832);
      ctx.strokeStyle=MAT[S.mat]?MAT[S.mat].col:'#fff'; ctx.lineWidth=3*DPR; ctx.stroke(); }
    if(S.drag&&S.drag.to){
      const M=MAT[S.mat]||MAT.road;
      const L=Math.hypot(S.drag.to.x-S.drag.x, S.drag.to.y-S.drag.y);
      const okL = L<=M.maxLen+1e-6 && L>0.4 && !beamBlocked(S.drag.x,S.drag.y,S.drag.to.x,S.drag.to.y);
      ctx.globalAlpha=.62; ctx.lineCap="round"; ctx.lineWidth=M.wv*s;
      ctx.strokeStyle= okL ? M.col : '#ff5c5c';
      ctx.beginPath(); ctx.moveTo(X(S.drag.x),Y(S.drag.y)); ctx.lineTo(X(S.drag.to.x),Y(S.drag.to.y)); ctx.stroke();
      ctx.globalAlpha=1;
      if(L>0.4){
        ctx.fillStyle='#fff'; ctx.font='900 '+(12*DPR)+'px "Noto Sans KR",sans-serif'; ctx.textAlign='center';
        ctx.fillText(Math.round(L*M.cost)+'원', X((S.drag.x+S.drag.to.x)/2), Y((S.drag.y+S.drag.to.y)/2)-10*DPR);
      }
    }
    /* 출발 자리 표시 */
    drawCarShape(lv._startX+VEH[(lv.veh[0].t)].wb/2, lv._startY-VEH[lv.veh[0].t].r,
                 VEH[lv.veh[0].t], 0, 0.35);
  }

  /* 차 */
  if(S.run) S.W.cars.forEach(c=>{
    if(c.dead) return;
    const w0=c.p[0], w1=c.p[1], bd=c.p[2];
    let dx=w1.x-w0.x, dy=w1.y-w0.y, L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
    let nx=-dy, ny=dx;
    if((bd.x-w0.x)*nx+(bd.y-w0.y)*ny > 0){} else { nx=-nx; ny=-ny; }
    const r=c.r, bh=c.V.bh, col=c.V.col;
    const p1=[w0.x+nx*r*0.5, w0.y+ny*r*0.5], p2=[w1.x+nx*r*0.5, w1.y+ny*r*0.5];
    const p3=[w1.x+nx*(r*0.5+bh), w1.y+ny*(r*0.5+bh)], p4=[w0.x+nx*(r*0.5+bh), w0.y+ny*(r*0.5+bh)];
    ctx.fillStyle=col; ctx.beginPath();
    ctx.moveTo(X(p1[0]),Y(p1[1])); ctx.lineTo(X(p2[0]),Y(p2[1]));
    ctx.lineTo(X(p3[0]),Y(p3[1])); ctx.lineTo(X(p4[0]),Y(p4[1])); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.moveTo(X(p4[0]+dx*0.25),Y(p4[1]+dy*0.25));
    ctx.lineTo(X(p3[0]-dx*0.25),Y(p3[1]-dy*0.25));
    ctx.lineTo(X(p3[0]-dx*0.25-nx*bh*0.45),Y(p3[1]-dy*0.25-ny*bh*0.45));
    ctx.lineTo(X(p4[0]+dx*0.25-nx*bh*0.45),Y(p4[1]+dy*0.25-ny*bh*0.45));
    ctx.closePath(); ctx.fill();
    [w0,w1].forEach(p=>{
      ctx.beginPath(); ctx.arc(X(p.x),Y(p.y),r*s,0,6.2832); ctx.fillStyle='#22282f'; ctx.fill();
      ctx.beginPath(); ctx.arc(X(p.x),Y(p.y),r*s*0.42,0,6.2832); ctx.fillStyle='#96a4b4'; ctx.fill();
    });
  });

  ctx.restore();

  /* 시험 중 시계 */
  if(S.run){
    ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='900 '+(13*DPR)+'px "Noto Sans KR",sans-serif';
    ctx.textAlign='left'; ctx.fillText(S.W.t.toFixed(1)+'초', 14*DPR, cv.height-90*DPR);
  }
}
function groundTopAt(x){
  let best=S.lv.h;
  S.lv.ground.forEach(g=>{ if(x>=g[0]&&x<=g[0]+g[2]) best=Math.min(best,g[1]); });
  return best;
}
function drawCarShape(cx,cy,V,ang,alpha){
  ctx.globalAlpha=alpha; const s=VW.s, r=V.r;
  ctx.fillStyle=V.col;
  ctx.fillRect(X(cx-V.wb/2-r*0.3), Y(cy-r*0.5-V.bh), (V.wb+r*0.6)*s, V.bh*s);
  ctx.fillStyle='#22282f';
  [-V.wb/2, V.wb/2].forEach(o=>{ ctx.beginPath(); ctx.arc(X(cx+o),Y(cy),r*s,0,6.2832); ctx.fill(); });
  ctx.globalAlpha=1;
}

/* ======================= 손가락 ======================= */
function evPt(e){
  const r=cv.getBoundingClientRect();
  return { x:wX((e.clientX-r.left)*DPR), y:wY((e.clientY-r.top)*DPR) };
}
function snap(p){
  const gx=Math.round(p.x), gy=Math.round(p.y);
  if(Math.hypot(p.x-gx,p.y-gy)>0.62) return null;
  if(!canPlaceNode(gx,gy)) return null;
  return {x:gx,y:gy};
}
cv.addEventListener('pointerdown',e=>{
  if(S.run) return; SND.init();
  cv.setPointerCapture(e.pointerId);
  const p=evPt(e);
  if(S.mat==='erase'){ eraseAt(p.x,p.y); S.drag=null; return; }
  const g=snap(p);
  if(!g){ S.sel=null; S.drag=null; return; }
  S.drag={x:g.x,y:g.y,to:null,moved:false};
});
cv.addEventListener('pointermove',e=>{
  if(S.run||!S.drag) return;
  const p=evPt(e), g=snap(p);
  if(g&&(g.x!==S.drag.x||g.y!==S.drag.y)){ S.drag.to=g; S.drag.moved=true; }
  else S.drag.to=null;
});
cv.addEventListener('pointerup',e=>{
  if(S.run||!S.drag) return;
  const d=S.drag; S.drag=null;
  if(d.to){ addBeam(d.x,d.y,d.to.x,d.to.y); S.sel=null; return; }
  /* 제자리에서 뗐다 = 톡 누르기 */
  if(S.sel && (S.sel.x!==d.x||S.sel.y!==d.y)){ addBeam(S.sel.x,S.sel.y,d.x,d.y); S.sel=null; }
  else { S.sel = (S.sel&&S.sel.x===d.x&&S.sel.y===d.y) ? null : {x:d.x,y:d.y}; SND.click(); }
});
cv.addEventListener('pointercancel',()=>{ S.drag=null; });

/* ======================= 돌림판 ======================= */
let lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!S.lv){ return; }
  const dt=Math.min((now-lastT)/1000||0, 0.05); lastT=now;
  if(S.run&&S.W){
    const n = S.fast?8:4;
    for(let i=0;i<n && S.W.state==='run';i++) step(S.W, 1/240);
    if(S.W.broke){ S.W.broke=false; SND.snap(); }
    if(S.W.sank){ S.W.sank=false; SND.splash(); }
    /* 끝나도 S.run 은 그대로 둔다 — 화면이 멈춘 채 남아야 부러진 자리가 보인다.
       stopRun() 이 불릴 때까지 얼려 둔다. 이 순서를 뒤집지 말 것. */
    if(S.W.state!=='run' && !S.W.shown){
      S.W.shown=true; const win=S.W.state==='win';
      setTimeout(()=>finish(win), win?300:600);
    }
  }
  draw();
}

/* ======================= 시작 ======================= */
loadSave(); renderPick(); resize(); requestAnimationFrame(loop);
document.getElementById('modal').addEventListener('click',e=>{
  if(e.target.id==='modal') closeModal();
});
window.__bb=()=>S;   /* 콘솔에서 상태 보기 */
</script>
