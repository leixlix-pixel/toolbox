<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>대분수 × 대분수 — 그림으로 보면 조각이 넷</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f172a; --navy:#1e3a8a; --navy2:#3b82f6; --red:#dc2626;
  --gold:#f59e0b; --green:#10b981; --purple:#a855f7;
  --paper:#fdfcf8; --line:#d8d3c4; --muted:#6b7280;
  --acc:var(--navy2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#111827}
body{
  font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  user-select:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
}

/* ── 고정 무대 ───────────────────────────── */
#wrap{position:relative;width:100%;height:calc(100% - 46px);display:flex;align-items:center;justify-content:center}
#stage{flex:0 0 auto;width:1280px;height:720px;position:relative;transform-origin:center center;background:var(--paper);
  border-radius:6px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.5)}
.slide{position:absolute;inset:0;padding:42px 56px 54px;display:none;flex-direction:column;color:var(--ink)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;left:0;bottom:0;height:7px;width:100%;background:var(--acc)}

/* ── 공통 부품 ───────────────────────────── */
.eyebrow{font-size:19px;font-weight:700;color:var(--acc);letter-spacing:.06em;margin-bottom:7px}
h1{font-size:40px;font-weight:900;line-height:1.25;letter-spacing:-.02em}
h2{font-size:26px;font-weight:700;line-height:1.4}
.lead{font-size:22px;line-height:1.6;color:#334155}
b.hl{background:linear-gradient(transparent 58%, #fecaca 58%);font-weight:900;color:var(--red);padding:0 2px}
b.hn{background:linear-gradient(transparent 58%, #bfdbfe 58%);font-weight:900;color:var(--navy);padding:0 2px}
b.hg{background:linear-gradient(transparent 58%, #a7f3d0 58%);font-weight:900;color:#047857;padding:0 2px}
b.hp{background:linear-gradient(transparent 58%, #e9d5ff 58%);font-weight:900;color:#7e22ce;padding:0 2px}
.term{background:#fff;border:2px solid var(--line);border-left:7px solid var(--acc);
  border-radius:8px;padding:13px 18px;font-size:20px;line-height:1.5}
.act{background:#fff8e6;border:2px dashed var(--gold);border-radius:12px;padding:14px 20px;font-size:21px;line-height:1.5}
.hand{font-family:'Gaegu',sans-serif;font-size:26px;color:var(--red);line-height:1.35}
.row{display:flex;gap:30px;align-items:center}
.grow{flex:1}
.center{align-items:center;justify-content:center;text-align:center}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:19px;font-weight:700;
  border-radius:999px;padding:4px 13px;border:2px solid}
.sw{width:15px;height:15px;border-radius:4px;display:inline-block}

/* 분수 표기 */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  margin:0 4px;line-height:1.05;font-weight:900}
.fr .n{padding:0 5px}
.fr .d{padding:0 5px;border-top:3px solid currentColor}
.mixed{display:inline-flex;align-items:center;vertical-align:middle;font-weight:900}
.eq{font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.eq.sm{font-size:29px}
.eq.xs{font-size:24px}
.op{font-weight:900;color:var(--muted)}

/* 단계 노출 */
[data-step]{opacity:0;transition:opacity .4s ease}
[data-step].vis{opacity:1}

/* SVG — 선 색은 전부 요소에 직접 준다(CSS 로 덮어쓰지 않는다) */
svg.gv{display:block;width:100%;height:auto}

/* 하단 바 */
.bar{height:46px;width:100%;display:flex;align-items:center;justify-content:center;gap:14px;
  background:#111827;color:#e5e7eb;font-size:15px;flex:0 0 46px}
.bar button{font-family:inherit;font-size:15px;font-weight:700;min-height:32px;padding:6px 16px;
  border:0;border-radius:7px;background:#374151;color:#f9fafb;cursor:pointer}
.bar button:active{background:#4b5563}
#cnt{min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
#zl,#zr{position:absolute;top:0;bottom:46px;width:13%;z-index:5;background:transparent}
#zl{left:0} #zr{right:0}
</style>
</head>
<body>

<div id="wrap">
  <div id="stage"></div>
</div>
<div id="zl" onclick="go(-1)"></div>
<div id="zr" onclick="go(1)"></div>

<div class="bar no-print">
  <button onclick="go(-1)">◀ 이전</button>
  <span id="cnt">1 / 12</span>
  <button onclick="go(1)">다음 ▶</button>
  <button onclick="fs()">전체화면</button>
</div>

<script>
/* ══════════════════════════════════════════════
   그리기 도구 — 넓이 모델
   대분수 × 대분수를 「가로 × 세로 직사각형」 하나로 본다.
   조각이 넷이라는 것, 잘게 자르면 칸이 된다는 것 두 가지를
   같은 그림 위에서 보여 주는 것이 이 자료의 전부다.
   ══════════════════════════════════════════════ */

const G=(a,b)=>b?G(b,a%b):a;

/* SVG 분수 — (x,y)가 가운데 */
function sfrac(x,y,n,d,sz,col){
  return `<text x="${x}" y="${y-sz*0.30}" text-anchor="middle" font-size="${sz}" font-weight="900" fill="${col}">${n}</text>`
       + `<line x1="${x-sz*0.50}" y1="${y}" x2="${x+sz*0.50}" y2="${y}" stroke="${col}" stroke-width="${Math.max(2,sz*0.10)}" stroke-linecap="round"/>`
       + `<text x="${x}" y="${y+sz*1.02}" text-anchor="middle" font-size="${sz}" font-weight="900" fill="${col}">${d}</text>`;
}
/* SVG 대분수 */
function smixed(x,y,w,n,d,sz,col){
  const iw=sz*0.78*String(w).length, fw=sz*1.05, tw=iw+fw;
  const x0=x-tw/2;
  return `<text x="${x0+iw/2}" y="${y+sz*0.36}" text-anchor="middle" font-size="${sz*1.2}" font-weight="900" fill="${col}">${w}</text>`
       + sfrac(x0+iw+fw/2, y, n, d, sz*0.86, col);
}
/* n/d 값을 약분해서 정수·진분수·대분수 중 알맞게 */
function sval(x,y,n,d,sz,col){
  const g=G(n,d); n/=g; d/=g;
  if(d===1) return `<text x="${x}" y="${y+sz*0.36}" text-anchor="middle" font-size="${sz*1.2}" font-weight="900" fill="${col}">${n}</text>`;
  if(n>d) return smixed(x,y,Math.floor(n/d),n%d,d,sz,col);
  return sfrac(x,y,n,d,sz,col);
}

/* ── 넓이 그림 ───────────────────────────────
   A = 가로 대분수 {w,n,d}, B = 세로 대분수, U = 1 의 길이(px)
   o = {
     p:[s,s,s,s]   조각 넷이 나타날 step (없으면 안 그림 · 9 는 영영 안 보임)
     lab:[s,s,s,s] 조각 안 넓이 값
     mul:[s,s,s,s] 조각 안 「가로×세로」 식
     hatch:[…]     빨간 빗금(빠뜨린 조각)
     split:s       조각 경계선  fine:s 잘게 자른 선  cells:s 잔칸 번호
     dim:s         가로·세로 치수   ruler:s 1 눈금
   } ────────────────────────────────────────── */
let UID=0;
function areaFig(A,B,U,o){
  o=o||{};
  const id='hx'+(++UID);
  const aw=A.w+A.n/A.d, bh=B.w+B.n/B.d;
  const W=aw*U, H=bh*U, ax=A.w*U, ay=B.w*U, fw=W-ax, fh=H-ay;
  const L=(o.dim!==undefined)?60:12, T=(o.dim!==undefined)?52:12, R=12, BM=12;
  const VW=W+L+R, VH=H+T+BM;
  const col=['#10b981','#3b82f6','#f59e0b','#a855f7'];
  const box=[[0,0,ax,ay],[ax,0,fw,ay],[0,ay,ax,fh],[ax,ay,fw,fh]];
  const val=[[A.w*B.w,1],[A.n*B.w,A.d],[A.w*B.n,B.d],[A.n*B.n,A.d*B.d]];
  const mul=[[A.w,B.w],[[A.n,A.d],B.w],[A.w,[B.n,B.d]],[[A.n,A.d],[B.n,B.d]]];
  const S=v=>`data-step="${v}"`;

  let s=`<svg class="gv" viewBox="0 0 ${VW} ${VH}">`;
  s+=`<defs><pattern id="${id}" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">`
   + `<line x1="0" y1="0" x2="0" y2="14" stroke="#dc2626" stroke-width="5"/></pattern></defs>`;
  s+=`<g transform="translate(${L},${T})">`;
  s+=`<rect width="${W}" height="${H}" fill="#ffffff"/>`;

  /* 조각 색칠 */
  box.forEach((b,i)=>{
    if(o.p&&o.p[i]!==undefined)
      s+=`<rect ${S(o.p[i])} x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" fill="${col[i]}" opacity=".45"/>`;
  });

  /* 잘게 자른 선 — 세로(가로 등분) · 가로(세로 등분) */
  if(o.fine!==undefined){
    const fs=Array.isArray(o.fine)?o.fine:[o.fine,o.fine];
    const nv=Math.round(aw*A.d), nh=Math.round(bh*B.d);
    s+=`<g ${S(fs[0])}>`;
    for(let i=1;i<nv;i++) s+=`<line x1="${i*U/A.d}" y1="0" x2="${i*U/A.d}" y2="${H}" stroke="#64748b" stroke-width="2"/>`;
    s+=`</g><g ${S(fs[1])}>`;
    for(let j=1;j<nh;j++) s+=`<line x1="0" y1="${j*U/B.d}" x2="${W}" y2="${j*U/B.d}" stroke="#64748b" stroke-width="2"/>`;
    s+=`</g>`;
  }

  /* 잔칸 번호 */
  if(o.cells!==undefined){
    const nv=Math.round(aw*A.d), nh=Math.round(bh*B.d);
    const cw=U/A.d, ch=U/B.d, fsz=Math.min(cw,ch)*0.44;
    s+=`<g ${S(o.cells)}>`;
    let k=0;
    for(let j=0;j<nh;j++) for(let i=0;i<nv;i++){
      k++;
      s+=`<rect x="${i*cw}" y="${j*ch}" width="${cw}" height="${ch}" fill="#10b981" opacity=".22"/>`;
      s+=`<text x="${i*cw+cw/2}" y="${j*ch+ch/2+fsz*0.36}" text-anchor="middle" font-size="${fsz}" font-weight="900" fill="#047857">${k}</text>`;
    }
    s+=`</g>`;
  }

  /* 빗금 — 빠뜨린 조각 */
  box.forEach((b,i)=>{
    if(o.hatch&&o.hatch[i]!==undefined)
      s+=`<rect ${S(o.hatch[i])} x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" fill="url(#${id})" opacity=".9"/>`;
  });

  /* 조각 안 라벨 */
  box.forEach((b,i)=>{
    const cx=b[0]+b[2]/2, cy=b[1]+b[3]/2;
    const sz=Math.min(b[2],b[3])*0.30, cap=Math.min(34,Math.max(15,sz));
    if(o.mul&&o.mul[i]!==undefined){
      const m=mul[i], mz=cap*0.82, gap=mz*1.15;
      const lx=cx-gap, rx=cx+gap;
      s+=`<g ${S(o.mul[i])}>`;
      s+=Array.isArray(m[0])?sfrac(lx,cy,m[0][0],m[0][1],mz,'#0f172a')
        :`<text x="${lx}" y="${cy+mz*0.36}" text-anchor="middle" font-size="${mz*1.2}" font-weight="900" fill="#0f172a">${m[0]}</text>`;
      s+=`<text x="${cx}" y="${cy+mz*0.34}" text-anchor="middle" font-size="${mz}" font-weight="900" fill="#6b7280">×</text>`;
      s+=Array.isArray(m[1])?sfrac(rx,cy,m[1][0],m[1][1],mz,'#0f172a')
        :`<text x="${rx}" y="${cy+mz*0.36}" text-anchor="middle" font-size="${mz*1.2}" font-weight="900" fill="#0f172a">${m[1]}</text>`;
      s+=`</g>`;
    }
    if(o.lab&&o.lab[i]!==undefined){
      const dy=(o.mul&&o.mul[i]!==undefined)?cap*1.5:0;
      s+=`<g ${S(o.lab[i])}>`+sval(cx,cy+dy,val[i][0],val[i][1],cap,'#0f172a')+`</g>`;
    }
  });

  /* 조각 경계 */
  if(o.split!==undefined){
    s+=`<g ${S(o.split)}>`;
    s+=`<line x1="${ax}" y1="0" x2="${ax}" y2="${H}" stroke="#0f172a" stroke-width="4"/>`;
    s+=`<line x1="0" y1="${ay}" x2="${W}" y2="${ay}" stroke="#0f172a" stroke-width="4"/>`;
    s+=`</g>`;
  }
  /* 1 눈금 */
  if(o.ruler!==undefined){
    s+=`<g ${S(o.ruler)}>`;
    for(let i=1;i<=Math.floor(aw);i++) s+=`<line x1="${i*U}" y1="0" x2="${i*U}" y2="${H}" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 6"/>`;
    for(let j=1;j<=Math.floor(bh);j++) s+=`<line x1="0" y1="${j*U}" x2="${W}" y2="${j*U}" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 6"/>`;
    s+=`</g>`;
  }
  s+=`<rect width="${W}" height="${H}" fill="none" stroke="#0f172a" stroke-width="4"/>`;

  /* 치수 */
  if(o.dim!==undefined){
    const tk='#334155';
    s+=`<g ${S(o.dim)}>`;
    s+=`<line x1="0" y1="-24" x2="${W}" y2="-24" stroke="${tk}" stroke-width="2.5"/>`;
    s+=`<line x1="0" y1="-31" x2="0" y2="-17" stroke="${tk}" stroke-width="2.5"/>`;
    s+=`<line x1="${W}" y1="-31" x2="${W}" y2="-17" stroke="${tk}" stroke-width="2.5"/>`;
    s+=smixed(W/2,-42,A.w,A.n,A.d,20,tk);
    s+=`<line x1="-28" y1="0" x2="-28" y2="${H}" stroke="${tk}" stroke-width="2.5"/>`;
    s+=`<line x1="-35" y1="0" x2="-21" y2="0" stroke="${tk}" stroke-width="2.5"/>`;
    s+=`<line x1="-35" y1="${H}" x2="-21" y2="${H}" stroke="${tk}" stroke-width="2.5"/>`;
    s+=smixed(-46,H/2,B.w,B.n,B.d,20,tk);
    s+=`</g>`;
  }
  s+=`</g></svg>`;
  return {svg:s, w:VW, h:VH};
}
/* 폭 px 를 정해 주면 그 폭짜리 상자에 담아 준다 */
function fig(width,r,extra){
  return `<div style="width:${width}px;${extra||''}">${r.svg}</div>`;
}

/* 자연수 격자 — 곱셈이 넓이라는 것을 되짚는 데만 쓴다 */
function natRect(c,r,U,numbered){
  const W=c*U,H=r*U,P=10;
  let s=`<svg class="gv" viewBox="0 0 ${W+P*2} ${H+P*2}"><g transform="translate(${P},${P})">`;
  s+=`<rect width="${W}" height="${H}" fill="#dbeafe"/>`;
  let k=0;
  if(numbered) for(let j=0;j<r;j++) for(let i=0;i<c;i++){
    k++;
    s+=`<text x="${i*U+U/2}" y="${j*U+U/2+U*0.16}" text-anchor="middle" font-size="${U*0.42}" font-weight="900" fill="#1d4ed8">${k}</text>`;
  }
  for(let i=1;i<c;i++) s+=`<line x1="${i*U}" y1="0" x2="${i*U}" y2="${H}" stroke="#60a5fa" stroke-width="2.5"/>`;
  for(let j=1;j<r;j++) s+=`<line x1="0" y1="${j*U}" x2="${W}" y2="${j*U}" stroke="#60a5fa" stroke-width="2.5"/>`;
  s+=`<rect width="${W}" height="${H}" fill="none" stroke="#1e3a8a" stroke-width="4"/></g></svg>`;
  return {svg:s,w:W+P*2,h:H+P*2};
}

/* 띠 — 대분수를 가분수로 펴는 그림 */
function strip(w,n,d,W,H,color,step){
  const total=w*d+n, unit=W/(w+n/d)/d, P=4;
  let s=`<svg class="gv" viewBox="0 0 ${W+P*2} ${H+P*2}" ${step!==undefined?`data-step="${step}"`:''}><g transform="translate(${P},${P})">`;
  s+=`<rect width="${W}" height="${H}" fill="#fff"/>`;
  for(let i=0;i<total;i++) s+=`<rect x="${i*unit}" y="0" width="${unit}" height="${H}" fill="${color}" opacity=".42"/>`;
  for(let i=1;i<total;i++) s+=`<line x1="${i*unit}" y1="0" x2="${i*unit}" y2="${H}" stroke="#64748b" stroke-width="2"/>`;
  for(let i=1;i<=w;i++) s+=`<line x1="${i*d*unit}" y1="0" x2="${i*d*unit}" y2="${H}" stroke="#0f172a" stroke-width="4"/>`;
  s+=`<rect width="${W}" height="${H}" fill="none" stroke="#0f172a" stroke-width="3.5"/></g></svg>`;
  return {svg:s,w:W+P*2,h:H+P*2};
}

/* HTML 분수 표기 */
const F=(n,d,sz)=>`<span class="fr" style="font-size:${sz||1}em"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const M=(w,n,d,sz)=>`<span class="mixed" style="${sz?`font-size:${sz}em`:''}">${w}${F(n,d,.72)}</span>`;

/* 오늘의 두 수 */
const A={w:1,n:1,d:2};   /* 가로 1½ */
const B={w:2,n:1,d:3};   /* 세로 2⅓ */

/* ══════════════════════════════════════════════
   슬라이드
   ══════════════════════════════════════════════ */
const SLIDES=[

/* 1 ── 표지 ─────────────────────────────── */
`<section class="slide" style="--acc:#7e22ce;justify-content:center;background:
  radial-gradient(circle at 80% 20%, #f3e8ff 0%, transparent 46%),
  radial-gradient(circle at 16% 84%, #dcfce7 0%, transparent 44%), var(--paper)">
  <div class="row" style="gap:56px">
    <div style="flex:1">
      <div class="eyebrow">5학년 2학기 · 2단원 분수의 곱셈</div>
      <h1 style="font-size:56px;margin:8px 0 14px">대분수 × 대분수</h1>
      <div class="lead" style="font-size:25px">
        ${M(1,1,2)} × ${M(2,1,3)} 을 계산하는 법은<br>이미 배웠지. 그런데 <b class="hp">왜</b> 그렇게 할까?
      </div>
      <div class="term" style="margin-top:22px;border-left-color:#7e22ce;font-size:21px">
        그림 하나면 다 보인다.<br>
        <b class="hp">대분수끼리 곱하면 조각이 넷</b>이 생긴다는 것.
      </div>
      <div class="hand" style="margin-top:18px">자연수는 자연수끼리, 분수는 분수끼리<br>곱하면 왜 안 되는지도 여기서 보인다.</div>
    </div>
    <div style="flex:0 0 auto">
      ${fig(300, areaFig(A,B,116,{p:[0,0,0,0],split:0,dim:0}))}
    </div>
  </div>
</section>`,

/* 2 ── 곱셈은 넓이다 ────────────────────── */
`<section class="slide" data-steps="3" style="--acc:#1d4ed8">
  <div class="eyebrow">되짚기 · 곱셈은 직사각형의 넓이다</div>
  <h1 style="font-size:36px">3 × 2 를 그림으로 그리면?</h1>
  <div class="row grow" style="margin-top:14px;gap:34px">
    <div style="flex:0 0 300px;text-align:center">
      ${fig(292, natRect(3,2,96,true))}
      <div style="font-size:20px;font-weight:700;margin-top:8px">가로 3 · 세로 2 → <b class="hn">6칸</b></div>
    </div>
    <div class="grow">
      <div class="term" style="font-size:21px">
        <b class="hn">가로 × 세로 = 넓이.</b> 곱셈은 원래 이 그림이다.<br>
        <span style="color:var(--muted);font-size:19px">칸을 세면 답이 나온다 — 3 × 2 = 6</span>
      </div>
      <div class="act" style="margin-top:16px;font-size:21px" data-step="1">
        <b class="hl">가로세로가 분수여도 그림은 그대로다.</b><br>

  </div>
</section>`,

/* ══════════════════════════════════════════════
   재생기 — 03 과 같은 조작
   ══════════════════════════════════════════════ */
const stage=document.getElementById('stage');
stage.innerHTML=SLIDES.join('');
const slides=[...document.querySelectorAll('.slide')];
let cur=0, step=0;

function maxStep(i){ return parseInt(slides[i].dataset.steps||'0',10); }

function render(){
  slides.forEach((s,i)=>s.classList.toggle('on',i===cur));
  slides[cur].querySelectorAll('[data-step]').forEach(el=>{
    const n=parseInt(el.dataset.step,10);
    el.classList.toggle('vis', n<=step);
  });
  document.getElementById('cnt').textContent=`${cur+1} / ${slides.length}`;
}

function go(d){
  if(d>0){
    if(step<maxStep(cur)){ step++; render(); return; }
    if(cur<slides.length-1){ cur++; step=0; render(); }
  }else{
    if(step>0){ step--; render(); return; }
    if(cur>0){ cur--; step=maxStep(cur); render(); }
  }
}
function jump(i){ cur=Math.max(0,Math.min(slides.length-1,i)); step=0; render(); }

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); go(1); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); go(-1); }
  else if(k==='ArrowDown'){ e.preventDefault(); jump(cur+1); }
  else if(k==='ArrowUp'){ e.preventDefault(); jump(cur-1); }
  else if(k==='Home'){ jump(0); }
  else if(k==='End'){ jump(slides.length-1); }
  else if(k==='f'||k==='F'){ fs(); }
});

let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)) go(dx<0?1:-1);
},{passive:true});

document.getElementById('wrap').addEventListener('click',()=>go(1));

function fs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

function fit(){
  const s=Math.min(window.innerWidth/1280,(window.innerHeight-46)/720);
  stage.style.transform=`scale(${s})`;
}
window.addEventListener('resize',fit);
fit(); render();
</script>
