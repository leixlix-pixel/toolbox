<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>디자인 저울 — 무엇을 포기했을까</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1c1f26; --navy:#1b3a6b; --navy2:#2f5fa8; --red:#d94141; --gold:#e0a43a;
  --paper:#f6f4ef; --card:#fff; --line:#dcd8cf; --muted:#7b7770; --green:#2e7a42;
}
html,body{height:100%}
body{
  font-family:'Noto Sans KR',sans-serif; background:var(--paper); color:var(--ink);
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none; font-size:18px;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 40px}

/* 헤더 */
header{background:#1b3a6b;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.18)}
header .ttl{font-size:20px;font-weight:900;letter-spacing:-.02em}
header .sub{font-size:14px;opacity:.75;font-weight:500}
header .sp{margin-left:auto;display:flex;gap:8px}
.hbtn{background:#2f5fa8;color:#fff;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;min-height:44px}
.hbtn:active{background:#26497f}

/* 공통 */
.screen{display:none;padding-top:18px}
.screen.on{display:block}
h2.big{font-size:27px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
p.desc{font-size:17px;color:var(--muted);line-height:1.55;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;
  padding:12px 24px;border-radius:12px;font-size:19px;font-weight:900;background:#2f5fa8;color:#fff}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy2)}
.btn.warm{background:#d94141}
.btn.gray{background:#8a857d}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:12px;flex-wrap:wrap}

/* 물건 고르기 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.item{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.item:active{border-color:var(--navy2)}
.item.done{border-color:var(--green);background:#f2fbf4}
.item .thumb{width:100%;height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.item .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.item .nm{font-size:17px;font-weight:900;line-height:1.3}
.item .mk{font-size:13px;color:var(--muted);line-height:1.35}
.item .chk{font-size:13px;font-weight:900;color:var(--green)}
.item.mine .thumb{background:#f2f0ec;border-radius:10px;color:#a9a49b;font-size:15px;font-weight:700}

/* 배분 */
.rate-top{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.rate-left{flex:1 1 340px;min-width:300px}
.rate-right{flex:1 1 330px;min-width:290px;display:flex;flex-direction:column;align-items:center}
.pool{background:#fff7e6;border:2px solid var(--gold);border-radius:14px;padding:14px 18px;
  display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pool .n{font-family:'Gaegu',sans-serif;font-size:52px;line-height:1;color:#b06a12}
.pool .lb{font-size:17px;font-weight:700;line-height:1.4}
.pool.zero{background:#eefaf1;border-color:var(--green)}
.pool.zero .n{color:var(--green)}

.ax{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:10px 12px;margin-bottom:9px}
.ax .name{width:96px;font-size:17px;font-weight:900;line-height:1.2;flex:0 0 auto}
.ax .name small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ax .dots{flex:1;display:flex;gap:5px;justify-content:center}
.ax .dot{width:19px;height:19px;border-radius:50%;background:#e8e5df}
.ax .dot.f{background:#2f5fa8}
.pm{width:46px;height:46px;border-radius:12px;background:#eef1f7;font-size:26px;font-weight:900;
  color:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pm:active{background:#dbe2ee}
.pm[disabled]{opacity:.3}
.ax .val{width:34px;text-align:center;font-family:'Gaegu',sans-serif;font-size:34px;line-height:1;color:var(--navy)}

svg.rd{display:block;max-width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:6px}
.legend span{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.legend i{width:15px;height:15px;border-radius:4px;display:inline-block}

.term{background:#eef3fb;border-left:6px solid var(--navy2);border-radius:0 12px 12px 0;
  padding:14px 16px;font-size:17px;line-height:1.6}
.term b{color:var(--navy)}
.warnbox{background:#fdeef1;border-left:6px solid var(--red);border-radius:0 12px 12px 0;
  padding:14px 16px;font-size:17px;line-height:1.6}
.hint{font-size:15px;color:var(--muted);line-height:1.5}

/* 대조 */
.made{background:#fff;border:2px solid var(--gold);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.made h3{font-size:20px;font-weight:900;color:#946012;margin-bottom:7px}
.made p{font-size:17px;line-height:1.6}
.gap-line{font-size:18px;line-height:1.6;background:#f4f1ea;border-radius:12px;padding:13px 16px;margin-top:12px}
.gap-line b{color:var(--red)}

/* 모둠 */
.names{display:flex;flex-direction:column;gap:9px;margin:12px 0}
.nameRow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:9px 12px}
.nameRow i{width:16px;height:16px;border-radius:5px;flex:0 0 auto}
.nameRow input{flex:1;font-family:inherit;font-size:18px;border:0;border-bottom:2px solid #e3e0da;
  padding:7px 2px;background:none;color:var(--ink);min-width:0}
.nameRow input:focus{outline:none;border-bottom-color:var(--navy2)}
.nameRow .st{font-size:14px;font-weight:900;color:var(--muted);flex:0 0 auto}
.nameRow .st.ok{color:var(--green)}

.copybox{background:#11131a;color:#a8e8b0;border-radius:12px;padding:14px 16px;
  font-size:17px;line-height:1.75;user-select:text;-webkit-user-select:text}

/* QR */
.qrlay{position:fixed;inset:0;background:rgba(15,17,22,.92);display:none;align-items:center;
  justify-content:center;flex-direction:column;gap:18px;z-index:60;padding:20px}
.qrlay.on{display:flex}
.qrlay .box{background:#fff;padding:20px;border-radius:18px;text-align:center}
.qrlay .box svg{width:min(62vw,360px);height:min(62vw,360px);display:block}
.qrlay .box .ph{width:min(62vw,360px);height:min(62vw,360px);display:flex;align-items:center;
  justify-content:center;background:#f2f0ec;border:3px dashed #bdb8ae;border-radius:12px;
  color:#8d8880;font-size:17px;font-weight:700;text-align:center;line-height:1.6}
.qrlay .ad{color:#cfd4de;font-size:16px;font-family:ui-monospace,Consolas,monospace;text-align:center;
  user-select:text;-webkit-user-select:text;word-break:break-all}

.foot{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:560px){
  h2.big{font-size:23px}
  .ax .name{width:80px;font-size:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .item .thumb{height:115px}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="ttl">디자인 저울</div>
    <div class="sub">점수는 모두 15점뿐이다</div>
  </div>
  <div class="sp">
    <button class="hbtn" id="btnHome">처음</button>
    <button class="hbtn" id="btnQr">QR</button>
  </div>
</header>

<div class="wrap">

<!-- 1. 물건 고르기 -->
<section class="screen on" id="scHome">
  <h2 class="big">어떤 물건을 재어 볼까?</h2>
  <p class="desc">물건 하나를 고르면 다섯 자리에 <b>15점</b>을 나눠 줄 수 있다.<br>
  한 곳을 올리면 다른 곳이 줄어든다 — 전부 5점을 줄 수는 없다.</p>
  <div class="grid" id="itemGrid"></div>
</section>

<!-- 2. 배분 -->
<section class="screen" id="scRate">
  <h2 class="big" id="rateTitle">—</h2>
  <p class="desc" id="rateWho">—</p>
  <div class="rate-top">
    <div class="rate-left">
      <div class="pool" id="pool">
        <div class="n" id="poolN">10</div>
        <div class="lb">아직 나눠 주지 않은 점수<br><span class="hint">0이 되어야 다음으로 넘어간다</span></div>
      </div>
      <div id="axes"></div>
    </div>
    <div class="rate-right">
      <div class="card" style="width:100%;display:flex;flex-direction:column;align-items:center">
        <svg class="rd" id="rdLive" width="340" height="310"></svg>
        <div class="hint" style="text-align:center;margin-top:2px">점수를 옮길 때마다 모양이 바뀐다</div>
      </div>
    </div>
  </div>
  <div class="foot">
    <button class="btn ghost" id="rateBack">◀ 물건 다시 고르기</button>
    <button class="btn" id="rateDone" disabled>다 나눴다 ▶</button>
  </div>
</section>

<!-- 3. 대조 -->
<section class="screen" id="scResult">
  <h2 class="big" id="resTitle">—</h2>
  <div class="rate-top">
    <div class="rate-right" style="flex:1 1 360px">
      <div class="card" style="width:100%;display:flex;flex-direction:column;align-items:center">
        <svg class="rd" id="rdResult" width="380" height="350"></svg>
        <div class="legend" id="resLegend"></div>
      </div>
    </div>
    <div class="rate-left" style="flex:1 1 360px">
      <div class="made" id="madeBox"></div>
      <div class="gap-line" id="gapLine"></div>
    </div>
  </div>
  <div class="foot">
    <button class="btn ghost" id="resBack">◀ 처음으로</button>
    <button class="btn warm" id="resGroup">우리 모둠도 매기기 ▶</button>
    <button class="btn gray" id="resAgain">내가 다시 매기기</button>
  </div>
</section>

<!-- 4. 모둠 -->
<section class="screen" id="scGroup">
  <h2 class="big">우리 모둠 겹쳐 보기</h2>
  <p class="desc" id="grpItem">—</p>
  <div class="rate-top">
    <div class="rate-left" style="flex:1 1 330px">
      <div class="card">
        <div style="font-size:18px;font-weight:900;margin-bottom:4px">모둠원 이름</div>
        <div class="hint">한 사람씩 차례로 매긴다. 앞사람 점수는 보이지 않는다.</div>
        <div class="names" id="grpNames"></div>
        <button class="btn" id="grpNext" style="width:100%">다음 사람 매기기 ▶</button>
      </div>
    </div>
    <div class="rate-right" style="flex:1 1 360px">
      <div class="card" style="width:100%;display:flex;flex-direction:column;align-items:center">
        <svg class="rd" id="rdGroup" width="380" height="350"></svg>
        <div class="legend" id="grpLegend"></div>
      </div>
    </div>
  </div>
  <div class="card" id="grpTalk" style="margin-top:14px"></div>
  <div class="foot">
    <button class="btn ghost" id="grpBack">◀ 처음으로</button>
    <button class="btn gray" id="grpSave">그림으로 저장</button>
    <button class="btn gray" id="grpReset">모둠 지우고 다시</button>
  </div>
</section>

</div>

<div class="qrlay" id="qrlay">
  <div class="box"><span data-qr="scale"></span></div>
  <div class="ad" id="qrAddr">leixlix-pixel.github.io/toolbox/design-magic/design-scale.html</div>
  <button class="btn ghost" id="qrClose">닫기</button>
</div>

const KEY = 'design-scale-v2';
let S = load();
function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r && r.mine!==undefined) return r; }catch(e){}
  return { mine:{}, group:{}, photo:null, photoName:'' };   /* mine[id]=[..], group[id]=[{n,v}] */
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ================= 레이더 ================= */
function drawRadar(svg, sets){
  const W = +svg.getAttribute('width'), H = +svg.getAttribute('height');
  const cx = W/2, cy = H/2 + 4, R = Math.min(W,H)/2 - 48;
  const pt = (i,r)=>{ const a = -Math.PI/2 + i*2*Math.PI/5;
    return [cx + Math.cos(a)*R*r/5, cy + Math.sin(a)*R*r/5]; };
  let s = '';
  for(let ring=1; ring<=5; ring++){
    const p = [0,1,2,3,4].map(i=>pt(i,ring).map(v=>v.toFixed(1)).join(',')).join(' ');
    s += '<polygon points="'+p+'" fill="'+(ring===5?'#ffffff':'none')+'" stroke="#d5d0c7" stroke-width="1.3"/>';
  }
  for(let i=0;i<5;i++){
    const [x,y] = pt(i,5);
    s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#d5d0c7" stroke-width="1.3"/>';
    const [lx,ly] = pt(i,6.1);
    s += '<text x="'+lx.toFixed(1)+'" y="'+(ly+5).toFixed(1)+'" text-anchor="middle" font-size="15" font-weight="700" fill="#6f6b64" font-family="Noto Sans KR, sans-serif">'+AXES[i].k+'</text>';
  }
  sets.forEach(set=>{
    const v = set.v, c = set.c;
    const p = v.map((r,i)=>pt(i,r).map(x=>x.toFixed(1)).join(',')).join(' ');
    s += '<polygon points="'+p+'" fill="'+c+'" fill-opacity="'+(set.op||.24)+'" stroke="'+c+'" stroke-width="3.4" stroke-linejoin="round"'+(set.dash?' stroke-dasharray="7 5"':'')+'/>';
    v.forEach((r,i)=>{ const [x,y]=pt(i,r);
      s += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4.8" fill="'+c+'"/>'; });
  });
  svg.innerHTML = s;
}

/* ================= 화면 ================= */
const screens = {home:'scHome', rate:'scRate', result:'scResult', group:'scGroup'};
function go(name){
  Object.values(screens).forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById(screens[name]).classList.add('on');
  scrollTo(0,0);
}

/* ---- 물건 고르기 ---- */
function renderHome(){
  const g = document.getElementById('itemGrid');
  g.innerHTML = '';
  ITEMS.forEach(it=>{
    const b = document.createElement('button');
    b.className = 'item' + (it.id==='mine' ? ' mine' : '') + (S.mine[it.id] ? ' done' : '');
    let thumb;
    if(it.id==='mine'){
      thumb = S.photo ? '<img src="'+S.photo+'" alt="">' : '사진을 찍어<br>넣어 보세요';
    } else {
      thumb = '<img src="'+(IMG[it.img]||'')+'" alt="">';
    }
    const nm = (it.id==='mine' && S.photoName) ? S.photoName : it.nm;
    b.innerHTML = '<div class="thumb">'+thumb+'</div>'+
      '<div class="nm">'+nm+'</div><div class="mk">'+it.mk+'</div>'+
      (S.mine[it.id] ? '<div class="chk">✓ 매긴 적 있음</div>' : '');
    b.onclick = ()=>pick(it);
    g.appendChild(b);
  });
}

function pick(it){
  if(it.id==='mine' && !S.photo){ takePhoto(); return; }
  curItem = it;
  mode = 'solo'; groupName = '';
  vals = (S.mine[it.id] ? S.mine[it.id].slice() : [1,1,1,1,1]);
  startRate();
}

/* ---- 사진 ---- */
function takePhoto(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      const im = new Image();
      im.onload = ()=>{
        const s = Math.min(1, 420/Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
        const cx = c.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0,0,c.width,c.height);
        cx.drawImage(im,0,0,c.width,c.height);
        S.photo = c.toDataURL('image/jpeg', .84);
        if(!S.photoName) S.photoName = '내가 찾은 물건';
        save(); renderHome();
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}

/* ---- 배분 ---- */
function startRate(){
  document.getElementById('rateTitle').textContent =
    (curItem.id==='mine' && S.photoName ? S.photoName : curItem.nm);
  document.getElementById('rateWho').innerHTML = mode==='group'
    ? '<b>'+esc(groupName)+'</b> 차례입니다. 앞사람 점수는 보이지 않습니다.'
    : curItem.mk + ' — 15점을 다섯 자리에 나눠 주세요.';
  renderAxes(); go('rate');
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderAxes(){
  const box = document.getElementById('axes');
  box.innerHTML = '';
  AXES.forEach((a,i)=>{
    const d = document.createElement('div');
    d.className = 'ax';
    let dots = '';
    for(let n=1;n<=MAXV;n++) dots += '<span class="dot'+(n<=vals[i]?' f':'')+'"></span>';
    d.innerHTML = '<div class="name">'+a.k+'<small>'+a.s+'</small></div>'+
      '<button class="pm" data-m="'+i+'">−</button>'+
      '<div class="val">'+vals[i]+'</div>'+
      '<button class="pm" data-p="'+i+'">+</button>'+
      '<div class="dots">'+dots+'</div>';
    box.appendChild(d);
  });
  const used = vals.reduce((a,b)=>a+b,0), left = TOTAL - used;
  box.querySelectorAll('[data-m]').forEach(b=>{
    const i = +b.dataset.m; b.disabled = vals[i] <= MINV;
    b.onclick = ()=>{ if(vals[i]>MINV){ vals[i]--; renderAxes(); } };
  });
  box.querySelectorAll('[data-p]').forEach(b=>{
    const i = +b.dataset.p; b.disabled = (vals[i] >= MAXV || left <= 0);
    b.onclick = ()=>{ if(vals[i]<MAXV && (TOTAL - vals.reduce((a,c)=>a+c,0))>0){ vals[i]++; renderAxes(); } };
  });
  document.getElementById('poolN').textContent = left;
  document.getElementById('pool').classList.toggle('zero', left===0);
  document.getElementById('rateDone').disabled = (left !== 0);
  drawRadar(document.getElementById('rdLive'), [{v:vals, c:mode==='group' ? nextColor() : ME_COLOR}]);
}
function nextColor(){
  const list = S.group[curItem.id] || [];
  return COLORS[Math.min(list.length, COLORS.length-1)];
}

/* ---- 대조 ---- */
function showResult(){
  const it = curItem;
  S.mine[it.id] = vals.slice(); save();
  document.getElementById('resTitle').textContent =
    (it.id==='mine' && S.photoName ? S.photoName : it.nm);
  const sets = [{v:vals, c:ME_COLOR}];
  let legend = '<span><i style="background:'+ME_COLOR+'"></i>내가 매긴 점수</span>';
  const made = document.getElementById('madeBox');
  const gap = document.getElementById('gapLine');

  if(it.made){
    sets.push({v:it.made, c:MADE_COLOR, op:.16, dash:true});
    legend += '<span><i style="background:'+MADE_COLOR+'"></i>만든 사람이 노린 것</span>';
    made.innerHTML = '<h3>만든 사람은 무엇을 노렸을까</h3><p>'+it.why+'</p>'+
      '<p style="font-size:15px;color:var(--muted);margin-top:9px">이것은 <b>정답이 아니다.</b> ' +
      '대 보라고 놓아 둔 것일 뿐, 다르게 본 쪽이 틀린 것이 아니다.</p>';
    let bi = 0, bd = -1;
    it.made.forEach((m,i)=>{ const d = Math.abs(m - vals[i]); if(d > bd){ bd = d; bi = i; } });
    gap.innerHTML = bd === 0
      ? '다섯 자리가 <b>모두 같다.</b> 만든 사람과 똑같이 보았다 — 왜 그렇게 보았는지 말해 보자.'
      : '가장 많이 갈린 자리는 <b>'+AXES[bi].k+'</b>이다 ('+vals[bi]+'점 ↔ '+it.made[bi]+'점).<br>'+
        '<span style="font-size:16px;color:var(--muted)">왜 그렇게 보았는지 한 줄로 말해 보자.</span>';
  } else {
    made.innerHTML = '<h3>내가 찾은 물건</h3><p>이 물건은 <b>만든 사람의 답이 없다.</b> ' +
      '대신 모둠 친구들에게 매겨 달라고 해 보자 — 같은 물건인데 오각형이 갈릴 것이다.</p>';
    gap.innerHTML = '내가 준 가장 높은 점수는 <b>'+AXES[vals.indexOf(Math.max(...vals))].k+'</b>이다. ' +
      '이 물건을 만든 사람도 그걸 가장 노렸을까?';
  }
  document.getElementById('resLegend').innerHTML = legend;
  drawRadar(document.getElementById('rdResult'), sets);
  go('result');
}

  nb.textContent = full ? '네 사람이 다 매겼다' : '다음 사람 매기기 ▶';

  drawRadar(document.getElementById('rdGroup'), sets.length ? sets : [{v:[1,1,1,1,1], c:'#ccc', op:.05}]);
  document.getElementById('grpLegend').innerHTML =
    list.map((r,i)=>'<span><i style="background:'+COLORS[i]+'"></i>'+esc(r.n)+'</span>').join('');

  /* 갈린 자리 */
  const talk = document.getElementById('grpTalk');
  if(list.length < 2){
    talk.innerHTML = '<div class="hint">두 사람 이상 매기면 <b>어디에서 갈렸는지</b>가 여기에 나온다.</div>';
  } else {
    let bi=0, bs=-1;
    for(let i=0;i<5;i++){
      const col = list.map(r=>r.v[i]);
      const sp = Math.max(...col) - Math.min(...col);
      if(sp > bs){ bs = sp; bi = i; }
    }
    const lines = list.map(r=>esc(r.n)+' '+r.v[bi]+'점').join(' · ');
    talk.innerHTML = bs === 0
      ? '<div class="term">다섯 자리가 <b>모두 같았다.</b> 서로 베낀 것이 아니라면, 이 물건은 성격이 아주 뚜렷한 것이다.</div>'
      : '<div class="term">가장 크게 갈린 자리는 <b>'+AXES[bi].k+'</b>이다.<br>'+lines+
        '<br><span style="font-size:16px;color:var(--muted)">같은 물건인데 왜 갈렸을까? 한 사람씩 까닭을 말해 보자.</span></div>'+
        '<div class="copybox" style="margin-top:12px">'+
        '학습지에 옮겨 적기<br>' +
        list.map((r,i)=>'· '+esc(r.n)+' : '+r.v.join(' / ')).join('<br>')+
        '<br><span style="color:#7d8a80">(독창 / 심미 / 경제 / 합목적 / 환경 차례)</span></div>';
  }
}

/* ---- PNG 저장 ---- */
function saveRadar(svgEl, fname){
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const W = +svgEl.getAttribute('width'), H = +svgEl.getAttribute('height');
  const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'">' +
    '<rect width="100%" height="100%" fill="#ffffff"/>' + clone.innerHTML + '</svg>');
  const im = new Image();
  im.onload = ()=>{
    const c = document.createElement('canvas');
    c.width = W*2; c.height = H*2;
    const cx = c.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0,0,c.width,c.height);
    cx.drawImage(im,0,0,c.width,c.height);
    const a = document.createElement('a');
    a.download = fname; a.href = c.toDataURL('image/png'); a.click();
  };
  im.src = src;
}

  } else {

document.getElementById('grpNext').onclick = ()=>{

};
