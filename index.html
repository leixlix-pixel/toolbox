<html lang="ko">
<head>

<title>5학년 수업자료</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1c2430; --muted:#6d6b66; --line:#e2ddd2; --paper:#f6f2e9; --card:#fff;
  --row-alt:#fbf9f4; --hover:#eef4fb;
  --social:#c0392b; --korean:#1d5b95; --math:#2e7d5b; --music:#c8963e;
  --art:#7d4a86; --ethics:#d1712f; --practical:#2b7a8c; --extra:#5c6470;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding:0 0 60px;line-height:1.5}

header{background:#123a63;color:#fff;padding:22px 20px 18px;
  box-shadow:0 3px 14px rgba(0,0,0,.18);position:sticky;top:0;z-index:20}
header .wrap{max-width:1180px;margin:0 auto}
h1{font-size:26px;font-weight:900;letter-spacing:-.02em}
header p{font-size:14px;opacity:.8;margin-top:3px}
#q{width:100%;margin-top:14px;padding:13px 16px;border:0;border-radius:12px;
  font-family:inherit;font-size:17px;font-weight:500;color:var(--ink);min-height:48px}
#q:focus{outline:3px solid #4a86c4}

main{max-width:1180px;margin:0 auto;padding:0 20px}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
.bar button{min-height:42px;padding:8px 16px;border:2px solid var(--line);border-radius:10px;
  background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer}
.bar button:active{transform:translateY(1px)}
.bar .sp{flex:1}
.bar .total{font-size:14px;color:var(--muted);font-weight:500}

#recent{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
#recent[hidden]{display:none}
#recent .lab{font-size:14px;font-weight:700;color:var(--muted);margin-right:2px}
#recent a{display:inline-block;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;background:#fff;
  border:1px solid var(--line);border-left:5px solid;border-radius:8px;padding:7px 11px}

/* ── 트리 표 ── */
.tree{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 2px 7px rgba(30,25,15,.06)}
.row{display:flex;align-items:center;min-height:46px;border-top:1px solid var(--line);
  text-decoration:none;color:inherit;cursor:pointer;user-select:none}
.tree > .row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.row .no{flex:0 0 74px;padding-left:14px;font-size:14px;font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums;align-self:stretch;display:flex;align-items:center;
  border-right:1px solid var(--line)}
.row .body{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:8px 14px 8px 12px}
.caret{flex:0 0 22px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:transform .12s}
.caret svg{width:11px;height:11px}
.open > .body .caret{transform:rotate(90deg)}
.ico{flex:0 0 auto;display:flex;align-items:center}
.ico svg{display:block}
.name{min-width:0;flex:1}
.cnt{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--muted);background:var(--paper);
  border-radius:999px;padding:2px 10px}

/* 과목 */
.lv0{background:#fdfcf8}
.lv0 .name{font-size:18px;font-weight:900}
.lv0 .no{color:var(--ink)}
/* 단원 */
.lv1 .body{padding-left:40px}
.lv1 .name{font-size:16px;font-weight:700}
.lv1 .name .un{color:var(--muted);font-weight:700;margin-right:6px}
/* 자료 */
.lv2{background:var(--card)}
.lv2:nth-of-type(even){background:var(--row-alt)}
.lv2 .body{padding-left:100px}
.lv2 .no{font-weight:500;font-size:13px}
.lv2 .name{font-size:15.5px;line-height:1.4}
.lv2 .name b{font-weight:700}
.lv2 .name .sub{color:var(--muted);font-weight:400}
.lv2 .name .fn{display:block;font-size:12px;color:#9a978f;margin-top:1px;word-break:break-all}
.lv2:hover{background:var(--hover)}
.tag{flex:0 0 auto;font-size:11.5px;font-weight:900;border-radius:5px;padding:2px 7px;
  border:1.5px solid;white-space:nowrap}
.tag.new{color:#fff}
mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}

.kids{display:none}
.open + .kids{display:block}
.searching .kids{display:block}

#empty{display:none;text-align:center;color:var(--muted);font-size:16px;padding:50px 0}
footer{max-width:1180px;margin:30px auto 0;padding:0 20px;font-size:13px;color:var(--muted)}

@media (max-width:640px){
  main{padding:0 12px}
  .row .no{display:none}
  .lv1 .body{padding-left:30px}
  .lv2 .body{padding-left:52px}
  .lv2 .name .fn{display:none}
  .tag{display:none}
}
</style>
</head>

/* ── 저장 (막혀 있어도 페이지는 그대로 돈다) ── */
function load(key, def){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch(e){ return def; }
}
function save(key, v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch(e){} }

const openSet = new Set(load('toolbox-open', []));
const readRecent = () => load('toolbox-recent', []);
function pushRecent(f){
  save('toolbox-recent', [f].concat(readRecent().filter(x => x !== f)).slice(0, 4));
}

function build(){
  return SUBJECTS.map(sub => {
    const rows = ITEMS.filter(it => it.s === sub.key);
    const known = UNITS[sub.key] || [];
    const units = [];
    const loose = rows.filter(it => !it.u);
    if (loose.length) units.push({ u:'_', n:'', name:'단원 미정 — 새로 올라온 자료', items: loose });
    known.forEach(k => {
      const items = rows.filter(it => it.u === k.u);
      if (items.length) units.push(Object.assign({}, k, { items }));
    });
    /* UNITS 에 없는 단원 — 처음 나온 순서대로 뒤에 붙인다 */
    const seen = new Set(known.map(k => k.u));
    rows.forEach(it => {
      if (!it.u || seen.has(it.u)) return;
      seen.add(it.u);
      const num = /^\d+$/.test(it.u);
      units.push({ u: it.u, n: num ? it.u + '단원' : '', name: num ? '' : it.u,
        items: rows.filter(x => x.u === it.u) });
    });
    return Object.assign({}, sub, { units, count: rows.length });
  }).filter(s => s.count);
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function hi(text, q){
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
const hrefOf = f => './' + f.split('/').map(encodeURIComponent).join('/');

const CARET = '<svg viewBox="0 0 10 10"><path d="M3 1.5 7.5 5 3 8.5z" fill="currentColor"/></svg>';
const FOLDER = 'M1 3.5A1.5 1.5 0 0 1 2.5 2h5l2 2h10A1.5 1.5 0 0 1 21 5.5v10a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 1 15.5z';
const folderBig = c => '<svg width="22" height="18" viewBox="0 0 22 18"><path d="' + FOLDER + '" fill="' + c + '"/></svg>';
const folderSm  = c => '<svg width="19" height="16" viewBox="0 0 22 18"><path d="' + FOLDER + '" fill="none" stroke="' + c + '" stroke-width="2"/></svg>';
const DOC = '<svg width="15" height="18" viewBox="0 0 15 18"><path d="M1.5 1h8l4 4v11.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5z" fill="#fff" stroke="#9a978f" stroke-width="1.3"/><path d="M9.5 1v4h4" fill="none" stroke="#9a978f" stroke-width="1.3"/></svg>';

let query = '';

function itemRow(it, no, color, q){
  const a = document.createElement('a');
  a.className = 'row lv2';
  a.href = hrefOf(it.f);
  a.target = '_blank';
  a.rel = 'noopener';
  const cut = it.t.indexOf(' — ');
  const main = cut < 0 ? it.t : it.t.slice(0, cut);
  const sub = cut < 0 ? '' : it.t.slice(cut);
  let tag = '';
  if (it.tag) tag = it.tag === 'NEW'
    ? '<span class="tag new" style="background:' + color + ';border-color:' + color + '">NEW</span>'
    : '<span class="tag" style="color:' + color + ';border-color:' + color + '">' + esc(it.tag) + '</span>';
  a.innerHTML = '<span class="no">' + no + '</span><span class="body">' +
    '<span class="ico">' + DOC + '</span>' +
    '<span class="name"><b>' + hi(main, q) + '</b><span class="sub">' + hi(sub, q) + '</span>' +
    '<span class="fn">' + esc(it.f) + '</span></span>' + tag + '</span>';
  a.onclick = () => { pushRecent(it.f); setTimeout(renderRecent, 0); };
  return a;
}

function groupRow(cls, id, no, icon, label, count){
  const d = document.createElement('div');
  d.className = 'row ' + cls + (query || openSet.has(id) ? ' open' : '');
  d.setAttribute('role', 'button');
  d.setAttribute('aria-expanded', d.classList.contains('open'));
  d.tabIndex = 0;
  d.innerHTML = '<span class="no">' + no + '</span><span class="body"><span class="caret">' + CARET + '</span>' +
    '<span class="ico">' + icon + '</span><span class="name">' + label + '</span><span class="cnt">' + count + '</span></span>';
  const toggle = () => {
    if (query) return;
    const on = d.classList.toggle('open');
    d.setAttribute('aria-expanded', on);
    on ? openSet.add(id) : openSet.delete(id);
    save('toolbox-open', [...openSet]);
  };
  d.onclick = toggle;
  d.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
  return d;
}

function render(){
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  const q = query.trim().toLowerCase();
  tree.classList.toggle('searching', !!q);
  let shown = 0;

  build().forEach((sub, si) => {
    const units = sub.units.map(u => Object.assign({}, u, {
      items: q ? u.items.filter(it => (it.t + ' ' + it.f + ' ' + sub.name + ' ' + u.n + ' ' + u.name).toLowerCase().includes(q)) : u.items
    })).filter(u => u.items.length);
    if (!units.length) return;
    const total = units.reduce((n, u) => n + u.items.length, 0);
    shown += total;

    const sNo = String(si + 1);
    tree.appendChild(groupRow('lv0', sub.key, sNo, folderBig(sub.color), esc(sub.name), total));
    const sKids = document.createElement('div');
    sKids.className = 'kids';

    units.forEach((u, ui) => {
      const uNo = sNo + '.' + (ui + 1);
      const label = (u.n ? '<span class="un">' + esc(u.n) + '</span>' : '') + hi(u.name, q);
      sKids.appendChild(groupRow('lv1', sub.key + ':' + u.u, uNo, folderSm(sub.color), label, u.items.length));
      const uKids = document.createElement('div');
      uKids.className = 'kids';
      u.items.forEach((it, ii) => uKids.appendChild(itemRow(it, uNo + '.' + (ii + 1), sub.color, q)));
      sKids.appendChild(uKids);
    });
    tree.appendChild(sKids);
  });

  tree.style.display = shown ? '' : 'none';
  document.getElementById('empty').style.display = shown ? 'none' : 'block';
  document.getElementById('total').textContent = q ? shown + '개 찾음' : '자료 ' + ITEMS.length + '개';
  renderRecent();
}

function renderRecent(){
  const box = document.getElementById('recent');
  const rec = readRecent().map(f => ITEMS.find(i => i.f === f)).filter(Boolean);
  if (!rec.length || query.trim()) { box.hidden = true; return; }
  box.innerHTML = '<span class="lab">최근에 연 자료</span>';
  rec.forEach(it => {
    const a = document.createElement('a');
    a.href = hrefOf(it.f);
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.borderLeftColor = colorOf(it.s);
    a.textContent = it.t.split(' — ')[0];
    a.title = it.t;
    a.onclick = () => { pushRecent(it.f); setTimeout(renderRecent, 0); };
    box.appendChild(a);
  });
  box.hidden = false;
}

document.getElementById('openAll').onclick = () => {
  build().forEach(s => { openSet.add(s.key); s.units.forEach(u => openSet.add(s.key + ':' + u.u)); });
  save('toolbox-open', [...openSet]);
  render();
};
document.getElementById('closeAll').onclick = () => {
  openSet.clear();
  save('toolbox-open', []);
  render();
};
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
render();
</script>
</body>
</html>
