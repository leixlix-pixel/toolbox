<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고려 모둠 조사 학습지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --ink:#1a1a1a; --line:#c9cdd4; --muted:#71767e; --paper:#fff;
  --warn:#c0392b; --soft:#f4f6f9;
}
html,body{margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#e8eaee;color:var(--ink);
     -webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ── 화면 전용 조작 바 ─────────────────────────── */
.bar{position:sticky;top:0;z-index:50;background:#0f1b2d;color:#fff;
     padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
     font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.bar b{font-size:15px;letter-spacing:-.3px}
.bar .sp{flex:1}
.bar select{font-family:inherit;font-size:14px;padding:9px 10px;border-radius:8px;
            border:none;min-height:40px;max-width:260px}
.bar button{font-family:inherit;font-size:14px;font-weight:700;min-height:40px;
            padding:9px 16px;border:none;border-radius:8px;background:#ffd34d;color:#1a1a1a;
            cursor:pointer;touch-action:manipulation}
.bar button.ghost{background:rgba(255,255,255,.16);color:#fff}
.bar .hint{width:100%;font-size:12.5px;color:#b9c4d4;line-height:1.5}

/* ── A4 ────────────────────────────────────────── */
@page{size:A4;margin:0}
.page{
  width:210mm;height:297mm;padding:12mm 13mm 12mm;background:var(--paper);
  margin:16px auto;box-shadow:0 3px 14px rgba(0,0,0,.18);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  --acc:#1f4e79;
}
.page.hide{display:none !important}

/* 머리 */
.head{display:flex;align-items:flex-end;gap:12px;border-bottom:3px solid var(--acc);
      padding-bottom:7px;flex:none}
.badge{background:var(--acc);color:#fff;border-radius:8px;padding:5px 11px;
       font-size:15px;font-weight:900;line-height:1.1;text-align:center;flex:none}
.badge small{display:block;font-size:10.5px;font-weight:500;opacity:.85;margin-top:2px}
.who{flex:1;min-width:0}
.who .eyebrow{font-size:11.5px;color:var(--muted);letter-spacing:.5px;font-weight:700}
.who h1{margin:0;font-size:29px;font-weight:900;letter-spacing:-1.3px;line-height:1.15;color:var(--acc)}
.name-in{flex:none;font-size:12px;color:#333;text-align:right;line-height:2.1;white-space:nowrap}
.name-in u{text-decoration:none;border-bottom:1px solid #999;display:inline-block;min-width:52px}

/* 본문: 남는 높이를 쓰는 칸과 여백에 나눠 준다 */
.pbody{flex:1;min-height:0;display:flex;flex-direction:column;
       justify-content:space-between;gap:9px;padding-top:9px}
.sec{display:flex;flex-direction:column;min-height:0}
.grow{flex-grow:var(--g,.5);min-height:0}
.st{font-size:13.5px;font-weight:900;color:var(--acc);margin:0 0 5px;
    display:flex;align-items:center;gap:6px;flex:none}
.st .num{background:var(--acc);color:#fff;width:19px;height:19px;border-radius:50%;
         font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.st .tip{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:-.2px}

/* 쓰는 줄 (SVG 로 긋는다 — 인쇄에서 사라지지 않게) */
.wr{position:relative;flex:1 1 0;min-height:0}
.wr svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wr svg line{stroke:var(--line);stroke-width:1}

/* ① 언제·어디 */
.when{display:flex;gap:8px;flex:none}
.when .cell{flex:1;border:1.5px solid var(--line);border-radius:6px;padding:5px 8px 0;height:46px}
.when .cell span{font-size:11px;color:var(--muted);font-weight:700}
.when .cell .blank{border-bottom:1px dotted #b9bec6;height:20px;margin-top:3px}

/* ② 찾아올 것 3가지 */
.qs{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px}
.q{flex:1;min-height:0;display:flex;flex-direction:column;
   border-left:4px solid var(--acc);padding-left:8px}
.q .qt{font-size:12.5px;font-weight:700;line-height:1.35;margin-bottom:2px;flex:none}
.q .qt i{font-style:normal;color:var(--acc);font-weight:900;margin-right:4px}

/* ③ 그림 */
.draw{flex:1 1 0;min-height:0;border:2px dashed #b9bec6;border-radius:8px;
      position:relative;background:#fcfcfd}
.draw .cap{position:absolute;left:10px;top:8px;font-size:11.5px;color:var(--muted)}
.drawname{font-size:12px;margin-bottom:5px;flex:none}
.drawname u{text-decoration:none;border-bottom:1px solid #aaa;display:inline-block;min-width:200px}

/* ④ 이어 보기 */
.link{font-size:11.5px;color:#333;margin:-2px 0 4px;flex:none;line-height:1.45}
.link b{color:var(--acc)}

/* ⑤ 전시 문제 */
.quiz{flex:none;border:2px solid var(--acc);border-radius:8px;padding:6px 10px 8px;
      display:flex;gap:10px;align-items:stretch}
.quiz .qh{flex:none;font-size:12.5px;font-weight:900;color:var(--acc);line-height:1.35;width:92px}
.quiz .qh small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:2px}
.quiz .ql{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px;padding-top:4px}
.quiz .ql span{border-bottom:1px dotted #9aa0a8;height:18px;display:block}

/* 각주 */
.foot{flex:none;border-top:1.5px solid #dde1e6;padding-top:7px;margin-top:9px}
.warn{background:#fdf0ee;border-left:4px solid var(--warn);border-radius:0 6px 6px 0;
      padding:6px 9px;font-size:11.5px;line-height:1.45}
.warn b{color:var(--warn)}
.keys{font-size:11.5px;color:#333;margin-top:6px;line-height:1.5}
.keys b{color:var(--acc)}
.keys .kw{background:var(--soft);border:1px solid #e1e5ea;border-radius:4px;
          padding:1px 6px;margin-right:4px;display:inline-block;font-weight:700}
.src{display:flex;align-items:flex-end;gap:6px;font-size:11.5px;color:#333;margin-top:6px}
.src .l{flex:1;border-bottom:1px dotted #b9bec6;height:15px}

/* ── 배정표(교사용 첫 장) ─────────────────────── */
.cover{--acc:#0f1b2d}
.cover h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-1.2px}
.cover .sub{font-size:13px;color:var(--muted);margin-top:3px}
.grid6{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gcard{border:2px solid var(--c);border-radius:9px;overflow:hidden}
.gcard .gt{background:var(--c);color:#fff;padding:6px 10px;font-weight:900;font-size:14.5px;letter-spacing:-.4px}
.gcard .gt small{font-weight:500;font-size:11px;opacity:.9;margin-left:4px}
.gcard ol{margin:0;padding:6px 10px 7px 28px;font-size:12.5px;line-height:1.75}
.gcard ol li::marker{font-weight:900;color:var(--c)}
.gcard .who2{display:inline-block;min-width:54px;border-bottom:1px solid #bbb;margin-left:4px;height:14px;vertical-align:middle}
.steps{border:1.5px solid #dde1e6;border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.65;background:#fafbfc}
.steps h3{margin:0 0 4px;font-size:14px;color:#0f1b2d}
.steps ol{margin:0;padding-left:20px}
.steps b{color:#0f1b2d}
.steps .note{margin-top:6px;font-size:11.5px;color:var(--muted)}

@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .page{margin:0;box-shadow:none;page-break-after:always}
  .page:last-of-type{page-break-after:auto}
}
</style>
</head>
<body>

<div class="bar no-print">
  <b>고려 모둠 조사 학습지</b>
  <span class="sp"></span>
  <select id="pick" onchange="only(this.value)"></select>
  <button class="ghost" onclick="only('')">전체 보기</button>
  <button onclick="window.print()">🖨 인쇄</button>
  <div class="hint">첫 장은 교사용 배정표, 그 뒤로 6모둠 × 4명 = 24장. 한 모둠만 뽑으려면 위에서 고른 뒤 인쇄 — 보이는 쪽만 나온다.</div>
</div>

<div id="out"></div>

function only(n){
  document.querySelectorAll('.page').forEach(p=>{
    p.classList.toggle('hide', n!=='' && n!=null && p.dataset.n !== String(n));
  });
  pick.value = n==null ? '' : n;
  window.scrollTo(0,0);
  draw();
}

/* 쓰는 줄은 SVG 로 긋는다 — 줄 수가 아니라 줄 간격을 고정한다 */
function draw(){
  document.querySelectorAll('svg.rules').forEach(svg=>{
    const w = svg.clientWidth, h = svg.clientHeight;
    if(!w || !h) return;
    const pitch = parseFloat(svg.dataset.pitch) || 26;
    const n = Math.max(1, Math.round(h / pitch));
    const gap = h / n;
    let s = '';
    for(let i=1;i<=n;i++){
      const y = Math.round(gap*i) - 1.5;
      s += `<line x1="1" y1="${y}" x2="${w-1}" y2="${y}"/>`;
    }
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('preserveAspectRatio','none');
    svg.innerHTML = s;
  });
}
draw();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
window.addEventListener('load', draw);
window.addEventListener('resize', draw);
window.addEventListener('beforeprint', draw);
