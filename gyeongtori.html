<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>늴리리야 — 경토리의 흥은 어디서 오나</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1c2430; --navy:#123a63; --navy2:#1d5b95;
  --red:#c0392b; --gold:#c8963e; --green:#2e7d5b; --plum:#7d4a86;
  --paper:#f6f2e9; --line:#d9d2c4; --muted:#6d6b66;
}

html,body{height:100%;background:#0d1520;font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}

#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;background:var(--paper);overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}

.slide{position:absolute;inset:0;padding:38px 54px;display:none;
  flex-direction:column;background:var(--paper);--acc:var(--navy)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 12% 8%,rgba(200,150,62,.10),transparent 45%),
             radial-gradient(circle at 92% 95%,rgba(18,58,99,.08),transparent 45%)}
.slide>*{position:relative;z-index:1}

.eyebrow{display:inline-block;font-size:21px;font-weight:700;color:#fff;
  background:var(--acc);padding:6px 18px;border-radius:999px;margin-bottom:12px;align-self:flex-start}
h1.title{font-size:56px;font-weight:900;color:var(--navy);line-height:1.16;letter-spacing:-.02em}
h2.stitle{font-size:40px;font-weight:900;color:var(--acc);line-height:1.2;letter-spacing:-.02em;margin-bottom:4px}
.rule{width:92px;height:7px;border-radius:4px;
  background:linear-gradient(90deg,var(--red),var(--gold));margin:8px 0 18px}
p.body{font-size:27px;line-height:1.55;color:var(--ink);font-weight:500}
p.body+p.body{margin-top:12px}
.small{font-size:22px;line-height:1.5}
.tiny{font-size:19px;line-height:1.5}

b.hl{font-weight:900;color:var(--red);background:linear-gradient(transparent 62%,rgba(192,57,43,.20) 62%);padding:0 2px}
b.hn{font-weight:900;color:var(--navy2);background:linear-gradient(transparent 62%,rgba(29,91,149,.18) 62%);padding:0 2px}
b.hg{font-weight:900;color:var(--green);background:linear-gradient(transparent 62%,rgba(46,125,91,.18) 62%);padding:0 2px}

.cols{display:flex;gap:28px;flex:1;min-height:0;align-items:center}
.col{flex:1;min-width:0}

.term{background:#fff;border-left:9px solid var(--gold);border-radius:8px;padding:14px 18px;
  box-shadow:0 6px 16px rgba(30,25,15,.10)}
.term .t{font-size:24px;font-weight:900;color:var(--gold);margin-bottom:3px}
.term .d{font-size:22px;font-weight:500;color:var(--ink);line-height:1.5}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;
  box-shadow:0 6px 16px rgba(30,25,15,.09)}
.card h3{font-size:24px;font-weight:900;color:var(--acc);margin-bottom:8px}

.act{background:#fff;border:3px dashed var(--navy2);border-radius:18px;padding:18px 24px}
.act-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.act-badge{background:var(--navy2);color:#fff;font-weight:900;font-size:20px;
  padding:5px 15px;border-radius:999px;white-space:nowrap}
.act-t{font-size:26px;font-weight:900;color:var(--navy)}

table.tbl{width:100%;border-collapse:collapse;font-size:22px;text-align:center}
table.tbl th{background:var(--acc);color:#fff;padding:10px 8px;font-weight:900}
table.tbl td{border:1px solid var(--line);padding:11px 10px;background:#fff;color:var(--ink);font-weight:700}
table.tbl td.dim{background:#efe9db;color:var(--muted);font-weight:500;font-size:19px}
table.tbl td.lead{background:#fff;font-weight:900;font-size:24px}

.bubble{background:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 6px 14px rgba(30,25,15,.10);
  font-size:21px;line-height:1.5;font-weight:600;color:var(--ink);position:relative}
.bubble.l{border:2px solid var(--navy2)}
.bubble.r{border:2px solid var(--gold)}

/* ---------- 소리 장치 ---------- */
.play{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:56px;padding:12px 24px;border:0;border-radius:14px;cursor:pointer;
  background:var(--navy2);color:#fff;font-family:inherit;font-size:23px;font-weight:900;
  box-shadow:0 5px 0 #0e3a63;transition:transform .06s,box-shadow .06s}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #0e3a63}
.play.on{background:var(--red);box-shadow:0 5px 0 #8c2418}
.play.gold{background:var(--gold);box-shadow:0 5px 0 #966b1f}
.play.plum{background:var(--plum);box-shadow:0 5px 0 #56305c}
.play.green{background:var(--green);box-shadow:0 5px 0 #1d5540}
.play.grey{background:#5c6470;box-shadow:0 5px 0 #3b424b}
.play.on{background:var(--red)!important;box-shadow:0 5px 0 #8c2418!important}
.play.stop{background:#5c6470;box-shadow:0 5px 0 #3b424b;font-size:21px;min-height:50px;padding:10px 20px}

/* 건반 */
.keys{display:flex;gap:9px}
.key{flex:1;min-height:96px;border-radius:13px;border:3px solid var(--line);background:#fff;
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;transition:transform .07s,background .07s}
.key .nm{font-size:29px;font-weight:900;color:var(--navy)}
.key .sub{font-size:15px;font-weight:700;color:var(--muted)}
.key:active,.key.lit{transform:translateY(4px);background:#fdf3d9;border-color:var(--gold)}
.key.five{border-color:#e0b86a;background:#fffaf0}
.key.five .nm{color:#a5761d}
.key.half{border-color:#d9b4b4;background:#fdf3f3}
.key.half .nm{color:#9c4a4a}
.key.half .sub{color:#b06a6a}

/* 장단 칸 */
.beat{display:flex;gap:5px}
.cell{flex:1;height:54px;border-radius:9px;border:2px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;
  color:#b6ae9e;transition:transform .1s,background .1s,color .1s}
.cell.h{border-color:var(--navy2);color:var(--navy2);background:#eaf3fb}
.cell.m{border-color:var(--gold);color:#9a7126;background:#fdf6e7}
.cell.lit{transform:translateY(-5px) scale(1.06);background:var(--red);color:#fff;border-color:#8c2418}
.beatlbl{display:flex;gap:5px;margin-top:5px}
.beatlbl span{flex:1;text-align:center;font-size:17px;font-weight:700;color:var(--muted)}

/* 토리 지도 도식 */
.torimap{position:relative;width:100%;height:100%;min-height:330px}
.tori{position:absolute;border-radius:999px;padding:6px 13px;border:3px solid;background:#fff;
  box-shadow:0 4px 11px rgba(30,25,15,.14);text-align:center;white-space:nowrap}
.tori .n{font-size:19px;font-weight:900;line-height:1.2}

.imgcol{flex:0 0 470px;height:100%;display:flex;align-items:center;justify-content:center}
.imgcol img{max-width:100%;max-height:640px;border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.25)}

/* 표지 */
.cover{padding:0;background:linear-gradient(160deg,#3d2350,#7d4a86 78%);flex-direction:row}
.cover .txt{flex:1;padding:0 0 0 62px;display:flex;flex-direction:column;justify-content:center}
.cover .kicker{color:#f3d79a;font-size:23px;font-weight:700;margin-bottom:14px}
.cover h1{color:#fff;font-size:62px;font-weight:900;line-height:1.2;letter-spacing:-.02em}
.cover .sub{color:#e2d3ea;font-size:25px;font-weight:500;margin-top:20px;line-height:1.5}
.cover .pic{flex:0 0 520px;height:100%;overflow:hidden;position:relative}
.cover .pic img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.cover .pic::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(61,35,80,.98) 0%,rgba(61,35,80,.35) 26%,rgba(61,35,80,0) 60%)}

.closing{justify-content:center;align-items:center;text-align:center;padding:0;
  background:linear-gradient(160deg,#7d4a86,#3d2350 78%)}
.closing .num{color:#f3d79a;font-size:24px;font-weight:900;margin-bottom:14px}
.closing h1{color:#fff;font-size:50px;font-weight:900;line-height:1.34}
.closing .sub{color:#e2d3ea;font-size:24px;font-weight:500;margin-top:22px;line-height:1.55}

.bar{position:fixed;left:0;right:0;bottom:0;height:46px;background:#0f1a29;color:#cfd8e6;
  display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;z-index:50}
.bar button{background:#1d3350;color:#e8eef7;border:0;border-radius:7px;padding:7px 13px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#prog{position:fixed;left:0;top:0;height:4px;background:var(--navy2);z-index:60;transition:width .18s}
.zone{position:fixed;top:0;bottom:46px;width:9%;z-index:40;cursor:pointer}
#zl{left:0}#zr{right:0}
</style>
</head>
<body>

<div id="prog"></div>
<div id="stage"></div>
<div class="zone" id="zl"></div>
<div class="zone" id="zr"></div>
<div class="bar no-print">
  <button onclick="go(-1)">◀ 이전</button>
  <button onclick="go(1)">다음 ▶</button>
  <span id="counter">1 / 1</span>
  <span style="flex:1"></span>
  <span style="opacity:.65">← → 넘김 · F 전체화면 · 🔊 소리 켜 두세요</span>
  <button onclick="fs()">전체화면</button>
</div>

/* 7 반음이 없다 */

      <p class="body small">① 한 사람이 네 음을 누른다<br>
        ② 짝이 이어서 네 음을 누른다<br>
        ③ 마지막은 <b class="hl">솔</b>로 끝낸다 — 끝난 느낌이 난다</p></div></div>
    <div class="col"><div class="card" style="--acc:var(--green);height:100%">
      <h3>굿거리 위에 얹으면</h3>
      <p class="body small">무릎으로 <b class="hg">덩 기덕 쿵 더러러러</b>를 치면서<br>
        그 위에 방금 만든 가락을 얹어 보자.<br>
        <span style="color:var(--muted)">그 순간 그것이 우리 노래가 된다.</span></p>
      <button class="play green" style="width:100%;margin-top:12px;font-size:20px;min-height:50px" data-beat="gutslow">▶ 장단 틀어 놓기</button></div></div>
  </div>
  <div style="text-align:center;margin-top:10px"><button class="play stop" onclick="stopAll()">■ 멈추기</button></div>
</section>`,

/* 16 마무리 */
`<section class="slide closing">
  <div class="num">오늘의 답</div>
  <h1>흥은 신나게 부르는 마음이 아니라<br>음과 장단이 만들어 낸 것이다</h1>
  <div class="sub">반음이 없어 밝고, 셋으로 쪼개져 흔들리고,<br>
    뜻이 없어 신명만 남는다.<br>
    그래서 늴리리야는 처음 들어도 어깨가 들썩인다.</div>
</section>`
];

/* ===== 소리 ===== */
const F = {
  E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77, C6:1046.50
};

/* 음계(무작위 연주용) */
const SCALES = {
  five  : ['G4','A4','C5','D5','E5','G5','A5'],              /* 경토리 솔라도레미 */
  seven : ['C5','D5','E5','F5','G5','A5','B5','C6'],          /* 반음이 든 일곱 음 */
  menari: ['E4','G4','A4','C5','D5','E5','G5'],               /* 메나리 미솔라도레 */
  yukja : ['E4','A4','B4','E5','A5']                          /* 육자배기 미라시 */
};

let ac = null, timers = [], curBtn = null;

function audio(){
  if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
function clearLit(){
  document.querySelectorAll('.cell.lit,.key.lit').forEach(e => e.classList.remove('lit'));
  document.querySelectorAll('.play.on').forEach(e => {
    e.classList.remove('on');
    if(e.dataset.label) e.textContent = e.dataset.label;
  });
  curBtn = null;
}
function stopAll(){
  timers.forEach(clearTimeout); timers = [];
  clearLit();
  if(ac){ try{ ac.close(); }catch(e){} ac = null; }
}
/* 가락음 — 피리처럼 삼각파 */
function tone(a, t, f, d, vol){
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  const v = vol === undefined ? .20 : vol;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(v, t + .015);
  g.gain.setValueAtTime(v, t + d * .72);
  g.gain.exponentialRampToValueAtTime(.0008, t + d * .99);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + d + .02);
}
/* 떠는음 — 주파수를 크게 흔든다 */
function toneVib(a, t, f, d, depth, rate){
  const o = a.createOscillator(), g = a.createGain();
  const lfo = a.createOscillator(), lg = a.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  lfo.frequency.value = rate; lg.gain.value = depth;
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(.20, t + .04);
  g.gain.setValueAtTime(.20, t + d * .75);
  g.gain.exponentialRampToValueAtTime(.0008, t + d * .99);
  o.connect(g); g.connect(a.destination);
  o.start(t); lfo.start(t); o.stop(t + d + .02); lfo.stop(t + d + .02);
}
/* 꺾는음 — 위에서 아래로 미끄러진 뒤 머문다 */
function toneBend(a, t, fFrom, fTo, d){
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(fFrom, t);
  o.frequency.setValueAtTime(fFrom, t + .22);
  o.frequency.exponentialRampToValueAtTime(fTo, t + .40);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(.20, t + .02);
  g.gain.setValueAtTime(.20, t + d * .75);
  g.gain.exponentialRampToValueAtTime(.0008, t + d * .99);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + d + .02);
}
/* 장구 — 북편(저음) / 채편(고음) */
function drum(a, t, kind){
  if(kind === 'low' || kind === 'both'){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(62, t + .10);
    g.gain.setValueAtTime(.55, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .30);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + .32);
  }
  if(kind === 'high' || kind === 'both'){
    const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
    o.type = 'square';
    o.frequency.setValueAtTime(1450, t);
    o.frequency.exponentialRampToValueAtTime(760, t + .05);
    f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 1.1;
    g.gain.setValueAtTime(.20, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .11);
    o.connect(f); f.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + .13);
  }
}

/* --- 건반 한 음 --- */
function hit(note, el){
  const a = audio();
  tone(a, a.currentTime + .01, F[note], .85);
  if(el){
    el.classList.add('lit');
    setTimeout(() => el.classList.remove('lit'), 160);
  }
}

/* --- 무작위 가락 --- */
function playRandom(scaleKey, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const sc = SCALES[scaleKey], a = audio();
  let t = a.currentTime + .1;
  mark(btn);
  for(let i = 0; i < 8; i++){
    const n = sc[Math.floor(Math.random() * sc.length)];
    const d = (i === 7) ? .95 : .42;
    tone(a, t, F[n], d * .95);
    t += d;
  }
  timers.push(setTimeout(clearLit, (t - a.currentTime) * 1000));
}
/* --- 무작위 화음 (겹쳐서) --- */
function playChord(scaleKey, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const sc = SCALES[scaleKey], a = audio();
  let t = a.currentTime + .1;
  mark(btn);
  for(let k = 0; k < 3; k++){
    const pick = [];
    while(pick.length < 3){
      const n = sc[Math.floor(Math.random() * sc.length)];
      if(!pick.includes(n)) pick.push(n);
    }
    pick.forEach(n => tone(a, t, F[n], 1.05, .13));
    t += 1.25;
  }
  timers.push(setTimeout(clearLit, (t - a.currentTime) * 1000));
}
/* --- 두 음 같이 --- */
function playPair(kind, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const a = audio(); let t = a.currentTime + .1;
  mark(btn);
  const pair = (kind === 'half') ? ['E5','F5'] : ['G5','A5'];
  tone(a, t, F[pair[0]], .55); t += .62;          /* 하나씩 */
  tone(a, t, F[pair[1]], .55); t += .80;
  pair.forEach(n => tone(a, t, F[n], 1.6, .16));  /* 그다음 같이 */
  t += 1.8;
  timers.push(setTimeout(clearLit, (t - a.currentTime) * 1000));
}
/* --- 시김새 --- */
function playOrn(kind, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const a = audio(); const t = a.currentTime + .1;
  mark(btn);
  if(kind === 'straight') tone(a, t, F.A4, 1.7);
  if(kind === 'vib')      toneVib(a, t, F.A4, 1.7, 15, 5.6);
  if(kind === 'bend')     toneBend(a, t, F.C5, F.B4, 1.7);
  timers.push(setTimeout(clearLit, 1900));
}
/* --- 장단 --- */
const BEATS = {
  /* 12칸: 굿거리 — 덩 · 기 / 덕 · · / 쿵 · · / 더 러 러 */
  gut    : { cells: 12, unit: .175, box: 'bt3',
             hits: {0:'both', 2:'high', 3:'high', 6:'low', 9:'high', 10:'high', 11:'high'} },
  gutslow: { cells: 12, unit: .235, box: 'bt3b',
             hits: {0:'both', 2:'high', 3:'high', 6:'low', 9:'high', 10:'high', 11:'high'} },
  /* 8칸: 행진 — 쿵 · 짝 · / 쿵 · 짝 · */
  march  : { cells: 8, unit: .2625, box: 'bt2',
             hits: {0:'low', 2:'high', 4:'low', 6:'high'} }
};
function playBeat(key, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const B = BEATS[key], a = audio();
  let t = a.currentTime + .12;
  mark(btn);
  const box = document.getElementById(B.box);
  for(let rep = 0; rep < 4; rep++){
    for(let i = 0; i < B.cells; i++){
      const kind = B.hits[i];
      if(kind) drum(a, t, kind);
      if(box){
        const delay = (t - a.currentTime) * 1000;
        timers.push(setTimeout(() => {
          [...box.children].forEach((c, n) => c.classList.toggle('lit', n === i));
        }, Math.max(0, delay)));
      }
      t += B.unit;
    }
  }
  timers.push(setTimeout(clearLit, (t - a.currentTime) * 1000));
}
function mark(btn){
  if(!btn) return;
  curBtn = btn;
  if(!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.classList.add('on');
  btn.textContent = '■ 멈춤';
}

/* ===== 렌더링 ===== */
const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.join('');
stage.querySelectorAll('img[data-img]').forEach(el => {
  const src = IMG[el.dataset.img];
  if(src) el.src = src; else el.style.display = 'none';
});
stage.querySelectorAll('.key[data-note]').forEach(k => { k.onclick = () => hit(k.dataset.note, k); });
stage.querySelectorAll('.play[data-rand]').forEach(b => { b.onclick = () => playRandom(b.dataset.rand, b); });
stage.querySelectorAll('.play[data-chord]').forEach(b => { b.onclick = () => playChord(b.dataset.chord, b); });
stage.querySelectorAll('.play[data-pair]').forEach(b => { b.onclick = () => playPair(b.dataset.pair, b); });
stage.querySelectorAll('.play[data-orn]').forEach(b => { b.onclick = () => playOrn(b.dataset.orn, b); });
stage.querySelectorAll('.play[data-beat]').forEach(b => { b.onclick = () => playBeat(b.dataset.beat, b); });

const slides = [...stage.querySelectorAll('.slide')];
let cur = 0;
function show(i){
  stopAll();
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, n) => s.classList.toggle('on', n === cur));
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + slides.length;
  const p = document.getElementById('prog');
  p.style.width = ((cur + 1) / slides.length * 100) + '%';
  p.style.background = getComputedStyle(slides[cur]).getPropertyValue('--acc');
}
function go(d){ show(cur + d); }

function fit(){
  const s = Math.min(window.innerWidth / 1280, (window.innerHeight - 46) / 720);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
function fs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener('keydown', e => {
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(1); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
  if(e.key === 'Home') show(0);
  if(e.key === 'End') show(slides.length - 1);
  if(e.key === 'f' || e.key === 'F') fs();
});
document.getElementById('zl').onclick = () => go(-1);
document.getElementById('zr').onclick = () => go(1);

let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('resize', fit);
fit();
show(0);
</script>
</body>
</html>
