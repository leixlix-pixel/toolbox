<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>요리조리 미술 탐험 ② 우리가 여는 전시</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --ink:#1d1b18; --navy:#2b3a4a; --navy2:#41566b; --red:#b0332b;
  --gold:#9d7a2b; --paper:#f6f1e7; --line:#ddd4c2; --muted:#7c7369;
  --plum:#6b3f66; --teal:#2f6b63;
}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:#26231f;font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;box-shadow:0 0 40px rgba(0,0,0,.5)}
.slide{position:absolute;inset:0;background:var(--paper);color:var(--ink);
  padding:38px 46px 50px;display:none;flex-direction:column;overflow:hidden}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;left:0;bottom:0;height:7px;width:100%;
  background:var(--acc,var(--navy))}
.eyebrow{font-size:16px;font-weight:700;color:var(--acc,var(--navy));
  letter-spacing:.14em;margin-bottom:8px}
h1{font-size:52px;font-weight:900;margin:0 0 10px;line-height:1.15;letter-spacing:-.02em}
h2{font-size:38px;font-weight:900;margin:0 0 14px;line-height:1.2;letter-spacing:-.02em}
h3{font-size:24px;font-weight:800;margin:0 0 8px}
p{font-size:21px;line-height:1.55;margin:0 0 10px}
.lead{font-size:24px;line-height:1.6}
.sm{font-size:18px;line-height:1.5;color:var(--muted)}
b.hl{background:linear-gradient(transparent 58%, #f4c4bf 58%);font-weight:800;color:var(--red)}
b.hn{background:linear-gradient(transparent 58%, #c8d8e6 58%);font-weight:800;color:var(--navy)}
.cap{font-size:14px;color:var(--muted);line-height:1.4;margin-top:6px}
.cap b{color:var(--ink);font-weight:800}
.row{display:flex;gap:26px;flex:1;min-height:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.ph{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);display:flex;flex-direction:column;align-items:center}
.ph img{width:100%;height:auto;display:block;border-radius:3px}
.ph.fit{flex:1;min-height:0;justify-content:center}
.ph.fit img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
.act{background:#fff;border:2px solid var(--acc,var(--navy));border-radius:12px;padding:16px 20px}
.act h3{color:var(--acc,var(--navy))}
.term{background:#efe8d8;border-left:5px solid var(--gold);border-radius:0 8px 8px 0;
  padding:11px 16px;font-size:18px;line-height:1.5}
.term b{color:var(--gold)}
.tag{display:inline-block;background:var(--acc,var(--navy));color:#fff;font-size:15px;
  font-weight:800;padding:3px 12px;border-radius:20px;margin-right:6px}
.bar{position:fixed;left:0;right:0;bottom:0;height:46px;
  display:flex;align-items:center;justify-content:center;gap:14px;z-index:9}
.bar button{background:#3a3631;color:#e8e2d6;border:0;border-radius:7px;
  padding:7px 15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.bar button:active{background:#524c44}
#cnt{color:#a89f92;font-size:15px;font-weight:700;min-width:64px;text-align:center}
#zl,#zr{position:fixed;top:0;bottom:46px;width:13%;z-index:8;cursor:pointer}
#zl{left:0}#zr{right:0}
.qrbox{flex:0 0 auto;background:#fff;padding:7px;border-radius:10px;
  border:1px solid var(--line);text-align:center}
.qrbox svg{width:132px;height:132px;display:block}
.qrbox .qc{font-size:14px;font-weight:900;color:var(--muted);margin-top:4px}
.big{font-family:'Gaegu',cursive;font-size:40px;font-weight:700;color:var(--red);line-height:1.2}
ul{margin:4px 0 0;padding-left:22px;font-size:20px;line-height:1.6}
li{margin-bottom:5px}
.wall{background:#e7dfd0;border:1px solid var(--line);border-radius:8px;padding:16px 14px 10px;
  display:flex;align-items:flex-end;justify-content:center;gap:14px}
.wall .fr{background:#fff;border:1px solid #cfc5b2;padding:5px;box-shadow:0 3px 8px rgba(0,0,0,.13)}
.wall .fr img{display:block;height:auto}
.wall .lab{font-size:12px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.3}
.vs{display:flex;align-items:center;gap:14px}
.vs .x{font-size:30px;font-weight:900;color:var(--muted)}
.badbox,.goodbox{border-radius:10px;padding:11px 15px;font-size:19px;line-height:1.5;margin-bottom:8px}
.badbox{background:#f6e3e1;border-left:5px solid var(--red)}
.goodbox{background:#e0ece7;border-left:5px solid var(--teal)}
.badbox b{color:var(--red)} .goodbox b{color:var(--teal)}
.three{display:flex;gap:16px}
.three>div{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 16px}
.three .tt{font-size:21px;font-weight:900;color:var(--acc,var(--navy));margin-bottom:6px}
.three .td{font-size:17px;line-height:1.5}
.three .ex{font-size:16px;color:var(--muted);margin-top:7px;line-height:1.45;
  border-top:1px dashed var(--line);padding-top:7px}
.plate{background:#fdfbf6;border:1px solid var(--line);border-radius:6px;padding:10px 14px;
  font-size:17px;line-height:1.5}
.plate .t{font-weight:900;font-size:19px}
.plate .m{color:var(--muted);font-size:15px}
.plate .f{color:var(--navy);margin-top:5px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="zl"></div><div id="zr"></div>
<div class="bar">
  <button onclick="go(-1)">◀ 이전</button>
  <span id="cnt"></span>
  <button onclick="go(1)">다음 ▶</button>
  <button onclick="fs()">전체화면</button>
</div>

const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.join('');
stage.querySelectorAll('img[data-img]').forEach(el=>{
  const k = el.getAttribute('data-img');
  if(IMG[k]) el.src = IMG[k]; else el.style.display='none';
});
stage.querySelectorAll('[data-qr]').forEach(el=>{
  const k = el.getAttribute('data-qr');
  if(QR[k]) el.outerHTML = QR[k];
});

const slides = [...document.querySelectorAll('.slide')];
let i = 0;
function show(n){
  i = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((s,k)=>s.classList.toggle('on', k===i));
  document.getElementById('cnt').textContent = (i+1)+' / '+slides.length;
}
function go(d){ show(i+d); }
function fs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
document.getElementById('zl').onclick = ()=>go(-1);
document.getElementById('zr').onclick = ()=>go(1);
addEventListener('keydown', e=>{
  if(['ArrowRight',' ','PageDown'].includes(e.key)){ go(1); e.preventDefault(); }
  else if(['ArrowLeft','PageUp'].includes(e.key)) go(-1);
  else if(e.key==='Home') show(0);
  else if(e.key==='End') show(slides.length-1);
  else if(e.key==='f'||e.key==='F') fs();
});
let tx=0;
addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
addEventListener('touchend',e=>{
  const d=e.changedTouches[0].clientX-tx;
  if(Math.abs(d)>60) go(d<0?1:-1);
},{passive:true});
function fit(){
  const s = Math.min(innerWidth/1280, (innerHeight-46)/720);
  stage.style.transform = 'translate(-50%,-50%) scale('+s+')';
  stage.style.marginTop = '-23px';
}
addEventListener('resize', fit); fit(); show(0);
</script>
</body>
