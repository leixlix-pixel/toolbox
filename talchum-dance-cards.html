<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>탈춤놀이 — 동작 카드 여섯 장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#231d18; --navy:#123a63; --deep:#8e2b1f;
  --red:#c0392b; --gold:#c8963e; --green:#2e7d5b; --plum:#7d4a86;
  --paper:#f7f1e4; --line:#d9cfbb; --muted:#6f675c;
}

html,body{height:100%;background:#12100e;font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}

#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;background:var(--paper);overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}

.slide{position:absolute;inset:0;padding:32px 48px;display:none;
  flex-direction:column;background:var(--paper);--acc:var(--deep)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 10% 6%,rgba(200,150,62,.13),transparent 46%),
             radial-gradient(circle at 94% 96%,rgba(142,43,31,.10),transparent 46%)}
.slide>*{position:relative;z-index:1}

.eyebrow{display:inline-block;font-size:19px;font-weight:700;color:#fff;
  background:var(--acc);padding:5px 17px;border-radius:999px;margin-bottom:9px;align-self:flex-start}
h1.title{font-size:54px;font-weight:900;color:var(--deep);line-height:1.16;letter-spacing:-.02em}
h2.stitle{font-size:37px;font-weight:900;color:var(--acc);line-height:1.2;letter-spacing:-.02em}
.rule{width:86px;height:7px;border-radius:4px;
  background:linear-gradient(90deg,var(--red),var(--gold));margin:8px 0 15px}
p.body{font-size:24px;line-height:1.5;color:var(--ink);font-weight:500}
p.body+p.body{margin-top:9px}
b.hl{background:linear-gradient(transparent 58%,rgba(192,57,43,.30) 58%);font-weight:900;color:var(--deep)}
b.hn{background:linear-gradient(transparent 58%,rgba(18,58,99,.24) 58%);font-weight:900;color:var(--navy)}
.sp{flex:1}

/* 표지 */
.cover{justify-content:center;align-items:center;text-align:center;
  background:linear-gradient(150deg,#8e2b1f,#5d1c14 60%,#3a1510)}
.cover h1{color:#fff;font-size:64px}
.cover .sub{color:#f0d9a8;font-size:26px;font-weight:700;margin-top:14px}
.cover .kr{font-family:'Gaegu',sans-serif;font-size:34px;color:#fff;opacity:.92;margin-top:26px;
  border-top:3px solid rgba(255,255,255,.3);padding-top:20px;line-height:1.4}
.cover::after{display:none}

/* 공통 박스 */
.act{background:#fff;border:3px solid var(--acc);border-radius:16px;padding:16px 20px}
.term{background:#fff6e2;border-left:8px solid var(--gold);border-radius:0 12px 12px 0;
  padding:12px 18px;font-size:20px;line-height:1.45}
.cols{display:flex;gap:18px;flex:1;min-height:0}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;
  box-shadow:0 3px 10px rgba(40,30,15,.07)}

/* 장단 박자판 */
.beats{display:flex;gap:10px;align-items:center}
.beat{width:62px;height:62px;border-radius:14px;background:#fff;border:3px solid var(--line);
  display:grid;place-items:center;font-size:23px;font-weight:900;color:var(--muted);
  transition:background .06s,color .06s,transform .06s,border-color .06s}
.beat.on{background:var(--deep);border-color:var(--deep);color:#fff;transform:translateY(-6px) scale(1.06)}
.beat.strong{border-color:var(--deep);color:var(--deep)}

.btn{font-family:inherit;font-size:20px;font-weight:700;border:0;border-radius:11px;
  padding:12px 22px;min-height:50px;background:var(--deep);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--deep);border:3px solid var(--deep)}
.btn:active{transform:translateY(2px)}
.btnrow{display:flex;gap:11px;align-items:center;flex-wrap:wrap}

/* 동작 카드 */
.movewrap{display:flex;gap:22px;flex:1;min-height:0;align-items:stretch}
.figbox{width:432px;flex:none;background:#fff;border:3px solid var(--acc);border-radius:18px;
  display:flex;flex-direction:column;align-items:center;padding:10px 0 12px;position:relative}
.figbox .cardno{position:absolute;top:-16px;left:18px;background:var(--acc);color:#fff;
  font-size:21px;font-weight:900;padding:3px 16px;border-radius:999px}
.figbox svg{flex:1;min-height:0}
.figbox .nm{font-family:'Gaegu',sans-serif;font-size:40px;color:var(--deep);line-height:1}
.moveinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px;
  justify-content:space-between}
.howrow{display:flex;gap:9px}
.how{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 10px;text-align:center}
.how .hb{font-size:17px;font-weight:900;color:var(--deep)}
.how .ht{font-size:16px;line-height:1.32;margin-top:4px;color:var(--ink);font-weight:500}
.tagrow{display:flex;gap:9px;flex-wrap:wrap}
.tg{font-size:17px;font-weight:700;padding:6px 13px;border-radius:999px;
  background:#efe6d4;color:#6b4a1e}
.tg.sit{background:#dfeee6;color:#1f6146}
.tg.org{background:#f6ddd8;color:#8e2b1f}

/* 구조표 */
table.struct{width:100%;border-collapse:collapse;font-size:19px}
table.struct th,table.struct td{border:2px solid var(--line);padding:7px 10px;text-align:left}
table.struct th{background:var(--deep);color:#fff;font-weight:700;font-size:18px}
table.struct td.who{font-weight:700;color:var(--navy);white-space:nowrap}
table.struct tr.pick td{background:#fff3d6}
table.struct td.num{text-align:center;font-weight:900;color:var(--deep);width:104px}
table.struct .rep{color:var(--muted);font-weight:500;font-size:17px}

/* 여섯 장 모아보기 */
.sixgrid{display:grid;grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,minmax(0,1fr));gap:13px;flex:1;min-height:0}
.sixcell{background:#fff;border:2px solid var(--line);border-radius:13px;
  display:flex;flex-direction:column;align-items:center;padding:6px 4px 8px;position:relative;
  min-height:0;overflow:hidden}
.sixcell .n6{position:absolute;top:5px;left:9px;font-size:17px;font-weight:900;color:var(--deep)}
.sixcell svg{flex:1 1 0;min-height:0;width:100%}
.sixcell .nm6{font-family:'Gaegu',sans-serif;font-size:27px;color:var(--deep);line-height:1}
.sixcell .d6{font-size:14.5px;color:var(--muted);line-height:1.3;text-align:center;margin-top:1px}

/* 역할 */
.roles{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
.role{background:#fff;border:2px solid var(--line);border-radius:13px;padding:12px 10px;text-align:center}
.role .ri{font-size:38px;line-height:1}
.role .rn{font-size:21px;font-weight:900;color:var(--deep);margin-top:5px}
.role .rd{font-size:15.5px;color:var(--muted);line-height:1.34;margin-top:4px}
.role.hi{border-color:var(--green);background:#f0f8f4}
.role.hi .rn{color:var(--green)}

/* 조작 */
#zl,#zr{position:fixed;top:0;bottom:46px;width:16%;z-index:5;cursor:pointer}
#zl{left:0} #zr{right:0}
#progwrap{position:fixed;left:0;right:0;bottom:46px;height:5px;background:rgba(255,255,255,.12);z-index:8}
#prog{height:100%;width:0;background:var(--gold);transition:width .2s}
.bar{position:fixed;left:0;right:0;bottom:0;height:46px;background:#1b1714;
  display:flex;align-items:center;gap:9px;padding:0 14px;z-index:10}
.bar button{font-family:inherit;font-size:14px;font-weight:700;background:#3a322b;color:#f3ead9;
  border:0;border-radius:8px;padding:8px 15px;min-height:34px;cursor:pointer}
.bar button:active{background:#55493e}
.bar #counter{color:#bdb1a0;font-size:14px;font-weight:700;margin-left:5px}
.bar .fl{flex:1}
</style>
</head>
<body>

<div id="stage"></div>
<div id="zl"></div><div id="zr"></div>
<div id="progwrap"><div id="prog"></div></div>
<div class="bar">
  <button onclick="go(-1)">◀ 이전</button>
  <button onclick="go(1)">다음 ▶</button>
  <span id="counter">1 / 1</span>
  <span class="fl"></span>
  <button onclick="stopAll()">■ 멈춤</button>
  <button onclick="fs()">⛶ 전체화면</button>
</div>

<script>
/* ===================== 장단 소리 (웹오디오 · 파일 없음) ===================== */
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }

/* 북편 — 낮고 둥근 울림 (쿵/덩) */
function kung(t, gain){
  const c = ac(), o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(68, t + 0.16);
  f.type = 'lowpass'; f.frequency.value = 420;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);
  o.connect(f); f.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + 0.4);
}
/* 채편 — 짧고 마른 탁 (덕/딱) */
let NOISE = null;
function noiseBuf(){
  if(NOISE) return NOISE;
  const c = ac(), n = Math.floor(c.sampleRate * 0.25);
  NOISE = c.createBuffer(1, n, c.sampleRate);
  const d = NOISE.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  return NOISE;
}
function duk(t, gain){
  const c = ac(), s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
  s.buffer = noiseBuf();
  f.type = 'bandpass'; f.frequency.value = 2100; f.Q.value = 1.1;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  s.connect(f); f.connect(g); g.connect(c.destination);
  s.start(t); s.stop(t + 0.16);
}

/* ===================== 스틱 피겨 ===================== */
/* 각도 규칙 — 팔·다리는 아래로 늘어뜨린 상태가 0도.
   왼쪽(화면 왼쪽) 팔다리는 양수가 바깥, 오른쪽은 음수가 바깥이다. */
const DEF = { la:12, ra:-12, tilt:0, dy:0, head:0, ll:9, rl:-9 };

const MOVES = [
  { n:1, name:'으쓱', org:'어깨춤',
    how:['쿵 — 오른 어깨를 위로','덕 — 왼 어깨를 위로','쿵 — 다시 오른쪽','덕 — 다시 왼쪽'],
    tip:'팔은 가만히 두고 어깨만. 네 박 동안 네 번.',
    sit:'앉아서도 그대로 된다',
    frames:[{tilt:-7,dy:4,la:19,ra:-6},{tilt:7,dy:0,la:6,ra:-19},
            {tilt:-7,dy:4,la:19,ra:-6},{tilt:7,dy:0,la:6,ra:-19}] },

  { n:2, name:'뿌리기', org:'외사위',
    how:['쿵 — 왼팔을 위로 던지고','덕 — 툭 떨군다','쿵 — 오른팔을 위로','덕 — 툭 떨군다'],
    tip:'던질 때 힘을 주고 떨굴 때 힘을 뺀다. 이 힘 빼기가 탈춤이다.',
    sit:'앉아서도 그대로 된다',
    frames:[{la:150,ra:-12,dy:0},{la:12,ra:-12,dy:11},
            {la:12,ra:-150,dy:0},{la:12,ra:-12,dy:11}] },

  { n:3, name:'활개', org:'활개펴기',
    how:['쿵 — 두 팔을 크게 벌리고','덕 — 그대로 멈춤','쿵 — 그대로 멈춤','덕 — 스르르 내린다'],
    tip:'세 박을 버티는 것이 이 카드의 전부다. 크게 벌릴수록 좋다.',
    sit:'앉아서도 그대로 된다',
    frames:[{la:88,ra:-88,dy:0},{la:88,ra:-88,dy:0},
            {la:88,ra:-88,dy:0},{la:16,ra:-16,dy:12}] },

  { n:4, name:'쿵딛기', org:'배김새',
    how:['쿵 — 한 발을 크게 딛고','덕 — 정지','쿵 — 정지','덕 — 제자리로'],
    tip:'딛고 나서 움직이지 않는 것이 동작이다. 멈춘 곳에서 힘이 보인다.',
    sit:'앉은 사람은 발 대신 두 손으로 무릎을 친다',
    frames:[{ll:32,rl:-13,dy:17,la:31,ra:-31,tilt:4},{ll:32,rl:-13,dy:17,la:31,ra:-31,tilt:4},
            {ll:32,rl:-13,dy:17,la:31,ra:-31,tilt:4},{ll:9,rl:-9,dy:0,la:12,ra:-12,tilt:0}] },

  { n:5, name:'탈 숨기', org:'놀이 동작',
    how:['쿵 — 두 손으로 탈을 가리고','덕 — 가린 채','쿵 — 확 내리며 보여 준다','덕 — 그대로'],
    tip:'가렸다가 보여 줄 때 고개를 함께 든다. 받는 쪽이 놀란다.',
    sit:'앉아서도 그대로 된다',
    frames:[{la:222,ra:-222,dy:7,head:6},{la:222,ra:-222,dy:7,head:6},
            {la:12,ra:-12,dy:0,head:-5},{la:12,ra:-12,dy:0,head:-5}] },

  { n:6, name:'까딱', org:'고개잡이',
    how:['쿵 — 고개를 왼쪽으로','덕 — 오른쪽으로','쿵 — 왼쪽','덕 — 오른쪽'],
    tip:'몸은 가만히, 고개만. 제일 작은 동작이지만 장단은 제일 잘 보인다.',
    sit:'앉아서도 그대로 된다',
    frames:[{head:-11,dy:3},{head:11,dy:0},{head:-11,dy:3},{head:11,dy:0}] }
];

/* 피겨 SVG — 탈을 쓴 사람 */
function figSVG(uid){
  return '<svg viewBox="0 0 300 400" class="fig" id="fig' + uid + '">' +
    '<ellipse cx="150" cy="372" rx="66" ry="10" fill="#231d18" opacity=".10"/>' +
    '<g class="f-body">' +
      '<g class="f-legs">' +
        '<g class="f-ll"><line x1="150" y1="243" x2="150" y2="340" stroke="#231d18" stroke-width="11" stroke-linecap="round"/>' +
          '<line x1="150" y1="340" x2="133" y2="352" stroke="#231d18" stroke-width="11" stroke-linecap="round"/></g>' +
        '<g class="f-rl"><line x1="150" y1="243" x2="150" y2="340" stroke="#231d18" stroke-width="11" stroke-linecap="round"/>' +
          '<line x1="150" y1="340" x2="167" y2="352" stroke="#231d18" stroke-width="11" stroke-linecap="round"/></g>' +
      '</g>' +
      '<g class="f-torso">' +
        '<line x1="150" y1="132" x2="150" y2="246" stroke="#231d18" stroke-width="15" stroke-linecap="round"/>' +
        '<g class="f-head">' +
          '<path d="M150 48 C182 48 199 70 199 94 C199 124 178 142 150 142 C122 142 101 124 101 94 C101 70 118 48 150 48 Z" ' +
            'fill="#b8402f" stroke="#231d18" stroke-width="5"/>' +
          '<path d="M120 70 C134 64 166 64 180 70" stroke="#231d18" stroke-width="4" fill="none" stroke-linecap="round"/>' +
          '<path d="M116 84 L139 94" stroke="#231d18" stroke-width="8" stroke-linecap="round"/>' +
          '<path d="M184 84 L161 94" stroke="#231d18" stroke-width="8" stroke-linecap="round"/>' +
          '<ellipse cx="130" cy="105" rx="10" ry="8" fill="#231d18"/>' +
          '<ellipse cx="170" cy="105" rx="10" ry="8" fill="#231d18"/>' +
          '<path d="M130 124 C142 118 158 118 170 124 C158 132 142 132 130 124 Z" fill="#231d18"/>' +
        '</g>' +
        '<path d="M108 150 Q150 138 192 150 L188 232 Q150 242 112 232 Z" fill="#c0392b" stroke="#231d18" stroke-width="5" stroke-linejoin="round"/>' +
        '<path d="M112 206 Q150 216 188 206 L188 218 Q150 228 112 218 Z" fill="#1d5b95" stroke="#231d18" stroke-width="4" stroke-linejoin="round"/>' +
        '<g class="f-al"><line x1="110" y1="152" x2="110" y2="232" stroke="#231d18" stroke-width="11" stroke-linecap="round"/>' +
          '<circle cx="110" cy="238" r="10" fill="#f0e2c8" stroke="#231d18" stroke-width="4"/></g>' +
        '<g class="f-ar"><line x1="190" y1="152" x2="190" y2="232" stroke="#231d18" stroke-width="11" stroke-linecap="round"/>' +
          '<circle cx="190" cy="238" r="10" fill="#f0e2c8" stroke="#231d18" stroke-width="4"/></g>' +
      '</g>' +
    '</g></svg>';
}

/* 포즈 적용 */
function applyPose(root, p){
  const q = s => root.querySelector(s);
  const f = Object.assign({}, DEF, p || {});
  const set = (el, tr, ox, oy) => { if(el){ el.style.transformOrigin = ox + 'px ' + oy + 'px'; el.style.transform = tr; } };
  set(q('.f-body'),  'translateY(' + f.dy + 'px)', 150, 200);
  set(q('.f-torso'), 'rotate(' + f.tilt + 'deg)', 150, 240);
  set(q('.f-head'),  'rotate(' + f.head + 'deg)', 150, 140);
  set(q('.f-al'), 'rotate(' + f.la + 'deg)', 110, 152);
  set(q('.f-ar'), 'rotate(' + f.ra + 'deg)', 190, 152);
  set(q('.f-ll'), 'rotate(' + f.ll + 'deg)', 150, 243);
  set(q('.f-rl'), 'rotate(' + f.rl + 'deg)', 150, 243);
}

/* 카드마다 서 있는 자세가 달라야 한눈에 구분된다 — 멈춰 있을 때는 첫 박 자세로 둔다 */
function poseOf(id){
  const n = parseInt(String(id).replace(/^figS?/, ''), 10);
  const m = MOVES.find(x => x.n === n);
  return m ? m.frames[0] : null;
}
function restFigs(root){
  (root || document).querySelectorAll('svg.fig').forEach(s => applyPose(s, poseOf(s.id)));
}

/* ===================== 재생 ===================== */
let timer = null, running = false;

function stopAll(){
  running = false;
  if(timer){ clearInterval(timer); timer = null; }
  document.querySelectorAll('.beat').forEach(b => b.classList.remove('on'));
}

/* 자진모리 네 박 — 덩 덕 덩 덕 */
function playBeats(opt){
  stopAll();
  const o = opt || {};
  const step = o.slow ? 760 : 500;      /* 한 박 */
  const bars = o.bars || 2;
  const total = bars * 4;
  const beatsEl = o.beatsEl || null;
  const figRoot = o.figRoot || null;
  const frames = o.frames || null;
  let i = 0;
  running = true;

  const tick = () => {
    if(!running) return;
    const b = i % 4;
    const t = ac().currentTime + 0.01;
    if(b === 0 || b === 2){ kung(t, b === 0 ? 0.5 : 0.36); duk(t, 0.10); }
    else { duk(t, 0.26); }
    if(beatsEl){
      beatsEl.querySelectorAll('.beat').forEach((el, n) => el.classList.toggle('on', n === b));
    }
    if(figRoot && frames) applyPose(figRoot, frames[b % frames.length]);
    i++;
    if(i >= total){
      setTimeout(() => {
        if(!running) return;
        stopAll();
        if(figRoot) applyPose(figRoot, poseOf(figRoot.id));
      }, step);
    }
  };
  ac().resume && ac().resume();
  tick();
  timer = setInterval(() => { if(i < total) tick(); }, step);
}

function playMove(n, slow){
  const m = MOVES.find(x => x.n === n);
  const fig = document.getElementById('fig' + n);
  const bt = document.getElementById('beats' + n);
  playBeats({ slow: !!slow, bars: 2, beatsEl: bt, figRoot: fig, frames: m.frames });
}

/* ===================== 슬라이드 ===================== */
function beatBar(id){
  return '<div class="beats" id="' + id + '">' +
    '<div class="beat strong">쿵</div><div class="beat">덕</div>' +
    '<div class="beat strong">쿵</div><div class="beat">덕</div></div>';
}

function moveSlide(m){
  const hows = m.how.map((h, i) => {
    const p = h.split(' — ');
    return '<div class="how"><div class="hb">' + p[0] + '</div><div class="ht">' + (p[1] || '') + '</div></div>';
  }).join('');
  return '<section class="slide" style="--acc:var(--deep)">' +

/* ===================== 렌더링 ===================== */
const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.join('');
restFigs();

const slides = [...stage.querySelectorAll('.slide')];
let cur = 0;
function show(i){
  stopAll();
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, n) => s.classList.toggle('on', n === cur));
  restFigs(slides[cur]);
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + slides.length;
  const p = document.getElementById('prog');
  p.style.width = ((cur + 1) / slides.length * 100) + '%';
  p.style.background = getComputedStyle(slides[cur]).getPropertyValue('--acc');
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch(e){}
}
function go(d){ show(cur + d); }

function fit(){
  const s = Math.min(window.innerWidth / 1280, (window.innerHeight - 46) / 720);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
function fs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener('keydown', e => {
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(1); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
  if(e.key === 'Home') show(0);
  if(e.key === 'End') show(slides.length - 1);
  if(e.key === 'f' || e.key === 'F') fs();
});
document.getElementById('zl').onclick = () => go(-1);
document.getElementById('zr').onclick = () => go(1);

let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('resize', fit);
fit();
const h = parseInt((location.hash || '').replace('#', ''), 10);
show(isFinite(h) && h > 0 ? h - 1 : 0);
</script>
