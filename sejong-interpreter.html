<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>세종, 말을 배우러 오다 — 통역관이 되어</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#140f1c; --bg2:#1c1527; --card:#241b33; --card2:#302444; --line:#443458;
  --ink:#f3edff; --muted:#a798c2;
  --gold:#f0c060; --jade:#4dd2a8; --red:#ff6b7a; --blue:#79a6ff; --ink2:#c9b8e8;
}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:'Noto Sans KR',sans-serif; font-size:17px; line-height:1.6;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none; min-height:100vh;
  background:
    radial-gradient(1100px 460px at 50% -8%, #2b2040 0%, transparent 62%),
    var(--bg);
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea{font-family:inherit}
#app{max-width:820px;margin:0 auto;padding:0 14px 44px}

/* ── 머리 ── */
header{
  display:flex;align-items:center;gap:8px;
  padding:12px 2px 10px;position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--bg) 70%,transparent);
}
.brand{font-weight:900;font-size:15px;letter-spacing:-.7px;display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:bl 2.2s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.hspace{flex:1}
.iconbtn{width:36px;height:36px;flex:none;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px}
.cnt{font-size:12.5px;font-weight:700;padding:5px 9px;flex:none;white-space:nowrap;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--gold);min-height:32px;display:flex;align-items:center}

/* ── 공통 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.big{font-size:26px;font-weight:900;line-height:1.32;letter-spacing:-1px}
.sub{color:var(--muted);font-size:15px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.btn{
  display:block;width:100%;min-height:52px;padding:13px 17px;border-radius:14px;
  background:var(--card2);border:1.5px solid var(--line);
  font-weight:500;text-align:left;line-height:1.45;
  transition:transform .08s,border-color .15s,background .15s;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--gold);border-color:#ffe0a0;color:#39280a;font-weight:700;text-align:center}
.btn.go{background:var(--jade);border-color:#9df0d6;color:#05301f;font-weight:700;text-align:center}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;text-align:center;min-height:46px}
.btn.sel{border-color:var(--gold);background:#352a16}
.btn.ok{border-color:#2f7a5c;background:#153026}
.btn.no{border-color:#7a3340;background:#331820;opacity:.72}
.stack{display:flex;flex-direction:column;gap:9px}
.mt{margin-top:14px}

/* ── 시작 화면 ── */
.hero{text-align:center;padding:22px 6px 8px}
.hero h1{font-size:33px;font-weight:900;line-height:1.22;letter-spacing:-1.4px;margin:12px 0 8px}
.hero h1 em{font-style:normal;color:var(--gold)}
.heroic{font-size:54px;line-height:1;filter:drop-shadow(0 0 24px rgba(240,192,96,.45))}
.quotebox{
  background:linear-gradient(135deg,#1f1830,#2a2040);border:1px solid var(--line);
  border-radius:18px;padding:17px 18px;margin-top:16px;text-align:left
}
.quotebox .old{font-family:'Gaegu',serif;font-size:21px;line-height:1.85;color:var(--gold);letter-spacing:.3px}
.quotebox .now{font-size:14.5px;color:var(--muted);margin-top:10px;line-height:1.6}

/* ── QR ── */
.qrwrap{text-align:center;margin-top:24px}
.qrbtn{position:relative;background:#fff;border-radius:14px;padding:9px;line-height:0;border:3px solid var(--card2)}
.qrbtn svg{width:128px;height:128px;display:block}
.qrbadge{position:absolute;right:-8px;bottom:-9px;background:var(--gold);color:#39280a;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;line-height:1.5}
.qrov{position:fixed;inset:0;background:rgba(10,7,16,.94);z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px}
.qrov .in{background:#fff;padding:16px;border-radius:20px;line-height:0}
.qrov svg{width:min(78vw,440px);height:min(78vw,440px);display:block}

/* ── 홈: 통역 수첩 ── */
.bookbox{
  display:flex;gap:15px;align-items:center;
  background:linear-gradient(135deg,#1e1730,#2a2042);
  border:1px solid var(--line);border-radius:20px;padding:15px 17px;margin-bottom:14px
}
.bookbox svg{width:112px;height:140px;flex:none}
.booktx{flex:1;min-width:0}
.gauge{height:10px;border-radius:99px;background:#140e20;overflow:hidden;margin:9px 0 7px;border:1px solid var(--line)}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--jade));border-radius:99px;transition:width .5s}
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:center;gap:13px;width:100%;padding:14px 15px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);text-align:left}
.mrow .num{width:34px;height:34px;border-radius:11px;flex:none;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--muted)}
.mrow .tx{flex:1;min-width:0}
.mrow .tx b{display:block;font-size:16.5px;font-weight:700}
.mrow .tx span{display:block;font-size:13.5px;color:var(--muted);line-height:1.45}
.mrow .st{font-size:21px;flex:none}
.mrow.ok{border-color:#2f7a5c;background:#152b22}
.mrow.ok .num{background:var(--jade);color:#05301f}

/* ── 세종 말풍선 ── */
.saying{display:flex;gap:11px;align-items:flex-start;margin:4px 0 14px}
.saying .face{
  width:44px;height:44px;border-radius:50%;flex:none;
  background:linear-gradient(160deg,#3b2c56,#241b33);border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:23px
}
.saying .bub{
  flex:1;background:var(--card2);border:1.5px solid var(--line);border-radius:4px 16px 16px 16px;
  padding:12px 15px;font-size:16.5px;line-height:1.62
}
.saying .bub b{color:var(--gold);font-weight:700}
.saying.me{flex-direction:row-reverse}
.saying.me .face{border-color:var(--blue);font-size:21px}
.saying.me .bub{border-radius:16px 4px 16px 16px;background:#1c2540;border-color:#3c5285}

/* ── 교실 대화 ── */
.chat{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:9px;align-items:flex-start}
.line .who{
  font-size:13px;font-weight:700;color:var(--muted);flex:none;width:36px;text-align:right;padding-top:11px
}
.line .say{
  flex:1;background:var(--card2);border:1.5px solid var(--line);border-radius:14px;
  padding:10px 13px;font-size:16.5px;line-height:1.7
}
.tok{
  display:inline-block;padding:1px 5px;margin:0 1px;border-radius:7px;
  background:#3a2d52;border:1.5px dashed #6b568e;color:var(--ink);
  transition:background .15s,border-color .15s
}
.tok:active{transform:scale(.96)}
.tok.got{background:#3d3316;border:1.5px solid var(--gold);color:var(--gold);font-weight:700;border-style:solid}

/* ── 분류 통 ── */
.bins{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.bin{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:15px;background:var(--card2);border:1.5px solid var(--line);text-align:left}
.bin .bic{font-size:23px;flex:none;width:30px;text-align:center}
.bin b{display:block;font-size:16px;font-weight:700}
.bin span{display:block;font-size:13px;color:var(--muted);line-height:1.4}

/* ── 낱말 카드 ── */
.wordcard{
  background:linear-gradient(135deg,#2c2142,#1f1830);border:2px solid var(--line);
  border-radius:18px;padding:22px 18px;text-align:center;margin:10px 0 4px
}
.wordcard .w{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.25;color:var(--gold)}
.wordcard .ctx{font-size:14.5px;color:var(--muted);margin-top:9px;line-height:1.55}
.progdots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.progdots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.progdots i.on{background:var(--gold)}
.progdots i.dn{background:var(--jade)}

/* ── 피드백 ── */
.fb{border-radius:15px;padding:14px 16px;margin-top:12px;font-size:16px;line-height:1.66;border:1.5px solid}
.fb.good{background:#152b22;border-color:#2f7a5c}
.fb.bad{background:#2e1a20;border-color:#7a3340}
.fb.note{background:#1f2540;border-color:#3c5285}
.fb b{font-weight:700}
.fb .ft{display:block;font-weight:700;margin-bottom:5px;font-size:15px}
.fb.good .ft{color:var(--jade)}
.fb.bad .ft{color:var(--red)}
.fb.note .ft{color:var(--blue)}

/* ── 거울 ── */
.mirror{
  background:linear-gradient(160deg,#28203c,#191325);border:2px solid var(--line);
  border-radius:100px/40px;padding:20px 18px;text-align:center;margin:12px 0;
  box-shadow:inset 0 0 30px rgba(121,166,255,.10)
}
.mirror .mw{font-size:27px;font-weight:900;color:var(--blue);letter-spacing:-.5px}
.mirror .ms{font-size:14px;color:var(--muted);margin-top:7px}

/* ── 마음 두 겹 ── */
.twomind{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.mind{border-radius:15px;padding:13px 15px;border:1.5px solid var(--line);background:var(--card2)}
.mind .ml{font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--muted);margin-bottom:5px}
.mind .mt2{font-size:16.5px;line-height:1.6}
.mind.said{border-color:#3c5285;background:#1c2540}
.mind.heard{border-color:#7a3340;background:#2e1a20}

/* ── 입력칸 ── */
.inbox{
  width:100%;min-height:52px;padding:13px 15px;border-radius:14px;
  background:#170f24;border:1.5px solid var(--line);color:var(--ink);
  font-size:17px;line-height:1.5;resize:none;user-select:text;-webkit-user-select:text
}
.inbox:focus{outline:none;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{padding:8px 13px;border-radius:999px;background:var(--card2);border:1.5px solid var(--line);font-size:14.5px;min-height:38px;display:flex;align-items:center}
.chip.sel{border-color:var(--gold);background:#352a16;color:var(--gold);font-weight:700}

/* ── 수첩 ── */
.notepage{
  background:linear-gradient(135deg,#f6efdd,#eee3c9);color:#2f2415;
  border-radius:18px;padding:20px 20px 16px;margin-top:6px;
  box-shadow:0 10px 28px rgba(0,0,0,.4)
}
.notepage h3{font-family:'Gaegu',sans-serif;font-size:25px;font-weight:700;letter-spacing:-.5px;margin-bottom:12px;color:#4a3820;text-align:center}
.noteline{
  display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1.5px dashed #c8b894;
  font-family:'Gaegu',sans-serif;font-size:19px;line-height:1.55
}
.noteline:last-child{border-bottom:none}
.noteline .nn{font-weight:700;color:#8a6f3e;flex:none}
.noteline.empty{color:#a89b7e}

/* ── 서문 카드 ── */
.seomun{
  background:linear-gradient(135deg,#f6efdd,#e9dcc0);color:#2f2415;
  border-radius:16px;padding:20px 18px;margin:12px 0
}
.seomun .old{font-family:'Gaegu',sans-serif;font-size:21px;line-height:1.95;color:#4a3820;letter-spacing:.2px}
.seomun .now{font-size:15px;line-height:1.7;color:#5d4a2d;margin-top:12px;padding-top:12px;border-top:1.5px dashed #c8b894}
.seomun .now b{color:#8a4a20;font-weight:700}
.seomun .src{font-size:12px;color:#8a7c5e;margin-top:10px;line-height:1.5}

/* ── 토스트 ── */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#0e0a16;border:1.5px solid var(--gold);color:var(--ink);
  padding:11px 18px;border-radius:999px;font-size:15px;font-weight:500;
  opacity:0;transition:opacity .25s,transform .25s;z-index:80;pointer-events:none;max-width:90vw;text-align:center
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 완료 오버레이 ── */
.ovl{position:fixed;inset:0;background:rgba(10,7,16,.93);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.ovl .in{background:var(--card);border:1.5px solid var(--gold);border-radius:22px;padding:26px 22px;max-width:420px;width:100%;text-align:center}
.ovl .ic{font-size:50px;line-height:1;margin-bottom:10px}
.ovl h2{font-size:23px;font-weight:900;margin-bottom:8px;letter-spacing:-.6px}
.ovl p{color:var(--muted);font-size:15.5px;line-height:1.65;margin-bottom:16px}

.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:24px;line-height:1.6}
.warn{font-size:13px;color:var(--muted);line-height:1.6;background:#1f1830;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot"></span><span>세종, 말을 배우러 오다</span></div>
    <div class="hspace"></div>
    <div class="cnt" id="cnt">수첩 0/6</div>
    <button class="iconbtn" onclick="toggleSound()" id="sbtn" title="소리">🔊</button>
    <button class="iconbtn" onclick="resetAll()" title="처음부터">↺</button>
  </header>
  <div id="view"></div>
</div>
<div id="toast"></div>
<div id="ovlwrap"></div>
<script>

   ══════════════════════════════════════════════════════════ */

const QR = { main:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 39 39" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h39v39H0z"/><path stroke="#000000" d="M1 1.5h7m2 0h1m3 0h1m2 0h3m1 0h3m1 0h2m4 0h7M1 2.5h1m5 0h1m2 0h2m1 0h1m1 0h4m1 0h1m1 0h2m3 0h2m2 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m1 0h4m1 0h1m1 0h1m3 0h3m2 0h1m1 0h1m3 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m1 0h2m2 0h2m1 0h3m1 0h1m2 0h1m2 0h3m2 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m1 0h2m1 0h1m3 0h2m1 0h3m2 0h1m1 0h2m3 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m1 0h1m1 0h1m1 0h2m1 0h2m1 0h1m3 0h1m2 0h3m2 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M9 8.5h5m2 0h2m3 0h1m3 0h1m2 0h1M1 9.5h1m1 0h5m5 0h1m1 0h2m2 0h1m1 0h7m1 0h1m1 0h5M1 10.5h3m1 0h1m2 0h1m1 0h1m1 0h7m10 0h2m1 0h1m2 0h2M3 11.5h1m3 0h5m6 0h1m2 0h2m1 0h2m2 0h3m1 0h1m1 0h4M1 12.5h1m1 0h1m6 0h2m5 0h1m4 0h1m1 0h1m3 0h2m1 0h2m4 0h1M2 13.5h3m1 0h4m8 0h1m2 0h1m1 0h9m1 0h5M2 14.5h3m1 0h1m3 0h1m6 0h8m1 0h1m2 0h1m2 0h1M1 15.5h1m1 0h1m1 0h1m1 0h2m7 0h3m2 0h2m5 0h2m1 0h4m1 0h2M1 16.5h1m1 0h1m1 0h2m1 0h1m1 0h1m2 0h1m4 0h7m3 0h1m3 0h2m2 0h1M2 17.5h4m1 0h1m1 0h2m3 0h4m2 0h1m1 0h1m3 0h2m2 0h2m1 0h1m1 0h2M1 18.5h3m1 0h1m2 0h4m2 0h3m1 0h2m1 0h3m1 0h3m1 0h2m1 0h1m3 0h1M2 19.5h3m2 0h2m1 0h4m2 0h2m2 0h1m1 0h2m4 0h1m1 0h2m3 0h3M2 20.5h1m2 0h2m2 0h5m2 0h1m2 0h5m1 0h1m1 0h6m1 0h1m2 0h1M4 21.5h4m2 0h4m2 0h3m1 0h1m2 0h1m1 0h4m1 0h2m1 0h3M2 22.5h1m2 0h1m2 0h2m2 0h1m1 0h2m1 0h1m1 0h2m3 0h1m2 0h1m1 0h1m4 0h1M2 23.5h2m1 0h1m1 0h1m1 0h2m3 0h4m1 0h1m1 0h1m1 0h1m1 0h1m1 0h2m2 0h4m1 0h2M3 24.5h2m1 0h1m1 0h7m2 0h1m2 0h2m2 0h1m3 0h2m1 0h3M2 25.5h1m1 0h4m5 0h1m5 0h9m1 0h5m1 0h1M1 26.5h2m3 0h1m1 0h1m1 0h1m5 0h2m4 0h1m3 0h1m2 0h2m1 0h1m2 0h1M1 27.5h1m1 0h3m1 0h3m1 0h4m3 0h2m1 0h1m2 0h2m2 0h2m3 0h1m2 0h2M1 28.5h1m4 0h1m1 0h4m1 0h3m1 0h1m1 0h1m2 0h1m1 0h1m3 0h6m2 0h1M1 29.5h1m2 0h1m1 0h3m1 0h1m3 0h1m3 0h1m5 0h13M9 30.5h1m4 0h1m3 0h5m1 0h3m1 0h2m3 0h2M1 31.5h7m2 0h1m1 0h2m1 0h2m1 0h1m2 0h2m2 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h3M1 32.5h1m5 0h1m1 0h2m1 0h1m1 0h1m1 0h1m1 0h2m2 0h2m3 0h1m1 0h1m3 0h2m1 0h2M1 33.5h1m1 0h3m1 0h1m1 0h1m7 0h1m2 0h1m1 0h1m1 0h10m1 0h3M1 34.5h1m1 0h3m1 0h1m1 0h1m1 0h1m2 0h1m1 0h1m1 0h2m1 0h1m1 0h1m1 0h1m2 0h1m1 0h2m1 0h4M1 35.5h1m1 0h3m1 0h1m1 0h1m1 0h3m2 0h3m1 0h1m2 0h1m1 0h1m1 0h4m6 0h1M1 36.5h1m5 0h1m3 0h2m1 0h1m1 0h1m3 0h3m4 0h3m1 0h1m1 0h1m3 0h1M1 37.5h7m1 0h1m1 0h1m3 0h4m1 0h1m2 0h5m5 0h5"/></svg>' };/*QR_INJECT*/

/* ── 소리 (파일 없이 Web Audio) ── */
const SND = {
  ctx:null, vol:.55,
  init(){ if(this.ctx) return; try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  tone(f,dur,type,vol,delay,slide){
    if(!this.ctx||this.vol<=0) return;
    const t0=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t0+dur);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime((vol==null?.16:vol)*this.vol,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t0); o.stop(t0+dur+.05);
  },
  noise(dur,vol,delay,freq){
    if(!this.ctx||this.vol<=0) return;
    const t0=this.ctx.currentTime+(delay||0);
    const len=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const g=this.ctx.createGain(); g.gain.value=(vol==null?.12:vol)*this.vol;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start(t0);
  },
  click(){ this.tone(680,.06,'square',.10); },
  tap(){ this.tone(440,.05,'triangle',.09); },
  ok(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.16,'triangle',.15,i*.075)); },
  bad(){ this.tone(220,.22,'sawtooth',.13,0,110); this.tone(160,.26,'square',.08,.06,90); },
  get(){ [784,1047,1319].forEach((f,i)=>this.tone(f,.14,'sine',.18,i*.06)); },
  /* 붓질 — 수첩에 한 줄 적힐 때 */
  brush(){ this.noise(.42,.09,0,850); this.tone(300,.3,'sine',.06,0,210); },
  /* 종 — 세종이 무언가 깨달을 때 */
  bell(){ this.tone(1318,.62,'sine',.15); this.tone(1976,.5,'sine',.06,.03); },
  /* 거울 — 말이 나에게 되비칠 때 */
  mirror(){ [1047,1319,1568].forEach((f,i)=>this.tone(f,.5,'sine',.10,i*.05)); this.noise(.5,.05,0,3200); },
  fanfare(){ [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.28,'triangle',.17,i*.12)); }
};

function viewMission(){
  const m=M(V.mid), st=m.steps[V.si];

  if(st.type==='talk')        body=bodyTalk(m,st);
  else if(st.type==='pick')   body=bodyPick(m,st);
  else if(st.type==='choice') body=bodyChoice(m,st);
  else if(st.type==='fill')   body=bodyFill(m,st);
  else if(st.type==='multi')  body=bodyMulti(m,st);
  else if(st.type==='sign')   body=bodySign(m,st);
  const dots=m.steps.map((_,i)=>`<i class="${i<V.si?'dn':i===V.si?'on':''}"></i>`).join('');
  return `
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">

/* ── talk ── */
function bodyTalk(m,st){
  const ls=st.lines, shown=Math.min(V.ti,ls.length), last=shown>=ls.length;
  let h='';
  if(st.seomun && shown>=2) h+=seomunCard();
  const body=ls.slice(0,shown).map(line).join('');
  return `<div class="card">
    ${st.seomun&&shown>=2?ls.slice(0,1).map(line).join('')+seomunCard()+ls.slice(1,shown).map(line).join(''):body}
    ${!last?`<button class="btn mt" onclick="moreTalk()" style="text-align:center;color:#a798c2">… 계속 듣기</button>`
           :`<button class="btn go mt" onclick="nextStep()">다 들었어요</button>`}
  </div>`;
}
function moreTalk(){ SND.tap(); V.ti++; render(); }

/* ── pick : 대화에서 말 짚기 ── */
function bodyPick(m,st){
  const ids=[]; st.chat.forEach(c=>c.segs.forEach(s=>{ if(s.id) ids.push(s.id); }));
  const all=V.got.length>=ids.length;
  const chat=st.chat.map(c=>`<div class="line"><span class="who">${c.who}</span><span class="say">${
    c.segs.map(s=>{
      if(!s.id) return esc(s.t);
      const got=V.got.includes(s.id);
      return `<button class="tok ${got?'got':''}" onclick="pickTok('${s.id}')">${esc(s.t)}</button>`;
    }).join('')
  }</span></div>`).join('');
  const lastId=V.got[V.got.length-1];
  return `<div class="card">
    ${sayS(st.q)}
    <div class="chat mt">${chat}</div>
    <div class="sub" style="text-align:center;margin-top:12px;font-size:13.5px">${V.got.length} / ${ids.length} 짚음</div>
    ${lastId?`<div style="margin-top:12px">${line(st.fbs[lastId])}</div>`:''}
    ${all?`<div style="margin-top:6px">${line(st.after)}</div><button class="btn go mt" onclick="nextStep()">다음</button>`:''}
  </div>`;
}
function pickTok(id){
  if(V.got.includes(id)){ SND.tap(); return; }
  V.got.push(id); SND.get(); render();
}

/* ── choice ── */
function bodyChoice(m,st){
  const picked=V.pick!=null, o=picked?st.opts[V.pick]:null;
  const opts=st.opts.map((op,i)=>{
    let cls='btn';
    if(picked){
      if(i===V.pick) cls+= (op.ok?' ok':' no');
      else if(op.ok && !st.poll) cls+=' ok';
      else cls+=' no';
    }
    return `<button class="${cls}" onclick="pickOpt(${i})" ${picked?'disabled':''}>${op.t}</button>`;
  }).join('');
  let extra='';
  if(picked && o.mirror){
    extra+=`<div class="mirror"><div class="mw">${o.mirror}</div><div class="ms">— 거울에 비친 그 말</div></div>`;
  }
  if(picked && o.reveal){
    extra+=`<div class="twomind">
      <div class="mind said"><div class="ml">말한 사람의 마음</div><div class="mt2">${o.reveal.said}</div></div>
      <div class="mind heard"><div class="ml">들은 사람의 마음</div><div class="mt2">${o.reveal.heard}</div></div>
    </div>`;
  }
  let foot='';
  if(picked){
    if(o.ok||st.poll){
      const more = st.poll && V.heard.length<st.opts.length;
      foot=`${more?`<button class="btn mt" onclick="hearMore()" style="text-align:center">다른 답은 뭐라고 하실까? (${V.heard.length}/${st.opts.length})</button>`:''}
            <button class="btn go mt" onclick="nextStep()">${st.after&&V.heard.length>=st.opts.length?'다음':'다음'}</button>`;
    } else {
      foot=`<button class="btn primary mt" onclick="againOpt()">다시 생각해 보기</button>`;
    }
  }
  const scene = st.scene
    ? `<div class="chat" style="margin-bottom:13px">`
      + st.scene.map(s => `<div class="line"><span class="who">${s.who}</span><span class="say">${s.say}</span></div>`).join('')
      + `</div>`
    : '';
  return `<div class="card">
    ${st.lead?`<div class="sub" style="margin-bottom:9px;font-size:14.5px">${st.lead}</div>`:''}
    ${scene}
    ${sayS(st.q)}
    <div class="stack mt">${opts}</div>
    ${picked?`<div class="fb ${o.ok||st.poll?'good':'bad'}"><span class="ft">${o.ok||st.poll?'👑 세종':'👑 세종이 고개를 젓는다'}</span>${o.fb}</div>`:''}
    ${extra}
    ${picked&&(o.ok||st.poll)&&st.after?`<div style="margin-top:12px">${line(st.after)}</div>`:''}
    ${foot}
  </div>`;
}
function pickOpt(i){
  const st=M(V.mid).steps[V.si], o=st.opts[i];
  V.pick=i;
  if(!V.heard.includes(i)) V.heard.push(i);
  if(o.mirror) SND.mirror();
  else if(o.key) SND.bell();
  else if(o.ok||st.poll) SND.ok();
  else SND.bad();
  render();
}
function againOpt(){ SND.click(); V.pick=null; render(); }
function hearMore(){
  const st=M(V.mid).steps[V.si];
  for(let i=0;i<st.opts.length;i++) if(!V.heard.includes(i)){ V.pick=i; V.heard.push(i); SND.ok(); render(); return; }
}

/* ── fill : 네 자리에 다른 말 채우기 ── */
function bodyFill(m,st){
  if(V.wrapI>0) return wrapFill(m,st);
  const used=V.slots.map(s=>s.trim()).filter(Boolean);
  const dup=used.length!==new Set(used).size;
  const full=V.slots.every(s=>s.trim());
  const done=full&&!dup;
  const slots=st.slots.map((sl,i)=>{
    const sel=V.slot===i;
    return `<div style="margin-bottom:11px">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px">
        <b style="font-size:16px;color:${sel?'#f0c060':'#f3edff'}">${sl.k}</b>
        <span class="sub" style="font-size:12.5px">${sl.ex}</span>
      </div>
      <input class="inbox" style="${sel?'border-color:#f0c060':''}" value="${esc(V.slots[i])}"
        placeholder="여기에 쓸 말은?" onfocus="selSlot(${i})" oninput="setSlot(${i},this.value)" maxlength="12">
    </div>`;
  }).join('');
  const chips=st.chips.map(c=>`<button class="chip ${V.slots.includes(c)?'sel':''}" onclick="putChip('${esc(c)}')">${c}</button>`).join('');
  return `<div class="card">
    ${sayS(st.q)}
    <div class="sub mt" style="font-size:14px">${st.hint}</div>
    <div class="mt">${slots}</div>
    <div class="sub" style="font-size:13px;margin-top:14px">고르기 — 먼저 위 칸을 누르고 낱말을 고르세요</div>
    <div class="chips">${chips}</div>
    ${dup?`<div class="fb bad" style="margin-top:14px"><span class="ft">👑 세종</span>같은 말이 두 번 있구나. <b>자리마다 다른 말이라야</b> 이 일의 뜻이 있다.</div>`:''}
    ${done?`<button class="btn go mt" onclick="fillDone()">세종께 보이기</button>`
          :`<div class="sub" style="text-align:center;margin-top:14px;font-size:13.5px">${used.length}/4 칸 채움</div>`}
  </div>`;
}
function selSlot(i){ V.slot=i; }
function setSlot(i,v){ V.slots[i]=v; }
function putChip(c){
  SND.tap();
  const i=V.slots.findIndex((s,k)=>k===V.slot);
  V.slots[V.slot]=c;
  if(V.slot<3) V.slot++;
  render();
}
function fillDone(){ SND.ok(); V.wrapI=1; render(); window.scrollTo(0,0); }
function wrapFill(m,st){
  const words=V.slots.map(s=>s.trim()), n=V.wrapI;
  const rows=st.slots.map((sl,i)=>`<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed #443458">
      <span class="sub" style="width:80px;flex:none;font-size:14px">${sl.k}</span>
      <b style="font-size:19px;color:#f0c060">${esc(words[i])}</b>
    </div>`).join('');
  return `<div class="card">
    <div class="eyebrow">내가 지은 네 마디</div>
    <div style="margin:10px 0 16px">${rows}</div>
    ${n>=1?line(st.after):''}
    ${n>=2?line(st.after2):''}
    ${n>=3?`<div class="fb note"><span class="ft">👑 세종이 조용히 묻는다</span>${st.after3[1]}</div>`:''}
    ${n<3?`<button class="btn mt" onclick="fillMore()" style="text-align:center;color:#a798c2">… 계속 듣기</button>`
         :`<button class="btn go mt" onclick="finishM()">수첩에 적기</button>`}
  </div>`;
}
function fillMore(){ SND.tap(); V.wrapI++; if(V.wrapI===3) SND.bell(); render(); }

/* ── multi : 여럿 고르기 ── */
function bodyMulti(m,st){
  const cards=st.cards.map((c,i)=>{
    const on=V.sel.includes(i);
    let cls='btn'+(on?' sel':'');
    if(V.graded){ cls='btn'+(c.ok?(on?' ok':' no'):(on?' no':'')); }
    return `<button class="${cls}" onclick="togMulti(${i})">${V.graded?(c.ok?'✓ ':(on?'✗ ':'　')):''}${c.t}</button>`;
  }).join('');
  let fbs='';
  if(V.graded){
    const wrongPick=st.cards.map((c,i)=>({c,i})).filter(x=>V.sel.includes(x.i)&&!x.c.ok);
    const missed=st.cards.map((c,i)=>({c,i})).filter(x=>!V.sel.includes(x.i)&&x.c.ok);
    const right=st.cards.map((c,i)=>({c,i})).filter(x=>V.sel.includes(x.i)&&x.c.ok);
    fbs=right.map(x=>`<div class="fb good"><span class="ft">👑 세종</span>${x.c.fb}</div>`).join('');
    fbs+=wrongPick.map(x=>`<div class="fb bad"><span class="ft">👑 세종이 고개를 젓는다</span>${x.c.fb}</div>`).join('');
    if(missed.length) fbs+=`<div class="fb note"><span class="ft">👑 세종</span>아직 <b>${missed.length}명</b>이 더 있다. 다시 보아라.</div>`;
  }
  const perfect=V.graded&&st.cards.every((c,i)=>c.ok===V.sel.includes(i));
  return `<div class="card">
    ${sayS(st.q)}
    <div class="sub mt" style="font-size:14px">${st.hint}</div>
    <div class="stack mt">${cards}</div>
    ${fbs}
    ${!V.graded?`<button class="btn primary mt" onclick="gradeMulti()">세종께 보이기 (${V.sel.length}명 고름)</button>`
      :perfect?`<div style="margin-top:12px">${line(st.after)}</div><button class="btn go mt" onclick="nextStep()">다음</button>`
      :`<button class="btn primary mt" onclick="regrade()">다시 골라 보기</button>`}
  </div>`;
}
function togMulti(i){
  if(V.graded) return;
  SND.tap();
  const k=V.sel.indexOf(i);
  if(k<0) V.sel.push(i); else V.sel.splice(k,1);
  render();
}
function gradeMulti(){
  const st=M(V.mid).steps[V.si];
  if(!V.sel.length){ toast('한 명도 고르지 않았어요'); return; }
  V.graded=true;
  const perfect=st.cards.every((c,i)=>c.ok===V.sel.includes(i));
  if(perfect) SND.bell(); else SND.bad();
  render();
}
function regrade(){ SND.click(); V.graded=false; render(); }

/* ── sign : 마지막 줄 쓰기 ── */
function bodySign(m,st){
  const ok=V.sign.trim().length>=2;
  const chips=st.chips.map(c=>`<button class="chip ${V.sign===c?'sel':''}" onclick="putSign('${esc(c)}')">${c}</button>`).join('');
  return `<div class="card">
    ${sayS(st.q)}
    <div class="sub mt" style="font-size:14.5px">${st.hint}</div>
    <textarea class="inbox mt" rows="2" placeholder="예) 「그만해」라는 말을 들으면 바로 멈추겠다"
      oninput="setSign(this.value)" maxlength="60">${esc(V.sign)}</textarea>
    <div class="sub" style="font-size:13px;margin-top:12px">골라서 넣어도 되고, 고친 뒤 써도 된다</div>
    <div class="chips">${chips}</div>
    <div class="mt">
      <div class="sub" style="font-size:13px;margin-bottom:6px">이름 (수첩에 남습니다)</div>
      <input class="inbox" value="${esc(S.name)}" placeholder="이름" oninput="setName(this.value)" maxlength="10">
    </div>
    ${ok?`<button class="btn go mt" onclick="finishM()">수첩에 적기</button>`
        :`<div class="sub" style="text-align:center;margin-top:14px;font-size:13.5px">한 줄을 적으면 수첩이 완성된다</div>`}
  </div>`;
}
function setSign(v){ V.sign=v; }
function setName(v){ S.name=v; save(); }
function putSign(c){ SND.tap(); V.sign=c; render(); }

/* ── 단계 이동 ── */
function nextStep(){
  SND.click();
  const m=M(V.mid);
  if(V.si<m.steps.length-1){ V.si++; resetStep(); render(); window.scrollTo(0,0); }
  else finishM();
}

/* ── 미션 완료 ── */
function finishM(){
  const m=M(V.mid);
  if(m.id==='m6' && V.sign.trim().length<2){ toast('한 줄을 적어 주세요'); return; }
  const first=!S.done[m.id];
  S.done[m.id]=true;
  S.lines[m.id]= m.id==='m6' ? V.sign.trim() : m.note;
  save();
  SND.brush();
  const n=doneCount();
  V.ovl=`<div class="ovl">
    <div class="in">
      <div class="ic">🖌️</div>
      <h2>수첩에 한 줄이 적혔다</h2>
      <div class="notepage" style="text-align:left;margin-bottom:16px">
        <div class="noteline" style="border-bottom:none">
          <span class="nn">${MISSIONS.findIndex(x=>x.id===m.id)+1}.</span>
          <span>${esc(S.lines[m.id])}</span>
        </div>
      </div>
      <p>${n<6?'수첩 <b>'+n+'/6</b> 줄 — 아직 '+(6-n)+'줄이 남았다.':'<b>여섯 줄이 다 찼다.</b> 세종이 돌아갈 때가 되었다.'}</p>
      ${n<6?`<button class="btn go" onclick="closeOvl()">계속하기</button>`
           :`<button class="btn go" onclick="closeOvl(1)">📜 완성된 수첩 보기</button>`}
    </div></div>`;
  V.screen='home'; render();
  if(n===6) setTimeout(()=>SND.fanfare(),800);
}
function closeOvl(toFinal){
  SND.click(); V.ovl=null;
  if(toFinal){ V.screen='final'; }
  render(); window.scrollTo(0,0);
}

  </div>
  <div class="card">
    ${sayS('통역관아, 수고하였다. 여섯 줄을 다 채웠구나.')}
    ${sayS('이 수첩은 <b>내가 배운 것</b>이 아니라 <b>네가 가르쳐 준 것</b>이다. 그러니 이것은 네 것이기도 하다.')}
    ${sayS('내 할 일은 여기까지다. <b>글자는 내가 만들었고, 말은 너희가 만든다.</b>')}
    ${sayS('…부디 <b>제 뜻을 펴지 못하는 이</b>가 네 곁에 없기를.')}
    <div class="notepage mt">

      </div>
    </div>
    <button class="btn go mt" onclick="saveCard()">💾 수첩 이미지로 저장하기</button>

  </div>
  <div class="warn">
    <b>선생님께</b> — 저장한 이미지를 모아 게시하면 학급 약속판이 됩니다.

  </div>
  <div class="foot">언어문화개선교육 · 2026.10.06</div>`;
}

/* ── 수첩 이미지 저장 ── */
function saveCard(){
  SND.click();
  const W=820, H=1180, c=document.createElement('canvas');
  c.width=W; c.height=H;
  const x=c.getContext('2d');

  /* 한지 바탕 */
  const g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#f8f1de'); g.addColorStop(1,'#eadfc3');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  /* 결 */
  x.globalAlpha=.05; x.strokeStyle='#8a6f3e';
  for(let i=0;i<70;i++){ x.beginPath(); x.moveTo(0,i*17+((i*37)%13)); x.lineTo(W,i*17+((i*53)%19)); x.stroke(); }
  x.globalAlpha=1;
  /* 테두리 */
  x.strokeStyle='#8a6f3e'; x.lineWidth=3; x.strokeRect(26,26,W-52,H-52);
  x.strokeStyle='#c3ab7a'; x.strokeRect(36,36,W-72,H-72);

  const F=(s,w)=>`${w||400} ${s}px 'Noto Sans KR', sans-serif`;
  x.textAlign='center'; x.fillStyle='#4a3820';
  x.font=F(19,700); x.fillText('通 譯 手 帖', W/2, 96);
  x.font=F(40,900); x.fillStyle='#3a2c16';
  x.fillText('세종의 통역 수첩', W/2, 150);
  x.font=F(16,400); x.fillStyle='#7a6642';
  x.fillText('세종대왕이 2026년 교실에서 배워 간 여섯 가지', W/2, 184);

  x.strokeStyle='#8a6f3e'; x.lineWidth=2;
  x.beginPath(); x.moveTo(90,206); x.lineTo(W-90,206); x.stroke();

  /* 여섯 줄 */
  let y=254;
  MISSIONS.forEach((m,i)=>{
    const t=S.lines[m.id]||'';
    x.textAlign='left';
    x.font=F(25,900); x.fillStyle='#b08832';
    x.fillText(String(i+1)+'.', 78, y);
    x.font=F(20,500); x.fillStyle='#33291a';
    /* 줄바꿈 */
    const maxw=W-190; let lineTxt='', yy=y;
    for(const ch of t){
      if(x.measureText(lineTxt+ch).width>maxw){ x.fillText(lineTxt,124,yy); lineTxt=ch; yy+=32; }
      else lineTxt+=ch;
    }
    x.fillText(lineTxt,124,yy);
    /* 미션 이름 */
    x.font=F(13,400); x.fillStyle='#9a8256';
    x.fillText(m.title, 124, yy+24);
    y=yy+68;
    x.strokeStyle='#cbb98f'; x.lineWidth=1; x.setLineDash([5,5]);
    x.beginPath(); x.moveTo(78,y-30); x.lineTo(W-78,y-30); x.stroke(); x.setLineDash([]);
  });

  /* 서문 */
  x.textAlign='center';
  x.font=F(19,700); x.fillStyle='#8a4a20';
  x.fillText('제 뜻을 펴지 못하는 사람이 많다', W/2, H-176);
  x.font=F(14,400); x.fillStyle='#9a8256';
  x.fillText('훈민정음 서문 (1446)', W/2, H-150);

  x.font=F(22,700); x.fillStyle='#4a3820';
  x.fillText('통역관  '+(S.name||'　　　'), W/2, H-100);
  x.font=F(13,400); x.fillStyle='#9a8256';
  x.fillText('2026년 10월 · 언어문화개선교육', W/2, H-72);

  try{
    const a=document.createElement('a');
    a.download='세종의_통역수첩_'+(S.name||'통역관')+'.png';
    a.href=c.toDataURL('image/png');
    a.click();
    SND.get(); toast('수첩을 저장했어요');
  }catch(e){ toast('저장이 막혀 있어요 — 화면을 캡처해 주세요'); }
}

/* ── 잡다 ── */
let toastT=null;
function toast(msg){
  const t=$('toast'); t.innerHTML=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2300);
}
function toggleSound(){
  S.sound = S.sound===false;
  SND.vol = S.sound ? .55 : 0;
  save(); render();
  if(S.sound){ SND.init(); SND.ok(); }
}
let resetArm=false, resetT=null;
function resetAll(){
  if(!resetArm){
    resetArm=true; SND.bad();
    toast('정말 처음부터? <b>한 번 더</b> 누르면 수첩이 지워집니다');
    clearTimeout(resetT); resetT=setTimeout(()=>{resetArm=false;},3500);
    return;
  }
  resetArm=false;
  S={ done:{}, lines:{}, name:'', last:'', sound:S.sound };
  save();
  V={ screen:'intro', mid:null, si:0, ti:1, got:[], pick:null, heard:[], slots:['','','',''], slot:0, sel:[], graded:false, wrapI:0, sign:'', ovl:null };
  render(); window.scrollTo(0,0);
  toast('수첩을 비웠습니다');
}
function showQR(){
  SND.click();
  V.ovl=`<div class="qrov" onclick="hideQR()"><div class="in">${QR.main}</div>
    <div style="color:#a798c2;font-size:14px;text-align:center">태블릿 카메라로 찍으세요<br>아무 데나 누르면 닫힙니다</div></div>`;
  render();
}
function hideQR(){ SND.click(); V.ovl=null; render(); }

/* ── 부팅 ── */
load();
render();
window.addEventListener('keydown',e=>{ if(e.key==='Escape'&&V.ovl){ V.ovl=null; render(); } });
</script>
