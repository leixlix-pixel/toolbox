<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>규칙은 완성되지 않는다</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1c2430; --navy:#123a63; --navy2:#1d5b95;
  --red:#c0392b; --gold:#c8963e; --green:#2e7d5b; --plum:#7d4a86;
  --paper:#f6f2e9; --line:#d9d2c4; --muted:#6d6b66;
}

html,body{height:100%;background:#0d1520;font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}

#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;background:var(--paper);overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}

.slide{position:absolute;inset:0;padding:38px 54px;display:none;
  flex-direction:column;background:var(--paper);--acc:var(--plum)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 12% 8%,rgba(200,150,62,.10),transparent 45%),
             radial-gradient(circle at 92% 95%,rgba(125,74,134,.08),transparent 45%)}
.slide>*{position:relative;z-index:1}

.eyebrow{display:inline-block;font-size:21px;font-weight:700;color:#fff;
  background:var(--acc);padding:6px 18px;border-radius:999px;margin-bottom:12px;align-self:flex-start}
h2.stitle{font-size:40px;font-weight:900;color:var(--acc);line-height:1.2;letter-spacing:-.02em;margin-bottom:6px}
h2.stitle.sm{font-size:34px}
.rule{width:92px;height:7px;border-radius:4px;
  background:linear-gradient(90deg,var(--red),var(--gold));margin:10px 0 20px}
p.body{font-size:27px;line-height:1.58;color:var(--ink);font-weight:500}
p.body+p.body{margin-top:12px}
.small{font-size:23px;line-height:1.5}
.tiny{font-size:19px;line-height:1.5}

b.hl{font-weight:900;color:var(--red);background:linear-gradient(transparent 62%,rgba(192,57,43,.20) 62%);padding:0 2px}
b.hn{font-weight:900;color:var(--navy2);background:linear-gradient(transparent 62%,rgba(29,91,149,.18) 62%);padding:0 2px}
b.hg{font-weight:900;color:var(--green);background:linear-gradient(transparent 62%,rgba(46,125,91,.18) 62%);padding:0 2px}
b.hp{font-weight:900;color:var(--plum);background:linear-gradient(transparent 62%,rgba(125,74,134,.18) 62%);padding:0 2px}

.cols{display:flex;gap:30px;flex:1;min-height:0;align-items:center}
.cols.top{align-items:flex-start}
.cols.stretch{align-items:stretch}
.col{flex:1;min-width:0}

.term{background:#fff;border-left:9px solid var(--gold);border-radius:8px;padding:14px 18px;
  box-shadow:0 6px 16px rgba(30,25,15,.10)}
.term+.term{margin-top:14px}
.term .t{font-size:24px;font-weight:900;color:var(--gold);margin-bottom:3px}
.term .d{font-size:22px;font-weight:500;color:var(--ink);line-height:1.5}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;
  box-shadow:0 6px 16px rgba(30,25,15,.09)}
.card h3{font-size:25px;font-weight:900;color:var(--acc);margin-bottom:8px}
.card p{font-size:22px;line-height:1.52;color:var(--ink);font-weight:500}
.card p+p{margin-top:9px}

.act{background:#fff;border:3px dashed var(--navy2);border-radius:18px;padding:20px 24px}
.act-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.act-badge{background:var(--navy2);color:#fff;font-weight:900;font-size:20px;
  padding:5px 15px;border-radius:999px;white-space:nowrap}

.qbox{background:#fff;border:3px solid var(--acc);border-radius:20px;
  padding:26px 32px;box-shadow:0 10px 24px rgba(30,25,15,.12)}
.qbox p{font-size:32px;line-height:1.48;font-weight:700;color:var(--ink)}
.qbox p.mid{font-size:26px}

.rules{display:flex;flex-direction:column;gap:11px}
.rl{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:12px;
  padding:13px 18px;box-shadow:0 5px 13px rgba(30,25,15,.09)}
.rl .n{flex:0 0 34px;height:34px;border-radius:999px;background:var(--acc);color:#fff;
  font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
.rl .tx{font-size:22px;line-height:1.45;font-weight:600;color:var(--ink);padding-top:3px}

.tl{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center}
.tlrow{display:flex;gap:18px;align-items:stretch}
.tlyear{flex:0 0 128px;background:var(--acc);color:#fff;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}
.tltx{flex:1;background:#fff;border-radius:12px;padding:12px 18px;
  box-shadow:0 5px 13px rgba(30,25,15,.09);font-size:21px;line-height:1.45;
  font-weight:600;color:var(--ink);display:flex;align-items:center}

.voices{display:flex;gap:22px;align-items:stretch}
.voices.vert{flex-direction:column}
.voice{flex:1;background:#fff;border-radius:18px;padding:20px 24px;
  box-shadow:0 6px 16px rgba(30,25,15,.10);display:flex;flex-direction:column;gap:10px;justify-content:center}
.voice.a{border:3px solid var(--navy2)}
.voice.b{border:3px solid var(--red)}
.voice .who{font-size:22px;font-weight:900}
.voice.a .who{color:var(--navy2)}
.voice.b .who{color:var(--red)}
.voice .say{font-family:'Gaegu',sans-serif;font-size:30px;line-height:1.36;
  font-weight:700;color:var(--ink)}

/* 사례 4칸 */
.grid4{display:flex;gap:16px;flex:1;align-items:stretch;flex-wrap:wrap}
.gc{flex:1 1 calc(50% - 8px);min-width:0;background:#fff;border-radius:14px;padding:15px 18px;
  box-shadow:0 6px 16px rgba(30,25,15,.10);border-left:8px solid var(--acc);
  display:flex;flex-direction:column;justify-content:center}
.gc .gt{font-size:22px;font-weight:900;color:var(--ink);margin-bottom:5px}
.gc .gd{font-size:19px;font-weight:600;color:var(--muted);line-height:1.42}

.vs{display:flex;gap:22px;flex:1;align-items:stretch}
.way{flex:1;background:#fff;border-radius:20px;padding:22px 24px;
  box-shadow:0 8px 20px rgba(30,25,15,.11);display:flex;flex-direction:column;gap:12px;justify-content:center}
.way.x{border:4px solid var(--red)}
.way.o{border:4px solid var(--green)}
.way .wh{font-size:25px;font-weight:900;line-height:1.3}
.way.x .wh{color:var(--red)}
.way.o .wh{color:var(--green)}
.way .wd{font-size:21px;font-weight:600;color:var(--ink);line-height:1.5}

.cover2{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#5d3566,#7d4a86 70%)}
.cover2 .kicker{color:#f3d79a;font-size:22px;font-weight:700;margin-bottom:16px}
.cover2 h1{color:#fff;font-size:52px;font-weight:900;line-height:1.28}
.cover2 .sub{color:#e6dbea;font-size:24px;font-weight:500;margin-top:18px}

.divider{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#7d4a86,#5d3566 70%)}
.divider .num{color:#f3d79a;font-size:26px;font-weight:900;margin-bottom:10px}
.divider h1{color:#fff;font-size:44px;font-weight:900;line-height:1.3}
.divider .sub{color:#e6dbea;font-size:23px;font-weight:500;margin-top:16px}

.bar{position:fixed;left:0;right:0;bottom:0;height:46px;background:#0f1a29;color:#cfd8e6;
  display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;z-index:50}
.bar button{background:#1d3350;color:#e8eef7;border:0;border-radius:7px;padding:7px 13px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.bar button:hover{background:#2a4a70}
#prog{position:fixed;left:0;top:0;height:4px;background:var(--plum);z-index:60;transition:width .18s}
.zone{position:fixed;top:0;bottom:46px;width:12%;z-index:40;cursor:pointer}
#zl{left:0}#zr{right:0}
</style>
</head>
<body>

<div id="prog"></div>
<div id="stage"></div>
<div class="zone" id="zl"></div>
<div class="zone" id="zr"></div>
<div class="bar">
  <button onclick="go(-1)">◀ 이전</button>
  <button onclick="go(1)">다음 ▶</button>
  <span id="counter">1 / 1</span>
  <span style="margin-left:18px;opacity:.7">← → 이동 · F 전체화면</span>
  <button style="margin-left:auto" onclick="fs()">⛶ 전체화면</button>
</div>

<script>
const IMG = {};
/*IMG_INJECT*/

const SLIDES = [

/* 1. 표지 */
`<section class="slide cover2">
  <div class="kicker">도덕 6. 공동체를 정의롭게! · 3차시 · 96~97쪽</div>
  <h1>규칙은<br>완성되지 않는다</h1>
  <div class="sub">일주일 동안 지켜 보니 어땠나요?</div>
</section>`,

/* 2. 일주일 돌아보기 */
`<section class="slide" style="--acc:var(--red)">
  <span class="eyebrow">먼저 · 교과서 95쪽 표를 펴고</span>
  <h2 class="stitle">지난 일주일에 무슨 일이 있었나</h2>
  <div class="rule"></div>
  <div class="rules" style="flex:1;justify-content:center">
    <div class="rl"><span class="n">1</span><span class="tx">규칙을 <b class="hg">가장 잘 지킨 날</b>은 언제였나? 그날은 왜 잘 됐나?</span></div>
    <div class="rl"><span class="n">2</span><span class="tx">규칙이 <b class="hl">안 지켜진 날</b>은 언제였나? 그날 무슨 일이 있었나?</span></div>
    <div class="rl"><span class="n">3</span><span class="tx">규칙을 지키기가 <b class="hl">유독 어려웠던 사람</b>이 있었나?</span></div>
    <div class="rl"><span class="n">4</span><span class="tx">규칙 때문에 <b class="hl">억울했던 일</b>이 있었나?</span></div>
  </div>
  <p class="body small" style="margin-top:14px;color:var(--muted)">
  3·4번의 답이 오늘 고칠 곳이다.</p>
</section>`,

/* 3. 구분 — 축구 */
`<section class="slide divider">
  <div class="num">1차시에 이어서</div>
  <h1>규칙을 하나로 합친 축구는<br>그 뒤로 편안해졌을까?</h1>
  <div class="sub">1863년에서 오늘까지</div>
</section>`,

/* 4. VAR 연표 */
`<section class="slide" style="--acc:var(--green)">
  <span class="eyebrow">축구 · 판정을 둘러싼 160년</span>
  <h2 class="stitle sm">규칙을 만든 뒤에도 계속 고쳐 왔다</h2>
  <div class="rule"></div>
  <div class="tl">
    <div class="tlrow">
      <div class="tlyear">1863</div>
      <div class="tltx">규칙을 하나로 합쳤다. 그래도 <b class="hl">심판이 잘못 볼 때</b>는 어쩔 수 없었다.</div>
    </div>
    <div class="tlrow">
      <div class="tlyear">2016</div>
      <div class="tltx">영상으로 다시 보는 <b class="hg">VAR</b>을 시험해 보기로 했다.</div>
    </div>
    <div class="tlrow">
      <div class="tlyear">2018</div>
      <div class="tltx">월드컵에서 처음 쓰였다. 그런데 <b class="hl">불만이 사라지지 않았다.</b></div>
    </div>
    <div class="tlrow">
      <div class="tlyear">2022</div>
      <div class="tltx">오프사이드는 아예 <b class="hg">기계가 자동으로</b> 잡아내게 바꿨다.</div>
    </div>
    <div class="tlrow">
      <div class="tlyear">지금</div>
      <div class="tltx">아직도 고치는 중이다. <b class="hp">다음 장에서 무엇을 고치고 있는지 본다.</b></div>
    </div>
  </div>
</section>`,

/* 5. VAR의 남은 문제 */
`<section class="slide" style="--acc:var(--green)">
  <span class="eyebrow">교과서 96쪽이 말한 문제</span>
  <h2 class="stitle sm">영상으로 다시 봐도 불만이 남은 이유</h2>
  <div class="rule"></div>
  <div class="cols stretch">
    <div class="col">
      <div class="card" style="height:100%;display:flex;flex-direction:column;justify-content:center;border-color:var(--red);border-width:3px">
        <h3 style="color:var(--red)">축구의 VAR</h3>
        <p>영상 판독을 요청할 수 있는 사람은 <b class="hl">심판뿐</b>이다.</p>
        <p>심판이 "다시 볼 필요 없다"고 하면
        <b class="hl">잘못 봤는지 확인할 방법이 없다.</b></p>
      </div>
    </div>
    <div class="col">
      <div class="card" style="height:100%;display:flex;flex-direction:column;justify-content:center;border-color:var(--green);border-width:3px">
        <h3 style="color:var(--green)">배구 · 야구는 다르다</h3>
        <p>배구는 <b class="hg">감독</b>이, 야구도 <b class="hg">감독</b>이
        "다시 봐 주세요"를 신청할 수 있다.</p>
        <p>대신 횟수가 정해져 있어서 아무 때나 못 쓴다.</p>
      </div>
    </div>
  </div>
  <p class="body small" style="margin-top:16px">
  같은 문제를 종목마다 <b class="hn">다르게</b> 풀고 있다.</p>
</section>`,

/* 6. FVS */
`<section class="slide" style="--acc:var(--green)">
  <span class="eyebrow">지금 일어나고 있는 일</span>
  <h2 class="stitle sm">축구도 감독이 요청하는 방식을 시험 중이다</h2>
  <div class="rule"></div>
  <div class="cols stretch">
    <div class="col">
      <div class="card" style="height:100%;display:flex;flex-direction:column;justify-content:center">
        <h3>FVS · 감독이 부르는 판독</h3>
        <p>감독이 <b class="hg">손가락을 빙글 돌리고</b> 카드를 내밀면 판독을 요청한다.</p>
        <p>한 경기에 <b class="hn">두 번</b>까지. 틀리면 기회가 줄어든다.</p>
        <p style="margin-top:12px;color:var(--muted);font-size:20px">
        캐나다 프로리그가 2026년부터 이 방식으로 경기한다.</p>
      </div>
    </div>
    <div class="col">
      <div class="qbox" style="border-color:var(--green)">
        <p>교과서에 <b class="hg">"보완 중"</b>이라고 적힌 그 일이<br>
        <b class="hp">지금 진짜로 일어나고 있다.</b></p>
      </div>
    </div>
  </div>
</section>`,

/* 7. 정리 — 규칙은 완성되지 않는다 */
`<section class="slide" style="--acc:var(--green)">
  <span class="eyebrow">그래서</span>
  <h2 class="stitle">규칙은 만들고 끝나는 것이 아니다</h2>
  <div class="rule"></div>
  <div class="cols">
    <div class="col">
      <div class="qbox">
        <p>160년 동안<br>
        <b class="hg">고치고 또 고쳤는데도</b><br>
        아직 고치는 중이다.</p>
      </div>
    </div>
    <div class="col">
      <p class="body">한 번에 완벽한 규칙을 만드는 사람은 없다.</p>
      <p class="body" style="margin-top:14px">
      <b class="hp">고칠 수 있게 열어 두는 것</b>까지가 규칙을 만드는 일이다.</p>
      <p class="body small" style="margin-top:16px;color:var(--muted)">
      우리 반 규칙 1호도 마찬가지다. 일주일 써 보고 오늘 고친다.</p>
    </div>
  </div>
</section>`,

/* 8. 구분 — 똑같이 vs 공정 */
`<section class="slide divider">
  <div class="num">고치기 전에</div>
  <h1>똑같이 적용하는 것이<br>늘 공정할까?</h1>
  <div class="sub">교과서 101쪽 만화를 먼저 읽어 봅시다</div>
</section>`,

/* 9. 아리스토텔레스 */
`<section class="slide" style="--acc:var(--gold)">
  <span class="eyebrow">교과서 101쪽 · 2400년 전의 답</span>
  <h2 class="stitle sm">"같은 경우는 같게, 다른 경우는 다르게"</h2>
  <div class="rule"></div>
  <div class="voices" style="flex:1">
    <div class="voice a">
      <div class="who">이럴 때는 같게</div>
      <div class="say">같은 시간 동안<br>같은 일을 했다면<br>같은 몫을 받는다</div>
    </div>
    <div class="voice b">
      <div class="who">이럴 때는 다르게</div>
      <div class="say">같은 시험을 봤어도<br>결과가 다르면<br>다른 점수를 받는다</div>
    </div>
  </div>
  <div class="term" style="margin-top:18px">
    <div class="t">그러니까</div>
    <div class="d"><b class="hl">똑같이 대하는 것</b>과 <b class="hg">공정하게 대하는 것</b>은
    같은 말이 아니다.</div>
  </div>
</section>`,

/* 10. 우리 주변 사례 */
`<section class="slide" style="--acc:var(--gold)">
  <span class="eyebrow">우리 둘레의 '다르게'</span>
  <h2 class="stitle sm">일부러 다르게 해 두는 규칙들</h2>
  <div class="rule"></div>
  <div class="grid4">
    <div class="gc">
      <div class="gt">급식 대체식</div>
      <div class="gd">우유 알레르기가 있는 아이에게는 다른 것을 준다.
      "다들 우유 먹는데 너만 왜"라고 하지 않는다.</div>
    </div>
    <div class="gc">
      <div class="gt">시험 시간 연장</div>
      <div class="gd">시각장애 학생은 점자를 읽는 데 시간이 더 걸린다.
      그래서 시간을 더 준다.</div>
    </div>
    <div class="gc">
      <div class="gt">장애인 주차 구역</div>
      <div class="gd">문에서 가장 가까운 자리를 비워 둔다.
      먼저 온 사람 순서가 아니다.</div>
    </div>
    <div class="gc">
      <div class="gt">패럴림픽 등급</div>
      <div class="gd">몸 상태가 비슷한 선수끼리 겨루도록 나눈다.
      전부 한 경기에 넣으면 오히려 불공평하다.</div>
    </div>
  </div>
</section>`,

/* 11. 예외를 만들면 규칙이 무너지나 */
`<section class="slide" style="--acc:var(--red)">
  <span class="eyebrow">그럼 이런 걱정이 든다</span>
  <h2 class="stitle sm">"예외를 만들면 규칙이 무너지지 않나요?"</h2>
  <div class="rule"></div>
  <div class="vs">
    <div class="way x">
      <div class="wh">이러면 무너진다</div>
      <div class="wd">그때그때 <b class="hl">봐 준다</b>.<br>

`<section class="slide divider">
  <div class="num">오늘의 한 문장</div>

];

const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.join('');
const slides = [...stage.querySelectorAll('.slide')];
stage.querySelectorAll('img[data-img]').forEach(img => {
  const key = img.getAttribute('data-img');
  if (IMG[key]) img.src = IMG[key];
});

let cur = 0;
function show(i){
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s,n) => s.classList.toggle('on', n === cur));
  document.getElementById('counter').textContent = (cur+1) + ' / ' + slides.length;
  const p = document.getElementById('prog');
  p.style.width = ((cur+1)/slides.length*100) + '%';
  p.style.background = getComputedStyle(slides[cur]).getPropertyValue('--acc');
}
function go(d){ show(cur + d); }

function fit(){
  const s = Math.min(window.innerWidth/1280, (window.innerHeight-46)/720);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
function fs(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener('keydown', e => {
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); go(1); }
  if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(slides.length-1);
  if (e.key === 'f' || e.key === 'F') fs();
});
document.getElementById('zl').onclick = () => go(-1);
document.getElementById('zr').onclick = () => go(1);

let tx=0, ty=0;
document.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('resize', fit);
fit();
show(0);
</script>
</body>
