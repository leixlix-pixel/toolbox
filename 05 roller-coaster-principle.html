<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>롤러코스터에는 엔진이 없다</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1c2430; --navy:#123a63; --navy2:#1d5b95;
  --red:#c0392b; --gold:#c8963e; --green:#2e7d5b; --plum:#7d4a86;
  --paper:#f6f2e9; --line:#d9d2c4; --muted:#6d6b66;
}

html,body{height:100%;background:#0d1520;font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}

#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;background:var(--paper);overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}

.slide{position:absolute;inset:0;padding:40px 54px;display:none;
  flex-direction:column;background:var(--paper);--acc:var(--navy2)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 12% 8%,rgba(29,91,149,.10),transparent 45%),
             radial-gradient(circle at 92% 95%,rgba(200,150,62,.10),transparent 45%)}
.slide>*{position:relative;z-index:1}

.eyebrow{display:inline-block;font-size:21px;font-weight:700;color:#fff;
  background:var(--acc);padding:6px 18px;border-radius:999px;margin-bottom:12px;align-self:flex-start}
h2.stitle{font-size:40px;font-weight:900;color:var(--acc);line-height:1.2;letter-spacing:-.02em;margin-bottom:6px}
h2.stitle.sm{font-size:35px}
.rule{width:92px;height:7px;border-radius:4px;
  background:linear-gradient(90deg,var(--navy2),var(--gold));margin:10px 0 20px}
p.body{font-size:27px;line-height:1.58;color:var(--ink);font-weight:500}
p.body+p.body{margin-top:14px}
.small{font-size:22px;line-height:1.5}
.tiny{font-size:19px;line-height:1.5}

b.hl{font-weight:900;color:var(--red);background:linear-gradient(transparent 62%,rgba(192,57,43,.20) 62%);padding:0 2px}
b.hn{font-weight:900;color:var(--navy2);background:linear-gradient(transparent 62%,rgba(29,91,149,.18) 62%);padding:0 2px}
b.hg{font-weight:900;color:var(--green);background:linear-gradient(transparent 62%,rgba(46,125,91,.18) 62%);padding:0 2px}

.cols{display:flex;gap:30px;flex:1;min-height:0;align-items:center}
.col{flex:1;min-width:0}

.term{background:#fff;border-left:9px solid var(--gold);border-radius:8px;padding:14px 18px;
  box-shadow:0 6px 16px rgba(30,25,15,.10)}
.term+.term{margin-top:14px}
.term .t{font-size:24px;font-weight:900;color:var(--gold);margin-bottom:3px}
.term .d{font-size:22px;font-weight:500;color:var(--ink);line-height:1.5}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  box-shadow:0 6px 16px rgba(30,25,15,.09)}
.card h3{font-size:23px;font-weight:900;color:var(--acc);margin-bottom:8px}
.cardrow{display:flex;gap:16px}
.cardrow>.card{flex:1}

.act{background:#fff;border:3px dashed var(--red);border-radius:18px;padding:20px 24px}
.act-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.act-badge{background:var(--red);color:#fff;font-weight:900;font-size:20px;
  padding:5px 15px;border-radius:999px;white-space:nowrap}
.act-t{font-size:26px;font-weight:900;color:var(--navy)}

.chip{display:inline-block;background:#fff;border:2px solid var(--acc);color:var(--acc);
  font-weight:900;font-size:23px;border-radius:999px;padding:12px 26px;margin:9px 11px 0 0}
.chipwrap{display:flex;flex-wrap:wrap}

.fig{display:flex;justify-content:center;align-items:center;flex:1;min-height:0}
.fig svg{max-width:100%;max-height:100%}
.figcap{font-size:19px;color:var(--muted);text-align:center;font-weight:600;margin-top:6px}

.plan{display:flex;gap:16px;flex:1;min-height:0;align-items:stretch}
.ph{flex:1;background:#fff;border-radius:16px;border:1px solid var(--line);padding:18px 20px;
  box-shadow:0 6px 16px rgba(30,25,15,.09);display:flex;flex-direction:column}
.ph .pn{font-family:'Gaegu',sans-serif;font-size:34px;color:var(--navy2);line-height:1}
.ph .pt{font-size:24px;font-weight:900;color:var(--navy);margin:6px 0 8px}
.ph .pd{font-size:20px;line-height:1.5;color:var(--ink);font-weight:500}

.vs{display:flex;gap:0;flex:1;min-height:0;align-items:stretch;
  background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 6px 16px rgba(30,25,15,.09)}
.vs .vcol{flex:1;padding:16px 20px}
.vs .vcol+.vcol{border-left:2px solid var(--line)}
.vs .vh{font-size:25px;font-weight:900;margin-bottom:10px}
.vs .vi{font-size:22px;line-height:1.5;font-weight:500;color:var(--ink);
  padding:8px 0;border-bottom:1px dashed var(--line)}
.vs .vi:last-child{border-bottom:0}

.tbl{display:grid;grid-template-columns:152px repeat(4,1fr);flex:1;min-height:0;
  background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 6px 16px rgba(30,25,15,.09)}
.tbl>div{padding:10px 13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:19px;line-height:1.38;font-weight:500;display:flex;align-items:center}
.tbl>div:nth-child(5n){border-right:0}
.tbl>div:nth-last-child(-n+5){border-bottom:0}
.tbl .th{background:#eef2f7;font-weight:900;font-size:22px;justify-content:center;color:var(--navy)}
.tbl .rh{background:#faf7f0;font-weight:900;font-size:19px;color:var(--muted)}

.cover2{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#123a63,#1d5b95 70%)}
.cover2 .kicker{color:#ffe9b0;font-size:22px;font-weight:700;margin-bottom:16px}
.cover2 h1{color:#fff;font-size:50px;font-weight:900;line-height:1.28}
.cover2 .sub{color:#d6e4f2;font-size:23px;font-weight:500;margin-top:20px}

.divider{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#1c5a45,#123a63 70%)}
.divider .num{color:#ffe9b0;font-size:26px;font-weight:900;margin-bottom:10px}
.divider h1{color:#fff;font-size:46px;font-weight:900;line-height:1.25}

.bar{position:fixed;left:0;right:0;bottom:0;height:46px;background:#0f1a29;color:#cfd8e6;
  display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;z-index:50}
.bar button{background:#1d3350;color:#e8eef7;border:0;border-radius:7px;padding:7px 13px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#prog{position:fixed;left:0;top:0;height:4px;background:var(--navy2);z-index:60;transition:width .18s}
.zone{position:fixed;top:0;bottom:46px;width:12%;z-index:40;cursor:pointer}
#zl{left:0}#zr{right:0}
</style>
</head>
<body>

<div id="prog"></div>
<div id="stage"></div>
<div class="zone" id="zl"></div>
<div class="zone" id="zr"></div>
<div class="bar">
  <button onclick="go(-1)">◀ 이전</button>
  <button onclick="go(1)">다음 ▶</button>
  <span id="counter">1 / 1</span>
  <span style="margin-left:18px;opacity:.7">← → 이동 · F 전체화면</span>
  <button style="margin-left:auto" onclick="fs()">⛶ 전체화면</button>
</div>

/* ── 슬라이드 ─────────────────────────────────────────── */

const SLIDES = [

/* 1 */

const stage = document.getElementById("stage");
stage.innerHTML = SLIDES.join("");
const slides = [...stage.querySelectorAll(".slide")];

let cur = 0;
function show(i){
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s,n) => s.classList.toggle("on", n === cur));
  document.getElementById("counter").textContent = (cur+1) + " / " + slides.length;
  const p = document.getElementById("prog");
  p.style.width = ((cur+1)/slides.length*100) + "%";
  p.style.background = getComputedStyle(slides[cur]).getPropertyValue("--acc");
}
function go(d){ show(cur + d); }
function fit(){
  const s = Math.min(window.innerWidth/1280, (window.innerHeight-46)/720);
  stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
}
function fs(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
document.addEventListener("keydown", e => {
  if (["ArrowRight","PageDown"," "].includes(e.key)) { e.preventDefault(); go(1); }
  if (["ArrowLeft","PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
  if (e.key === "Home") show(0);
  if (e.key === "End") show(slides.length-1);
  if (e.key === "f" || e.key === "F") fs();
});
document.getElementById("zl").onclick = () => go(-1);
document.getElementById("zr").onclick = () => go(1);
let tx=0, ty=0;
document.addEventListener("touchstart", e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, {passive:true});
window.addEventListener("resize", fit);
fit();
show(0);
</script>
</body>
</html>
