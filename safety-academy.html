<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>119 소방학교 — 불이 나면, 땅이 흔들리면</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1523; --bg2:#121d31; --card:#1a2740; --card2:#243352; --line:#31456d;
  --ink:#eaf1fc; --muted:#93a6c7;
  --red:#ff5a4d; --amber:#ffb224; --green:#3ddc84; --blue:#4da3ff;
}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:'Noto Sans KR',sans-serif; font-size:17px; line-height:1.6;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
  min-height:100vh;
  background:
    radial-gradient(1200px 500px at 50% -10%, #1d2c49 0%, transparent 60%),
    var(--bg);
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
#app{max-width:820px;margin:0 auto;padding:0 14px 40px}

/* ── 머리 ── */
header{
  display:flex;align-items:center;gap:8px;
  padding:12px 2px 10px; position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--bg) 70%,transparent);
}
.brand{font-weight:900;font-size:17px;letter-spacing:-.5px;display:flex;align-items:center;gap:7px}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:bl 1.6s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.hspace{flex:1}
.rankchip{
  font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line);color:var(--amber);
  min-height:32px;display:flex;align-items:center
}
.iconbtn{
  width:38px;height:38px;border-radius:11px;background:var(--card);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px
}

/* ── 공통 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.big{font-size:27px;font-weight:900;line-height:1.3;letter-spacing:-1px}
.sub{color:var(--muted);font-size:15px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--amber);text-transform:uppercase}
.btn{
  display:block;width:100%;min-height:52px;padding:13px 18px;border-radius:14px;
  background:var(--card2);border:1.5px solid var(--line);
  font-weight:500;text-align:left;line-height:1.45;
  transition:transform .08s, border-color .15s, background .15s;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--red);border-color:#ff8a80;color:#fff;font-weight:700;text-align:center}
.btn.go{background:var(--green);border-color:#8ff0bb;color:#07281a;font-weight:700;text-align:center}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;text-align:center;min-height:46px}
.stack{display:flex;flex-direction:column;gap:9px}

/* ── 시작 화면 ── */
.hero{text-align:center;padding:26px 6px 8px}
.hero h1{font-size:34px;font-weight:900;line-height:1.2;letter-spacing:-1.4px;margin:10px 0 8px}
.hero h1 em{font-style:normal;color:var(--red)}
.siren{font-size:56px;line-height:1;filter:drop-shadow(0 0 22px rgba(255,90,77,.55))}
.rankpick{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.rankopt{
  display:flex;align-items:center;gap:13px;width:100%;
  padding:14px 15px;border-radius:15px;background:var(--card);
  border:1.5px solid var(--line);text-align:left
}
.rankopt .ic{font-size:26px;width:34px;text-align:center;flex:none}
.rankopt b{display:block;font-size:17px;font-weight:700}
.rankopt span{display:block;font-size:13.5px;color:var(--muted);line-height:1.45}
.rankopt.sel{border-color:var(--amber);background:#2a2415;box-shadow:0 0 0 3px rgba(255,178,36,.13)}

/* ── QR ── */
.qrwrap{text-align:center;margin-top:26px}
.qrbtn{position:relative;background:#fff;border-radius:14px;padding:9px;line-height:0;border:3px solid var(--card2)}
.qrbtn svg{width:132px;height:132px;display:block}
.qrbadge{
  position:absolute;right:-8px;bottom:-9px;background:var(--amber);color:#2a1c00;
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;line-height:1.5
}
.qrov{position:fixed;inset:0;background:rgba(6,10,18,.93);z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px}
.qrov .in{background:#fff;padding:16px;border-radius:20px;line-height:0}
.qrov svg{width:min(78vw,440px);height:min(78vw,440px);display:block}

/* ── 홈: 출동 준비도 ── */
.readybox{
  display:flex;gap:16px;align-items:center;
  background:linear-gradient(135deg,#16233c,#1d2c49);
  border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:14px
}
.readybox svg{width:104px;height:150px;flex:none}
.readytx{flex:1;min-width:0}
.gauge{height:11px;border-radius:99px;background:#0d1626;overflow:hidden;margin:9px 0 7px;border:1px solid var(--line)}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--red));border-radius:99px;transition:width .5s}
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{
  display:flex;align-items:center;gap:13px;width:100%;
  padding:14px 15px;border-radius:16px;background:var(--card);
  border:1.5px solid var(--line);text-align:left
}
.mrow .num{
  width:34px;height:34px;border-radius:11px;flex:none;
  background:var(--card2);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;color:var(--muted)
}
.mrow .tx{flex:1;min-width:0}
.mrow .tx b{display:block;font-size:17px;font-weight:700}
.mrow .tx span{display:block;font-size:13.5px;color:var(--muted)}
.mrow .st{font-size:22px;flex:none}
.mrow.ok{border-color:#2f6b4c;background:#16281f}
.mrow.ok .num{background:var(--green);color:#07281a}

/* ── 미션 화면 ── */
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead .back{font-size:15px;color:var(--muted);padding:8px 10px;margin-left:-10px}
.mhead .ttl{font-weight:900;font-size:19px;letter-spacing:-.6px}
.steps{display:flex;gap:5px;margin-bottom:14px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--card2)}
.steps i.on{background:var(--amber)}
.steps i.done{background:var(--green)}
.scene{
  background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--amber);
  border-radius:0 14px 14px 0;padding:13px 15px;margin-bottom:14px;
  font-size:16px;color:#cfdcf2;line-height:1.55
}
.scene b{color:var(--amber);font-weight:700}
.qq{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:13px;letter-spacing:-.5px}
.opt{position:relative;padding-left:46px}
.opt .mk{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:23px;height:23px;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)
}
.opt.bad{border-color:#7a3b36;background:#2a1a18;opacity:.75}
.opt.bad .mk{border-color:var(--red);color:var(--red)}
.opt.good{border-color:#2f6b4c;background:#16281f}
.opt.good .mk{border-color:var(--green);color:var(--green);background:var(--green);color:#07281a}
.fb{
  border-radius:14px;padding:14px 16px;margin-top:12px;font-size:16px;line-height:1.6;
  animation:pop .22s ease-out
}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.fb.bad{background:#2a1a18;border:1px solid #7a3b36}
.fb.good{background:#16281f;border:1px solid #2f6b4c}
.fb .lead{font-weight:700;display:block;margin-bottom:3px}
.fb.bad .lead{color:var(--red)}
.fb.good .lead{color:var(--green)}
.fb b{color:#fff}

/* 순서 맞히기 */
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.slot{
  display:flex;align-items:center;gap:11px;min-height:50px;padding:10px 14px;
  border-radius:13px;border:1.5px dashed var(--line);background:#0f1a2c;color:var(--muted);font-size:15px
}
.slot.f{border-style:solid;background:var(--card2);color:var(--ink);font-weight:500}
.slot .n{width:24px;height:24px;border-radius:50%;background:var(--card2);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.slot.f .n{background:var(--amber);color:#2a1c00}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:11px 15px;border-radius:13px;background:var(--card2);
  border:1.5px solid var(--line);font-size:15px;font-weight:500;min-height:46px
}
.chip.used{opacity:.25}

/* 위험 찾기 */
.findwrap{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px}
.findwrap svg{width:100%;height:auto;display:block}
.hot{cursor:pointer;pointer-events:all}
.hot rect{fill:transparent}
.hot.found rect{fill:rgba(61,220,132,.16);stroke:var(--green);stroke-width:2.5;rx:8}
.hot.miss rect{fill:rgba(77,163,255,.12);stroke:var(--blue);stroke-width:2;rx:8}
.aura{animation:au 1.9s infinite}
@keyframes au{0%,100%{opacity:.18}50%{opacity:.55}}
.findcount{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.findcount i{width:26px;height:8px;border-radius:99px;background:var(--card2)}
.findcount i.on{background:var(--green)}

/* 분류 */
.sortcard{
  background:linear-gradient(135deg,#1e2d4a,#16223a);border:1.5px solid var(--line);
  border-radius:18px;padding:22px 18px;text-align:center;font-size:19px;font-weight:700;
  line-height:1.45;min-height:120px;display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;letter-spacing:-.4px
}
.sortbtns{display:flex;gap:10px}
.sortbtns .btn{text-align:center;min-height:76px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-weight:700}
.sortbtns .btn small{font-size:12.5px;font-weight:400;color:var(--muted)}
.sortbtns .btn.fire{background:#2e1a16;border-color:#7a3b36}
.sortbtns .btn.quake{background:#1a2438;border-color:#3d5480}
.sortprog{display:flex;gap:5px;justify-content:center;margin-bottom:12px}
.sortprog i{width:22px;height:6px;border-radius:99px;background:var(--card2)}
.sortprog i.on{background:var(--amber)}

/* 정리 */
.wrapup{background:linear-gradient(135deg,#1d2c49,#16233c);border:1px solid var(--line);border-radius:18px;padding:20px}
.wrapup h3{font-size:20px;font-weight:900;margin-bottom:10px;letter-spacing:-.5px}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border:none}
.rule .ic{font-size:26px;flex:none;width:32px;text-align:center}
.rule .tx{flex:1;font-size:16px;line-height:1.55}
.rule .tx b{color:var(--amber)}

/* 흔들림 */
.shake{animation:sh .42s infinite}
@keyframes sh{
  0%{transform:translate(0,0)}15%{transform:translate(-5px,2px)}30%{transform:translate(4px,-3px)}
  45%{transform:translate(-4px,-2px)}60%{transform:translate(5px,3px)}75%{transform:translate(-3px,2px)}100%{transform:translate(0,0)}
}
.smoke{
  position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  background:linear-gradient(180deg,rgba(60,58,56,.92),rgba(70,68,66,.6) 70%,transparent);
  transition:height .6s
}
.countdown{font-size:46px;font-weight:900;text-align:center;color:var(--red);letter-spacing:2px;margin:6px 0 10px;
  text-shadow:0 0 26px rgba(255,90,77,.6)}

/* 수료증 */
.certwrap{text-align:center}
.certwrap canvas{width:100%;max-width:560px;border-radius:14px;border:1px solid var(--line);margin:12px 0}
.nameinput{
  width:100%;min-height:52px;padding:13px 16px;border-radius:14px;background:var(--card2);
  border:1.5px solid var(--line);color:var(--ink);font-family:inherit;font-size:17px;text-align:center
}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:#0a1220;border:1px solid var(--line);border-radius:999px;
  padding:11px 20px;font-size:15px;z-index:95;box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:pop .2s
}
.note{font-size:13.5px;color:var(--muted);line-height:1.55;text-align:center;margin-top:14px}
.teach{
  border:1px dashed var(--line);border-radius:14px;padding:13px 15px;margin-top:16px;
  font-size:13.5px;color:var(--muted);line-height:1.6
}
.teach b{color:var(--amber)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot"></span>119 소방학교</div>
    <div class="hspace"></div>
    <button class="rankchip" id="rankBtn" onclick="pickRank()"></button>
    <button class="iconbtn" id="sndBtn" onclick="toggleSnd()">🔊</button>
    <button class="iconbtn" onclick="resetAll()">↺</button>
  </header>
  <main id="view"></main>
</div>

<script>
/* ═══════════════════════════════════════════════
   119 소방학교 — 3~6학년 공통 재난 대피 훈련
   미션 6개를 통과하면 출동 장비가 하나씩 채워진다.
   ═══════════════════════════════════════════════ */

const QR = { main:'' };/*QR_INJECT*/

/* ── 소리: 파일 없이 Web Audio ── */
const SND = {
  ctx:null, vol:.55,
  init(){ if(this.ctx) return; try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  tone(f,dur,type,vol,delay,slide){
    if(!this.ctx||this.vol<=0) return;
    const t0=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t0+dur);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime((vol==null?.16:vol)*this.vol,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0+dur+.05);
  },
  noise(dur,vol,delay,freq){
    if(!this.ctx||this.vol<=0) return;
    const t0=this.ctx.currentTime+(delay||0);
    const len=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const g=this.ctx.createGain(); g.gain.value=(vol==null?.12:vol)*this.vol;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start(t0);
  },
  click(){ this.tone(680,.06,'square',.10); },
  ok(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.16,'triangle',.15,i*.075)); },
  bad(){ this.tone(220,.22,'sawtooth',.13,0,110); this.tone(160,.26,'square',.08,.06,90); },
  get(){ [784,1047,1319].forEach((f,i)=>this.tone(f,.14,'sine',.18,i*.06)); },
  siren(){ for(let i=0;i<3;i++){ this.tone(740,.28,'sine',.13,i*.56,1040); this.tone(1040,.28,'sine',.13,i*.56+.28,740); } },
  bell(){ for(let i=0;i<6;i++) this.tone(2200,.09,'square',.08,i*.14); },
  rumble(){ this.noise(1.6,.20,0,180); this.tone(48,1.5,'sine',.22,0,36); },
  spray(){ this.noise(.9,.16,0,2400); },
  fanfare(){ [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.26,'triangle',.17,i*.11)); }
};

/* ── 상태 ── */
const KEY='safety-academy-v1';
let S = { rank:null, done:{}, name:'', sound:true };
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){}
  SND.vol = S.sound===false ? 0 : .55;
}

/* 계급: 1=훈련생 2=대원 3=대장 — step.lv 가 이 값보다 크면 건너뛴다 */
const RANKS = {
  train:{ lv:1, name:'훈련생', ic:'🧢', desc:'기본 훈련만 합니다. 처음이라면 여기부터.' },
  crew :{ lv:2, name:'대원',   ic:'⛑️', desc:'기본 훈련에 되물음이 하나씩 더 붙습니다.' },
  chief:{ lv:3, name:'대장',   ic:'🎖️', desc:'심화 판단까지 전부. 어려운 쪽을 원한다면.' }
};
function lv(){ return S.rank ? RANKS[S.rank].lv : 1; }

/* ═══════════ 훈련 과목 ═══════════ */
const MISSIONS = [
{ id:'m1', gear:'radio', ic:'📞', title:'신고 훈련',   sum:'119에 무엇부터 말하나',
  intro:'3층 복도에서 매캐한 냄새가 난다. 연기도 조금 보인다.',
  steps:[
  { scene:'복도 끝에서 <b>매캐한 냄새</b>가 난다. 천장 쪽으로 옅은 연기가 보인다.',
    q:'가장 먼저 할 일은?',
    opts:[
      {t:'큰 소리로 "불이야!" 외치고 비상벨을 누른다', ok:true,
       fb:'맞아. 알리는 것이 먼저야. 한 번 외치면 <b>이 층 전체가 동시에</b> 알게 돼. 비상벨은 다른 층까지 알려 주고.'},
      {t:'혼자 조용히 119에 전화한다',
       fb:'신고는 꼭 필요해. 그런데 <b>너만 알고 있는 동안</b> 옆 반은 아무것도 모른 채 수업을 하고 있어. 먼저 알리고, 신고는 바로 이어서 하면 돼.'},
      {t:'선생님을 찾으러 교실을 돌아다닌다',
       fb:'찾아다니는 동안 연기가 퍼져. 그리고 <b>연기가 있는 쪽으로 다시 가는 것</b>이 돼. 소리치면 선생님도 같이 들어.'}
    ]},
  { scene:'📞 <b>"119입니다. 위치가 어디죠?"</b>',
    q:'뭐라고 답할까?',
    opts:[
      {t:'"신리초등학교 3층 복도예요"', ok:true,
       fb:'정확해. <b>이름과 층</b>까지 말하면 소방차가 바로 출발할 수 있어. 위치는 늘 첫 번째로 말한다.'},
      {t:'"학교에 불이 났어요!"',
       fb:'학교는 전국에 <b>만 곳이 넘어</b>. 어느 학교인지 모르면 차가 출발을 못 해. 학교 이름을 꼭 말해야 해.'},
      {t:'"빨리 와주세요! 큰일 났어요!"',
       fb:'급한 마음은 알아. 그런데 <b>어디로 갈지</b>를 모르면 아무리 빨라도 못 와. 장소가 언제나 먼저야.'}
    ]},
  { scene:'📞 <b>"무슨 일이 있나요?"</b>',
    q:'본 대로 말해 보자.',

function openM(id){ SND.init(); SND.click(); V.screen='mission'; V.mid=id; V.si=0; V.wrap=false; resetStep(); render(); afterRender(); }
function resetStep(){ V.picked=null; V.ans=null; V.order=[]; V.found=[]; V.sortI=0; V.sortAns=null; }

/* ── 미션 ── */
function viewMission(){
  const m = MISSIONS.find(x=>x.id===V.mid);
  const ss = steps(m);
  if(V.wrap) return viewWrap(m);
  const st = ss[V.si];
  let body='';
  if(st.type==='order') body = bodyOrder(st);
  else if(st.type==='find') body = bodyFind(st);
  else if(st.type==='sort') body = bodySort(st);
  else body = bodyChoice(st);
  return `
  <div class="mhead">
    <button class="back" onclick="home()">‹ 상황실</button>
    <div class="ttl">${m.ic} ${m.title}</div>
  </div>
  <div class="steps">${ss.map((s,i)=>`<i class="${i<V.si?'done':i===V.si?'on':''}"></i>`).join('')}</div>
  ${body}`;
}
function home(){ SND.click(); V.screen='home'; V.wrap=false; render(); }

/* 선택형 */
function bodyChoice(st){
  const os = opts(st);
  const chosen = V.picked!=null ? os[V.picked] : null;
  return `
  ${st.scene?`<div class="scene">${st.scene}</div>`:''}
  ${st.count && V.picked==null ? `<div class="countdown" id="cd">3</div>`:''}
  ${st.q?`<div class="qq">${st.q}</div>`:''}
  <div class="stack">
    ${os.map((o,i)=>{
      let cls='btn opt';
      if(V.picked===i) cls += o.ok?' good':' bad';
      return `<button class="${cls}" onclick="pick(${i})">
        <span class="mk">${V.picked===i?(o.ok?'✓':'✕'):String.fromCharCode(9312+i)}</span>${esc(o.t)}</button>`;
    }).join('')}
  </div>
  ${chosen?`<div class="fb ${chosen.ok?'good':'bad'}">
      <span class="lead">${chosen.ok?'맞았어':'다시 생각해 보자'}</span>${chosen.fb}
      ${chosen.ok?`<button class="btn go" style="margin-top:12px" onclick="next()">다 읽었어 · 다음</button>`
                 :`<button class="btn ghost" style="margin-top:10px" onclick="again()">다시 고르기</button>`}
    </div>`:''}`;
}
function pick(i){
  const m = MISSIONS.find(x=>x.id===V.mid), st = steps(m)[V.si], o = opts(st)[i];
  SND.init(); V.picked=i;
  if(o.ok) SND.ok(); else SND.bad();
  if(V.ticking){ clearInterval(V.ticking); V.ticking=null; }
  render();
  if(!o.ok && m.shake) doShake(700);
}
function again(){ SND.click(); V.picked=null; render(); if(MISSIONS.find(x=>x.id===V.mid).shake) startCount(); }
function next(){
  const m = MISSIONS.find(x=>x.id===V.mid), ss = steps(m);
  SND.click();
  if(V.si < ss.length-1){ V.si++; resetStep(); render(); afterRender(); }
  else { V.wrap=true; SND.get(); render(); }
}

  const filled = V.order.length===st.items.length;
  return `

      <span class="lead">${V.ans.ok?'맞았어':'순서가 달라'}</span>${V.ans.msg}

                :`<button class="btn ghost" style="margin-top:10px" onclick="clearOrder()">다시 해 보기</button>`}

}
function putOrder(i){
  const m = MISSIONS.find(x=>x.id===V.mid), st = steps(m)[V.si];
  if(V.ans) return;
  SND.init(); SND.click();
  const pos = V.order.length;
  V.order.push(i);
  if(i!==pos){
    SND.bad();
    V.ans = { ok:false, msg:`<b>${pos+1}번째</b>에는 「${esc(st.items[pos])}」가 와야 해.<br>${st.hints[pos]}` };
  } else if(V.order.length===st.items.length){
    SND.ok(); SND.spray();
    V.ans = { ok:true, msg:st.okfb };
  }
  render();
}
function clearOrder(){ SND.click(); V.order=[]; V.ans=null; render(); }

}

function findHit(id,kind){
  if(V.found.includes(id)) return;
  SND.init();
  const list = kind==='d'?FIND.danger:FIND.safe;
  const o = list.find(x=>x.id===id);
  V.found.push(id);
  if(kind==='d'){ SND.bad(); } else { SND.click(); }
  V.ans = { ok:kind==='d', label:o.label, fb:o.fb };
  const found = V.found.filter(x=>FIND.danger.some(d=>d.id===x));
  if(found.length>=5) SND.ok();
  render();
}

/* 분류형 */
function bodySort(st){
  const cs = cards(st);
  const c = cs[V.sortI];
  if(!c) return '';
  const a = V.sortAns;
  return `
  ${st.scene?`<div class="scene">${st.scene}</div>`:''}
  <div class="sortprog">${cs.map((_,i)=>`<i class="${i<V.sortI?'on':''}"></i>`).join('')}</div>
  <div class="sortcard">${esc(c.t)}</div>
  ${a?`<div class="fb ${a.ok?'good':'bad'}">
      <span class="lead">${a.ok?'맞았어':'다시 생각해 보자'}</span>${a.ok?c.fb:c.bad}
      <button class="btn ${a.ok?'go':'ghost'}" style="margin-top:12px" onclick="${a.ok?'sortNext()':'sortAgain()'}">${a.ok?'다 읽었어 · 다음 상황':'다시 고르기'}</button>
    </div>`:`
  <div class="sortbtns">
    <button class="btn fire" onclick="sortPick('fire')">🏃 지금 나간다<small>불 · 연기</small></button>
    <button class="btn quake" onclick="sortPick('quake')">🛡️ 먼저 숨는다<small>흔들림</small></button>
  </div>`}`;
}
function sortPick(v){
  const m = MISSIONS.find(x=>x.id===V.mid), st = steps(m)[V.si], c = cards(st)[V.sortI];
  SND.init();
  const ok = c.a===v;
  V.sortAns = { ok };
  if(ok) SND.ok(); else SND.bad();
  render();
}
function sortAgain(){ SND.click(); V.sortAns=null; render(); }
function sortNext(){
  const m = MISSIONS.find(x=>x.id===V.mid), st = steps(m)[V.si], cs = cards(st);
  SND.click(); V.sortAns=null;
  if(V.sortI < cs.length-1){ V.sortI++; render(); }
  else next();
}

/* 정리 */
function viewWrap(m){
  const first = !S.done[m.id];
  return `
  <div class="mhead"><div class="ttl">${m.ic} ${m.title} — 정리</div></div>
  <div class="wrapup">
    <h3>${m.wrap.title}</h3>
    ${m.wrap.rules.map(r=>`<div class="rule"><span class="ic">${r[0]}</span><span class="tx">${r[1]}</span></div>`).join('')}
  </div>
  <button class="btn go" style="margin-top:16px" onclick="finishM()">
    ${first?'✓ 훈련 완료 · 장비 받기':'상황실로 돌아가기'}
  </button>`;
}
function finishM(){
  const m = MISSIONS.find(x=>x.id===V.mid);
  const first = !S.done[m.id];
  S.done[m.id]=true; save();
  if(first){ SND.get(); toast('장비를 받았다 — 출동 준비도 ' + doneCount() + '/' + MISSIONS.length); }
  else SND.click();
  V.screen='home'; V.wrap=false; render();
  if(doneCount()===MISSIONS.length && first) setTimeout(()=>SND.fanfare(), 700);
}

/* ── 연출 ── */
function afterRender(){
  const m = MISSIONS.find(x=>x.id===V.mid);
  if(!m) return;
  const st = steps(m)[V.si];
  if(m.smoke) setSmoke((V.si+1)/steps(m).length);
  if(st && st.count) startCount();
}
function startCount(){
  const el = $('cd'); if(!el) return;
  let n = 3; el.textContent = n;
  SND.rumble(); doShake(3400);
  if(V.ticking) clearInterval(V.ticking);
  V.ticking = setInterval(()=>{
    n--; const e=$('cd'); if(!e){ clearInterval(V.ticking); V.ticking=null; return; }
    if(n<=0){ e.textContent='지금!'; e.style.fontSize='34px'; clearInterval(V.ticking); V.ticking=null; }
    else { e.textContent=n; SND.tone(300,.1,'square',.1); }
  },1000);
}
function doShake(ms){
  const a=$('app'); if(!a) return;
  a.classList.add('shake');
  setTimeout(()=>a.classList.remove('shake'), ms||600);
}
function clearShake(){ const a=$('app'); if(a) a.classList.remove('shake'); }
function setSmoke(p){
  let el = document.querySelector('.smoke');
  if(!el){ el=document.createElement('div'); el.className='smoke'; document.body.appendChild(el); }
  el.style.height = Math.round(14 + p*30) + 'vh';
}
function clearSmoke(){
  const m = MISSIONS.find(x=>x.id===V.mid);
  if(V.screen!=='mission' || !m || !m.smoke || V.wrap){
    const el=document.querySelector('.smoke'); if(el) el.remove();
  }
}

/* ── 수료증 ── */
function goCert(){ SND.click(); SND.fanfare(); V.screen='cert'; render(); }
function viewCert(){
  return `
  <div class="mhead"><button class="back" onclick="home()">‹ 상황실</button><div class="ttl">🎖️ 수료증</div></div>
  <div class="certwrap">
    <input class="nameinput" id="nm" placeholder="이름을 적어 주세요" value="${esc(S.name||'')}"
      oninput="S.name=this.value;save();drawCert()" maxlength="12">
    <canvas id="cv" width="1000" height="700"></canvas>
    <div class="stack">
      <button class="btn go" onclick="saveCert()">📥 이미지로 저장하기</button>
      <button class="btn ghost" onclick="home()">상황실로</button>
    </div>
    <div class="note">저장한 그림은 사진첩에 들어갑니다.<br>태블릿을 돌려 쓴다면 <b>다음 친구가 쓰기 전에</b> 저장해 두세요.</div>
  </div>`;
}
function drawCert(){
  const cv = $('cv'); if(!cv) return;
  const x = cv.getContext('2d'), W=1000, H=700;
  const g = x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#14203a'); g.addColorStop(1,'#0d1523');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.strokeStyle='#ffb224'; x.lineWidth=5; x.strokeRect(26,26,W-52,H-52);
  x.strokeStyle='#31456d'; x.lineWidth=2; x.strokeRect(42,42,W-84,H-84);
  x.textAlign='center';
  x.fillStyle='#ffb224'; x.font='700 22px "Noto Sans KR",sans-serif';
  x.fillText('1 1 9   소 방 학 교', W/2, 108);
  x.fillStyle='#eaf1fc'; x.font='900 54px "Noto Sans KR",sans-serif';
  x.fillText('훈 련 수 료 증', W/2, 176);
  x.strokeStyle='#ffb224'; x.lineWidth=3; x.beginPath(); x.moveTo(W/2-90,198); x.lineTo(W/2+90,198); x.stroke();

  const nm = (S.name||'').trim() || '○ ○ ○';
  x.fillStyle='#fff'; x.font='900 62px "Noto Sans KR",sans-serif';
  x.fillText(nm, W/2, 288);
  const r = RANKS[S.rank] || RANKS.train;
  x.fillStyle='#ffb224'; x.font='700 26px "Noto Sans KR",sans-serif';
  x.fillText(r.ic + '  ' + r.name + ' 과정', W/2, 330);

  x.fillStyle='#cfdcf2'; x.font='400 25px "Noto Sans KR",sans-serif';
  x.fillText('위 사람은 119 소방학교의 훈련 여섯 과정을', W/2, 396);
  x.fillText('모두 마쳤으므로 이 증서를 줍니다.', W/2, 434);

  x.fillStyle='#0f1a2c'; roundRect(x,120,470,760,112,16); x.fill();
  x.strokeStyle='#31456d'; x.lineWidth=2; roundRect(x,120,470,760,112,16); x.stroke();
  x.fillStyle='#ff8a80'; x.font='700 27px "Noto Sans KR",sans-serif'; x.textAlign='left';
  x.fillText('🔥  연기가 보이면 —  지금 나간다', 156, 512);
  x.fillStyle='#8fc4ff';
  x.fillText('🌏  흔들리면 —  먼저 숨는다', 156, 556);

  x.textAlign='center'; x.fillStyle='#93a6c7'; x.font='400 21px "Noto Sans KR",sans-serif';
  const d = new Date();
  x.fillText(d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일', W/2, 622);
  x.fillStyle='#eaf1fc'; x.font='700 25px "Noto Sans KR",sans-serif';
  x.fillText('1 1 9   소 방 학 교 장', W/2, 662);
}
function roundRect(x,rx,ry,w,h,r){
  x.beginPath(); x.moveTo(rx+r,ry);
  x.arcTo(rx+w,ry,rx+w,ry+h,r); x.arcTo(rx+w,ry+h,rx,ry+h,r);
  x.arcTo(rx,ry+h,rx,ry,r); x.arcTo(rx,ry,rx+w,ry,r); x.closePath();
}
function saveCert(){
  const cv=$('cv'); if(!cv) return;
  SND.ok();
  try{
    const a=document.createElement('a');
    a.download='119소방학교_수료증.png'; a.href=cv.toDataURL('image/png'); a.click();
    toast('사진첩에 저장했어요');
  }catch(e){ toast('저장이 막혀 있어요. 화면을 캡처해 주세요'); }
}

/* ── 잡다 ── */
function toast(t){
  const old=document.querySelector('.toast'); if(old) old.remove();
  const d=document.createElement('div'); d.className='toast'; d.textContent=t;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2600);
}
function toggleSnd(){
  S.sound = S.sound===false;
  SND.vol = S.sound?.55:0; save();
  $('sndBtn').textContent = S.sound?'🔊':'🔇';
  if(S.sound){ SND.init(); SND.click(); }
}
let resetArm=false;
function resetAll(){
  if(!resetArm){ resetArm=true; toast('한 번 더 누르면 처음부터 다시 시작합니다'); setTimeout(()=>resetArm=false,3200); return; }
  resetArm=false;
  S={ rank:null, done:{}, name:'', sound:S.sound };
  save(); V={ screen:'intro', mid:null, si:0, picked:null, ans:null, order:[], found:[], sortI:0, sortAns:null, wrap:false, ticking:null };
  render(); toast('처음으로 되돌렸습니다');
}
function showQR(){
  if(!QR.main) return;
  SND.click();
  const d=document.createElement('div'); d.className='qrov';
  d.innerHTML=`<div class="in">${QR.main}</div><div style="color:var(--muted);font-size:14px">화면을 누르면 닫힙니다</div>`;
  d.onclick=()=>d.remove();
  document.body.appendChild(d);
  const k=e=>{ if(e.key==='Escape'){ d.remove(); document.removeEventListener('keydown',k); } };
  document.addEventListener('keydown',k);
}

load();
render();
afterRender();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(V.screen==='cert') drawCert(); });
</script>
</body>
</html>
