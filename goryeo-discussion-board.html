<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고려 토의 진행판</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#0e2129; --bg2:#0a1920; --panel:#163039; --panel2:#1d3d48;
  --line:#2c5261; --ink:#e9f3f5; --dim:#8fb0ba;
  --acc:#4fc0a8; --gold:#f0c766; --red:#ef7f6e; --blue:#79b8e0;
}
html,body{height:100%;margin:0}
body{
  font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--ink);
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  overflow:hidden; user-select:none;
}
button{font-family:inherit; cursor:pointer; border:0}
#app{height:100%; display:flex; flex-direction:column}

/* ───── 홈 ───── */
.home{height:100%; overflow-y:auto; padding:clamp(20px,3vw,44px)}
.home h1{
  font-size:clamp(24px,3.4vw,40px); font-weight:900; margin:0 0 6px; letter-spacing:-1px;
}
.home .sub{color:var(--dim); font-size:clamp(13px,1.4vw,17px); margin:0 0 clamp(18px,2.5vw,32px); line-height:1.6}
.home .sub b{color:var(--gold)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:clamp(11px,1.3vw,18px)}
.card{
  background:var(--panel); border:2px solid var(--line); border-radius:14px;
  padding:clamp(14px,1.6vw,20px); text-align:left; color:var(--ink); display:flex; gap:13px;
  align-items:flex-start; transition:background .12s,border-color .12s;
}
.card:active{background:var(--panel2)}
.card .cn{
  flex:0 0 auto; width:38px; height:38px; border-radius:10px; background:var(--acc); color:#07222a;
  font-size:21px; font-weight:900; display:flex; align-items:center; justify-content:center;
}
.card .ct{flex:1; min-width:0}
.card .cu{font-size:11.5px; color:var(--acc); font-weight:700; margin-bottom:3px; letter-spacing:.4px}
.card .cttl{font-size:clamp(15px,1.6vw,19px); font-weight:700; line-height:1.3; letter-spacing:-.4px}
.card .cq{font-size:12.5px; color:var(--dim); margin-top:6px; line-height:1.45}
.star{display:inline-block; background:var(--gold); color:#2c1f00; font-size:10px; font-weight:900;
      padding:2px 7px; border-radius:20px; margin-left:6px; vertical-align:2px}

/* ───── 머리 ───── */
.bar{
  flex:0 0 auto; display:flex; align-items:center; gap:clamp(8px,1.2vw,16px);
  padding:clamp(8px,1vw,14px) clamp(12px,1.6vw,22px); background:var(--bg2); border-bottom:1px solid var(--line);
}
.hbtn{
  background:var(--panel); color:var(--ink); border-radius:9px; padding:9px 13px;
  font-size:13px; font-weight:700; min-height:40px; white-space:nowrap;
}
.hbtn:active{background:var(--panel2)}
.btitle{flex:1; min-width:0; overflow:hidden}
.btitle .bu{font-size:11px; color:var(--acc); font-weight:700; letter-spacing:.5px}
.btitle .bt{font-size:clamp(15px,1.8vw,22px); font-weight:900; letter-spacing:-.5px; white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis}

.steps{display:flex; gap:5px; flex-wrap:nowrap}
.sbtn{
  background:var(--panel); color:var(--dim); border-radius:8px; padding:7px 11px;
  font-size:12px; font-weight:700; min-height:38px; white-space:nowrap; border:1.5px solid transparent;
}
.sbtn.on{background:var(--acc); color:#07222a; border-color:var(--acc)}
.sbtn.done{color:var(--ink); border-color:var(--line)}

/* ───── 본문 ───── */
.main{flex:1; min-height:0; display:flex; gap:clamp(10px,1.3vw,18px); padding:clamp(10px,1.4vw,20px)}
.left{flex:1; min-width:0; display:flex; flex-direction:column; gap:clamp(8px,1.1vw,14px); overflow-y:auto}
.right{
  flex:0 0 clamp(220px,25vw,330px); display:flex; flex-direction:column; gap:clamp(8px,1.1vw,14px); min-height:0;
}

.situ{
  background:#1a2f27; border-left:5px solid var(--gold); border-radius:0 11px 11px 0;
  padding:clamp(12px,1.5vw,20px); font-size:clamp(15px,1.75vw,25px); line-height:1.6; flex:0 0 auto;
}
.situ b{color:var(--gold); font-weight:700}
.ask{
  font-size:clamp(20px,3vw,42px); font-weight:900; line-height:1.34; letter-spacing:-1px;
  color:#fff; flex:0 0 auto;
}
.opts{display:flex; flex-wrap:wrap; gap:9px; flex:0 0 auto}
.opt{
  background:var(--panel); border:2px solid var(--line); border-radius:30px;
  padding:clamp(7px,.9vw,12px) clamp(13px,1.5vw,22px); font-size:clamp(13px,1.5vw,20px); font-weight:700;
}
.note{
  background:var(--panel); border-radius:11px; padding:clamp(11px,1.4vw,18px);
  font-size:clamp(13px,1.5vw,20px); line-height:1.6; flex:0 0 auto;
}
.note b{color:var(--acc)}

/* 교과서 단계 */
.pg{display:flex; align-items:baseline; gap:12px; flex:0 0 auto}
.pg .big{font-size:clamp(30px,4.6vw,66px); font-weight:900; color:var(--gold); letter-spacing:-2px; line-height:1}
.pg .lab{font-size:clamp(13px,1.5vw,20px); color:var(--dim)}
.clist{display:flex; flex-direction:column; gap:7px; flex:0 0 auto}
.cit{
  background:var(--panel); border-radius:9px; padding:clamp(9px,1.1vw,15px) clamp(11px,1.3vw,18px);
  font-size:clamp(13px,1.5vw,21px); display:flex; gap:11px; align-items:baseline; line-height:1.45;
}
.cit i{color:var(--acc); font-style:normal; font-weight:900; flex:0 0 auto}
.cit em{margin-left:auto; color:var(--dim); font-style:normal; font-size:.82em; flex:0 0 auto}

/* ───── 타이머 ───── */
.tbox{
  background:var(--panel); border-radius:13px; padding:clamp(10px,1.3vw,17px); flex:0 0 auto;
  border:2px solid var(--line);
}
.tbox.run{border-color:var(--acc)}
.tbox.over{border-color:var(--red); animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{background:var(--panel)}50%{background:#3a2020}}
.tlab{font-size:12px; color:var(--dim); font-weight:700; text-align:center; margin-bottom:2px}
.tnum{
  font-size:clamp(40px,7.5vw,104px); font-weight:900; text-align:center; line-height:1;
  letter-spacing:-3px; font-variant-numeric:tabular-nums;
}
.tnum.warn{color:var(--gold)}
.tnum.over{color:var(--red)}
.tbtns{display:flex; gap:6px; margin-top:10px}
.tbtns button{
  flex:1; background:var(--panel2); color:var(--ink); border-radius:8px; padding:10px 4px;
  font-size:13px; font-weight:700; min-height:44px;
}
.tbtns button.go{background:var(--acc); color:#07222a}
.tbtns button:active{opacity:.75}

/* 교사 노트 */
.tbox.solo{flex:1; display:flex; flex-direction:column; justify-content:center}
.ntoggle{
  flex:0 0 auto; background:#23402c; color:#bfe6cb; border:2px solid #2f5138; border-radius:11px;
  padding:12px; font-size:13.5px; font-weight:700; min-height:48px;
}
.ntoggle:active{background:#2c5137}
.ntoggle small{display:block; color:#7fa88c; font-weight:500; font-size:11px; margin-top:2px}
.tn{
  flex:1; min-height:0; overflow-y:auto; background:#1b2a1e; border:2px solid #2f5138;
  border-radius:13px; padding:clamp(10px,1.2vw,16px);
}
.tn h3{
  margin:0 0 8px; font-size:12px; font-weight:900; color:var(--gold); letter-spacing:1.2px;
}
.tn .aim{font-size:clamp(12.5px,1.35vw,17px); line-height:1.6; color:#dff0e2}
.tn .aim b{color:var(--gold)}
.rx{margin-top:9px; padding-top:9px; border-top:1px dashed #37624a}
.rx:first-of-type{margin-top:0; padding-top:0; border-top:0}
.rx .said{font-size:clamp(12px,1.3vw,16px); color:#9fd9b4; line-height:1.45}
.rx .said::before{content:'“'}
.rx .said::after{content:'”'}
.rx .back{font-size:clamp(12.5px,1.35vw,17px); line-height:1.5; margin-top:4px; padding-left:13px;
          border-left:3px solid var(--gold)}
.warnbox{
  background:#3a2620; border:1.5px solid #6b3f33; border-radius:9px; padding:9px 11px; margin-top:10px;
  font-size:clamp(12px,1.3vw,16px); line-height:1.55; color:#ffd9d0;
}
.warnbox b{color:var(--red)}

/* ───── 갈래 보드 ───── */
.board{flex:1; min-height:0; display:flex; gap:clamp(8px,1.1vw,14px)}
.col{
  flex:1; min-width:0; background:var(--panel); border:2px solid var(--line); border-radius:13px;
  display:flex; flex-direction:column; overflow:hidden;
}
.col.c0{border-color:#3d7fa8} .col.c1{border-color:#b8734f} .col.c2{border-color:#7d6bb0}
.colh{
  padding:clamp(8px,1vw,13px) clamp(10px,1.2vw,16px); font-size:clamp(14px,1.7vw,23px); font-weight:900;
  background:var(--panel2); display:flex; align-items:center; gap:9px; flex:0 0 auto;
}
.colh .cnt{
  margin-left:auto; background:var(--bg2); color:var(--dim); font-size:12px; font-weight:700;
  border-radius:20px; padding:3px 10px;
}
.items{flex:1; min-height:0; overflow-y:auto; padding:9px; display:flex; flex-direction:column; gap:6px}
.item{
  background:var(--bg2); border-radius:8px; padding:9px 11px; font-size:clamp(13px,1.45vw,19px);
  line-height:1.45; display:flex; gap:8px; align-items:flex-start; user-select:text;
}
.item span{flex:1; min-width:0; word-break:break-word}
.item button{background:none; color:#5d7d88; font-size:17px; padding:0 3px; line-height:1; flex:0 0 auto}
.item button:active{color:var(--red)}
.colf{padding:8px; flex:0 0 auto; border-top:1px solid var(--line)}
.colf input{
  width:100%; background:var(--bg2); border:1.5px solid var(--line); color:var(--ink);
  border-radius:8px; padding:11px 12px; font-family:inherit; font-size:15px; min-height:46px; user-select:text;
}
.colf input:focus{outline:2px solid var(--acc); outline-offset:-1px}

/* ───── 아래 ───── */
.foot{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:clamp(8px,1vw,13px) clamp(12px,1.6vw,22px); background:var(--bg2); border-top:1px solid var(--line);
}
.foot .fi{flex:1; font-size:clamp(11px,1.2vw,15px); color:var(--dim); line-height:1.45}
.foot .fi b{color:var(--gold)}
.nav{
  background:var(--panel); color:var(--ink); border-radius:9px; padding:11px 20px;
  font-size:15px; font-weight:700; min-height:46px;
}
.nav.go{background:var(--acc); color:#07222a}
.nav:disabled{opacity:.3}

@media (max-width:860px){
  .main{flex-direction:column}
  .right{flex:0 0 auto; flex-direction:row}
  .tbox{flex:1} .tn{flex:1.3; min-height:120px}
  .board{flex-direction:column}
  .steps{display:none}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ═══════════════ 데이터 ═══════════════ */
const STEPS=[
  {n:'혼자 생각', min:2,  k:'solo'},
  {n:'모둠에서 듣기', min:8, k:'group'},
  {n:'모둠 발표', min:5, k:'share'},
  {n:'교과서 읽기', min:10, k:'text'},
  {n:'판단 쓰기', min:5, k:'judge'},
  {n:'마무리 이야기', min:5, k:'close'}
];

const SHEETS=[
{
 no:1, unit:'고려의 건국과 후삼국 통일', pages:'47~48',
 title:'왕건은 왜 낙타를 굶겨 죽였을까',
 situ:'너는 전쟁에서 이긴 나라의 왕이야. 그런데 얼마 전 망해 버린 이웃 나라 사람 <b>수만 명</b>이 국경을 넘어와서 받아 달라고 한다. 우리 백성 먹을 곡식도 넉넉하지 않아.',
 ask:'너라면 이 사람들을 어떻게 하겠어?',
 opts:['돌려보낸다','받아주되 따로 살게 한다','우리 백성과 똑같이 대한다','그 밖에'],
 check:[['왕건은 발해 세자 대광현에게 무엇을 주었나?','47쪽'],
        ['왕건이 발해 유민을 받아들인 까닭은?','47쪽'],
        ['후대 왕들에게 남긴 열 가지 가르침의 이름은?','48쪽']],
 situ2:'그런데 <b>같은 왕건</b>이 이런 일도 했어. 거란이 사신과 낙타 50필을 선물로 보내오자, 사신 30명을 섬으로 귀양 보내고 낙타는 다리 아래에 묶어 <b>모두 굶어 죽게</b> 했다(53쪽).',
 ask2:'왕건은 꼭 그렇게까지 해야 했을까?',
 opts2:['그래야 했다','그럴 필요는 없었다'],
 aim:'같은 사람의 두 행동을 나란히 놓는다. 잔인함이냐 아니냐가 아니라 <b>이 행동이 누구에게 보내는 말이었나</b>까지 가는 것이 목표.',
 rx:[['잔인하다. 동물이 무슨 죄야.','그럼 낙타를 그냥 돌려보냈으면 거란은 뭐라고 생각했을까?'],
     ['거란이 나쁜 나라니까 당연하다.','낙타는 거란이 아니잖아. 낙타를 죽여서 거란에게 전해지는 말은 뭐지?'],
     ['발해는 우리 편, 거란은 적이니까.','발해 사람도 몇 달 전까지는 남의 나라 사람이었어. 무엇이 우리 편을 정하지?'],
     ['왕건이 화가 많이 났나 보다.','화가 났으면 조용히 없앨 수도 있었어. 왜 사람들이 보는 다리 아래에 묶었을까?']],
 stuck:'몰래 없앨 수도 있었는데 왜 다리 아래에 묶었을까? — 이 한 줄이면 대개 다시 굴러간다.',
 openq:"왕건의 행동은 거란에게 하는 말이었을까, 고려 백성에게 하는 말이었을까?",
 close:'정리해 주지 말 것. <b>“왕건의 행동은 거란에게 하는 말이었을까, 고려 백성에게 하는 말이었을까”</b>만 남기고 끝낸다. 다음 차시(거란의 침입)에서 이 질문이 되살아난다.'
},
{
 no:2, unit:'고려 사회의 모습', pages:'49~50',
 title:'시험으로 뽑으면 공평할까',
 situ:'네가 왕이야. 나라 일을 맡길 사람을 뽑아야 하는데, 지금은 <b>힘센 집안 자식들이 좋은 자리를 다 차지하고</b> 있어.',
 ask:'집안을 보지 않고 뽑으려면 어떤 방법이 있을까?',
 opts:[],
 check:[['고려가 관리를 뽑기 위해 실시한 제도는?','49쪽'],
        ['억울하게 노비가 된 백성에게 무엇을 해 주었나?','49쪽'],
        ['신라와 고려의 차이를 교과서는 뭐라고 썼나?','49쪽']],
 situ2:'그런데 과거 시험을 보려면 <b>어려운 한문 책을 몇 년씩</b> 읽어야 했어. 책도 비쌌고 가르쳐 줄 사람도 있어야 했지. 농사일을 도와야 하는 집 아이에게 그런 시간이 있었을까?',
 ask2:'시험으로 사람을 뽑는 것은 공평한 방법일까?',
 opts2:['공평하다','공평하지 않다','공평하지만 부족하다'],
 aim:'교과서가 “능력을 중시했다”고 칭찬만 한 자리에 그늘을 보게 한다. <b>완벽한 것과 더 나은 것은 다르다</b>까지 가면 성공.',
 rx:[['공평하다. 실력으로 뽑으니까.','시험 볼 준비를 할 수 있는 사람이 이미 정해져 있다면, 그래도 실력 대결일까?'],
     ['공평하지 않다. 가난한 아이는 못 본다.','그럼 무엇으로 뽑아야 공평해? 추첨? 면접? 그 방법엔 문제가 없을까?'],
     ['그래도 집안으로 뽑는 것보단 낫다.','가장 좋은 답이다. 무엇이 더 나아졌는지 정확히 말하게 할 것.'],
     ['시험이 제일 낫다. 다른 방법은 없다.','고려에서 과거에 붙은 사람은 거의 다 양인이었어. 천인은 아예 볼 수 없었고.']],
 stuck:'“우리 반에서 대표 한 명을 뽑아야 해. 무엇으로 뽑을까?” — 실제로 몇 개 받아 적고 각각의 허점을 찾게 한다.',
 openq:"오늘날에도 시험으로 뽑는 일이 많아. 그건 어때?",
 close:'완벽한 방법은 없다는 것을 남긴다. <b>“오늘날에도 시험으로 뽑는 일이 많은데, 그건 어때?”</b>로 닫는다.',
 careful:'집안 형편 이야기가 나올 수 있다. 개인 사정으로 흐르면 <b>“고려 사람이라면”</b>으로 되돌릴 것.'
},
{
 no:3, unit:'고려 사회의 모습', pages:'50 · 52',
 title:'아버지는 왜 아들에게 옷 한 벌만 남겼을까',
 situ:'고려의 어느 아버지가 세상을 떠나며 <b>재산을 전부 다 자란 딸</b>에게 주고, 어린 아들에게는 <b>검은 옷 한 벌, 모자 하나, 신발 하나, 종이 한 장</b>만 남겼어. 세월이 흘러 다 자란 아들이 소송을 냈다. 네가 재판관이야.',
 ask:'너라면 어떻게 판결하겠어?',
 opts:[],
 check:[['손변은 어떻게 판결했나?','52쪽'],
        ['아버지가 그렇게 유언한 까닭은?','52쪽'],
        ['고려에서 아들과 딸은 유산을 어떻게 받았나?','50쪽'],

let S = { sheet:null, step:0, note:false };
let T = { left:0, total:0, run:false, endAt:0, tick:null };
let BOARD = {};

function bkey(no){ return 'goryeo-board-'+no }
function loadBoard(no){
  try{ BOARD = JSON.parse(localStorage.getItem(bkey(no))||'{}') }catch(e){ BOARD={} }
  if(!BOARD.cols) BOARD.cols=[[],[],[]];
}
function saveBoard(no){
  try{ localStorage.setItem(bkey(no), JSON.stringify(BOARD)) }catch(e){}
}

/* ═══════════════ 소리 ═══════════════ */
let ac=null;
function ready(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)() }catch(e){} }
  if(ac && ac.state==='suspended') ac.resume(); }
function beep(f,d,v,type){
  if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0,ac.currentTime);
  g.gain.linearRampToValueAtTime(v||.18, ac.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+d+.05);
}
function chime(){ beep(784,.45,.2); setTimeout(()=>beep(1047,.5,.2),260); setTimeout(()=>beep(1319,.7,.22),540); }
function tickSound(){ beep(660,.12,.1,'triangle'); }

/* ═══════════════ 타이머 ═══════════════ */
function setTimer(min){
  stopTimer();
  T.total = min*60; T.left = T.total; T.run=false;
  paintTimer();
}
function startTimer(){
  ready();
  if(T.run) return;
  T.run=true; T.endAt = Date.now() + T.left*1000;
  T.tick = setInterval(()=>{
    const prev = T.left;
    T.left = Math.round((T.endAt - Date.now())/1000);
    if(prev>60 && T.left<=60) tickSound();
    if(prev>0 && T.left<=0) chime();
    paintTimer();
  }, 250);
  paintTimer();
}
function stopTimer(){
  T.run=false;
  if(T.tick){ clearInterval(T.tick); T.tick=null }
  paintTimer();
}
function toggleTimer(){ T.run ? stopTimer() : startTimer() }
function addMin(m){
  T.left += m*60;
  if(T.run) T.endAt = Date.now() + T.left*1000;
  paintTimer();
}
function fmt(sec){
  const neg = sec<0; const s = Math.abs(sec);
  return (neg?'-':'') + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function paintTimer(){
  const box=document.getElementById('tbox'), num=document.getElementById('tnum'),
        btn=document.getElementById('tgo');
  if(!box) return;
  num.textContent = fmt(T.left);
  num.className = 'tnum' + (T.left<=0 ? ' over' : (T.left<=60 ? ' warn' : ''));
  box.className = 'tbox' + (T.left<=0 ? ' over' : (T.run ? ' run' : ''));
  if(btn) btn.textContent = T.run ? '⏸ 멈춤' : '▶ 시작';
}

/* ═══════════════ 렌더 ═══════════════ */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function render(){
  const app=document.getElementById('app');
  if(S.sheet===null){ app.innerHTML=homeHTML(); return }
  app.innerHTML = sheetHTML();
  paintTimer();
  const inp = document.querySelector('.colf input');
  if(inp && STEPS[S.step].k==='share') inp.focus();
}

  + '<div class="cards">'
  + SHEETS.map((s,i)=>
      '<button class="card" onclick="openSheet('+i+')">'
      + '<div class="cn">'+s.no+'</div>'
      + '<div class="ct"><div class="cu">교과서 '+s.pages+'쪽</div>'
      + '<div class="cttl">'+s.title+(s.star?'<span class="star">핵심</span>':'')+'</div>'
      + '<div class="cq">'+s.ask2+'</div></div></button>'
    ).join('')
  + '</div></div>';
}

function sheetHTML(){
  const s=SHEETS[S.sheet], st=STEPS[S.step];
  return '<div class="bar">'
  + '<button class="hbtn" onclick="goHome()">◀ 목록</button>'
  + '<div class="btitle"><div class="bu">'+s.no+'차시 · 교과서 '+s.pages+'쪽</div><div class="bt">'+s.title+'</div></div>'
  + '<div class="steps">'
  +   STEPS.map((x,i)=>'<button class="sbtn'+(i===S.step?' on':(i<S.step?' done':''))+'" onclick="goStep('+i+')">'+(i+1)+'. '+x.n+'</button>').join('')
  + '</div>'
  + '<button class="hbtn" onclick="fs()">⛶</button>'
  + '</div>'

  + '<div class="main">'
  +   (st.k==='share' ? boardHTML(s) : '<div class="left">'+leftHTML(s,st)+'</div>')
  +   '<div class="right">'
  +     '<div class="tbox'+(S.note?'':' solo')+'" id="tbox">'
  +       '<div class="tlab">'+(S.step+1)+'. '+st.n+'</div>'
  +       '<div class="tnum" id="tnum">0:00</div>'
  +       '<div class="tbtns">'
  +         '<button class="go" id="tgo" onclick="toggleTimer()">▶ 시작</button>'
  +         '<button onclick="setTimer('+st.min+')">↺</button>'
  +         '<button onclick="addMin(1)">+1분</button>'
  +       '</div>'
  +     '</div>'
  +     (S.note ? noteHTML(s,st) : '<button class="ntoggle" onclick="toggleNote()">선생님 노트 펴기 ▾<small>아이들에게도 보이는 화면입니다</small></button>')
  +   '</div>'
  + '</div>'

  + '<div class="foot">'
  +   '<button class="nav" onclick="goStep('+(S.step-1)+')"'+(S.step===0?' disabled':'')+'>◀ 이전</button>'
  +   '<div class="fi">'+footHint(s,st)+'</div>'
  +   '<button class="nav go" onclick="goStep('+(S.step+1)+')"'+(S.step===STEPS.length-1?' disabled':'')+'>다음 ▶</button>'
  + '</div>';
}

function leftHTML(s,st){
  if(st.k==='solo')
    return '<div class="situ">'+s.situ+'</div><div class="ask">'+s.ask+'</div>'
         + (s.opts.length?'<div class="opts">'+s.opts.map(o=>'<span class="opt">'+o+'</span>').join('')+'</div>':'')
         + '<div class="note">학습지 <b>①번 칸</b>에 혼자 씁니다. 아직 이야기하지 않습니다.</div>';

  if(st.k==='group')
    return '<div class="ask">한 사람씩 돌아가며<br>자기가 쓴 것을 읽습니다</div>'
         + '<div class="note">다 읽은 뒤에 자유롭게 이야기하세요.<br><br>학습지 <b>②번 칸</b>에는 <b>나와 다른 생각을 한 친구만</b> 적습니다. 같은 생각은 적지 않아도 됩니다.<br><br><b>모둠 의견을 하나로 정하지 않습니다.</b></div>'
         + '<div class="situ" style="border-left-color:#4fc0a8;font-size:clamp(14px,1.6vw,22px)">지금 이야기하는 질문 — <b>'+s.ask+'</b></div>';

  if(st.k==='text')
    return '<div class="pg"><div class="big">'+s.pages+'쪽</div><div class="lab">지금 교과서를 폅니다 · 혼자 읽습니다</div></div>'
         + '<div class="clist">'+s.check.map((c,i)=>
             '<div class="cit"><i>'+(i+1)+'</i><span>'+c[0]+'</span><em>'+c[1]+'</em></div>').join('')+'</div>'
         + '<div class="note">학습지 <b>③번 칸</b>을 채웁니다. <b>답을 불러 주지 마세요.</b> 못 찾는 아이에게만 쪽수를 짚어 줍니다.</div>';

  if(st.k==='judge')
    return '<div class="situ">'+s.situ2+'</div><div class="ask">'+s.ask2+'</div>'
         + (s.opts2.length?'<div class="opts">'+s.opts2.map(o=>'<span class="opt">'+o+'</span>').join('')+'</div>':'')
         + '<div class="note">학습지 <b>④번 칸</b>. 처음 쓴 것과 생각이 달라졌다면 <b>지우지 말고 둘 다</b> 남기게 하세요.</div>';

  /* close — 아이들이 보는 화면이다. 되묻는 말은 선생님 노트로 간다. */
  return '<div class="note" style="font-size:clamp(13px,1.5vw,20px)">방금 우리가 답한 질문<br><b style="color:#fff">'+s.ask2+'</b></div>'
       + '<div class="ask" style="color:var(--gold)">'+s.openq+'</div>'
       + '<div class="note">학습지 맨 아래 <b>생각 더하기</b> 칸의 질문입니다. 오늘은 답을 내지 않고 끝냅니다.</div>';
}

function noteHTML(s,st){
  let body='';
  if(st.k==='solo')
    body = '<div class="aim">'+s.aim+'</div>'
         + '<div class="warnbox">지금은 <b>아무 말도 보태지 마세요.</b> 힌트를 주면 전부 그 방향으로 씁니다.</div>';
  else if(st.k==='group')
    body = '<div class="aim">돌아다니며 <b>듣기만</b> 합니다. 아직 정리해 주지 마세요.<br><br>말이 없는 모둠에는 이걸 던집니다:<br><br><b>'+s.stuck+'</b></div>';
  else if(st.k==='share')
    body = s.rx.map(r=>'<div class="rx"><div class="said">'+r[0]+'</div><div class="back">'+r[1]+'</div></div>').join('');
  else if(st.k==='text')
    body = '<div class="aim">읽는 동안은 조용히 둡니다. 교과서에서 답이 나오는 것은 <b>③번뿐</b>입니다 — ④번은 교과서에 답이 없습니다.</div>';
  else if(st.k==='judge')
    body = '<div class="aim">조용해도 <b>기다리세요.</b> 5분은 생각보다 깁니다.<br><br>“모르겠어요”라는 아이에게는 <b>둘 중 하나를 먼저 고르게</b> 하고 이유를 나중에 쓰게 합니다.</div>';
  else
    body = '<div class="aim">'+s.close+'</div>'
         + (s.careful?'<div class="warnbox">'+s.careful+'</div>':'')
         + '<div class="warnbox" style="background:#1b2a1e;border-color:#2f5138;color:#dff0e2">'
         + '<b style="color:#9fd9b4">정답을 정리해 주고 끝내지 마세요.</b> 열어 둔 채 끝내야 다음 시간에 되살아납니다.</div>';

  const head = st.k==='share' ? ('이렇게 말하면 이렇게 되묻기 · '+s.rx.length+'개 ↓') : (st.k==='close' ? '끝낼 때' : '선생님 노트');
  return '<div class="tn"><h3>'+head
       + '<button onclick="toggleNote()" style="float:right;background:none;color:#7fa88c;font-size:15px;padding:0 4px;line-height:1">✕</button>'
       + '</h3>'+body+'</div>';
}

function footHint(s,st){
  const m = {
    solo:'학습지 ①번 · 혼자 씁니다. <b>지금 힌트를 주지 마세요.</b>',
    group:'학습지 ②번 · 돌아가며 읽기 → 자유 토의. <b>합의시키지 않습니다.</b>',
    share:'모둠 대표가 말하면 받아 적습니다. 오른쪽 <b>되묻는 말</b>을 보며 한 번씩 밀어 보세요.',
    text:'교과서 '+s.pages+'쪽 · 학습지 ③번. <b>답을 불러 주지 마세요.</b>',
    judge:'학습지 ④번 · 처음 쓴 것을 <b>지우지 않게</b> 하세요.',
    close:'<b>정리하지 말고 열어 둔 채</b> 끝냅니다.'
  };
  return m[st.k]||'';
}

/* ── 갈래 보드 ── */
function boardHTML(s){
  const labels = s.opts2.length ? s.opts2 : ['이런 생각이 나왔다','이런 생각도 나왔다'];
  return '<div class="board">'
  + labels.map((L,i)=>
      '<div class="col c'+i+'">'
      + '<div class="colh">'+L+'<span class="cnt">'+(BOARD.cols[i]||[]).length+'</span></div>'
      + '<div class="items">'
      +   (BOARD.cols[i]||[]).map((t,j)=>
            '<div class="item"><span>'+esc(t)+'</span><button onclick="delItem('+i+','+j+')">✕</button></div>').join('')
      + '</div>'
      + '<div class="colf"><input placeholder="적고 Enter" onkeydown="if(event.key===\'Enter\')addItem('+i+',this)"></div>'
      + '</div>').join('')
  + '</div>';
}
function addItem(i,el){
  const v=el.value.trim(); if(!v) return;
  if(!BOARD.cols[i]) BOARD.cols[i]=[];
  BOARD.cols[i].push(v); el.value='';
  saveBoard(SHEETS[S.sheet].no);
  const keep=i; render();
  const inputs=document.querySelectorAll('.colf input');
  if(inputs[keep]) inputs[keep].focus();
}
function delItem(i,j){
  BOARD.cols[i].splice(j,1); saveBoard(SHEETS[S.sheet].no); render();
}

/* ═══════════════ 이동 ═══════════════ */
function openSheet(i){
  S.sheet=i; S.step=0; loadBoard(SHEETS[i].no);
  setTimer(STEPS[0].min); render(); ready();
}
function goHome(){ stopTimer(); S.sheet=null; S.note=false; render() }
function toggleNote(){ S.note=!S.note; render() }
function goStep(i){
  if(i<0||i>=STEPS.length) return;
  S.step=i; setTimer(STEPS[i].min); render();
}
function fs(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(S.sheet===null) return;
  if(e.key==='ArrowRight'){ goStep(S.step+1) }
  else if(e.key==='ArrowLeft'){ goStep(S.step-1) }
  else if(e.key===' '){ e.preventDefault(); toggleTimer() }
  else if(e.key==='Escape'){ goHome() }
  else if(e.key==='f'||e.key==='F'){ fs() }
  else if(e.key==='n'||e.key==='N'){ toggleNote() }
});

render();
</script>
</body>
</html>
