<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우주 연출 스튜디오</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1c;--panel:#10173a;--panel2:#1b2452;--line:#2e3a74;--ink:#eef2ff;--muted:#98a4d4;--acc:#ffcc4d;--acc2:#6ee7f9;--pink:#ff7ab6;--ok:#5ee39a;--bad:#ff7b7b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:8px 14px;font-size:16px;font-weight:700;background:var(--panel2);white-space:nowrap}
button:active{transform:scale(.96)}
button.pri{background:linear-gradient(135deg,#ffcc4d,#ff9a3d);color:#2a1600}
button.ghost{background:transparent;border:1.5px solid var(--line)}
button.on{background:var(--acc2);color:#062030}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#ffe28a,#6ee7f9 60%,#3a3f7a)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--acc);margin-top:-11px;box-shadow:0 2px 8px #0008}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0b1130ee;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.top h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:22px;margin:0 8px;white-space:nowrap}
.top .sp{flex:1}
.stagewrap{position:relative;flex:1;min-height:0;min-width:0;background:#02040c}
.stagewrap canvas.main{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:12px 20px;border-radius:14px;font-size:17px;z-index:90;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:22px;padding:24px;max-width:620px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 20px 60px #000a}
.card h3{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:30px;margin:0 0 10px}
.card p{font-size:19px;line-height:1.65;margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}

/* 처음 화면 */
#home .stagewrap{position:absolute;inset:0}
.homebox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;pointer-events:none;background:radial-gradient(ellipse at center,#0007 0,#0000 70%)}
.homebox>*{pointer-events:auto}
.eyebrow{font-size:16px;color:var(--acc2);letter-spacing:.1em;font-weight:700}
.title{font-family:'Black Han Sans',sans-serif;font-size:clamp(40px,8vw,82px);margin:4px 0 6px;text-shadow:0 0 30px #6ee7f966,0 4px 0 #0008;text-align:center;line-height:1.1}
.sub{font-size:19px;color:#dfe6ff;margin-bottom:26px;text-align:center}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,250px));gap:14px;width:100%;justify-content:center}
.mcard{background:#0e1640dd;border:1.5px solid var(--line);border-radius:20px;padding:18px 16px;text-align:left;white-space:normal;min-height:150px;display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(4px)}
.mcard .ic{font-size:36px}
.mcard b{font-size:21px}
.mcard span{font-size:15px;color:var(--muted);font-weight:400;line-height:1.45}
.mcard.hot{border-color:var(--acc);box-shadow:0 0 24px #ffcc4d33}
@media (max-width:760px){.menu{grid-template-columns:1fr;max-width:420px}.mcard{min-height:0;flex-direction:row;align-items:center}.mcard .ic{font-size:30px}}
.corner{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:5}
.qrbtn{background:#fff;padding:6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#123}
.qrbtn[hidden]{display:none}
.qrbtn svg{width:64px;height:64px;display:block}
.qrbtn small{font-size:11px}
#qrBig .card{max-width:560px;text-align:center;background:#fff;color:#123}
#qrBig svg{width:min(460px,80vw);height:auto}

/* 스튜디오 */
.sbody{flex:1;display:flex;min-height:0}
.palette{width:300px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px}
.tabs button{min-height:38px;padding:4px 10px;font-size:15px}
.grid{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 8px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.tile{min-width:0;background:#0a1030;border:1.5px solid var(--line);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:92px;position:relative;font-weight:400;font-size:13px;white-space:normal}
.tile img{width:62px;height:56px;object-fit:contain}
.tile.sel{border-color:var(--acc);background:#2a2a10}
.tile .x{position:absolute;top:2px;right:2px;width:26px;height:26px;min-height:0;padding:0;border-radius:50%;background:#000a;font-size:14px}
.tile.wide{grid-column:span 3;flex-direction:row;justify-content:center;min-height:56px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#ff7ab6,#8a5cff)}
.bgtile img{width:84px;height:48px;object-fit:cover;border-radius:6px}
.objbar{flex-shrink:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 14px;min-height:94px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.objbar .hint{font-size:17px;color:var(--muted);line-height:1.5}
.sl{display:flex;align-items:center;gap:8px;flex:1;min-width:220px}
.sl label{font-size:15px;font-weight:700;white-space:nowrap}
.sl .end{font-size:14px;color:var(--muted);white-space:nowrap}
.dist{flex:2;min-width:300px}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-size:14px}
.chip{background:#0a1030;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip b{color:var(--acc)}
#mini{position:absolute;left:10px;bottom:10px;width:250px;height:160px;border-radius:14px;border:1.5px solid var(--line);background:#050a22e6;touch-action:none;display:none}
#mini.on{display:block}
.stagehint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:999px;font-size:15px;pointer-events:none;white-space:nowrap}
@media (orientation:portrait),(max-width:900px){
  .sbody{flex-direction:column}
  .palette{width:auto;height:230px;border-left:0;border-top:1px solid var(--line)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .tile.wide{grid-column:1/-1}
  #mini{width:190px;height:122px}
}

/* 사진 지우개 */
#eraser .card{max-width:900px}
.erwrap{display:flex;justify-content:center;align-items:center;background:#0a1030;border-radius:14px;padding:8px;height:min(56vh,520px)}
#erCv{max-width:100%;max-height:100%;touch-action:none;border-radius:8px;
 background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);
 background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;background-color:#fff}

/* 설계도 */
#plan .card{max-width:1100px;padding:16px}
#planCv{width:100%;height:auto;border-radius:10px;display:block}

/* 훈련소 */
.mlist{flex:1;overflow-y:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-content:start;max-width:1200px;margin:0 auto;width:100%}
.mtile{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:16px;text-align:left;white-space:normal;display:flex;flex-direction:column;gap:4px;min-height:140px}
.mtile .n{font-size:14px;color:var(--muted)}
.mtile .ic{font-size:34px}
.mtile b{font-size:20px}
.mtile .st{color:var(--acc);font-size:20px;letter-spacing:2px}
.mtile.lock{opacity:.4}
.mtile.next{border-color:var(--acc);box-shadow:0 0 18px #ffcc4d40}
.mbody{flex:1;display:flex;min-height:0}
.mpanel{width:340px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.goal{background:#0a1030;border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:17px;line-height:1.5}
.ordr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.ordr .L{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#2a1600;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.ordr small{font-size:13px;color:var(--muted)}
.pick{display:flex;gap:8px}
.pick button{flex:1;font-size:22px;font-weight:900}
.pick button.on{background:var(--acc);color:#2a1600}
.tool{background:#0a1030;border-radius:14px;padding:8px 12px}
.tool .h{font-size:15px;font-weight:700;display:flex;justify-content:space-between}
.tool .h span{color:var(--acc)}
.bigok{font-size:22px;min-height:58px}
.stars{font-size:54px;letter-spacing:6px;color:var(--acc);text-align:center;margin:6px 0}
.stars .off{color:#3a4270}
@media (orientation:portrait),(max-width:900px){
  .mbody{flex-direction:column}
  .mpanel{width:auto;max-height:46vh;border-left:0;border-top:1px solid var(--line)}
}

/* 무대 모드 */
#stageMode .stagewrap{position:absolute;inset:0}
.smbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:#000c;padding:8px;border-radius:16px;transition:opacity .4s;flex-wrap:wrap;justify-content:center;max-width:96vw}
.smbar.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>

<!-- ───────── 처음 ───────── -->
<section id="home" class="screen on">
  <div class="stagewrap"><canvas class="main" id="cvHome"></canvas></div>
  <div class="homebox">
    <div class="eyebrow">미술 10 · 우주로 날아간 미술</div>
    <div class="title">우주 연출 스튜디오</div>
    <div class="sub">납작한 화면에 <b>깊이</b>를 만드는 비법을 익히고, 나만의 우주를 연출해요</div>
    <div class="menu">
      <button class="mcard hot" onclick="go('missions')"><div class="ic">🎓</div><div><b>거리 마법 훈련소</b><br><span id="homeStars">10판 · 거리감을 만드는 여섯 가지 마법</span></div></button>
      <button class="mcard" onclick="go('studio')"><div class="ic">🎬</div><div><b>우주 연출 스튜디오</b><br><span>행성·우주인·내 작품 사진을 놓고 거리만 바꾸면 우주가 깊어져요</span></div></button>
      <button class="mcard" onclick="go('stageMode')"><div class="ic">📺</div><div><b>무대 모드</b><br><span>교실 TV에 움직이는 우주를 띄우고 그 앞에 작품을 매달아요</span></div></button>
    </div>
  </div>
  <div class="corner">
    <button class="ghost" id="sndBtn" onclick="toggleSnd()" style="background:#0008">🔊</button>
    <button class="qrbtn" id="qrBtn" hidden onclick="showQR()"></button>
  </div>
</section>

<!-- ───────── 훈련소 목록 ───────── -->
<section id="missions" class="screen">
  <div class="top">
    <button onclick="go('home')">◀ 처음</button>
    <h2>🎓 거리 마법 훈련소</h2>
    <div class="sp"></div>
    <span class="chip" id="mStarSum">★ 0 / 30</span>
  </div>
  <div class="mlist" id="mList"></div>
</section>

<!-- ───────── 훈련 한 판 ───────── -->
<section id="mission" class="screen">
  <div class="top">
    <button onclick="go('missions')">◀ 목록</button>
    <h2 id="mTitle">1판</h2>
    <div class="sp"></div>
    <button onclick="showIntro()">❓ 마법 설명</button>
    <button onclick="startMission(curM)">↺ 처음부터</button>
  </div>
  <div class="mbody">
    <div class="stagewrap"><canvas class="main" id="cvMission"></canvas><div class="stagehint" id="mHint" style="display:none"></div></div>
    <div class="mpanel">
      <div class="goal" id="mGoal"></div>
      <div>
        <div class="muted" style="font-size:14px;margin-bottom:4px">고칠 것을 고르세요 (화면에서 눌러도 돼요)</div>
        <div class="pick" id="mPick"></div>
      </div>
      <div id="mTools" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="sp" style="flex:1"></div>
      <button class="pri bigok" onclick="judge()">✨ 확인!</button>
    </div>
  </div>
</section>

<!-- ───────── 스튜디오 ───────── -->
<section id="studio" class="screen">
  <div class="top">
    <button onclick="go('home')">◀ 처음</button>
    <h2>🎬 우주 연출 스튜디오</h2>
    <div class="sp"></div>
    <button id="btnOff" title="누르고 있는 동안 거리 마법을 끕니다">👁 마법 끄고 보기</button>
    <button id="btnPlay" onclick="togglePlay()">▶ 살펴보기</button>
    <button id="btnMini" onclick="toggleMini()">🗺 위에서 본 모습</button>
    <button onclick="openPlan()">📋 설계도</button>
    <button onclick="exportPNG()">💾 그림 저장</button>
    <button onclick="go('stageMode')">📺 무대</button>
    <button class="ghost" onclick="loadSample()">✨ 예시</button>
    <button class="ghost" onclick="clearScene()">🗑 새로</button>
  </div>
  <div class="sbody">
    <div class="stagewrap"><canvas class="main" id="cvStudio"></canvas><canvas id="mini"></canvas><div class="stagehint" id="playHint" style="display:none">화면을 끌거나 태블릿을 기울여 보세요 — 가까운 것이 더 많이 움직여요</div></div>
    <aside class="palette">
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
    </aside>
  </div>
  <div class="objbar" id="objbar"></div>
</section>

<!-- ───────── 무대 모드 ───────── -->
<section id="stageMode" class="screen">
  <div class="stagewrap"><canvas class="main" id="cvStage"></canvas></div>
  <div class="smbar" id="smbar">
    <button onclick="leaveStage()">◀ 나가기</button>
    <button id="smWhat" onclick="smToggleWhat()">🪐 내 장면</button>
    <span style="display:flex;gap:4px"><button onclick="smBg(-1)">◀</button><button id="smBgName" style="min-width:130px" onclick="smBg(1)">배경</button><button onclick="smBg(1)">▶</button></span>
    <button id="smSpd" onclick="smSpeed()">🐢 천천히</button>
    <button onclick="fullScreen()">⛶ 전체 화면</button>
  </div>
</section>

<!-- ───────── 모달들 ───────── -->
<div class="modal" id="introM"><div class="card">
  <div style="font-size:54px" id="inIc"></div>
  <h3 id="inT"></h3>
  <p id="inP"></p>
  <p class="muted" id="inEx" style="font-size:17px"></p>
  <div class="row" style="margin-top:14px"><div class="sp" style="flex:1"></div><button class="pri" onclick="closeM('introM')">시작! ▶</button></div>
</div></div>

<div class="modal" id="resultM"><div class="card" style="text-align:center">
  <div class="stars" id="rsStars"></div>
  <h3 id="rsT"></h3>
  <p id="rsP"></p>
  <div class="row" style="justify-content:center;margin-top:14px" id="rsBtns"></div>
</div></div>

<div class="modal" id="askM"><div class="card" style="max-width:440px">
  <p id="askP" style="font-size:20px"></p>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="ghost" id="askNo">아니요</button><button class="pri" id="askYes">네</button></div>
</div></div>

<div class="modal" id="eraser"><div class="card">
  <h3 style="font-size:24px">📷 내 작품 배경 지우기</h3>
  <p class="muted" style="font-size:16px;margin:0 0 8px">흰 종이 앞에서 찍으면 잘 지워져요. 지울 곳을 눌러 보세요.</p>
  <div class="erwrap"><canvas id="erCv"></canvas></div>
  <div class="row" style="margin-top:10px">
    <button id="erWand" class="on" onclick="erMode('wand')">🪄 눌러서 지우기</button>
    <button id="erBrush" onclick="erMode('brush')">🧽 문질러 지우기</button>
    <button onclick="erEdge()">⬜ 가장자리 배경 한 번에</button>
    <button onclick="erUndo()">↩ 되돌리기</button>
  </div>
  <div class="sl" style="margin-top:6px"><label>비슷한 색 범위</label><span class="end">좁게</span><input type="range" id="erTol" min="10" max="110" value="45"><span class="end">넓게</span></div>
  <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="ghost" onclick="closeM('eraser')">취소</button><button class="pri" onclick="erDone()">✓ 다 됐어요</button></div>
</div></div>

<div class="modal" id="plan"><div class="card">
  <canvas id="planCv" width="1600" height="1000"></canvas>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button onclick="savePlan()">💾 설계도 저장</button><button class="pri" onclick="closeM('plan')">닫기</button></div>
</div></div>

<div class="modal" id="qrBig" onclick="closeM('qrBig')"><div class="card"><div id="qrBigIn"></div><p style="font-size:16px">태블릿 카메라로 찍으면 열려요</p></div></div>

<input type="file" id="fileIn" accept="image/*" capture="environment" hidden>
<div class="toast" id="toast"></div>

<script>

const QR = {};

/* ───────── 무대(렌더러) ───────── */
class Stage {
  constructor(cv, opt = {}){
    this.cv = cv; this.g = cv.getContext('2d'); this.cover = !!opt.cover;
    this.scene = {bg: 'deep', objs: []}; this.play = false; this.magicOff = false; this.hideObjs = false;
    this.cam = {x: 0, y: 0}; this.user = {x: 0, y: 0}; this.speed = 1; this.drift = 1;
    this.sel = null; this.mission = null; this.tags = false; this.shoot = null; this.nextShoot = 3;
    this.fit();
  }
  fit(){
    const p = this.cv.parentElement.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.dpr = dpr; this.cv.width = Math.max(2, Math.round(p.width * dpr)); this.cv.height = Math.max(2, Math.round(p.height * dpr));
    const kx = this.cv.width / W, ky = this.cv.height / H;
    this.k = this.cover ? Math.max(kx, ky) : Math.min(kx, ky);
    this.ox = (this.cv.width - W * this.k) / 2; this.oy = (this.cv.height - H * this.k) / 2;
  }
  toL(e){ const r = this.cv.getBoundingClientRect(); return {x: ((e.clientX - r.left) * this.dpr - this.ox) / this.k, y: ((e.clientY - r.top) * this.dpr - this.oy) / this.k}; }
  look(o){
    if(this.mission){
      const m = this.magicOff ? MOFF : null;
      return {w: m ? m.sz : o.sz, b: m ? 1 : o.bri, blur: m ? 0 : o.blur, sat: m ? 1 : 1 - (1 - o.bri) * .9, f: m ? m.spd : o.spd};
    }
    const d = this.magicOff ? 0 : o.d;
    return {w: o.size / (1 + 3.2 * d), b: 1 - .55 * d, blur: d * 3.2, sat: 1 - .45 * d, f: .3 + .7 * (1 - o.d)};
  }
  geom(o, t){
    const L = this.look(o), spr = sprite(o); if(!spr) return null;
    const w = L.w, h = w * spr.height / spr.width;
    let x = o.x - this.px * L.f, y = (this.mission && this.magicOff && MOFF.y != null && o.anchor === 'b' ? MOFF.y : o.y) - this.py * L.f;
    if(this.play && (KINDS[o.k] || {}).float && !this.mission) y += Math.sin(t * .9 + o.id * 1.7) * 9 * L.f;
    return {L, spr, w, h, x, y, rot: o.rot || 0, flip: o.flip, anchor: o.anchor || 'c'};
  }
  ordered(){
    const a = this.scene.objs.slice();
    if(this.mission) a.sort((p, q) => p.z - q.z); else a.sort((p, q) => q.d - p.d || p.id - q.id);
    return a;
  }
  update(dt, t){
    let tx = this.user.x, ty = this.user.y;
    if(this.play){ tx += Math.sin(t * .23 * this.speed) * .75 * this.drift + TILT.x; ty += Math.sin(t * .15 * this.speed + 1) * .45 * this.drift + TILT.y; }
    else if(!this.mission || !this.mission.drift){ tx = 0; ty = 0; }
    if(this.mission && this.mission.drift){ tx = Math.sin(t * .9) * 1.1; ty = 0; }
    const a = 1 - Math.pow(.02, dt);
    this.cam.x += (clamp(tx, -1.3, 1.3) - this.cam.x) * a; this.cam.y += (clamp(ty, -1.3, 1.3) - this.cam.y) * a;
    if(this.play){
      this.nextShoot -= dt;
      if(this.nextShoot < 0 && !this.shoot){ this.shoot = {x: 200 + Math.random() * 1000, y: 40 + Math.random() * 300, vx: 900 + Math.random() * 500, vy: 260 + Math.random() * 200, life: 0}; this.nextShoot = 4 + Math.random() * 6; }
      if(this.shoot){ const s = this.shoot; s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; if(s.life > 1.1) this.shoot = null; }
    }
  }
  render(t, g = this.g, k = this.k, ox = this.ox, oy = this.oy, full = true){
    this.px = this.cam.x * PAN; this.py = this.cam.y * PAN * .6;
    if(full){ g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#01020a'; g.fillRect(0, 0, g.canvas.width, g.canvas.height); }
    g.setTransform(k, 0, 0, k, ox, oy);
    g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
    const B = getBG(this.scene.bg);
    for(const L of B.layers) g.drawImage(L.c, -MG - this.px * L.f, -MG - this.py * L.f);
    for(const s of B.tw){
      const a = .25 + .75 * Math.abs(Math.sin(t * s.sp + s.ph)), x = s.x - this.px * .22, y = s.y - this.py * .22;
      g.globalAlpha = a; g.fillStyle = '#fff';
      g.beginPath(); g.moveTo(x, y - s.r); g.lineTo(x + s.r * .18, y); g.lineTo(x, y + s.r); g.lineTo(x - s.r * .18, y); g.fill();
      g.beginPath(); g.moveTo(x - s.r, y); g.lineTo(x, y + s.r * .18); g.lineTo(x + s.r, y); g.lineTo(x, y - s.r * .18); g.fill();
    }
    g.globalAlpha = 1;
    if(this.shoot){ const s = this.shoot, a = Math.sin(Math.PI * s.life / 1.1), x = s.x - this.px * .15, y = s.y - this.py * .15;
      const q = g.createLinearGradient(x, y, x - s.vx * .18, y - s.vy * .18); q.addColorStop(0, `rgba(255,255,255,${a})`); q.addColorStop(1, 'rgba(255,255,255,0)');
      g.strokeStyle = q; g.lineWidth = 2.5; g.beginPath(); g.moveTo(x, y); g.lineTo(x - s.vx * .18, y - s.vy * .18); g.stroke(); }
    const tagq = [];
    if(!this.hideObjs){
      for(const o of this.ordered()){
        const G = this.geom(o, t); if(!G) continue;
        const kd = k;
        const e = filtered(G.spr, sprKey(o), G.w * kd, G.L.b, G.L.sat, G.L.blur * kd, o.hue || 0);
        const dw = e.w / kd, dh = e.h / kd, pad = e.pad / kd;
        g.save(); g.translate(G.x, G.y); g.rotate(G.rot); if(G.flip) g.scale(-1, 1);
        if(!HAS_FILTER) g.globalAlpha = G.L.b;
        const top = G.anchor === 'b' ? -dh : -dh / 2;
        g.drawImage(e.c, -dw / 2 - pad, top - pad, dw + pad * 2, dh + pad * 2);
        g.globalAlpha = 1;
        if(full && this.sel === o){ g.strokeStyle = '#ffcc4d'; g.lineWidth = 3 / (k / this.dpr); g.setLineDash([10, 8]); g.strokeRect(-dw / 2 - 8, top - 8, dw + 16, dh + 16); g.setLineDash([]); }
        g.restore();
        if(this.tags && o.L) tagq.push({o, x: G.x, y: G.anchor === 'b' ? G.y - dh - 34 : G.y - dh / 2 - 30});
      }
      for(const {o, x, y} of tagq){
        g.fillStyle = this.sel === o ? '#ffcc4d' : 'rgba(10,16,48,.85)'; g.strokeStyle = '#ffcc4d'; g.lineWidth = 3;
        circ(g, x, y, 24); g.fill(); g.stroke();
        g.fillStyle = this.sel === o ? '#2a1600' : '#ffcc4d'; g.font = '900 28px "Noto Sans KR",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(o.L, x, y + 1);
      }
    }
    if(B.fg) g.drawImage(B.fg, -MG - this.px * 1.25, -MG - this.py * 1.25);
    if(this.mission && this.mission.bg === 'surface' && this.mission.tools.includes('y') && full && !this.magicOff){
      g.setLineDash([14, 10]); g.strokeStyle = 'rgba(255,204,77,.7)'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, HZ - this.py * .42); g.lineTo(W, HZ - this.py * .42); g.stroke(); g.setLineDash([]);
      g.fillStyle = 'rgba(255,204,77,.9)'; g.font = '700 22px "Noto Sans KR",sans-serif'; g.textAlign = 'left'; g.textBaseline = 'bottom'; g.fillText('지평선', 16, HZ - 6);
    }
    g.restore();
  }
  hit(p, t){
    const a = this.ordered().reverse();
    for(const o of a){
      const G = this.geom(o, t); if(!G) continue;
      let dx = p.x - G.x, dy = p.y - G.y; const c = Math.cos(-G.rot), s = Math.sin(-G.rot);
      let lx = dx * c - dy * s, ly = dx * s + dy * c; if(G.flip) lx = -lx;
      const u = (lx + G.w / 2) / G.w, v = (ly + (G.anchor === 'b' ? G.h : G.h / 2)) / G.h;
      const m = Math.max(0, 30 / G.w);
      if(u < -m || u > 1 + m || v < -m || v > 1 + m) continue;
      if(G.w < 70 || alphaAt(G.spr, sprKey(o), clamp(u, 0, 1), clamp(v, 0, 1)) > 25) return o;
    }
    return null;
  }
}

/* 태블릿 기울기 */
const TILT = {x: 0, y: 0, base: null, on: false};
window.addEventListener('deviceorientation', e => {
  if(e.beta == null) return;
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  let x = e.gamma, y = e.beta;
  if(ang === 90){ x = e.beta; y = -e.gamma; } else if(ang === -90 || ang === 270){ x = -e.beta; y = e.gamma; }
  if(!TILT.base) TILT.base = {x, y};
  TILT.x = clamp((x - TILT.base.x) / 25, -1, 1); TILT.y = clamp((y - TILT.base.y) / 25, -1, 1);
});
function resetTilt(){ TILT.base = null; TILT.x = TILT.y = 0; }

let lastT = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; const t = now / 1000;
  const map = {home: 'home', studio: 'studio', mission: 'mission', stageMode: 'stage'};
  const s = stages[map[cur]];
  if(s){ s.update(dt, t); s.render(t); }
  if(cur === 'studio' && MINI.on) drawMini();
  requestAnimationFrame(loop);
}

function judge(){
  const S = stages.mission, m = S.mission, objs = S.scene.objs;
  const seq = m.order.map(L => objs.find(o => o.L === L));
  let fail = null, strong = 0, total = 0;
  const pairs = []; for(let i = 0; i < seq.length - 1; i++) pairs.push([seq[i], seq[i + 1]]);
  for(const t of m.tools){
    total++; let ok = true, st = true;
    if(t === 'y'){ const up = objs.find(o => o.y < HZ + 8); if(up){ fail = fail || `「${up.L}」가 지평선 위로 올라가 하늘에 떠 버렸어요. 땅 위로 내려놓아요.`; continue; } }
    for(const [p, n] of pairs){
      let pass, str, msg;
      if(t === 'size'){ const r = n.sz / p.sz; pass = r <= .92; str = r <= .8; msg = r <= 1.02 ? `「${n.L}」와 「${p.L}」의 크기가 거의 같아서 거리 차이가 안 느껴져요.` : `「${n.L}」가 「${p.L}」보다 커요. 더 가까운 「${p.L}」가 더 커야 해요.`; }
      else if(t === 'order'){ pass = p.z > n.z; str = true; msg = `「${p.L}」가 「${n.L}」보다 앞에 있어야 해요. 앞에 있는 것이 뒤의 것을 가려요.`; }
      else if(t === 'bri'){ const d = p.bri - n.bri; pass = d >= .06; str = d >= .14; msg = d > -.02 ? `「${n.L}」와 「${p.L}」의 밝기가 거의 같아요. 멀수록 더 어둡게!` : `「${n.L}」가 「${p.L}」보다 밝아요. 먼 「${n.L}」를 더 어둡게!`; }
      else if(t === 'blur'){ const d = n.blur - p.blur; pass = d >= .3; str = d >= 1; msg = d > -.1 ? `「${n.L}」와 「${p.L}」의 흐림이 거의 같아요. 멀수록 더 뿌옇게!` : `「${n.L}」가 「${p.L}」보다 또렷해요. 먼 「${n.L}」를 더 흐리게!`; }
      else if(t === 'y'){ const d = p.y - n.y; pass = d >= 15; str = d >= 50; msg = `「${n.L}」가 「${p.L}」보다 지평선에 더 가까이(화면 위쪽에) 있어야 해요.`; }
      else if(t === 'spd'){ const d = p.spd - n.spd; pass = d >= .08; str = d >= .2; msg = d > -.02 ? `「${n.L}」와 「${p.L}」가 거의 똑같이 움직여요. 먼 것은 더 천천히!` : `「${n.L}」가 「${p.L}」보다 많이 움직여요. 먼 「${n.L}」를 더 천천히!`; }
      if(!pass){ ok = false; fail = fail || `${CUE[t].ic} ${msg}`; }
      if(!str) st = false;
    }
    if(ok && st) strong++;
  }
  if(fail){
    SND.bad();
    $('#rsStars').innerHTML = '🤔'; $('#rsT').textContent = '아직 거리가 헷갈려요';
    $('#rsP').textContent = fail;
    $('#rsBtns').innerHTML = `<button class="pri" onclick="closeM('resultM')">고치러 가기</button>`;
    openM('resultM'); return;
  }
  const stars = strong === total ? 3 : strong * 2 >= total ? 2 : 1;
  const p = prog(); const first = !p[curM]; p[curM] = Math.max(p[curM] || 0, stars); store('space-missions', p);
  SND.ok(); for(let i = 0; i < stars; i++) SND.star(i);
  $('#rsStars').innerHTML = '★'.repeat(stars) + `<span class="off">${'★'.repeat(3 - stars)}</span>`;
  $('#rsT').textContent = stars === 3 ? '깊이가 확 살아났어요!' : '거리가 생겼어요!';
  $('#rsP').innerHTML = (stars < 3 ? '차이를 조금 더 크게 벌리면 별 셋이에요. ' : '') + '<br><b>「마법 끄고 보기」를 누르고 있으면</b> 원래 납작했던 모습이 보여요.';
  const last = curM === MS.length - 1;
  $('#rsBtns').innerHTML = `<button id="rsOff">👁 마법 끄고 보기</button><button class="ghost" onclick="closeM('resultM')">더 고치기</button>` +
    (last ? `<button class="pri" onclick="closeM('resultM');go('studio')">🎬 스튜디오로!</button>` : `<button class="pri" onclick="closeM('resultM');startMission(${curM + 1})">다음 판 ▶</button>`);
  holdBtn($('#rsOff'), on => {
    const S2 = stages.mission;
    if(on){ const os = S2.scene.objs; MOFF = {sz: os.reduce((a, o) => a + o.sz, 0) / os.length, spd: os.reduce((a, o) => a + o.spd, 0) / os.length, y: os.reduce((a, o) => a + o.y, 0) / os.length}; $('#resultM').style.opacity = .12; }
    else $('#resultM').style.opacity = '';
    S2.magicOff = on;
  });

  if(first && last) toast('🏆 훈련소를 모두 마쳤어요! 이제 스튜디오에서 나만의 우주를 연출해요', 4000);
}

}

  if(!THUMB[k]){ const s = SPR[k] || (SPR[k] = PAINT[k]()); const r = Math.min(96 / s.width, 86 / s.height); THUMB[k] = mk(96, 86, g => g.drawImage(s, (96 - s.width * r) / 2, (86 - s.height * r) / 2, s.width * r, s.height * r)).toDataURL(); }
  return THUMB[k];
}
const BGTH = {};
function bgThumb(id){
  if(!BGTH[id]){ const B = getBG(id); BGTH[id] = mk(160, 90, g => { g.scale(160 / W, 90 / H); for(const L of B.layers) g.drawImage(L.c, -MG, -MG); if(B.fg) g.drawImage(B.fg, -MG, -MG); }).toDataURL('image/jpeg', .8); }
  return BGTH[id];
}

(() => {
  const cv = $('#cvStudio'), P = new Map(); let drag = null, pinch = null;
  cv.addEventListener('pointerdown', e => {
    const st = S(); cv.setPointerCapture(e.pointerId);
    P.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if(st.play){ drag = {pan: true, sx: e.clientX, sy: e.clientY, ux: st.user.x, uy: st.user.y}; return; }
    if(P.size === 2 && st.sel){
      const [a, b] = [...P.values()];
      pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), ang: Math.atan2(b.y - a.y, b.x - a.x), size: st.sel.size, rot: st.sel.rot || 0}; drag = null; return;
    }
    if(P.size > 1) return;
    const p = st.toL(e), o = st.hit(p, performance.now() / 1000);
    if(o){ const changed = st.sel !== o; st.sel = o; drag = {dx: p.x - o.x, dy: p.y - o.y}; if(changed){ SND.tap(); renderObjbar(); } }
    else if(st.sel){ st.sel = null; renderObjbar(); }
  });
  cv.addEventListener('pointermove', e => {
    if(!P.has(e.pointerId)) return;
    P.set(e.pointerId, {x: e.clientX, y: e.clientY});
    const st = S();
    if(drag && drag.pan){ const r = cv.getBoundingClientRect(); st.user.x = clamp(drag.ux - (e.clientX - drag.sx) / r.width * 3, -1.3, 1.3); st.user.y = clamp(drag.uy - (e.clientY - drag.sy) / r.height * 3, -1.3, 1.3); return; }
    if(pinch && P.size >= 2 && st.sel){
      const [a, b] = [...P.values()];
      st.sel.size = clamp(pinch.size * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 40, 900);
      st.sel.rot = pinch.rot + Math.atan2(b.y - a.y, b.x - a.x) - pinch.ang; return;
    }
    if(drag && st.sel){ const p = st.toL(e); st.sel.x = clamp(p.x - drag.dx, -100, W + 100); st.sel.y = clamp(p.y - drag.dy, -100, H + 100); }
  });
  const end = e => {
    P.delete(e.pointerId);
    const st = S();
    if(drag && drag.pan){ st.user = {x: 0, y: 0}; }
    if(pinch && P.size < 2){ pinch = null; renderObjbar(); }
    if(!P.size){ if(drag && !drag.pan) saveScene(); drag = null; }
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
})();

function fitMini(){ const c = MINI.cv, dpr = Math.min(2, devicePixelRatio || 1); c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr; MINI.dpr = dpr; }
const MM = {l: 14, r: 14, t: 26, b: 34};
function miniPos(o, w, h){ return {x: MM.l + clamp(o.x / W, 0, 1) * (w - MM.l - MM.r), y: MM.t + (1 - o.d) * (h - MM.t - MM.b)}; }
function drawMini(){
  const c = MINI.cv, g = c.getContext('2d'), dpr = MINI.dpr || 1, w = c.width / dpr, h = c.height / dpr;
  if(!w) return;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const top = MM.t, bh = (h - MM.t - MM.b) / 3;
  ['뒷줄', '가운데줄', '앞줄'].forEach((n, i) => { g.fillStyle = i % 2 ? 'rgba(110,231,249,.06)' : 'rgba(110,231,249,.12)'; g.fillRect(MM.l - 6, top + i * bh - 6, w - MM.l - MM.r + 12, bh); g.fillStyle = '#98a4d4'; g.font = '11px "Noto Sans KR"'; g.textAlign = 'right'; g.fillText(n, w - 8, top + i * bh + 6); });
  g.fillStyle = '#eef2ff'; g.font = '700 12px "Noto Sans KR"'; g.textAlign = 'left'; g.fillText('🗺 위에서 본 모습', 8, 16);
  g.textAlign = 'center'; g.font = '14px sans-serif'; g.fillText('👀 보는 사람', w / 2, h - 8);
  const st = S();
  for(const o of st.scene.objs.slice().sort((a, b) => b.d - a.d)){
    const p = miniPos(o, w, h), s = sprite(o); if(!s) continue;
    const r = Math.min(26 / s.width, 26 / s.height);
    g.drawImage(s, p.x - s.width * r / 2, p.y - s.height * r / 2, s.width * r, s.height * r);
    if(st.sel === o){ g.strokeStyle = '#ffcc4d'; g.lineWidth = 2; circ(g, p.x, p.y, 17); g.stroke(); }
  }
}
(() => {
  const c = MINI.cv; let drag = null;
  const pos = e => { const r = c.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top, w: r.width, h: r.height}; };
  c.addEventListener('pointerdown', e => {

/* 설계도 */
function wrap(g, text, x, y, maxW, lh){
  let line = '', yy = y;
  for(const ch of text){ const t = line + ch; if(g.measureText(t).width > maxW && line){ g.fillText(line, x, yy); line = ch; yy += lh; } else line = t; }
  if(line){ g.fillText(line, x, yy); yy += lh; }
  return yy;
}

  im.onload = () => {
    const s = Math.min(1, 640 / Math.max(im.width, im.height));
    ER.c.width = Math.round(im.width * s); ER.c.height = Math.round(im.height * s);
    ER.g.drawImage(im, 0, 0, ER.c.width, ER.c.height); URL.revokeObjectURL(url);
    ER.undo = []; erMode('wand'); openM('eraser');
  };
  im.onerror = () => toast('사진을 열지 못했어요');
  im.src = url;
});
function erMode(m){ ER.mode = m; $('#erWand').classList.toggle('on', m === 'wand'); $('#erBrush').classList.toggle('on', m === 'brush'); }
function erPush(){ ER.undo.push(ER.g.getImageData(0, 0, ER.c.width, ER.c.height)); if(ER.undo.length > 12) ER.undo.shift(); }
function erUndo(){ const d = ER.undo.pop(); if(d){ ER.g.putImageData(d, 0, 0); SND.tap(); } }
function flood(id, sx, sy, tol){
  const w = id.width, h = id.height, d = id.data, i0 = (sy * w + sx) * 4;
  const r0 = d[i0], g0 = d[i0 + 1], b0 = d[i0 + 2], t2 = tol * tol * 3;
  const seen = new Uint8Array(w * h), st = [sy * w + sx]; seen[sy * w + sx] = 1;
  while(st.length){
    const p = st.pop(), k = p * 4, dr = d[k] - r0, dg = d[k + 1] - g0, db = d[k + 2] - b0;
    if(d[k + 3] === 0 || dr * dr + dg * dg + db * db <= t2){
      d[k + 3] = 0;
      const x = p % w, y = (p / w) | 0;
      if(x > 0 && !seen[p - 1]){ seen[p - 1] = 1; st.push(p - 1); }
      if(x < w - 1 && !seen[p + 1]){ seen[p + 1] = 1; st.push(p + 1); }
      if(y > 0 && !seen[p - w]){ seen[p - w] = 1; st.push(p - w); }
      if(y < h - 1 && !seen[p + w]){ seen[p + w] = 1; st.push(p + w); }
    }
  }
}
function erEdge(){
  erPush(); const w = ER.c.width, h = ER.c.height, id = ER.g.getImageData(0, 0, w, h), tol = +$('#erTol').value;
  for(const [x, y] of [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1], [w >> 1, 0], [w >> 1, h - 1], [0, h >> 1], [w - 1, h >> 1]]) if(id.data[(y * w + x) * 4 + 3]) flood(id, x, y, tol);
  ER.g.putImageData(id, 0, 0); SND.pop();
}
(() => {
  const c = ER.c; let down = false;
  const pt = e => { const r = c.getBoundingClientRect(); return {x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height, s: c.width / r.width}; };
  const rub = p => { const g = ER.g; g.save(); g.globalCompositeOperation = 'destination-out'; circ(g, p.x, p.y, 16 * p.s); g.fill(); g.restore(); };
  c.addEventListener('pointerdown', e => {
    const p = pt(e); c.setPointerCapture(e.pointerId); erPush();
    if(ER.mode === 'wand'){ const id = ER.g.getImageData(0, 0, c.width, c.height); flood(id, clamp(p.x | 0, 0, c.width - 1), clamp(p.y | 0, 0, c.height - 1), +$('#erTol').value); ER.g.putImageData(id, 0, 0); SND.pop(); }
    else { down = true; rub(p); }
  });
  c.addEventListener('pointermove', e => { if(down) rub(pt(e)); });
  c.addEventListener('pointerup', () => { down = false; });
})();
function erDone(){
  const w = ER.c.width, h = ER.c.height, d = ER.g.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++) if(d[(y * w + x) * 4 + 3] > 12){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
  if(x1 < 0){ toast('다 지워져 버렸어요. 되돌리기를 눌러 보세요'); return; }
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const out = mk(cw, ch, g => g.drawImage(ER.c, x0, y0, cw, ch, 0, 0, cw, ch));
  const id = 'p' + Date.now().toString(36);
  PHOTOS[id] = out;
  let url = out.toDataURL('image/webp', .85); if(url.indexOf('image/webp') < 0) url = out.toDataURL('image/png');
  PHOTO_URL[id] = url;
  closeM('eraser'); curCat = 'mine'; renderPalette(); addObj('photo', id);
  toast('🧑‍🚀 내 작품이 우주에 떴어요! 거리를 바꿔 보세요');
}

/* ───────── 무대 모드 ───────── */
stages.stage = new Stage($('#cvStage'), {cover: true});
const SM = {what: 'scene', bgi: 0, slow: true, hideT: 0};
function enterStage(){
  const st = stages.stage;
  st.scene = S().scene; st.play = true; st.sel = null; st.hideObjs = SM.what === 'bg';
  st.speed = SM.slow ? .55 : 1.1; resetTilt();
  SM.bgi = Math.max(0, BGS.findIndex(b => b.id === st.scene.bg));
  smLabels(); showSmbar();
  fullScreen();
}
function leaveStage(){ go('studio'); }
function smLabels(){
  $('#smWhat').textContent = SM.what === 'scene' ? '🪐 내 장면' : '🌌 배경만';
  $('#smBgName').textContent = BGS[SM.bgi].n;
  $('#smSpd').textContent = SM.slow ? '🐢 천천히' : '🐇 보통';
}
function smToggleWhat(){ SM.what = SM.what === 'scene' ? 'bg' : 'scene'; stages.stage.hideObjs = SM.what === 'bg'; smLabels(); SND.tap(); showSmbar(); }
function smBg(dir){ SM.bgi = (SM.bgi + dir + BGS.length) % BGS.length; S().scene.bg = BGS[SM.bgi].id; saveScene(); smLabels(); SND.whoosh(); showSmbar(); }
function smSpeed(){ SM.slow = !SM.slow; stages.stage.speed = SM.slow ? .55 : 1.1; smLabels(); SND.tap(); showSmbar(); }
function fullScreen(){ const el = document.documentElement; if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {}); setTimeout(fitAll, 300); }
function showSmbar(){ $('#smbar').classList.remove('hide'); clearTimeout(SM.hideT); SM.hideT = setTimeout(() => $('#smbar').classList.add('hide'), 3500); }
$('#cvStage').addEventListener('pointerdown', showSmbar);
document.addEventListener('fullscreenchange', () => setTimeout(fitAll, 120));

/* 시작 */
loadScene();
fitAll();
requestAnimationFrame(loop);
</script>
