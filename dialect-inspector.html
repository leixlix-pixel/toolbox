<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>말 심사실 — 표준어와 방언</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --ink:#1b2a33; --navy:#1a3a52; --acc:#2f7d75; --red:#b83227; --gold:#c8892a;
  --line:#c8d3da; --muted:#6b7c88; --tint:#f1f7f6; --tint2:#fdf6ec; --paper:#fff;
}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Noto Sans KR',sans-serif; color:var(--ink); background:#e7ecef;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none;
  font-size:17px; line-height:1.5;
}
button{font-family:inherit; cursor:pointer; border:0}

#app{max-width:860px; margin:0 auto; min-height:100%; background:var(--paper); display:flex; flex-direction:column}

/* ── 홈 ── */
.home{padding:34px 22px 40px; display:flex; flex-direction:column; gap:16px; align-items:center; text-align:center}
.home .stamp{
  width:96px; height:96px; border-radius:50%; border:4px double var(--red); color:var(--red);
  display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:900;
  transform:rotate(-12deg); letter-spacing:-1px; margin-bottom:4px;
}
.home h1{margin:0; font-size:30px; font-weight:900; letter-spacing:-1px}
.home .sub{margin:0; font-size:16px; color:var(--muted); line-height:1.7; max-width:520px}
.home .sub b{color:var(--navy)}
.big{
  min-height:56px; padding:15px 40px; border-radius:12px; background:var(--navy); color:#fff;
  font-size:19px; font-weight:700; margin-top:6px;
}
.ghost{min-height:48px; padding:12px 24px; border-radius:10px; background:#eef3f5; color:var(--navy); font-size:16px; font-weight:700}
.tiny{font-size:13px; color:var(--muted); background:none; padding:8px 12px; min-height:44px}
.steplist{width:100%; max-width:520px; display:flex; flex-direction:column; gap:7px; margin-top:8px; text-align:left}
.sl{display:flex; align-items:center; gap:11px; padding:11px 14px; border:1.5px solid var(--line); border-radius:10px; font-size:15px}
.sl i{
  flex:0 0 auto; width:27px; height:27px; border-radius:50%; background:var(--tint); color:var(--acc);
  font-style:normal; font-weight:900; font-size:14px; display:flex; align-items:center; justify-content:center;
}
.sl.ok{border-color:#9fd3bd; background:#f4fbf8}
.sl.ok i{background:var(--acc); color:#fff}
.sl span{flex:1}
.sl em{font-style:normal; font-size:13px; color:var(--muted)}

/* ── 단계 화면 ── */
.top{
  flex:0 0 auto; background:var(--navy); color:#fff; padding:13px 18px;
  display:flex; align-items:center; gap:13px; position:sticky; top:0; z-index:5;
}
.top .no{
  flex:0 0 auto; width:33px; height:33px; border-radius:9px; background:#ffd76e; color:var(--navy);
  font-size:17px; font-weight:900; display:flex; align-items:center; justify-content:center;
}
.top .tt{flex:1; min-width:0}
.top .tu{font-size:11px; color:#a9c7d8; letter-spacing:1px}
.top .th{font-size:18px; font-weight:700; letter-spacing:-.4px}
.top .quit{background:rgba(255,255,255,.14); color:#fff; border-radius:8px; padding:9px 13px; font-size:14px; min-height:44px}

.body{flex:1; padding:18px 16px 110px; display:flex; flex-direction:column; gap:14px}
.qask{font-size:19px; font-weight:700; color:var(--navy); line-height:1.45}
.qsub{font-size:15px; color:var(--muted); line-height:1.6; margin-top:-6px}
.doc{
  background:var(--tint2); border-left:4px solid var(--gold); border-radius:0 9px 9px 0;
  padding:13px 15px; font-size:15.5px; line-height:1.7;
}
.doc b{color:var(--red)}
.doc .dh{font-size:12px; font-weight:700; color:var(--gold); letter-spacing:1px; margin-bottom:5px}

/* 칩 */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  padding:11px 15px; min-height:48px; border-radius:11px; border:2px solid var(--line); background:#fff;
  font-size:17px; font-weight:700; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:1px;
}
.chip small{font-size:12px; font-weight:400; color:var(--muted)}
.chip.sel{border-color:var(--navy); background:#eaf1f6; box-shadow:0 0 0 3px rgba(26,58,82,.13)}
.chip.used{opacity:.32}

/* 분류 칸 */
.bins{display:flex; flex-direction:column; gap:10px; flex:1 1 auto}
.bins.h{flex-direction:row; flex-wrap:wrap}
.bin{
  flex:1; min-width:0; border:2px dashed #a8bcc6; border-radius:12px; padding:10px 12px 12px;
  display:flex; flex-direction:column; gap:7px; min-height:92px; background:#fafcfd;
}
.bin.act{border-color:var(--navy); border-style:solid; background:#eef4f8}
.bin .bh{font-size:15px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:6px}
.bin .bh em{font-style:normal; font-size:12px; color:var(--muted); font-weight:400}
.bin .bi{display:flex; flex-wrap:wrap; gap:6px}

/* 배열 슬롯 */
.slots{display:flex; flex-direction:column; gap:8px}
.slot{
  display:flex; align-items:center; gap:11px; border:2px solid var(--line); border-radius:11px;
  padding:11px 14px; min-height:54px; background:#fff; font-size:16px;
}
.slot i{
  flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--tint); color:var(--acc);
  font-style:normal; font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center;
}
.slot span{flex:1; color:var(--ink)}
.slot.empty span{color:#b3c1c9}
.slot.act{border-color:var(--navy); background:#eef4f8}
.slot button{background:none; color:var(--muted); font-size:19px; padding:6px 8px; min-height:44px}

/* 짝짓기 */
.pairs{display:flex; flex-direction:column; gap:9px}
.pair{display:flex; gap:9px; align-items:stretch}
.pl{
  flex:1; border:2px solid var(--line); border-radius:11px; padding:11px 13px; background:#fff;
  font-size:16px; display:flex; align-items:center; min-height:56px; text-align:left;
}
.pl.sel{border-color:var(--navy); background:#eef4f8}
.pr{
  flex:0 0 40%; border:2px dashed #a8bcc6; border-radius:11px; padding:11px 13px; background:#fafcfd;
  font-size:15px; font-weight:700; color:var(--navy); display:flex; align-items:center; min-height:56px; text-align:left;
}
.pr.empty{color:#b3c1c9; font-weight:400}
.pr.act{border-color:var(--navy); border-style:solid; background:#eef4f8}

/* OX 목록 */
.oxs{display:flex; flex-direction:column; gap:8px}
.oxr{display:flex; align-items:center; gap:10px; border:2px solid var(--line); border-radius:11px; padding:10px 12px; background:#fff}
.oxr .t{flex:1; font-size:15.5px; line-height:1.5}
.oxr .t b{color:var(--navy)}
.oxr .t em{font-style:normal; color:var(--muted); font-size:14px}
.oxb{display:flex; gap:5px; flex:0 0 auto}
.oxb button{width:46px; height:46px; border-radius:9px; background:#eef3f5; color:#9db0ba; font-size:19px; font-weight:900}
.oxb button.on{background:var(--navy); color:#fff}

/* 문장 채우기 */
.fill{font-size:20px; line-height:2.1; font-weight:700; color:var(--navy); text-align:center; padding:6px 0}
.blank{
  display:inline-block; min-width:76px; border-bottom:3px solid var(--navy); margin:0 4px; padding:0 7px;
  color:var(--red); text-align:center;
}
.blank.empty{border-bottom-color:#b3c1c9}
.blank.act{background:#eef4f8}
.words{font-size:18px; line-height:2.2; text-align:center; padding:4px 0}
.wtok{display:inline-block; padding:4px 7px; border-radius:7px; margin:0 1px}
.wtok.sel{background:#ffe9a8; box-shadow:0 0 0 2px var(--gold)}

/* 아래 고정 바 */
.bar{
  position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.97); border-top:1.5px solid var(--line);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom)); display:flex; gap:10px; align-items:center;
  max-width:860px; margin:0 auto; box-shadow:0 -3px 14px rgba(0,0,0,.07);
}
.bar .hint{flex:1; font-size:13.5px; color:var(--muted); line-height:1.4}
.bar .go{
  min-height:52px; padding:13px 30px; border-radius:11px; background:var(--navy); color:#fff;
  font-size:17px; font-weight:700; flex:0 0 auto;
}
.bar .go[disabled]{background:#c7d2d8; color:#fff}
.bar .undo{min-height:52px; padding:13px 17px; border-radius:11px; background:#eef3f5; color:var(--navy); font-size:15px; font-weight:700}

/* 채점 결과 */
.judge{display:flex; flex-direction:column; gap:11px}
.verdict{
  display:flex; align-items:center; gap:13px; padding:15px 17px; border-radius:13px;
  font-size:20px; font-weight:900;
}
.verdict.ok{background:#e9f7f0; color:#1e6b4f}
.verdict.no{background:#fdeeec; color:var(--red)}
.verdict i{font-style:normal; font-size:27px}
.why{display:flex; flex-direction:column; gap:8px}
.wi{border:1.5px solid var(--line); border-radius:11px; padding:11px 13px; font-size:15px; line-height:1.6}
.wi.bad{border-color:#e8bfb8; background:#fdf6f5}
.wi .wh{font-weight:700; color:var(--navy); margin-bottom:3px; font-size:16px}
.wi .wh em{font-style:normal; color:var(--red); font-size:14px; font-weight:400; margin-left:6px}

/* 끝 화면 */
.end{padding:30px 22px 44px; display:flex; flex-direction:column; gap:15px; align-items:center; text-align:center}
.score{font-size:46px; font-weight:900; color:var(--navy); letter-spacing:-2px}
.score small{font-size:19px; color:var(--muted); font-weight:400}
.weak{width:100%; max-width:520px; text-align:left; display:flex; flex-direction:column; gap:7px}
.wk{display:flex; gap:10px; align-items:center; padding:10px 13px; border-radius:9px; background:#fdf6f5; font-size:15px}
.wk i{font-style:normal; color:var(--red); font-weight:900}
.last{
  max-width:520px; background:var(--tint2); border-left:4px solid var(--gold); border-radius:0 9px 9px 0;
  padding:15px 17px; font-size:16px; line-height:1.75; text-align:left;
}
.last b{color:var(--red)}
.qr{margin-top:6px; display:flex; flex-direction:column; align-items:center; gap:6px}
.qr svg{width:118px; height:118px; border:3px solid #eef3f5; border-radius:11px; background:#fff}
.qr div{font-size:11px; color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ══════════════════ 데이터 ══════════════════
   문항 재료는 전부 교과서·학습지에 나온 것만 썼다(쪽수는 03 학습지와 같다).
   찍기로 뚫는 평균 시도를 10회 위로 올리려고 모든 단계를 분류·배열·짝짓기로 만들었다.
   근거는 루트의 NOTES-slow-by-design.md. 3지선다로 되돌리지 말 것. */

/* ── 1단계 · 심사대 ── */
const W1_BINS = ['처음부터 표준어', '나중에 표준어가 됐다', '아직 방언이다'];
const W1 = [
 {w:'쌀팔다', d:'쌀을 돈 주고 사다', c:0, why:'사전에 <b>처음부터</b> 올라 있는 표준어예요. 뜻이 지금 우리가 아는 것과 반대라서 방언처럼 보이지만, 옛날에는 쌀을 살 때 “쌀 팔러 간다”고 했대요.'},
 {w:'부추', d:'', c:0, why:'표준어예요. 지역마다 정구지·세우리처럼 다르게 부르는데, 표준어로 정한 것은 <b>부추 하나</b>예요.'},
 {w:'가장자리', d:'', c:0, why:'표준어예요. 충청 지역에서는 <b>가생이</b>라고 해요(교과서 119쪽).'},
 {w:'개구리', d:'', c:0, why:'표준어예요. <b>까구리</b>는 아직 방언이에요.'},
 {w:'짜장면', d:'', c:1, why:'<b>2011년</b>에 표준어가 됐어요. 그전에는 자장면만 맞았는데, 사람들이 끝까지 짜장면이라고 해서 규칙이 바뀌었어요.'},
 {w:'맨날', d:'날마다', c:1, why:'<b>2011년</b>에 표준어가 됐어요. 그전에는 만날만 맞았어요.'},
 {w:'삐지다', d:'토라지다', c:1, why:'<b>2014년</b>에 표준어가 됐어요.'},
 {w:'꼬시다', d:'남을 꾀다', c:1, why:'<b>2014년</b>에 표준어가 됐어요.'},
 {w:'이쁘다', d:'예쁘다', c:1, why:'<b>2015년</b>에 표준어가 됐어요. 그전에는 예쁘다만 맞았어요.'},
 {w:'멍게', d:'바다에 사는 동물', c:1, why:'원래 <b>경상 지역 방언</b>이었는데 표준어가 됐어요(교과서 115쪽). 원래 표준어는 우렁쉥이예요.'},
 {w:'정구지', d:'부추', c:2, why:'경상 지역에서 부추를 이르는 말이에요. <b>아직 방언</b>이에요(교과서 116쪽).'},
 {w:'억수로', d:'아주, 매우', c:2, why:'경상 지역에서 쓰는 말이에요. 아주 많은 사람이 쓰는데도 <b>아직 방언</b>이에요(교과서 121쪽).'},
 {w:'옥시기', d:'옥수수', c:2, why:'옥수수를 이르는 방언이에요.'},
 {w:'가생이', d:'가장자리', c:2, why:'충청 지역에서 쓰는 말이에요(교과서 119쪽).'},
 {w:'까구리', d:'개구리', c:2, why:'개구리를 이르는 방언이에요.'}
];

/* ── 2단계 · 연표 ── */
const W2 = [
 {t:'조선어학회가 표준어 규정을 처음 만들었다', y:1936, why:'<b>1936년</b>이에요. 나라를 빼앗겼던 때에 우리말을 지키려고 표준을 세웠어요.'},
 {t:'제주어가 유네스코 소멸 위기 언어로 분류됐다', y:2010, why:'<b>2010년</b>이에요. 그것도 “아주 심각한 위기” 단계였어요(4차시).'},
 {t:'짜장면 · 맨날이 표준어가 됐다', y:2011, why:'<b>2011년</b>이에요.'},
 {t:'삐지다 · 꼬시다가 표준어가 됐다', y:2014, why:'<b>2014년</b>이에요.'},
 {t:'이쁘다 · 마실 · 찰지다가 표준어가 됐다', y:2015, why:'<b>2015년</b>이에요.'}
];
const W2_DOC = '표준어 규정을 <b>처음</b> 만든 것은 조선어학회예요. <b>나라를 빼앗겼던 때</b>에 우리말을 지키려고 표준을 세웠지요.<br><br>제주어가 소멸 위기 언어로 분류된 것은 <b>짜장면이 표준어가 되기 한 해 전</b> 일이에요.';

/* ── 3단계 · 말 지도 ── */
const W3_BINS = ['경상 지역 말', '지리산 마을 말', '충청 지역 말', '제주 지역 말'];
const W3 = [
 {w:'억수로', d:'아주, 매우', c:0, p:'121쪽'},
 {w:'할매', d:'할머니', c:0, p:'113쪽'},
 {w:'국시', d:'국수', c:0, p:'113쪽'},
 {w:'잡샀니껴', d:'잡수셨습니까', c:0, p:'113쪽'},
 {w:'자장구', d:'자전거', c:1, p:'129쪽'},
 {w:'바쿠', d:'바퀴', c:1, p:'129쪽'},
 {w:'뭣이여', d:'무엇이야', c:1, p:'129쪽'},
 {w:'그러니께', d:'그러니까', c:1, p:'129쪽'},
 {w:'대간하다', d:'힘들다, 고단하다', c:2, p:'118쪽'},
 {w:'가생이', d:'가장자리', c:2, p:'119쪽'},
 {w:'그러믄유', d:'그럼요', c:2, p:'118쪽'},
 {w:'어서 오슈', d:'어서 오세요', c:2, p:'111쪽'},
 {w:'혼저', d:'어서, 빨리', c:3, p:'111쪽'},
 {w:'돔베', d:'도마', c:3, p:'125쪽'},
 {w:'숨비소리', d:'해녀가 숨 고르는 소리', c:3, p:'124쪽'},
 {w:'세우리', d:'부추', c:3, p:'2차시'}
];
/* 해설에서 지역 이름을 빼는 대신 말끝을 준다 — 읽어야 가려진다.
   예문은 모두 교과서에 나온 말이고, 문제로 나오는 낱말과 겹치지 않게 골랐다. */
const W3_DOC = '<b>말 카드</b> — 지역마다 <b>말끝</b>이 다릅니다.<br>'
 + '<b>경상</b> 어서 오이소 · 좋아 보이네예 · 잘됐니더 <span style="color:#6b7c88;font-size:13px">(111 · 121 · 113쪽)</span><br>'
 + '<b>지리산 마을</b> 멋져 부러 · 못 보던 양반인디 · 소문이 났겄제 <span style="color:#6b7c88;font-size:13px">(129쪽)</span><br>'
 + '<b>충청</b> 드셨어유? · 힘들진 않았슈? · 내려온 겨? <span style="color:#6b7c88;font-size:13px">(118쪽)</span><br>'
 + '<b>제주</b> 폭싹 속았수다 · ～옵서예 <span style="color:#6b7c88;font-size:13px">(111쪽 · 4차시)</span>';
/* ⚠ 제주 예문을 「혼저 옵서예」로 되돌리지 말 것 — 문제로 나오는 낱말 「혼저」가 그대로 드러난다.
   말끝(～옵서예)만 주고 낱말은 아이가 떠올리게 한다. */

const W3_Q = [
 {q:'부추 · 정구지 · 세우리 — 셋 다 같은 것을 가리켜요. 이 가운데 <b>표준어</b>는?',
  o:['부추','정구지','세우리'], a:0,
  why:'표준어는 <b>부추</b>예요. 정구지는 경상, 세우리는 제주에서 쓰는 말이지요.'},
 {q:'그럼 <b>왜</b> 그 말이 표준어가 됐을까요?',

/* ══════════════════ 아이마다 다른 배치 ══════════════════
   출석번호를 묻지 않는다 — 처음 켤 때 기기마다 임의의 씨앗을 잡아 저장한다.
   같은 기기면 이어하기를 해도 같은 배치가 나온다. */
function rngFrom(seed){
  let x = seed || 1;
  return () => ((x = Math.imul(x ^ x>>>15, 2246822507) ^ Math.imul(x ^ x>>>13, 3266489909)) >>> 0) / 4294967296;
}
function shuffledBy(rnd, arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]] }
  return a;
}
/* 갈래마다 n개씩 뽑아 섞는다 — 정답이 한쪽에 몰리지 않게 */
function pickByClass(rnd, pool, per){
  const by = {};
  pool.forEach(x=>{ (by[x.c] = by[x.c] || []).push(x) });
  let out = [];
  Object.keys(by).forEach(k=>{ out = out.concat(shuffledBy(rnd, by[k]).slice(0, per)) });
  return shuffledBy(rnd, out);
}

const KEY = 'dialect-inspector';

function freshState(){

/* 씨앗에서 이 아이의 문제를 만든다 */
function buildQ(){
  rnd = rngFrom(S.seed);
  Q = {};
  Q.s1 = pickByClass(rngFrom(S.seed ^ 0x11), W1, 3).slice(0,8);
  if(Q.s1.length < 8) Q.s1 = shuffledBy(rngFrom(S.seed^0x11), W1).slice(0,8);
  Q.s2 = shuffledBy(rngFrom(S.seed ^ 0x22), W2);
  Q.s3 = pickByClass(rngFrom(S.seed ^ 0x33), W3, 2);
  Q.s4 = shuffledBy(rngFrom(S.seed ^ 0x44), W4);
  Q.s4t = shuffledBy(rngFrom(S.seed ^ 0x45), W4.map(x=>x.t));
  Q.s5 = shuffledBy(rngFrom(S.seed ^ 0x55), W5_WORDS.map((w,i)=>({w,i})));
  Q.s6 = shuffledBy(rngFrom(S.seed ^ 0x66), W6);
  /* 3단계 뒤 물음의 선택지도 섞는다 — 정답이 늘 첫 자리에 있던 사고가 있었다 */
  Q.s3q = W3_Q.map((q,qi)=>{
    const ord = shuffledBy(rngFrom(S.seed ^ (0x70+qi)), q.o.map((_,i)=>i));
    return { ord, ans: ord.indexOf(q.a) };
  });
}

let ac=null;
function ready(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)() }catch(e){} }
  if(ac && ac.state==='suspended') ac.resume() }
function beep(f,d,v,type){
  if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0,ac.currentTime);
  g.gain.linearRampToValueAtTime(v||.16, ac.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+d+.05);
}

/* ── 단계별 본문 ── */
function bodyHTML(i){
  if(i===0) return binsBody(Q.s1, W1_BINS, '낱말 여덟 개를 심사합니다.',
      '낱말을 누르고, 넣을 칸을 누르세요. 다 넣은 뒤에 한 번에 채점합니다.', null, x=>x.w, x=>x.d);
  if(i===1) return orderBody();
  if(i===2) return S.put && S.put.q3 !== undefined ? q3Body()
      : binsBody(Q.s3, W3_BINS, '이 말들은 어느 지역 말일까요?',
        '낱말을 누르고, 지역 칸을 누르세요. 위 말 카드의 <b>말끝</b>이 실마리입니다.', W3_DOC, x=>x.w, x=>x.d);
  if(i===3) return pairBody();
  if(i===4) return fillBody();
  if(i===5) return binsBody(Q.s6, W6_BINS, '방송 장면 여덟 개를 살펴봅니다.',
      '장면을 누르고, 넣을 칸을 누르세요. 위 규정을 먼저 읽어야 가릴 수 있습니다.', W6_DOC, x=>x.s, null, true);
  return '';
}

/* 분류 ── 탭 → 탭 (드래그는 터치에서 안 먹는다) */
function binsBody(items, bins, ask, sub, doc, label, desc, longText){
  if(!S.put) S.put = { sel:null, map:{} };
  const P = S.put;
  const left = items.map((x,i)=>i).filter(i=>P.map[i]===undefined);
  return (doc?'<div class="doc"><div class="dh">읽고 시작하세요</div>'+doc+'</div>':'')
  + '<div class="qask">'+ask+'</div>'
  + '<div class="qsub">'+sub+'</div>'
  + '<div class="chips">'
  +   left.map(i=>'<button class="chip'+(P.sel===i?' sel':'')+'" onclick="pick('+i+')"'
        + (longText?' style="flex:1 1 100%;text-align:left;align-items:flex-start;font-size:15.5px;font-weight:400;line-height:1.5"':'') + '>'
        + esc(label(items[i])) + (desc && desc(items[i]) ? '<small>'+esc(desc(items[i]))+'</small>' : '') + '</button>').join('')
  +   (left.length?'':'<div class="qsub" style="margin:0">다 넣었어요. 아래 <b>채점하기</b>를 누르세요.</div>')
  + '</div>'
  + '<div class="bins'+(bins.length>2 && !longText?' h':'')+'">'
  +   bins.map((b,bi)=>'<div class="bin'+(P.sel!==null?' act':'')+'" onclick="drop('+bi+')">'
        + '<div class="bh">'+b+'</div><div class="bi">'
        + items.map((x,i)=>P.map[i]===bi
            ? '<button class="chip" style="'+(longText?'flex:1 1 100%;text-align:left;align-items:flex-start;font-size:14.5px;font-weight:400;line-height:1.45;':'')
              + 'padding:7px 11px;min-height:40px;font-size:15px" onclick="event.stopPropagation();unput('+i+')">'
              + esc(label(x)) + '</button>'
            : '').join('')
        + '</div></div>').join('')
  + '</div>';
}
function pick(i){ ready(); sTap(); S.put.sel = (S.put.sel===i?null:i); save(); render() }
function drop(bi){
  const P=S.put; if(P.sel===null) return;
  sTap(); P.map[P.sel]=bi; P.sel=null; save(); render();
}
function unput(i){ sTap(); delete S.put.map[i]; save(); render() }

/* 배열 */
function orderBody(){
  if(!S.put) S.put = { sel:null, slots:[null,null,null,null,null] };
  const P = S.put, used = P.slots.filter(x=>x!==null);
  return '<div class="doc"><div class="dh">심사 기록부 — 읽고 시작하세요</div>'+W2_DOC+'</div>'
  + '<div class="qask">다섯 가지 일을 <b>먼저 일어난 것부터</b> 늘어놓으세요.</div>'
  + '<div class="qsub">카드를 누른 뒤 자리를 누르면 들어갑니다. 연도는 적혀 있지 않습니다.</div>'
  + '<div class="chips">'
  +   Q.s2.map((x,i)=> used.includes(i) ? '' :
        '<button class="chip'+(P.sel===i?' sel':'')+'" style="flex:1 1 100%;text-align:left;align-items:flex-start;font-size:15.5px;font-weight:500;line-height:1.5" onclick="pick2('+i+')">'
        + esc(x.t) + '</button>').join('')
  +   (used.length===5?'<div class="qsub" style="margin:0">다 놓았어요. 아래 <b>채점하기</b>를 누르세요.</div>':'')
  + '</div>'
  + '<div class="slots">'
  +   P.slots.map((v,si)=>'<div class="slot'+(v===null?' empty':'')+(P.sel!==null&&v===null?' act':'')+'" onclick="drop2('+si+')">'
        + '<i>'+(si+1)+'</i><span>'+(v===null?'여기에 놓기':esc(Q.s2[v].t))+'</span>'
        + (v!==null?'<button onclick="event.stopPropagation();unslot('+si+')">✕</button>':'')
        + '</div>').join('')
  + '</div>';
}
function pick2(i){ ready(); sTap(); S.put.sel=(S.put.sel===i?null:i); save(); render() }
function drop2(si){
  const P=S.put; if(P.sel===null || P.slots[si]!==null) return;
  sTap(); P.slots[si]=P.sel; P.sel=null; save(); render();
}
function unslot(si){ sTap(); S.put.slots[si]=null; save(); render() }

/* 3단계 뒤 물음 두 개 */
function q3Body(){
  const P=S.put, k=P.q3;
  const q=W3_Q[k], od=Q.s3q[k];
  return '<div class="qask">'+q.q+'</div>'
  + '<div class="qsub">지도를 다 맞혔어요. 두 가지만 더 물을게요. ('+(k+1)+'/2)</div>'
  + '<div class="chips" style="flex-direction:column">'
  +   od.ord.map((oi,pos)=>'<button class="chip" style="flex:1 1 100%;text-align:left;align-items:flex-start;font-size:17px" onclick="ansQ3('+pos+')">'
        + esc(q.o[oi]) + '</button>').join('')
  + '</div>';
}
function ansQ3(pos){
  const P=S.put, k=P.q3, od=Q.s3q[k];
  const ok = pos===od.ans;
  if(!ok) P.q3bad = true;
  ok ? sOk() : sNo();
  S.judged = { kind:'q3', k, ok, last:(k===1) };
  save(); render();
}

/* 짝짓기 */
function pairBody(){
  if(!S.put) S.put = { sel:null, map:{} };
  const P=S.put;
  const usedT = Object.values(P.map);
  return '<div class="qask">같은 뜻인데 말이 다릅니다. <b>누구에게 하는 말</b>일까요?</div>'
  + '<div class="qsub">왼쪽 말을 누르고, 오른쪽 칸을 누르세요. 여섯 가지 다 <b>틀린 말이 아닙니다.</b></div>'
  + '<div class="pairs">'
  +   Q.s4.map((x,i)=>'<div class="pair">'
        + '<button class="pl'+(P.sel===i?' sel':'')+'" onclick="pick4('+i+')">'+esc(x.s)+'</button>'
        + '<button class="pr'+(P.map[i]===undefined?' empty':'')+(P.sel!==null&&P.map[i]===undefined?' act':'')+'" onclick="'
        + (P.map[i]===undefined?'drop4('+i+')':'unpair('+i+')')+'">'
        + (P.map[i]===undefined?'누구에게?':esc(Q.s4t[P.map[i]])) + '</button>'
        + '</div>').join('')
  + '</div>'
  + '<div class="qsub" style="margin-top:2px">아직 안 쓴 상대</div>'
  + '<div class="chips">'
  +   Q.s4t.map((t,ti)=> usedT.includes(ti) ? '' :
        '<button class="chip'+(P.pick===ti?' sel':'')+'" style="font-size:15px" onclick="pickT('+ti+')">'+esc(t)+'</button>').join('')
  + '</div>';
}
function pick4(i){ ready(); sTap(); S.put.sel=(S.put.sel===i?null:i); S.put.pick=undefined; save(); render() }
function pickT(ti){ ready(); sTap(); S.put.pick=(S.put.pick===ti?undefined:ti); save(); render() }
function drop4(i){
  const P=S.put;
  if(P.pick!==undefined){ P.map[i]=P.pick; P.pick=undefined; P.sel=null; sTap(); save(); render(); return }
  if(P.sel!==null && P.sel!==i){ P.sel=i; save(); render(); return }
  P.sel=i; save(); render();
}
function unpair(i){ sTap(); delete S.put.map[i]; save(); render() }

/* 문장 채우기 */
function fillBody(){
  if(!S.put) S.put = { sel:null, blanks:[null,null,null], phase:0 };
  const P=S.put;
  if(P.phase===1){
    return '<div class="qask">문장을 맞혔어요. 하나만 더.</div>'
    + '<div class="doc"><div class="dh">표준어 규정 제1항</div>'
    +   W5_TOKENS.map((t,i)=>'<span class="wtok">'+t+'</span>').join(' ')
    + '</div>'
    + '<div class="qask" style="margin-top:4px"><b>억수로</b>는 경상 지역에서 아주 많은 사람이 쓰는데도 표준어가 아닙니다.<br>위 문장의 <b>어느 말 때문</b>일까요?</div>'
    + '<div class="qsub">문장에서 낱말 하나를 눌러 고르세요.</div>'
    + '<div class="words">'
    +   W5_TOKENS.map((t,i)=>'<button class="wtok'+(P.pickTok===i?' sel':'')+'" style="background:'+(P.pickTok===i?'#ffe9a8':'#eef3f5')+';font-size:18px;min-height:46px" onclick="pickTok('+i+')">'+t+'</button>').join(' ')
    + '</div>';
  }
  const used = P.blanks.filter(x=>x!==null);
  return '<div class="qask">표준어를 정한 <b>규정 제1항</b>입니다. 빈칸을 채우세요.</div>'
  + '<div class="qsub">낱말을 누르고 빈칸을 누르면 들어갑니다. 쓰지 않는 낱말이 섞여 있습니다.</div>'
  + '<div class="doc"><div class="fill">표준어는 '
  +   '<span class="blank'+(P.blanks[0]===null?' empty':'')+'" onclick="dropB(0)">'+(P.blanks[0]===null?'　　':esc(Q.s5[P.blanks[0]].w))+'</span> 있는 사람들이 두루 쓰는 '
  +   '<span class="blank'+(P.blanks[1]===null?' empty':'')+'" onclick="dropB(1)">'+(P.blanks[1]===null?'　　':esc(Q.s5[P.blanks[1]].w))+'</span> '
  +   '<span class="blank'+(P.blanks[2]===null?' empty':'')+'" onclick="dropB(2)">'+(P.blanks[2]===null?'　　':esc(Q.s5[P.blanks[2]].w))+'</span>말로<br>정함을 원칙으로 한다.'
  + '</div></div>'
  + '<div class="chips">'
  +   Q.s5.map((x,i)=> used.includes(i) ? '' :
        '<button class="chip'+(P.sel===i?' sel':'')+'" onclick="pickB('+i+')">'+esc(x.w)+'</button>').join('')
  + '</div>'
  + (used.length===3?'<div class="qsub">다 채웠어요. 아래 <b>채점하기</b>를 누르세요.</div>':'');
}
function pickB(i){ ready(); sTap(); S.put.sel=(S.put.sel===i?null:i); save(); render() }
function dropB(bi){
  const P=S.put;
  if(P.blanks[bi]!==null){ P.blanks[bi]=null; sTap(); save(); render(); return }
  if(P.sel===null) return;
  P.blanks[bi]=P.sel; P.sel=null; sTap(); save(); render();
}
function pickTok(i){ ready(); sTap(); S.put.pickTok=i; save(); render() }

/* ── 아래 바 ── */
function barHTML(i){
  const P = S.put || {};
  let ready_ = false, hint = '';
  if(i===0){ const n=Object.keys(P.map||{}).length; ready_ = n===8; hint = n+' / 8 넣었어요' }
  if(i===1){ const n=(P.slots||[]).filter(x=>x!==null).length; ready_ = n===5; hint = n+' / 5 놓았어요' }
  if(i===2){
    if(P.q3!==undefined) return '';
    const n=Object.keys(P.map||{}).length; ready_ = n===8; hint = n+' / 8 넣었어요';
  }
  if(i===3){ const n=Object.keys(P.map||{}).length; ready_ = n===6; hint = n+' / 6 짝지었어요' }
  if(i===4){
    if(P.phase===1){ ready_ = P.pickTok!==undefined; hint = ready_?'고른 낱말로 채점합니다':'낱말 하나를 고르세요' }
    else { const n=(P.blanks||[]).filter(x=>x!==null).length; ready_ = n===3; hint = n+' / 3 채웠어요' }
  }
  if(i===5){ const n=Object.keys(P.map||{}).length; ready_ = n===8; hint = n+' / 8 넣었어요' }
  return '<div class="bar">'
  + '<div class="hint">'+hint+'<br><span style="font-size:12px">다 놓은 뒤 한 번에 채점합니다</span></div>'
  + '<button class="go" onclick="grade()"'+(ready_?'':' disabled')+'>채점하기</button>'
  + '</div>';
}

/* ══════════════════ 채점 ══════════════════
   부분 피드백을 주지 말 것 — 놓는 도중에 초록불이 뜨면 조합의 수가 무너진다. */
function grade(){
  const i=S.stage, P=S.put;
  let wrong = [];

  /* 해설에 「→ 정답」을 적지 말 것. 한 번 틀리면 정답이 통째로 공개되어
     두 번째 시도에 무조건 통과한다(2026-09-24 실측 — 찍기 353탭까지 떨어졌다).
     근거만 적고, 어디에 놓을지는 아이가 읽고 정하게 한다. */
  if(i===0) wrong = Q.s1.map((x,k)=>({x,k})).filter(o=>P.map[o.k]!==o.x.c)
      .map(o=>({h:o.x.w, e:'제자리가 아니에요', w:o.x.why}));

  if(i===1){
    const order = W2.slice().sort((a,b)=>a.y-b.y);
    wrong = P.slots.map((v,si)=>({v,si})).filter(o=> Q.s2[o.v].y !== order[o.si].y)
      .map(o=>({h:esc(Q.s2[o.v].t), e:(o.si+1)+'번 자리가 아니에요', w:Q.s2[o.v].why}));
  }

  if(i===2 && P.q3===undefined){
    wrong = Q.s3.map((x,k)=>({x,k})).filter(o=>P.map[o.k]!==o.x.c)
      .map(o=>({h:o.x.w, e:'이 지역 말이 아니에요', w:'뜻은 “'+o.x.d+'” (교과서 '+o.x.p+') — <b>위 말 카드의 말끝</b>을 보고 어느 지역인지 다시 가려 보세요.'}));
    if(!wrong.length){
      /* 지도를 맞히면 물음 두 개로 이어진다 — 정답을 보상으로 주는 것이 아니라 다음 물음으로 넘어갈 뿐이다 */
      P.q3 = 0; P.mapOk = true; sOk(); save(); render(); return;
    }
  }

  if(i===3) wrong = Q.s4.map((x,k)=>({x,k}))
      .filter(o=> Q.s4t[P.map[o.k]] !== o.x.t)
      .map(o=>({h:o.x.s, e:'이 상대가 아니에요', w:'<b>말끝과 높임</b>을 보세요. 줄임말과 이모티콘은 누구에게 쓰는 말일까요? 같은 뜻이라도 <b>누구에게 하느냐</b>에 따라 말이 달라집니다.'}));

  if(i===4){
    if(P.phase===1){
      const ok = P.pickTok===W5_PICK;
      S.judged = { kind:'pick5', ok };
      if(!ok) P.bad5 = true;
      ok?sOk():sNo(); save(); render(); return;
    }
    wrong = P.blanks.map((v,bi)=>({v,bi})).filter(o=> Q.s5[o.v].i !== W5_ANS[o.bi])
      .map(o=>({h:(o.bi+1)+'번 빈칸', e:'이 낱말이 아니에요', w:'1차시에 읽었던 문장이에요. <b>“누가”</b> 쓰는 말인지, <b>“언제”</b>의 말인지, <b>“어디”</b> 말인지 — 세 가지가 차례로 들어갑니다.'}));
    if(!wrong.length){ P.phase=1; sOk(); save(); render(); return }
  }

  if(i===5) wrong = Q.s6.map((x,k)=>({x,k})).filter(o=>P.map[o.k]!==o.x.c)
      .map(o=>({h:o.x.s, e:'다시 보세요', w:o.x.why}));

  const ok = wrong.length===0;
  ok ? sOk() : sNo();
  S.judged = { kind:'stage', ok, wrong };
  save(); render();
}

function judgeHTML(){
  const J = S.judged, i = S.stage;

  if(J.kind==='q3' || J.kind==='pick5'){
    const q = J.kind==='q3' ? W3_Q[J.k] : null;
    const why = q ? q.why
      : '규정 제1항의 <b>“서울말”</b> 때문이에요. 많이 쓰는 말이 아니라 <b>서울에서 쓰는 말</b>을 기준으로 삼았기 때문에, 억수로는 아무리 많은 사람이 써도 표준어가 되지 못했어요.';
    const last = (J.kind==='pick5') || J.last;
    return '<div class="top"><div class="no">'+(i+1)+'</div>'
    + '<div class="tt"><div class="tu">'+(i+1)+' / 6</div><div class="th">'+STAGES[i].n+'</div></div></div>'
    + '<div class="body"><div class="judge">'
    +   '<div class="verdict '+(J.ok?'ok':'no')+'"><i>'+(J.ok?'◎':'✕')+'</i>'+(J.ok?'맞았어요':'아니에요')+'</div>'
    +   '<div class="wi'+(J.ok?'':' bad')+'"><div class="wh">왜 그럴까</div>'+why+'</div>'
    + '</div></div>'
    + '<div class="bar"><div class="hint"></div><button class="go" onclick="'+(last?'nextStage()':'nextQ3()')+'">'+(last?'다음 방으로':'다음 물음')+'</button></div>';
  }

  const again = J.wrong.length;
  return '<div class="top"><div class="no">'+(i+1)+'</div>'
  + '<div class="tt"><div class="tu">'+(i+1)+' / 6</div><div class="th">'+STAGES[i].n+'</div></div></div>'
  + '<div class="body"><div class="judge">'
  +   '<div class="verdict '+(J.ok?'ok':'no')+'"><i>'+(J.ok?'◎':'✕')+'</i>'
  +     (J.ok?'한 번에 통과했어요':again+'개가 제자리가 아니에요')+'</div>'
  +   (J.ok?'' : '<div class="qsub" style="margin:0"><b>아래 풀이를 읽고</b> 다시 놓기를 누르세요. 놓았던 것은 모두 풀립니다 — 읽지 않으면 또 틀립니다.</div>')
  +   '<div class="why">'
  +     J.wrong.map(w=>'<div class="wi bad"><div class="wh">'+esc(w.h)+'<em>'+esc(w.e)+'</em></div>'+w.w+'</div>').join('')
  +   '</div>'
  + '</div></div>'
  + '<div class="bar"><div class="hint"></div>'
  + '<button class="go" onclick="'+(J.ok?'nextStage()':'retry()')+'">'+(J.ok?'다음 방으로':'다시 놓기')+'</button></div>';
}

function nextQ3(){ S.put.q3 = 1; S.judged=null; save(); render() }
function retry(){
  const i=S.stage, P=S.put;
  S.badStage = S.badStage || {};
  S.badStage[i] = true;
  /* ⚠ 틀린 것만 빼 주지 말 것 — 그것이 곧 「이건 맞았어요」라는 부분 피드백이라,
     8개를 3칸에 넣는 6,561가지가 8가지로 무너진다(2026-09-24 실측 · 찍기 268탭).
     통째로 풀고, 어디가 틀렸는지는 <b>해설을 읽어야</b> 알게 둔다.
     읽은 아이에게는 다시 놓는 탭 몇 번이 늘 뿐이고, 찍는 아이만 비싸진다. */
  if(i===0||i===2||i===5) P.map = {};
  if(i===1) P.slots = [null,null,null,null,null];
  if(i===3) P.map = {};
  if(i===4 && P.phase===0) P.blanks = [null,null,null];
  if(i===4 && P.phase===1) P.pickTok = undefined;
  P.sel = null; P.pick = undefined;
  S.judged=null; save(); render();
}
function nextStage(){
  const i=S.stage;
  const clean = !(S.badStage && S.badStage[i]) && !(S.put && (S.put.q3bad || S.put.bad5));
  S.first[i] = clean;
  S.judged=null; S.put=null;
  if(i===5){ S.done=true; sDone() } else S.stage=i+1;
  save(); render();
}

/* ══════════════════ 끝 화면 ══════════════════ */
function endHTML(){
  const n = S.first.filter(Boolean).length;
  const weak = STAGES.map((s,i)=>({s,i})).filter(o=>!S.first[o.i]);
  return '<div class="end">'
  + '<div class="stamp" style="width:84px;height:84px;font-size:26px">審</div>'
  + '<h1 style="margin:0;font-size:25px;font-weight:900">심사를 마쳤습니다</h1>'
  + '<div class="score">'+n+'<small> / 6 방을 한 번에</small></div>'
  + (weak.length
      ? '<div class="weak"><div style="font-size:14px;color:var(--muted);margin-bottom:3px">다시 놓았던 방</div>'
        + weak.map(o=>'<div class="wk"><i>'+(o.i+1)+'</i>'+o.s.n+' — '+o.s.sub+'</div>').join('') + '</div>'
      : '<div class="qsub">여섯 방을 모두 한 번에 통과했어요.</div>')
  + '<div class="last">'
  +   '<b>이제 공책에 씁니다.</b><br>'
  +   '① 내가 표준어를 정하는 사람이라면, <b>무엇을 기준</b>으로 정할까? 규정 제1항과 다르게 정해도 좋습니다.<br>'
  +   '② 「억수로」를 표준어로 <b>만들어 준다면</b> 무엇이 좋아지고, 무엇이 불편해질까?'
  + '</div>'
  + '<button class="ghost" onclick="again()">한 번 더 — 이번엔 한 번도 안 틀리기</button>'
  + '<button class="tiny" onclick="askWipe()">기록 지우기</button>'
  + '<div class="qsub" style="max-width:520px">순위도 시간도 없습니다. 빨리 끝내는 것은 자랑이 아니에요.</div>'
  + '</div>';
}
function again(){
  /* 2회차는 같은 씨앗을 쓴다 — 같은 문제를 한 번도 안 틀리고 지나는 것이 조건이다 */
  const seed = S.seed;
  S = freshState(); S.seed = seed;
  buildQ(); save(); render();
}

/* ══════════════════ 시작 ══════════════════ */
load();
if(S) buildQ();
render();
</script>
</body>
</html>
