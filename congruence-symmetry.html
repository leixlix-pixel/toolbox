<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>합동과 대칭 — 포개면 딱 맞는다</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f172a; --navy:#1e3a8a; --navy2:#3b82f6; --red:#dc2626;
  --gold:#f59e0b; --green:#10b981; --purple:#a855f7;
  --paper:#fdfcf8; --line:#d8d3c4; --muted:#6b7280;
  --acc:var(--navy2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#111827}
body{
  font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  user-select:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
}

/* ── 고정 무대 ───────────────────────────── */
#wrap{position:relative;width:100%;height:calc(100% - 46px);display:flex;align-items:center;justify-content:center}
#stage{flex:0 0 auto;width:1280px;height:720px;position:relative;transform-origin:center center;background:var(--paper);
  border-radius:6px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.5)}
.slide{position:absolute;inset:0;padding:38px 52px 50px;display:none;flex-direction:column;color:var(--ink)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;left:0;bottom:0;height:7px;width:100%;background:var(--acc)}

/* ── 공통 부품 ───────────────────────────── */
.eyebrow{font-size:19px;font-weight:700;color:var(--acc);letter-spacing:.06em;margin-bottom:6px}
h1{font-size:44px;font-weight:900;line-height:1.22;letter-spacing:-.02em}
h2{font-size:34px;font-weight:900;line-height:1.28;letter-spacing:-.02em}
h3{font-size:24px;font-weight:700;line-height:1.35}
.lead{font-size:22px;line-height:1.6;color:#334155}
b.hl{background:linear-gradient(transparent 58%, #fecaca 58%);font-weight:900;color:var(--red);padding:0 2px}
b.hn{background:linear-gradient(transparent 58%, #bfdbfe 58%);font-weight:900;color:var(--navy);padding:0 2px}
b.hg{background:linear-gradient(transparent 58%, #a7f3d0 58%);font-weight:900;color:#047857;padding:0 2px}
b.hp{background:linear-gradient(transparent 58%, #e9d5ff 58%);font-weight:900;color:#7e22ce;padding:0 2px}
.term{background:#fff;border:2px solid var(--line);border-left:7px solid var(--acc);
  border-radius:8px;padding:12px 18px;font-size:21px;line-height:1.5}
.act{background:#fff8e6;border:2px dashed var(--gold);border-radius:12px;padding:13px 18px;font-size:20px;line-height:1.5}
.warn{background:#fef2f2;border:2px solid #fca5a5;border-left:7px solid var(--red);border-radius:10px;
  padding:12px 18px;font-size:20px;line-height:1.5}
.hand{font-family:'Gaegu',sans-serif;font-size:27px;color:var(--red);line-height:1.3}
.row{display:flex;gap:26px;align-items:center}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-height:0}
.center{align-items:center;justify-content:center;text-align:center}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:19px;font-weight:700;
  border-radius:999px;padding:4px 14px;border:2px solid}
.card{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 16px}
.num{display:inline-flex;align-items:center;justify-content:center;width:31px;height:31px;flex:0 0 31px;
  border-radius:50%;background:var(--acc);color:#fff;font-weight:900;font-size:19px;margin-right:9px}
.big{font-size:30px;font-weight:900}
ul{padding-left:24px}
li{font-size:21px;line-height:1.55;margin-bottom:5px}
table{border-collapse:collapse;width:100%;font-size:20px}
th,td{border:2px solid var(--line);padding:9px 12px;text-align:center}
th{background:#eef2ff;font-weight:900;font-size:20px}

/* 단계 노출 */
[data-step]{opacity:0;transition:opacity .38s ease}
[data-step].vis{opacity:1}

svg.gv{display:block;width:100%;height:auto}

/* 하단 바 */
.bar{height:46px;width:100%;display:flex;align-items:center;justify-content:center;gap:14px;
  background:#111827;color:#e5e7eb;font-size:15px;flex:0 0 46px}
.bar button{font-family:inherit;font-size:15px;font-weight:700;min-height:32px;padding:6px 16px;
  border:0;border-radius:7px;background:#374151;color:#f9fafb;cursor:pointer}
.bar button:active{background:#4b5563}
#cnt{min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
#zl,#zr{position:absolute;top:0;bottom:46px;width:13%;z-index:5;background:transparent}
#zl{left:0} #zr{right:0}
</style>
</head>
<body>

<div id="wrap">
  <div id="stage"></div>
</div>
<div id="zl" onclick="go(-1)"></div>
<div id="zr" onclick="go(1)"></div>

<div class="bar no-print">
  <button onclick="go(-1)">◀ 이전</button>
  <span id="cnt">1 / 15</span>
  <button onclick="go(1)">다음 ▶</button>
  <button onclick="fs()">전체화면</button>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   그리기 도구 — 좌표를 직접 찍지 않고 '변환'으로 만든다.
   합동인 도형은 원본을 돌리거나 뒤집어서, 대칭도형은 반쪽을
   실제로 반사·회전시켜서 만든다. 그래야 그림이 거짓말을
   하지 않는다(눈대중으로 찍으면 미세하게 안 맞는다).
   ══════════════════════════════════════════════════════════ */

const C={ ink:'#0f172a', navy:'#1e3a8a', blue:'#3b82f6', red:'#dc2626',
          gold:'#f59e0b', green:'#10b981', purple:'#a855f7', gray:'#94a3b8',
          line:'#cbd5e1', muted:'#64748b' };

/* 회전 — 점 p 를 중심 c 둘레로 a° (시계방향, 화면좌표) */
const ROT=(p,c,a)=>{const r=a*Math.PI/180,x=p[0]-c[0],y=p[1]-c[1];
  return [c[0]+x*Math.cos(r)-y*Math.sin(r), c[1]+x*Math.sin(r)+y*Math.cos(r)];};
/* 세로직선 x=k 에 대한 반사 */
const MIRX=(p,k)=>[2*k-p[0],p[1]];
/* 가로직선 y=k 에 대한 반사 */
const MIRY=(p,k)=>[p[0],2*k-p[1]];
/* 평행이동 */
const MOV=(p,dx,dy)=>[p[0]+dx,p[1]+dy];
/* 크기 변환(합동이 '아닌' 예를 만들 때만 쓴다) */
const SCL=(p,c,k)=>[c[0]+(p[0]-c[0])*k, c[1]+(p[1]-c[1])*k];
/* 배열 전체에 적용 */
const ALL=(ps,f)=>ps.map(f);
const MID=ps=>[ps.reduce((a,p)=>a+p[0],0)/ps.length, ps.reduce((a,p)=>a+p[1],0)/ps.length];
const PT=ps=>ps.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');

function poly(ps,fill,stroke,w,extra){
  return `<polygon points="${PT(ps)}" fill="${fill||'none'}" stroke="${stroke||C.ink}"
    stroke-width="${w||3}" stroke-linejoin="round" ${extra||''}/>`;
}
function pline(ps,stroke,w,extra){
  return `<polyline points="${PT(ps)}" fill="none" stroke="${stroke}" stroke-width="${w||3}"
    stroke-linejoin="round" stroke-linecap="round" ${extra||''}/>`;
}
function seg(a,b,stroke,w,extra){
  return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"
    stroke="${stroke}" stroke-width="${w||3}" stroke-linecap="round" ${extra||''}/>`;
}
function dot(p,col,r){
  return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r||6.5}" fill="${col}"
    stroke="#fff" stroke-width="2"/>`;
}
function txt(p,s,col,sz,anchor,weight){
  return `<text x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" text-anchor="${anchor||'middle'}"
    font-size="${sz||19}" font-weight="${weight||700}" fill="${col||C.ink}"
    font-family="'Noto Sans KR',sans-serif">${s}</text>`;
}
/* 꼭짓점 이름 — 도형 바깥쪽으로 밀어서 겹치지 않게.
   fix 에 {0:[dx,dy]} 처럼 주면 그 점만 손으로 옮긴다.
   대칭축 위에 앉은 꼭짓점은 바깥 방향이 곧 축 방향이라 라벨이 축선에
   겹친다 — 그 자리를 비켜 주는 것이 fix 의 용도다. */
function vlab(ps,names,col,sz,off,ctr,fix){
  const c=ctr||MID(ps); fix=fix||{};
  return ps.map((p,i)=>{
    if(!names[i]) return '';
    let x,y;
    if(fix[i]){ x=p[0]+fix[i][0]; y=p[1]+fix[i][1]; }
    else{ const dx=p[0]-c[0], dy=p[1]-c[1], L=Math.hypot(dx,dy)||1, d=off||24;
          x=p[0]+dx/L*d; y=p[1]+dy/L*d; }
    return txt([x,y+(sz||19)*0.34], names[i], col||C.muted, sz||19);
  }).join('');
}
/* 점 목록을 감싸는 viewBox — 좌표를 줄이거나 옮기지 않고 '창'을 맞춘다.
   도형을 축소·이동시키면 대칭축·대칭의 중심도 같이 옮겨야 해서
   어긋나기 쉽다(실제로 어긋났다). 도형은 그대로 두고 창만 맞춘다. */
function VB(ps,pad){
  const p=pad==null?26:pad;
  const xs=ps.map(q=>q[0]), ys=ps.map(q=>q[1]);
  const x0=Math.min(...xs)-p, y0=Math.min(...ys)-p;
  return [x0, y0, Math.max(...xs)+p-x0, Math.max(...ys)+p-y0];
}
const SVGB=(ps,pad,inner,style)=>{
  const b=VB(ps,pad);
  return `<svg class="gv" viewBox="${b.join(' ')}" style="${style||''}">${inner}</svg>`;
};
/* 여러 색으로 꼭짓점 찍기 */
function dots(ps,cols,r){ return ps.map((p,i)=>dot(p,cols[i%cols.length],r)).join(''); }

/* 각 표시 호 */
function arc(p,a,b,r,col,w){
  const u=[(a[0]-p[0]),(a[1]-p[1])], v=[(b[0]-p[0]),(b[1]-p[1])];
  const lu=Math.hypot(...u)||1, lv=Math.hypot(...v)||1;
  const s=[p[0]+u[0]/lu*r, p[1]+u[1]/lu*r], e=[p[0]+v[0]/lv*r, p[1]+v[1]/lv*r];
  const cr=u[0]*v[1]-u[1]*v[0];
  return `<path d="M${s[0].toFixed(1)},${s[1].toFixed(1)} A${r},${r} 0 0,${cr>0?1:0} ${e[0].toFixed(1)},${e[1].toFixed(1)}"
    fill="none" stroke="${col}" stroke-width="${w||3}"/>`;
}
/* 직각 표시 */
function rightAngle(p,a,b,s,col){
  const u=[(a[0]-p[0]),(a[1]-p[1])], v=[(b[0]-p[0]),(b[1]-p[1])];
  const lu=Math.hypot(...u)||1, lv=Math.hypot(...v)||1;
  const U=[u[0]/lu*s,u[1]/lu*s], V=[v[0]/lv*s,v[1]/lv*s];
  return pline([[p[0]+U[0],p[1]+U[1]],[p[0]+U[0]+V[0],p[1]+U[1]+V[1]],[p[0]+V[0],p[1]+V[1]]],col||C.red,2.5);
}
/* 변에 눈금 표시(길이가 같다는 뜻) */
function tick(a,b,n,col){
  const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
  let o='';
  for(let i=0;i<n;i++){
    const t=(i-(n-1)/2)*6;
    o+=seg([m[0]+ux*t-nx*7, m[1]+uy*t-ny*7],[m[0]+ux*t+nx*7, m[1]+uy*t+ny*7],col||C.ink,2.5);
  }
  return o;
}
/* 모눈 */
function grid(w,h,step,col){
  let o='';
  for(let x=0;x<=w;x+=step) o+=seg([x,0],[x,h],col||'#e2e8f0',1.2);
  for(let y=0;y<=h;y+=step) o+=seg([0,y],[w,y],col||'#e2e8f0',1.2);
  return o;
}
const SVG=(w,h,inner,style)=>`<svg class="gv" viewBox="0 0 ${w} ${h}" style="${style||''}">${inner}</svg>`;

/* ══════════════════════════════════════════════════════════
   이 자료가 계속 붙들고 가는 도형들
   ══════════════════════════════════════════════════════════ */

/* ① 합동 짝 — 삼각형 하나를 돌리고 뒤집어서 만든다 */
const TRI=[[18,118],[150,118],[112,26]];            // 밑변 132, 기울어진 꼭짓점
const TRI_C=MID(TRI);

/* ② 선대칭 육각형 — 대칭축 x=200 에 대해 반쪽을 반사해 만든다 */
const AX=200;
const LHALF=[[200,22],[286,74],[300,176]];          // 위꼭짓점 + 오른쪽 두 점
const LSYM=[ LHALF[0], LHALF[1], LHALF[2], [200,218], MIRX(LHALF[2],AX), MIRX(LHALF[1],AX) ];
const LNAME=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ'];

/* ③ 점대칭 육각형 — 세 점을 대칭의 중심으로 180° 돌려 만든다 */
const O=[200,120];
const PHALF=[[104,44],[248,36],[298,104]];
const PSYM=[ PHALF[0], PHALF[1], PHALF[2],
             ROT(PHALF[0],O,180), ROT(PHALF[1],O,180), ROT(PHALF[2],O,180) ];
const PNAME=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ'];

/* ══════════════════════════════════════════════════════════
   슬라이드
   ══════════════════════════════════════════════════════════ */
const SLIDES=[

/* ───────── 1. 표지 ───────── */
`<section class="slide" style="--acc:#3b82f6">
  <div class="eyebrow">수학 5-2 · 3단원</div>
  <h1>합동과 대칭<br><span style="font-size:30px;font-weight:700;color:#334155">— 포개면 딱 맞는다</span></h1>
  <div class="row grow" style="margin-top:6px;gap:20px">
    ${['<b>합동</b><br><span style="font-size:17px;color:#64748b">도형 둘이 포개진다</span>',
       '<b>선대칭도형</b><br><span style="font-size:17px;color:#64748b">접으면 저와 포개진다</span>',
       '<b>점대칭도형</b><br><span style="font-size:17px;color:#64748b">반 바퀴 돌리면 포개진다</span>']
      .map((cap,i)=>{
        let g='',box;
        if(i===0){
          const a=TRI, b=ALL(TRI,p=>MOV(ROT(p,TRI_C,152),150,0));
          g=poly(a,'#dbeafe',C.navy,3.5)+poly(b,'#dbeafe',C.navy,3.5);
          box=a.concat(b);
        }else if(i===1){
          g=poly(LSYM,'#dcfce7',C.green,3.5)
           +seg([AX,LSYM[0][1]-22],[AX,LSYM[3][1]+22],C.red,3,'stroke-dasharray="9 6"');
          box=LSYM;
        }else{
          g=poly(PSYM,'#f3e8ff',C.purple,3.5)+dot(O,C.red,8);
          box=PSYM;
        }
        return `<div class="card grow center col" style="gap:8px;padding:14px">
          <div class="grow center" style="display:flex;width:100%">
            ${SVGB(box,30,g,'max-height:176px')}</div>
          <div style="font-size:21px;line-height:1.3">${cap}</div></div>`;
      }).join('')}
  </div>
  <div class="term" style="margin-top:14px;font-size:23px">
    셋은 따로 배우는 세 가지가 아니다. <b class="hn">「포개 보았더니 맞더라」</b> 하나를
    <b class="hl">둘로 / 접어서 / 돌려서</b> 세 번 물어보는 것뿐이다.
  </div>
</section>`,

/* ───────── 2. 단원 지도 ───────── */
`<section class="slide" style="--acc:#3b82f6" data-steps="2">
  <div class="eyebrow">단원 지도</div>
  <h2>물어보는 건 늘 하나 — “포개면 맞나?”</h2>
  <div class="row grow" style="margin-top:12px;align-items:stretch;gap:20px">
    <div class="card col grow" style="border-color:#93c5fd;gap:6px">
      <div class="big" style="color:var(--navy)">도형이 <span style="font-size:36px">둘</span>일 때</div>
      <div class="grow center" style="display:flex">
      ${(()=>{
        const a=TRI, b=ALL(TRI,p=>MOV(ROT(p,TRI_C,200),172,4));
        return SVGB(a.concat(b),30,
          poly(a,'#dbeafe',C.navy,3.5)+poly(b,'#dbeafe',C.navy,3.5),
          'max-height:150px');
      })()}
      </div>
      <div style="font-size:18px;color:#64748b;text-align:center">하나를 들어다 다른 하나에 포갠다</div>
      <div class="term" style="border-left-color:var(--navy);font-size:21px">
        딱 맞으면 <b class="hn">서로 합동</b></div>
    </div>
    <div class="card col grow" style="border-color:#86efac;gap:6px;flex:1.95" data-step="1">
      <div class="big" style="color:#047857">도형이 <span style="font-size:36px">하나</span>일 때</div>
      <div class="row grow" style="gap:14px;align-items:stretch">
        <div class="col center grow" style="gap:3px;justify-content:flex-end">
          <div class="grow center" style="display:flex">
          ${(()=>{
            const g=poly(LSYM,'#dcfce7',C.green,3.5)
              +seg([AX,LSYM[0][1]-34],[AX,LSYM[3][1]+30],C.red,3,'stroke-dasharray="9 6"')
              +txt([AX+62,LSYM[0][1]-16],'접는다',C.red,19);
            return SVGB(LSYM,40,g,'max-height:186px');
          })()}
          </div>
          <div style="font-size:20px;font-weight:700">접어서 겹치면 <b class="hg">선대칭도형</b></div>
        </div>
        <div class="col center grow" style="gap:3px;justify-content:flex-end">
          <div class="grow center" style="display:flex">
          ${(()=>{
            const g=poly(PSYM,'#f3e8ff',C.purple,3.5)+dot(O,C.red,8)
              +`<path d="M ${O[0]+66},${O[1]-52} A 84 84 0 1 1 ${O[0]-20},${O[1]-84}"
                  fill="none" stroke="${C.red}" stroke-width="2.8" stroke-dasharray="7 5"/>`
              +poly([[O[0]-20,O[1]-84],[O[0]-6,O[1]-74],[O[0]-24,O[1]-68]],C.red,C.red,1)
              +txt([O[0]+4,O[1]-96],'반 바퀴 돌린다',C.red,18);
            return SVGB(PSYM,46,g,'max-height:186px');
          })()}
          </div>
          <div style="font-size:20px;font-weight:700">돌려서 겹치면 <b class="hp">점대칭도형</b></div>
        </div>
      </div>
    </div>
  </div>
  <div class="act" style="margin-top:12px" data-step="2">
    <b>4학년 때 배운 것이 그대로 쓰인다.</b> 포개는 방법은 <b class="hn">밀기 · 뒤집기 · 돌리기</b> 셋뿐이다.
    선대칭은 <b class="hg">뒤집기</b>, 점대칭은 <b class="hp">180° 돌리기</b> — 그때 그 손동작을 도형 이름으로 부르는 것이다.
  </div>
</section>`,

/* ───────── 3. 합동 ───────── */
`<section class="slide" style="--acc:#1e3a8a" data-steps="2">
  <div class="eyebrow">합동 ①</div>
  <h2>모양과 크기가 같아 <b class="hn">완전히</b> 겹치면 서로 합동</h2>
  <div class="grow center col" style="margin-top:8px">
    ${SVG(1140,300,(()=>{
      const base=ALL(TRI,p=>SCL(p,TRI_C,.92));

/* ───────── 6. 합동 실전 ───────── */
`<section class="slide" style="--acc:#dc2626" data-steps="4">
  <div class="eyebrow">합동 ④ · 시험에 이렇게 나온다</div>
  <h2>모르는 각 구하기 — 두 걸음이면 끝난다</h2>
  <div class="row grow" style="margin-top:10px;gap:22px;align-items:center">
    <div style="flex:1.12">
      ${(()=>{
        /* 두 번째 사각형은 첫 번째를 180° 돌려 옆에 놓은 것이다.
           그래서 대응은 ㄱ↔ㅅ · ㄴ↔ㅇ · ㄷ↔ㅁ · ㄹ↔ㅂ 이고,
           각도는 반드시 '짝이 맞는 꼭짓점'에 적어야 한다.
           (여기에 엉뚱한 꼭짓점을 골라 95°와 70°가 같은 짝에
            앉으면 문제 자체가 성립하지 않는다.) */
        const q=[[60,52],[250,36],[286,214],[92,240]];
        const c=MID(q);
        const q2=ALL(q,p=>MOV(ROT(p,c,180),300,10));
        const IN=(p,a,b,d)=>{                  /* 각 안쪽으로 d 만큼 들어간 자리 */
          const u=[a[0]-p[0],a[1]-p[1]], v=[b[0]-p[0],b[1]-p[1]];
          const lu=Math.hypot(...u)||1, lv=Math.hypot(...v)||1;
          let w=[u[0]/lu+v[0]/lv, u[1]/lu+v[1]/lv];
          const lw=Math.hypot(...w)||1;
          return [p[0]+w[0]/lw*d, p[1]+w[1]/lw*d+7];
        };
        let o=poly(q,'#fff','#1e3a8a',3.6)+poly(q2,'#fff','#1e3a8a',3.6);
        /* 왼쪽: ㄱ = 95°, ㄹ = ? */
        o+=arc(q[0],q[1],q[3],27,C.gold,3.2)+txt(IN(q[0],q[1],q[3],50),'95°',C.ink,21);
        o+=arc(q[3],q[0],q[2],27,C.red,3.6)+txt(IN(q[3],q[0],q[2],46),'?',C.red,32,'middle',900);
        /* 오른쪽: ㅇ(=ㄴ의 짝) = 130°, ㅁ(=ㄷ의 짝) = 70° */
        o+=arc(q2[1],q2[0],q2[2],27,C.blue,3.2)+txt(IN(q2[1],q2[0],q2[2],52),'130°',C.ink,21);
        o+=arc(q2[2],q2[1],q2[3],27,C.green,3.2)+txt(IN(q2[2],q2[1],q2[3],48),'70°',C.ink,21);
        o+=vlab(q,['ㄱ','ㄴ','ㄷ','ㄹ'],C.muted,20,25)
          +vlab(q2,['ㅅ','ㅇ','ㅁ','ㅂ'],C.muted,20,25);
        return SVGB(q.concat(q2),42,o,'max-height:292px');
      })()}
      <div class="hand" style="text-align:center;margin-top:2px">두 사각형은 서로 합동이다. 각 ㄹ은 몇 도?</div>
    </div>
    <div class="col" style="flex:1;gap:9px">
      <div class="card" style="border-color:#93c5fd;font-size:21px" data-step="1">
        <span class="num">1</span><b>대응각을 옮겨 적는다</b><br>
        <span style="font-size:20px;color:#334155">각 ㄴ = 각 ㅇ = <b class="hn">130°</b>　각 ㄷ = 각 ㅅ = <b class="hn">70°</b></span></div>
      <div class="card" style="border-color:#fcd34d;font-size:21px" data-step="2">
        <span class="num" style="background:#f59e0b">2</span><b>남은 각은 내각의 합으로</b><br>
        <span style="font-size:20px;color:#334155">사각형 네 각의 합 = <b>360°</b></span></div>
      <div class="term" style="border-left-color:var(--red);font-size:22px" data-step="3">
        360 − 95 − 130 − 70 = <b class="hl" style="font-size:28px">65°</b></div>
      <div class="act" style="font-size:19px" data-step="4">
        삼각형이면 <b>180°</b>, 사각형이면 <b>360°</b>.<br>
        <b class="hl">길이를 물으면 1번만으로 끝난다</b> — 옮겨 적기가 곧 답이다.
      </div>
    </div>
  </div>
</section>`,

        선대칭 문제의 8할이 이것이다.</div>
    </div>
    <div class="card col grow" style="gap:5px">
      <div style="font-size:21px;font-weight:900"><span class="num" style="background:#a855f7">3</span>점대칭</div>
      <div class="grow center" style="display:flex;width:100%">
      ${(()=>{
        const s=PSYM;
        let o=poly(s,'#faf5ff',C.purple,3.4);
        o+=seg(s[0],s[3],C.blue,2.6,'stroke-dasharray="6 5"');
        o+=tick(s[0],O,1,C.blue)+tick(O,s[3],1,C.blue);
        o+=dot(O,C.purple,8.5)+dot(s[0],C.red,7.5)+dot(s[3],C.red,7.5);
        o+=vlab(s,['ㄱ','','','ㄹ','',''],C.ink,20,26,O);
        o+=txt([O[0]+8,O[1]+34],'ㅇ',C.purple,21);
        o+=txt([(s[0][0]+O[0])/2-30,(s[0][1]+O[1])/2-16],'6 cm',C.blue,20);
        return SVGB(s,40,o,'max-height:176px');
      })()}
      </div>
      <div style="font-size:19px;color:#334155">점대칭도형. 선분 ㄱㅇ이 6 cm면 <b>선분 ㄱㄹ</b>은?</div>
      <div class="term" style="font-size:19px;padding:8px 13px;border-left-color:#a855f7" data-step="3">
        중심이 선분을 <b class="hp">반으로</b> 나누니 ㅇㄹ도 6 cm →
        <b class="hl">12 cm</b>. 거꾸로 묻는 문제가 꼭 나온다.</div>
    </div>
  </div>
  <div class="act" style="margin-top:12px;font-size:22px" data-step="4">
    <b>문제를 만나면 순서는 늘 같다.</b>
    ① 짝을 찾는다 → ② 아는 수를 짝에게 <b class="hl">옮겨 적는다</b> → ③ 그래도 모르면
    <b class="hn">180° · 360° · 「반으로」</b> 셋 중 하나를 쓴다.
  </div>
</section>`
];

/* ══════════════════════════════════════════════
   재생기 — 03 · 06 과 같은 조작
   ══════════════════════════════════════════════ */
const stage=document.getElementById('stage');
stage.innerHTML=SLIDES.join('');
const slides=[...document.querySelectorAll('.slide')];
let cur=0, step=0;

function maxStep(i){ return parseInt(slides[i].dataset.steps||'0',10); }

/* 그리기 슬라이드(10 · 13)는 SVG 그룹도 단계에 맞춰 여닫는다 */
function svgSteps(){
  const s=slides[cur];
  ['g1','g2','g3'].forEach((cls,i)=>{
    s.querySelectorAll('.'+cls).forEach(g=>{
      g.style.opacity = (step>=i+1) ? 1 : 0;
      g.style.transition='opacity .38s ease';
    });
  });
}

function render(){
  slides.forEach((s,i)=>s.classList.toggle('on',i===cur));
  slides[cur].querySelectorAll('[data-step]').forEach(el=>{
    const n=parseInt(el.dataset.step,10);
    el.classList.toggle('vis', n<=step);
  });
  svgSteps();
  document.getElementById('cnt').textContent=`${cur+1} / ${slides.length}`;
  history.replaceState(null,'','#'+(cur+1));
}

function go(d){
  if(d>0){
    if(step<maxStep(cur)){ step++; render(); return; }
    if(cur<slides.length-1){ cur++; step=0; render(); }
  }else{
    if(step>0){ step--; render(); return; }
    if(cur>0){ cur--; step=maxStep(cur); render(); }
  }
}
function jump(i){ cur=Math.max(0,Math.min(slides.length-1,i)); step=0; render(); }

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); go(1); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); go(-1); }
  else if(k==='ArrowDown'){ e.preventDefault(); jump(cur+1); }
  else if(k==='ArrowUp'){ e.preventDefault(); jump(cur-1); }
  else if(k==='Home'){ jump(0); }
  else if(k==='End'){ jump(slides.length-1); }
  else if(k==='f'||k==='F'){ fs(); }
});

let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)) go(dx<0?1:-1);
},{passive:true});

document.getElementById('wrap').addEventListener('click',()=>go(1));

function fs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

function fit(){
  const s=Math.min(window.innerWidth/1280,(window.innerHeight-46)/720);
  stage.style.transform=`scale(${s})`;
}
window.addEventListener('resize',fit);

/* 해시로 슬라이드 지정(#7 → 7번) — 수업 중에도, 검증에도 쓴다 */
const h=parseInt((location.hash||'').slice(1),10);
if(h>=1&&h<=SLIDES.length) cur=h-1;

fit(); render();
</script>
</body>
</html>
