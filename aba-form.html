<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>왜 아까 그 가락이 또 나올까 — aba 형식</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1c2430; --navy:#123a63; --navy2:#1d5b95;
  --red:#c0392b; --gold:#c8963e; --green:#2e7d5b; --plum:#7d4a86;
  --paper:#f6f2e9; --line:#d9d2c4; --muted:#6d6b66;
}

html,body{height:100%;background:#0d1520;font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}

#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;background:var(--paper);overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}

.slide{position:absolute;inset:0;padding:38px 54px;display:none;
  flex-direction:column;background:var(--paper);--acc:var(--navy)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 12% 8%,rgba(200,150,62,.10),transparent 45%),
             radial-gradient(circle at 92% 95%,rgba(18,58,99,.08),transparent 45%)}
.slide>*{position:relative;z-index:1}

.eyebrow{display:inline-block;font-size:21px;font-weight:700;color:#fff;
  background:var(--acc);padding:6px 18px;border-radius:999px;margin-bottom:12px;align-self:flex-start}
h1.title{font-size:56px;font-weight:900;color:var(--navy);line-height:1.16;letter-spacing:-.02em}
h2.stitle{font-size:40px;font-weight:900;color:var(--acc);line-height:1.2;letter-spacing:-.02em;margin-bottom:4px}
.rule{width:92px;height:7px;border-radius:4px;
  background:linear-gradient(90deg,var(--red),var(--gold));margin:8px 0 18px}
p.body{font-size:27px;line-height:1.55;color:var(--ink);font-weight:500}
p.body+p.body{margin-top:12px}
.small{font-size:22px;line-height:1.5}
.tiny{font-size:19px;line-height:1.5}

b.hl{font-weight:900;color:var(--red);background:linear-gradient(transparent 62%,rgba(192,57,43,.20) 62%);padding:0 2px}
b.hn{font-weight:900;color:var(--navy2);background:linear-gradient(transparent 62%,rgba(29,91,149,.18) 62%);padding:0 2px}
b.hg{font-weight:900;color:var(--green);background:linear-gradient(transparent 62%,rgba(46,125,91,.18) 62%);padding:0 2px}

.cols{display:flex;gap:28px;flex:1;min-height:0;align-items:center}
.col{flex:1;min-width:0}

.term{background:#fff;border-left:9px solid var(--gold);border-radius:8px;padding:14px 18px;
  box-shadow:0 6px 16px rgba(30,25,15,.10)}
.term .t{font-size:24px;font-weight:900;color:var(--gold);margin-bottom:3px}
.term .d{font-size:22px;font-weight:500;color:var(--ink);line-height:1.5}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;
  box-shadow:0 6px 16px rgba(30,25,15,.09)}
.card h3{font-size:24px;font-weight:900;color:var(--acc);margin-bottom:8px}

.act{background:#fff;border:3px dashed var(--navy2);border-radius:18px;padding:18px 24px}
.act-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.act-badge{background:var(--navy2);color:#fff;font-weight:900;font-size:20px;
  padding:5px 15px;border-radius:999px;white-space:nowrap}
.act-t{font-size:26px;font-weight:900;color:var(--navy)}

table.tbl{width:100%;border-collapse:collapse;font-size:23px;text-align:center}
table.tbl th{background:var(--acc);color:#fff;padding:10px 8px;font-weight:900}
table.tbl td{border:1px solid var(--line);padding:12px 10px;background:#fff;color:var(--ink);font-weight:700}
table.tbl td.dim{background:#efe9db;color:var(--muted);font-weight:500;font-size:20px}
table.tbl td.lead{background:#fff;font-weight:900;font-size:26px}

.bubble{background:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 6px 14px rgba(30,25,15,.10);
  font-size:21px;line-height:1.5;font-weight:600;color:var(--ink);position:relative}
.bubble.l{border:2px solid var(--navy2)}
.bubble.r{border:2px solid var(--gold)}

.chip{display:inline-block;background:#fff;border:2px solid var(--acc);color:var(--acc);
  font-weight:900;font-size:20px;border-radius:999px;padding:9px 20px;margin:6px 8px 0 0}
.chipwrap{display:flex;flex-wrap:wrap}

/* ---------- 소리 실험 장치 ---------- */
.play{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:56px;padding:12px 26px;border:0;border-radius:14px;cursor:pointer;
  background:var(--navy2);color:#fff;font-family:inherit;font-size:24px;font-weight:900;
  box-shadow:0 5px 0 #0e3a63;transition:transform .06s,box-shadow .06s}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #0e3a63}
.play.on{background:var(--red);box-shadow:0 5px 0 #8c2418}
.play.gold{background:var(--gold);box-shadow:0 5px 0 #966b1f}
.play.gold.on{background:var(--red);box-shadow:0 5px 0 #8c2418}
.play.stop{background:#5c6470;box-shadow:0 5px 0 #3b424b;font-size:21px;min-height:50px;padding:10px 20px}

.songrow{display:flex;align-items:center;gap:20px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:14px 20px;box-shadow:0 5px 14px rgba(30,25,15,.09)}
.songrow .no{font-size:34px;font-weight:900;color:var(--navy);flex:0 0 44px;text-align:center}
.songrow .desc{font-size:21px;font-weight:600;color:var(--muted);flex:1}

/* 형식 블록 */
.blocks{display:flex;gap:12px}
.blk{flex:1;height:62px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:900;border:3px solid var(--line);background:#fff;color:#b6ae9e;
  transition:transform .12s,background .12s,color .12s,border-color .12s}
.blk.a{border-color:#e79cb0;color:#c8577a;background:#fdeef2}
.blk.b{border-color:#8fc7e8;color:#2b7cad;background:#eaf5fb}
.blk.c{border-color:#c3b48f;color:#8a7132;background:#f7f2e6}
.blk.lit{transform:translateY(-6px) scale(1.05);background:var(--navy2);color:#fff;border-color:var(--navy)}

/* 가락선 */
.contour{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px 6px;
  box-shadow:0 5px 14px rgba(30,25,15,.08)}
.contour .lbl{font-size:19px;font-weight:900;margin-bottom:2px}

/* 가사 비교 */
.lyric{display:flex;align-items:center;gap:16px;margin-bottom:9px}
.lyric .tag{flex:0 0 58px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900}
.lyric .tag.a{background:#fdeef2;color:#c8577a;border:3px solid #e79cb0}
.lyric .tag.b{background:#eaf5fb;color:#2b7cad;border:3px solid #8fc7e8}
.lyric .txt{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:9px 16px;font-family:'Gaegu',sans-serif;font-size:31px;color:var(--ink)}

/* 표지 */
.cover{justify-content:center;align-items:flex-start;padding:0;
  background:linear-gradient(165deg,#123a63,#1d5b95 72%)}
.cover .inner{padding:0 62px 150px;position:relative;z-index:2}
.cover .kicker{color:#f3d79a;font-size:23px;font-weight:700;margin-bottom:14px}
.cover h1{color:#fff;font-size:66px;font-weight:900;line-height:1.2;letter-spacing:-.02em}
.cover .sub{color:#cfdcee;font-size:25px;font-weight:500;margin-top:20px}
.cover .band{position:absolute;left:0;right:0;bottom:0;height:240px;overflow:hidden;z-index:1}
.cover .band img{width:100%;height:100%;object-fit:cover;object-position:center 58%}
.cover .band::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(19,60,103,.97) 0%,rgba(19,60,103,.55) 32%,rgba(19,60,103,0) 72%)}

/* position 은 지정하지 않는다 — .slide 의 absolute/inset:0 을 덮으면 높이가 720px 이 아니게 된다 */
.closing{justify-content:center;align-items:center;text-align:center;padding:0;
  background:linear-gradient(165deg,#1d5b95,#123a63 72%)}
.closing .inner{position:relative;z-index:2;padding:0 70px 175px}
.closing .num{color:#f3d79a;font-size:24px;font-weight:900;margin-bottom:14px}
.closing h1{color:#fff;font-size:52px;font-weight:900;line-height:1.34}
.closing .sub{color:#cfdcee;font-size:24px;font-weight:500;margin-top:22px;line-height:1.5}
.closing .band{position:absolute;left:0;right:0;bottom:0;height:230px;overflow:hidden;z-index:1}
.closing .band img{width:100%;height:100%;object-fit:cover;object-position:center 62%}
.closing .band::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(19,60,103,.97) 0%,rgba(19,60,103,.55) 32%,rgba(19,60,103,0) 72%)}

.bar{position:fixed;left:0;right:0;bottom:0;height:46px;background:#0f1a29;color:#cfd8e6;
  display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;z-index:50}
.bar button{background:#1d3350;color:#e8eef7;border:0;border-radius:7px;padding:7px 13px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#prog{position:fixed;left:0;top:0;height:4px;background:var(--navy2);z-index:60;transition:width .18s}
.zone{position:fixed;top:0;bottom:46px;width:9%;z-index:40;cursor:pointer}
#zl{left:0}#zr{right:0}
</style>
</head>
<body>

<div id="prog"></div>
<div id="stage"></div>
<div class="zone" id="zl"></div>
<div class="zone" id="zr"></div>
<div class="bar no-print">
  <button onclick="go(-1)">◀ 이전</button>
  <button onclick="go(1)">다음 ▶</button>
  <span id="counter">1 / 1</span>
  <span style="flex:1"></span>
  <span style="opacity:.65">← → 넘김 · F 전체화면 · 🔊 소리 켜 두세요</span>
  <button onclick="fs()">전체화면</button>
</div>

        <p class="body small">① 좋아하는 노래를 머릿속으로 처음부터 불러 본다.<br><br>
          ② 후렴이 <b class="hn">몇 번</b> 나오는지 손가락으로 센다.<br><br>
          ③ 후렴과 후렴 사이에 무엇이 있었는지 말한다.<br><br>
          ④ 종이에 <b class="hl">a b a b</b> 처럼 적어 본다.</p>
      </div>
    </div>
    <div class="col">
      <div class="bubble l">"제 노래는 a b a b a 였어요"</div>
      <div class="bubble r" style="margin-top:14px">"후렴이 세 번이나 나와요"</div>
      <div class="bubble l" style="margin-top:14px">"a 인 줄 알았는데 조금씩 달랐어요"</div>
      <p class="body small" style="margin-top:20px;color:var(--muted)">
        ③번이 잘 안 나와도 괜찮다. <b class="hg">기억이 안 나는 부분이 곧 b</b>다 —
        한 번밖에 안 나왔으니까.</p>
    </div>
  </div>
</section>`,

/* 16 마무리 */
`<section class="slide closing">
  <div class="band"><img data-img="scare"></div>
  <div class="inner">
    <div class="num">오늘의 답</div>
    <h1>형식은 음악을<br>귀가 붙잡을 수 있게 만든<br>손잡이다</h1>
    <div class="sub">작곡가가 우리를 위해 세워 둔 길 안내판이다.<br>
      그래서 형식을 배우면 더 잘 들리고, 직접 만들 수도 있다.</div>
  </div>
</section>`
];

/* ===== 소리 ===== */
const F = {B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,C5:523.25};

/* 도막(작은악절) — [음이름, 길이(초)] */
const PH = {
  /* a : 도 미 솔 미 / 레 파 미 도 — 으뜸음으로 끝나 안정된다 */
  a  : [['C4',.40],['E4',.40],['G4',.40],['E4',.40],['D4',.40],['F4',.40],['E4',.40],['C4',.85]],
  /* b : 솔 라 시 라 / 솔 파 미 레 — 높은 데서 시작해 '레'로 열려 끝난다 */
  b  : [['G4',.40],['A4',.40],['B4',.40],['A4',.40],['G4',.40],['F4',.40],['E4',.40],['D4',.85]],
  /* c : 방향이 오락가락하고 끝음도 낯설다 — 붙잡을 것이 없다 */
  c  : [['A4',.40],['F4',.40],['D4',.40],['B3',.40],['C4',.40],['E4',.40],['G4',.40],['B4',.85]],
  /* b 변형 — 리듬을 촘촘하게 */
  br : [['G4',.20],['G4',.20],['A4',.20],['A4',.20],['B4',.40],['A4',.40],
        ['G4',.30],['F4',.30],['E4',.30],['D4',.85]],
  /* b 변형 — 방향을 뒤집어 내려간다 */
  bd : [['E4',.40],['D4',.40],['C4',.40],['D4',.40],['E4',.40],['F4',.40],['G4',.40],['D4',.85]]
};

const FORMS = {
  aaa : ['a','a','a'],
  abc : ['a','b','c'],
  aba : ['a','b','a'],
  aa  : ['a','a'],
  ar1a: ['a','br','a'],
  ad1a: ['a','bd','a']
};

let ac = null, timers = [], curBtn = null;

function audio(){
  if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
function clearLit(){
  document.querySelectorAll('.blk.lit').forEach(e => e.classList.remove('lit'));
  document.querySelectorAll('.play.on').forEach(e => {
    e.classList.remove('on');
    if(e.dataset.label) e.textContent = e.dataset.label;
  });
  curBtn = null;
}
function stopAll(){
  timers.forEach(clearTimeout); timers = [];
  clearLit();
  if(ac){ try{ ac.close(); }catch(e){} ac = null; }
}
function tone(a, t, f, d){
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(.20, t + .015);
  g.gain.setValueAtTime(.20, t + d * .72);
  g.gain.exponentialRampToValueAtTime(.0008, t + d * .99);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + d + .02);
}
function playForm(formKey, boxId, btn){
  const wasSame = (curBtn === btn);
  stopAll();
  if(wasSame) return;                       /* 같은 버튼 다시 누르면 정지 */

  const keys = FORMS[formKey]; if(!keys) return;
  const a = audio();
  let t = a.currentTime + .12;
  const t0 = t;

  if(btn){
    curBtn = btn;
    if(!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.classList.add('on');
    btn.textContent = '■ 멈춤';
  }

  keys.forEach((k, i) => {
    const start = t;
    PH[k].forEach(([n, d]) => { tone(a, t, F[n], d * .94); t += d; });
    t += .30;                               /* 도막 사이 숨 */
    if(boxId){
      timers.push(setTimeout(() => {
        const box = document.getElementById(boxId);
        if(box) [...box.children].forEach((c, n) => c.classList.toggle('lit', n === i));
      }, Math.max(0, (start - a.currentTime) * 1000)));
    }
  });
  timers.push(setTimeout(clearLit, (t - a.currentTime) * 1000));
  void t0;
}

/* ===== 가락선 그리기 ===== */
const ORDER = ['B3','C4','D4','E4','F4','G4','A4','B4','C5'];
function contour(key, color){
  const ph = PH[key], W = 300, H = 116, pad = 10;
  const total = ph.reduce((s, n) => s + n[1], 0);
  const yOf = n => H - pad - (ORDER.indexOf(n) / (ORDER.length - 1)) * (H - pad * 2);
  let x = pad, d = '', dots = '';
  ph.forEach(([n, len]) => {
    const w = (len / total) * (W - pad * 2), y = yOf(n);
    d += (d ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + 'L' + (x + w).toFixed(1) + ' ' + y.toFixed(1);
    dots += '<circle cx="' + (x + w / 2).toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.4" fill="' + color + '"/>';
    x += w;
  });
  let grid = '';
  for(let i = 0; i < ORDER.length; i += 2){
    const y = yOf(ORDER[i]);
    grid += '<line x1="' + pad + '" y1="' + y.toFixed(1) + '" x2="' + (W - pad) + '" y2="' + y.toFixed(1) +
            '" stroke="#e8e2d5" stroke-width="1"/>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block">' + grid +
         '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="3.6" ' +
         'stroke-linejoin="round" stroke-linecap="round"/>' + dots + '</svg>';
}

/* ===== 렌더링 ===== */
const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.join('');
stage.querySelectorAll('img[data-img]').forEach(el => {
  const src = IMG[el.dataset.img];
  if(src) el.src = src; else el.style.display = 'none';
});
stage.querySelectorAll('.play[data-form]').forEach(btn => {
  btn.onclick = () => playForm(btn.dataset.form, btn.dataset.box || '', btn);
});
const ct = { cta:['a','#c8577a'], ctb:['b','#2b7cad'], ctc:['c','#8a7132'] };
for(const id in ct){
  const el = document.getElementById(id);
  if(el) el.innerHTML = contour(ct[id][0], ct[id][1]);
}

const slides = [...stage.querySelectorAll('.slide')];
let cur = 0;
function show(i){
  stopAll();
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, n) => s.classList.toggle('on', n === cur));
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + slides.length;
  const p = document.getElementById('prog');
  p.style.width = ((cur + 1) / slides.length * 100) + '%';
  p.style.background = getComputedStyle(slides[cur]).getPropertyValue('--acc');
}
function go(d){ show(cur + d); }

function fit(){
  const s = Math.min(window.innerWidth / 1280, (window.innerHeight - 46) / 720);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
function fs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener('keydown', e => {
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(1); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
  if(e.key === 'Home') show(0);
  if(e.key === 'End') show(slides.length - 1);
  if(e.key === 'f' || e.key === 'F') fs();
});
document.getElementById('zl').onclick = () => go(-1);
document.getElementById('zr').onclick = () => go(1);

let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('resize', fit);
fit();
show(0);
</script>
</body>
</html>
