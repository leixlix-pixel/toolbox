<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>단소로 늴리리야 — 소리 내기부터 연주까지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1c2430; --bam:#3d7a52; --bam2:#2b5c3b; --clay:#b0703a;
  --navy:#123a63; --navy2:#1d5b95;
  --red:#c0392b; --gold:#c8963e; --plum:#7d4a86;
  --paper:#f7f4ec; --line:#ddd6c6; --muted:#6d6b66;
}

html,body{height:100%;background:#0e1a14;font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}

/* 율명 한자 — 확장한자(㳞) 폴백 체인 */
.yul{font-family:'Noto Sans KR','Batang','Gulim','Malgun Gothic','SimSun',serif}

#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;background:var(--paper);overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}

.slide{position:absolute;inset:0;padding:34px 48px;display:none;
  flex-direction:column;background:var(--paper);--acc:var(--bam)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 10% 6%,rgba(61,122,82,.10),transparent 44%),
             radial-gradient(circle at 94% 96%,rgba(176,112,58,.09),transparent 44%)}
.slide>*{position:relative;z-index:1}

.eyebrow{display:inline-block;font-size:20px;font-weight:700;color:#fff;
  background:var(--acc);padding:5px 17px;border-radius:999px;margin-bottom:10px;align-self:flex-start}
h1.title{font-size:54px;font-weight:900;color:var(--bam2);line-height:1.16;letter-spacing:-.02em}
h2.stitle{font-size:37px;font-weight:900;color:var(--acc);line-height:1.2;letter-spacing:-.02em}
.rule{width:88px;height:6px;border-radius:4px;
  background:linear-gradient(90deg,var(--bam),var(--gold));margin:7px 0 14px}
p.body{font-size:25px;line-height:1.5;color:var(--ink);font-weight:500}
p.body+p.body{margin-top:9px}
.small{font-size:21px;line-height:1.48}
.tiny{font-size:18px;line-height:1.45}
.mutedt{color:var(--muted)}

b.hl{font-weight:900;color:var(--red);background:linear-gradient(transparent 62%,rgba(192,57,43,.20) 62%);padding:0 2px}
b.hn{font-weight:900;color:var(--bam2);background:linear-gradient(transparent 62%,rgba(61,122,82,.20) 62%);padding:0 2px}
b.hg{font-weight:900;color:var(--clay);background:linear-gradient(transparent 62%,rgba(176,112,58,.20) 62%);padding:0 2px}

.cols{display:flex;gap:24px;flex:1;min-height:0;align-items:center}
.col{flex:1;min-width:0}
.rowc{display:flex;gap:16px;align-items:center}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;
  box-shadow:0 6px 16px rgba(30,25,15,.09)}
.card h3{font-size:22px;font-weight:900;color:var(--acc);margin-bottom:6px}

.term{background:#fff;border-left:8px solid var(--gold);border-radius:8px;padding:12px 16px;
  box-shadow:0 5px 14px rgba(30,25,15,.10)}
.term .t{font-size:22px;font-weight:900;color:var(--clay);margin-bottom:2px}
.term .d{font-size:20px;font-weight:500;color:var(--ink);line-height:1.45}

.act{background:#fff;border:3px dashed var(--bam);border-radius:16px;padding:15px 20px}
.act-h{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.act-badge{background:var(--bam);color:#fff;font-weight:900;font-size:19px;
  padding:4px 14px;border-radius:999px;white-space:nowrap}
.act-t{font-size:24px;font-weight:900;color:var(--bam2)}

table.tbl{width:100%;border-collapse:collapse;font-size:20px;text-align:center}
table.tbl th{background:var(--acc);color:#fff;padding:8px 6px;font-weight:900;font-size:19px}
table.tbl td{border:1px solid var(--line);padding:9px 8px;background:#fff;color:var(--ink);font-weight:700}
table.tbl td.dim{background:#efeade;color:var(--muted);font-weight:500;font-size:18px}
table.tbl td.lead{background:#fff;font-weight:900;font-size:22px}
table.tbl td.lft{text-align:left;font-weight:500;font-size:19px;line-height:1.4}

/* ---------- 소리 단추 ---------- */
.play{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:52px;padding:11px 21px;border:0;border-radius:13px;cursor:pointer;
  background:var(--bam);color:#fff;font-family:inherit;font-size:21px;font-weight:900;
  box-shadow:0 5px 0 #22482e;transition:transform .06s,box-shadow .06s}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #22482e}
.play.gold{background:var(--gold);box-shadow:0 5px 0 #966b1f}
.play.plum{background:var(--plum);box-shadow:0 5px 0 #56305c}
.play.navy{background:var(--navy2);box-shadow:0 5px 0 #0e3a63}
.play.clay{background:var(--clay);box-shadow:0 5px 0 #7d4c22}
.play.grey{background:#5c6470;box-shadow:0 5px 0 #3b424b}
.play.sm{min-height:44px;font-size:19px;padding:9px 16px;border-radius:11px}
.play.on{background:var(--red)!important;box-shadow:0 5px 0 #8c2418!important}

/* ---------- 율명 건반 ---------- */
.keys{display:flex;gap:8px}
.key{flex:1;min-height:104px;border-radius:13px;border:3px solid var(--line);background:#fff;
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;transition:transform .07s,background .07s;padding:6px 2px}
.key .ch{font-size:34px;font-weight:900;color:var(--bam2);line-height:1}
.key .rd{font-size:16px;font-weight:700;color:var(--muted)}
.key .gy{font-size:19px;font-weight:900;color:var(--clay)}
.key:active,.key.lit{transform:translateY(4px);background:#f0f8f1;border-color:var(--bam)}
.key.hi{border-color:#d9b96a;background:#fffaf0}
.key.hi .ch{color:#9a6f1c}

/* ---------- 정간보 ---------- */
.jang{display:flex;gap:4px;width:100%}
.jcell{flex:1;min-width:0;min-height:120px;background:#fff;border:2px solid var(--line);border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:6px 2px 5px;cursor:pointer;transition:transform .1s,background .1s,border-color .1s}
.jcell.beat3{border-left:4px solid var(--clay)}
.jcell .jy{font-size:32px;font-weight:900;color:var(--bam2);line-height:1.06;text-align:center;margin-top:2px}
.jcell .jy.two{font-size:24px}
.jcell .jw{font-size:21px;font-weight:700;color:var(--clay);margin-top:auto;padding-top:3px}
.jcell .jn{font-size:13px;font-weight:700;color:#b9b3a5}
.jcell.hold{background:#f4f1e7}
.jcell.hold .jy{color:#b9b3a5;font-size:22px}
.jcell.lit{transform:translateY(-5px);background:#fff3d9;border-color:var(--gold);
  box-shadow:0 6px 14px rgba(200,150,62,.35)}
.jcell.rest .jy{color:var(--muted);font-size:22px}

/* 세 장단을 한 화면에 겹쳐 놓는 자리는 칸이 낮으므로 글자도 줄인다 */
#allrows .jcell .jy{font-size:23px}
#allrows .jcell .jy.two{font-size:17px}
#allrows .jcell .jw{font-size:16px}
#allrows .jcell .jn{font-size:11px}

.jrow{display:flex;align-items:stretch;gap:8px}
.jlbl{width:74px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bam);color:#fff;border-radius:9px;font-size:17px;font-weight:900;line-height:1.25;text-align:center}

/* 굿거리 12칸 머리 */
.gutlbl{display:flex;gap:4px;margin-bottom:4px}
.gutlbl span{flex:1;text-align:center;font-size:15px;font-weight:700;color:var(--muted)}
.gutlbl span.g{color:var(--clay);font-weight:900}

/* ---------- 운지표 ---------- */
.fingrow{display:flex;gap:6px;justify-content:center;align-items:flex-end}
.fingbox{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 4px 6px;
  display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .08s,border-color .08s,background .08s}
.fingbox:active,.fingbox.lit{transform:translateY(-4px);border-color:var(--gold);background:#fffaf0}
.fingbox .fh{font-size:26px;font-weight:900;color:var(--bam2);line-height:1}
.fingbox .fg{font-size:16px;font-weight:900;color:var(--clay);margin-top:1px}
.fingbox .ff{font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}

.diag{display:flex;gap:14px;align-items:center}

/* 장단 연습 슬라이드의 오른쪽 팁 — 720px 안에 들어가도록 압축 */
.tips .term{padding:10px 15px}
.tips .term+.term{margin-top:9px}
.tips .term .t{font-size:21px}
.tips .term .d{font-size:19px;line-height:1.42}

.chk{display:flex;gap:8px;align-items:center;font-size:20px;font-weight:700;color:var(--ink)}
.chk .box{width:26px;height:26px;border:3px solid var(--bam);border-radius:6px;flex:none}

.numlist{list-style:none;display:flex;flex-direction:column;gap:9px}
.numlist li{display:flex;gap:11px;align-items:flex-start;font-size:22px;line-height:1.45;font-weight:500;color:var(--ink)}
.numlist .n{flex:none;width:32px;height:32px;border-radius:999px;background:var(--bam);color:#fff;
  font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:1px}
.numlist .n.c2{background:var(--clay)}

.bubble{background:#fff;border-radius:15px;padding:12px 16px;box-shadow:0 5px 13px rgba(30,25,15,.10);
  font-size:20px;line-height:1.45;font-weight:600;color:var(--ink);border:2px solid var(--gold)}

/* 표지 */
.cover{justify-content:center;align-items:center;text-align:center;padding:0;
  background:linear-gradient(158deg,#2b5c3b,#16362a 76%)}
.cover .num{color:#ffd98a;font-size:22px;font-weight:900;margin-bottom:12px;letter-spacing:.06em}
.cover h1{color:#fff;font-size:62px;font-weight:900;line-height:1.2}
.cover .sub{color:#cfe3d3;font-size:24px;font-weight:500;margin-top:20px;line-height:1.5}

.closing{justify-content:center;align-items:center;text-align:center;padding:0;
  background:linear-gradient(160deg,#b0703a,#6d3f18 78%)}
.closing .num{color:#ffe6bd;font-size:22px;font-weight:900;margin-bottom:12px}
.closing h1{color:#fff;font-size:48px;font-weight:900;line-height:1.32}
.closing .sub{color:#f2e0cd;font-size:23px;font-weight:500;margin-top:20px;line-height:1.5}

.bar{position:fixed;left:0;right:0;bottom:0;height:46px;background:#122019;color:#cfe0d4;
  display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;z-index:50}
.bar button{background:#244833;color:#e8f2ea;border:0;border-radius:7px;padding:7px 13px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#prog{position:fixed;left:0;top:0;height:4px;background:var(--bam);z-index:60;transition:width .18s}
.zone{position:fixed;top:0;bottom:46px;width:8%;z-index:40;cursor:pointer}
#zl{left:0}#zr{right:0}
</style>
</head>
<body>

<div id="prog"></div>
<div id="stage"></div>
<div class="zone" id="zl"></div>
<div class="zone" id="zr"></div>
<div class="bar no-print">
  <button onclick="go(-1)">◀ 이전</button>
  <button onclick="go(1)">다음 ▶</button>
  <span id="counter">1 / 1</span>
  <span style="flex:1"></span>
  <span style="opacity:.7">← → 넘김 · F 전체화면 · 🔊 소리 켜 두세요</span>
  <button onclick="fs()">전체화면</button>
</div>

<script>
/* =========================================================================
   율명 — 단소가 내는 여덟 음
   실제 음높이는 전통 단소(황종 = E♭) 기준. 계이름은 경토리 솔라도레미.
   fing = [뒤(엄지), 앞1, 앞2, 앞3]  1=막음 0=엶.  앞4(맨 아래)는 늘 열어 둔다.
   oct 1 = 청성(한 옥타브 위) — 운지는 같고 김을 세게 분다(역취).
   ========================================================================= */
const YUL = {
  '仲': {read:'중려',   gye:'솔',  f:415.30, fing:[1,1,1,1], oct:0, base:'仲'},
  '林': {read:'임종',   gye:'라',  f:466.16, fing:[1,1,1,0], oct:0, base:'林'},
  '無': {read:'무역',   gye:'도',  f:554.37, fing:[1,1,0,0], oct:0, base:'無'},
  '潢': {read:'황종청', gye:'레',  f:622.25, fing:[1,0,0,0], oct:0, base:'潢'},
  '汰': {read:'태주청', gye:'미',  f:698.46, fing:[0,0,0,0], oct:0, base:'汰'},
  '㳞': {read:'중려청', gye:'솔˙', f:830.61, fing:[1,1,1,1], oct:1, base:'仲'},
  '淋': {read:'임종청', gye:'라˙', f:932.33, fing:[1,1,1,0], oct:1, base:'林'},
  '潕': {read:'무역청', gye:'도˙', f:1108.73,fing:[1,1,0,0], oct:1, base:'無'}
};
const ORDER = ['仲','林','無','潢','汰','㳞','淋','潕'];

/* =========================================================================
   늴리리야 — 교과서 59쪽 3번 「선택 1 단소」 정간보를 그대로 옮긴 것
   굿거리 한 장단 = 12정간. 세 장단.
   y: 한 칸에 들어가는 율명(둘이면 반 박씩). '-' = 앞 음 이어짐, '△' = 쉼
   빈 배열 = 앞 음이 그대로 이어지는 칸
   ========================================================================= */
const JANG = [
  { t:'첫째 장단', s:'늴리리야 늴리리야', cells:[
    {y:['淋'],w:'늴'}, {y:['淋'],w:'리'}, {y:['淋'],w:'리'},
    {y:['㳞'],w:'야'}, {y:[],w:''},      {y:[],w:''},
    {y:['淋'],w:'늴'}, {y:['潕'],w:'리'}, {y:['淋'],w:'리'},
    {y:['㳞'],w:'야'}, {y:[],w:''},      {y:['淋','㳞'],w:''}
  ]},
  { t:'둘째 장단', s:'니나노 난실로 내가 돌아간다', cells:[
    {y:['汰'],w:'니'},     {y:['汰'],w:'나'},     {y:['-','汰'],w:'노'},
    {y:['汰','㳞'],w:'난'}, {y:['汰','潢'],w:'실'}, {y:['無'],w:'로'},
    {y:['潢','汰'],w:'내가'},{y:['潢','無'],w:'돌아'},{y:['林'],w:'간'},
    {y:['仲'],w:'다'},     {y:[],w:''},          {y:['△'],w:''}
  ]},
  { t:'셋째 장단', s:'늴늴리리 늴리리야', cells:[
    {y:['無'],w:'늴'}, {y:[],w:''},          {y:[],w:''},
    {y:['仲'],w:'늴'}, {y:['無'],w:'리'},     {y:['汰','潢'],w:'리'},
    {y:['無'],w:'늴'}, {y:['潢','無'],w:'리'}, {y:['林'],w:'리'},
    {y:['仲'],w:'야'}, {y:[],w:''},          {y:['△'],w:''}
  ]}
];

/* =========================================================================
   소리
   ========================================================================= */
let ac = null, timers = [], curBtn = null, running = false;

function audio(){
  if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
function clearLit(){
  document.querySelectorAll('.lit').forEach(e => e.classList.remove('lit'));
  document.querySelectorAll('.play.on').forEach(e => {
    e.classList.remove('on');
    if(e.dataset.label) e.textContent = e.dataset.label;
  });
  curBtn = null; running = false;
}
function stopAll(){
  timers.forEach(clearTimeout); timers = [];
  clearLit();
  if(ac){ try{ ac.close(); }catch(e){} ac = null; }
}
function mark(btn){
  if(!btn) return;
  if(!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.classList.add('on'); btn.textContent = '■ 멈추기';
  curBtn = btn; running = true;
}

/* --- 단소 한 음 : 사인파 + 옥타브 배음 + 숨소리 --- */
function danso(a, t, f, d, vol){
  const v = (vol === undefined ? .22 : vol);
  const out = a.createGain();
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(v, t + .055);          /* 부드러운 어택 */
  out.gain.setValueAtTime(v, t + Math.max(.06, d * .74));
  out.gain.exponentialRampToValueAtTime(.0008, t + d * .99);
  out.connect(a.destination);

  /* 기본음 */
  const o1 = a.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
  const g1 = a.createGain(); g1.gain.value = 1;
  /* 옥타브 배음 — 단소 특유의 맑고 뻥 뚫린 소리 */
  const o2 = a.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
  const g2 = a.createGain(); g2.gain.value = .17;
  /* 3배음 아주 조금 */
  const o3 = a.createOscillator(); o3.type = 'sine'; o3.frequency.value = f * 3;
  const g3 = a.createGain(); g3.gain.value = .05;

  /* 가벼운 흔들림(자연스러운 김) */
  const lfo = a.createOscillator(), lg = a.createGain();
  lfo.type = 'sine'; lfo.frequency.value = 5.2; lg.gain.value = f * .006;
  lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);

  /* 숨소리 — 짧은 노이즈를 대역통과로 */
  const nb = a.createBuffer(1, Math.ceil(a.sampleRate * Math.min(d, 1.4)), a.sampleRate);
  const nd = nb.getChannelData(0);
  for(let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1);
  const ns = a.createBufferSource(); ns.buffer = nb;
  const nf = a.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = f * 2.1; nf.Q.value = 1.4;
  const ng = a.createGain();
  ng.gain.setValueAtTime(.075, t);
  ng.gain.exponentialRampToValueAtTime(.010, t + .22);

  o1.connect(g1); g1.connect(out);
  o2.connect(g2); g2.connect(out);
  o3.connect(g3); g3.connect(out);
  ns.connect(nf); nf.connect(ng); ng.connect(out);

  o1.start(t); o2.start(t); o3.start(t); lfo.start(t); ns.start(t);
  const e = t + d + .03;
  o1.stop(e); o2.stop(e); o3.stop(e); lfo.stop(e); try{ ns.stop(e); }catch(x){}
}

/* --- 바람만 새는 소리(소리가 안 날 때) --- */
function breath(a, t, d, bright){
  const nb = a.createBuffer(1, Math.ceil(a.sampleRate * d), a.sampleRate);
  const nd = nb.getChannelData(0);
  for(let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1);
  const ns = a.createBufferSource(); ns.buffer = nb;
  const f = a.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.value = bright || 2200; f.Q.value = .7;
  const g = a.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(.30, t + .10);
  g.gain.setValueAtTime(.30, t + d * .7);
  g.gain.exponentialRampToValueAtTime(.001, t + d * .99);
  ns.connect(f); f.connect(g); g.connect(a.destination);
  ns.start(t); try{ ns.stop(t + d + .02); }catch(x){}
}

/* --- 삑 갈라지는 소리 --- */
function crack(a, t, f){
  danso(a, t, f, .25, .18);
  danso(a, t + .22, f * 2, .18, .20);
  breath(a, t + .38, .30, 3200);
  danso(a, t + .60, f, .30, .16);
}

/* --- 장구(굿거리) --- */
function drum(a, t, kind){
  if(kind === 'low' || kind === 'both'){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(62, t + .10);
    g.gain.setValueAtTime(.40, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .28);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .30);
  }
  if(kind === 'high' || kind === 'both'){
    const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
    o.type = 'square';
    o.frequency.setValueAtTime(1450, t);
    o.frequency.exponentialRampToValueAtTime(760, t + .05);
    f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 1.1;
    g.gain.setValueAtTime(.14, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .10);
    o.connect(f); f.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .12);
  }
}
/* 굿거리 12정간 — 1 덩 / 4 기덕 / 7 쿵 / 10 더러러러 */
function gutgeori(a, t0, beat){
  drum(a, t0 + beat * 0,  'both');
  drum(a, t0 + beat * 3,  'high');
  drum(a, t0 + beat * 6,  'low');
  drum(a, t0 + beat * 9,  'low');
  for(let k = 0; k < 4; k++) drum(a, t0 + beat * 10 + k * beat * .25, 'high');
}

/* =========================================================================
   단소 그림 (SVG)
   ========================================================================= */
function fingSVG(fing, opt){
  opt = opt || {};
  const w = opt.w || 74, oct = opt.oct || 0, labels = opt.labels;
  const H = 250, cx = 50;
  const holes = [
    {y:74,  back:true,  on:fing[0], lb:'왼손 엄지 (뒤)'},
    {y:112, back:false, on:fing[1], lb:'왼손 검지'},
    {y:145, back:false, on:fing[2], lb:'왼손 중지'},
    {y:178, back:false, on:fing[3], lb:'오른손 검지'},
    {y:211, back:false, on:0,       lb:'막지 않음', never:true}
  ];
  let s = '<svg viewBox="0 0 ' + (labels ? 260 : 100) + ' ' + H + '" width="' + w + '" style="display:block;overflow:visible">';
  s += '<defs><linearGradient id="bg' + (opt.id||0) + '" x1="0" y1="0" x2="1" y2="0">' +
       '<stop offset="0" stop-color="#c9a86b"/><stop offset=".38" stop-color="#e7d3a8"/>' +
       '<stop offset=".72" stop-color="#c9a86b"/><stop offset="1" stop-color="#9d7c44"/>' +
       '</linearGradient></defs>';
  /* 관 */
  s += '<rect x="' + (cx-15) + '" y="10" width="30" height="' + (H-18) + '" rx="14" fill="url(#bg' + (opt.id||0) + ')" stroke="#8a6a37" stroke-width="2"/>';
  /* 대나무 마디 */
  [96, 162, 228].forEach(y => {
    s += '<path d="M ' + (cx-15) + ' ' + y + ' Q ' + cx + ' ' + (y+5) + ' ' + (cx+15) + ' ' + y + '" fill="none" stroke="#8a6a37" stroke-width="2" opacity=".55"/>';
  });
  /* 취구 — 위 끝의 U자 홈 */
  s += '<path d="M ' + (cx-9) + ' 10 L ' + (cx-9) + ' 30 Q ' + cx + ' 44 ' + (cx+9) + ' 30 L ' + (cx+9) + ' 10 Z" fill="#f7f4ec" stroke="#8a6a37" stroke-width="2"/>';
  /* 구멍 */
  holes.forEach(h => {
    const fill = h.on ? '#2b2b2b' : '#fff';
    const dash = h.back ? ' stroke-dasharray="4 3"' : '';
    const stk  = h.never ? '#c3bbaa' : (h.back ? '#1d5b95' : '#5b4a2a');
    s += '<circle cx="' + cx + '" cy="' + h.y + '" r="9" fill="' + fill + '" stroke="' + stk + '" stroke-width="2.6"' + dash + '/>';
    if(h.never) s += '<line x1="' + (cx-5) + '" y1="' + (h.y-5) + '" x2="' + (cx+5) + '" y2="' + (h.y+5) + '" stroke="#c3bbaa" stroke-width="2"/>';
    if(labels){
      s += '<line x1="' + (cx+13) + '" y1="' + h.y + '" x2="106" y2="' + h.y + '" stroke="#c9c1b0" stroke-width="1.6"/>';
      s += '<text x="112" y="' + (h.y+6) + '" font-size="16" font-weight="700" fill="' +
           (h.never ? '#a49b8a' : (h.back ? '#1d5b95' : '#3f3625')) + '" font-family="Noto Sans KR">' + h.lb + '</text>';
    }
  });
  /* 역취 표시 */
  if(oct){
    s += '<g><path d="M 14 40 L 14 22 L 8 30 M 14 22 L 20 30" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
         '<text x="4" y="58" font-size="14" font-weight="900" fill="#c0392b" font-family="Noto Sans KR">세게</text></g>';
  }
  s += '</svg>';
  return s;
}

/* 큰 도해(구조 설명용) */
function dansoBig(){
  const cx = 96, H = 470;
  let s = '<svg viewBox="0 0 460 ' + H + '" width="100%" style="max-height:470px;display:block">';
  s += '<defs><linearGradient id="bgb" x1="0" y1="0" x2="1" y2="0">' +
       '<stop offset="0" stop-color="#c9a86b"/><stop offset=".38" stop-color="#e7d3a8"/>' +
       '<stop offset=".72" stop-color="#c9a86b"/><stop offset="1" stop-color="#9d7c44"/></linearGradient></defs>';
  s += '<rect x="' + (cx-26) + '" y="18" width="52" height="' + (H-40) + '" rx="24" fill="url(#bgb)" stroke="#8a6a37" stroke-width="3"/>';
  [170, 300, 415].forEach(y => {
    s += '<path d="M ' + (cx-26) + ' ' + y + ' Q ' + cx + ' ' + (y+9) + ' ' + (cx+26) + ' ' + y + '" fill="none" stroke="#8a6a37" stroke-width="3" opacity=".5"/>';
  });
  s += '<path d="M ' + (cx-16) + ' 18 L ' + (cx-16) + ' 52 Q ' + cx + ' 78 ' + (cx+16) + ' 52 L ' + (cx+16) + ' 18 Z" fill="#f7f4ec" stroke="#8a6a37" stroke-width="3"/>';

  const items = [
    {y:40,  t:'취구(吹口)', d:'입김을 부는 U자 홈', c:'#c0392b', big:true},
    {y:128, t:'제1공 (뒤)', d:'왼손 엄지 — 뒤쪽에 있다', c:'#1d5b95', back:true},
    {y:212, t:'제2공', d:'왼손 검지', c:'#3d7a52'},
    {y:288, t:'제3공', d:'왼손 중지', c:'#3d7a52'},
    {y:364, t:'제4공', d:'오른손 검지', c:'#3d7a52'},
    {y:432, t:'제5공', d:'막지 않는다', c:'#a49b8a', never:true}
  ];
  items.forEach(it => {
    if(it.big){
      s += '<line x1="' + (cx+20) + '" y1="' + it.y + '" x2="196" y2="' + it.y + '" stroke="' + it.c + '" stroke-width="2.4"/>';
    } else {
      const fill = it.never ? '#fff' : (it.back ? '#fff' : '#2b2b2b');
      const dash = it.back ? ' stroke-dasharray="6 4"' : '';
      s += '<circle cx="' + cx + '" cy="' + it.y + '" r="14" fill="' + fill + '" stroke="' + it.c + '" stroke-width="4"' + dash + '/>';
      if(it.never) s += '<line x1="' + (cx-8) + '" y1="' + (it.y-8) + '" x2="' + (cx+8) + '" y2="' + (it.y+8) + '" stroke="#a49b8a" stroke-width="3"/>';
      s += '<line x1="' + (cx+18) + '" y1="' + it.y + '" x2="196" y2="' + it.y + '" stroke="' + it.c + '" stroke-width="2.4"/>';
    }
    s += '<text x="206" y="' + (it.y - 3) + '" font-size="24" font-weight="900" fill="' + it.c + '" font-family="Noto Sans KR">' + it.t + '</text>';
    s += '<text x="206" y="' + (it.y + 22) + '" font-size="19" font-weight="500" fill="#4a4438" font-family="Noto Sans KR">' + it.d + '</text>';
  });
  s += '</svg>';
  return s;
}

/* --- 확장한자(㳞) 폰트 폴백 : 못 그리면 沖 으로 바꾼다 --- */
(function glyphFix(){
  /* 폭으로 재면 안 된다 — 한자는 전각 고정폭이라 두부(□)도 폭이 같아서
     모든 글자가 「미지원」으로 잡힌다. 실제로 찍힌 픽셀 수를 센다. */
  function drawn(ch){
    const cv = document.createElement('canvas'); cv.width = cv.height = 60;
    const x = cv.getContext('2d');
    x.font = '44px "Noto Sans KR", Batang, Gulim, "Malgun Gothic", serif';
    x.fillStyle = '#000'; x.fillText(ch, 4, 46);
    const d = x.getImageData(0, 0, 60, 60).data;
    let n = 0; for(let i = 3; i < d.length; i += 4) if(d[i] > 0) n++;
    return n;
  }
  const tofu = drawn('￾');                       /* 확실히 없는 글자 = 두부 모양 */
  const bad = ch => { const n = drawn(ch); return n === 0 || Math.abs(n - tofu) < tofu * .15; };
  const swap = {};
  /* 㳞(U+3CDE)은 확장한자라 한글 폰트에 없는 경우가 있다. 그때만 沖으로 바꾼다.
     潕(U+6F55)는 KS X 1001 안에 있어 폴백이 필요 없다 — 마땅한 대체자도 없다. */
  if(bad('㳞')) swap['㳞'] = '沖';
  const keys = Object.keys(swap);
  if(!keys.length) return;
  keys.forEach(k => {
    stage.innerHTML = stage.innerHTML.split(k).join(swap[k]);
    YUL[swap[k]] = YUL[k];
    const i = ORDER.indexOf(k); if(i >= 0) ORDER[i] = swap[k];
    JANG.forEach(j => j.cells.forEach(c2 => {
      c2.y = c2.y.map(y => y === k ? swap[k] : y);
    }));
  });
})();

         '<div class="jw">' + (cell.w || '') + '</div></div>';
}

/* =========================================================================
   장단 재생
   ========================================================================= */
const SPEED = { slow:.62, mid:.44, full:.30 };

/* 칸들을 실제 음 이벤트로 푼다 */
function toEvents(cells, beat, t0){
  const ev = [];
  let t = t0, last = null;
  cells.forEach(cell => {
    if(!cell.y.length){                       /* 빈 칸 = 앞 음 이어짐 */
      if(last) last.d += beat;
    } else {
      const n = cell.y.length, sub = beat / n;
      cell.y.forEach((ch, k) => {
        if(ch === '-'){ if(last) last.d += sub; }
        else if(ch === '△'){ last = null; }
        else if(YUL[ch]){
          const e = { t: t + k * sub, f: YUL[ch].f, d: sub, ch: ch };
          ev.push(e); last = e;
        }
      });
    }
    t += beat;
  });
  return { ev: ev, end: t };
}

function playJang(list, beat, btn, withDrum, hosts){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const a = audio();
  mark(btn);
  let t = a.currentTime + .25;
  const cellsAll = [];
  list.forEach((idx, n) => {
    const r = toEvents(JANG[idx].cells, beat, t);
    r.ev.forEach(e => danso(a, e.t, e.f, Math.max(e.d * .92, .16)));
    if(withDrum) gutgeori(a, t, beat);
    /* 칸 점등 */
    JANG[idx].cells.forEach((c, i) => {
      cellsAll.push({ at: (t - a.currentTime) + i * beat, jang: idx, cell: i, row: n });
    });
    t = r.end;
  });
  const hostFor = (jang, row) => {
    if(hosts === 'all') return document.querySelector('[data-all="' + jang + '"]');
    return document.querySelector('[data-jang="' + jang + '"]');
  };
  cellsAll.forEach(c => {
    timers.push(setTimeout(() => {
      document.querySelectorAll('.jcell.lit').forEach(e => e.classList.remove('lit'));
      const h = hostFor(c.jang, c.row);
      if(h){ const el = h.children[c.cell]; if(el) el.classList.add('lit'); }
    }, c.at * 1000));
  });
  timers.push(setTimeout(clearLit, (t - a.currentTime) * 1000 + 500));
}

/* =========================================================================
   단추
   ========================================================================= */
function bindAll(){
  /* 율명 건반 · 운지표 */
  stage.querySelectorAll('[data-note]').forEach(el => {
    el.onclick = () => {
      const ch = el.dataset.note;
      if(!YUL[ch]) return;
      stopAll();
      const a = audio();
      danso(a, a.currentTime + .02, YUL[ch].f, 1.0);
      el.classList.add('lit');
      timers.push(setTimeout(() => el.classList.remove('lit'), 700));
    };
  });

  /* 세 가지 소리 */
  stage.querySelectorAll('[data-snd]').forEach(b => {
    b.onclick = () => {
      const same = (curBtn === b); stopAll(); if(same) return;
      const a = audio(), t = a.currentTime + .05;
      mark(b);
      let dur = 1.6;
      if(b.dataset.snd === 'wind'){ breath(a, t, 1.5, 2400); dur = 1.6; }
      else if(b.dataset.snd === 'crack'){ crack(a, t, YUL['潢'].f); dur = 1.2; }
      else { danso(a, t, YUL['潢'].f, 1.5); dur = 1.7; }
      timers.push(setTimeout(clearLit, dur * 1000));
    };
  });

  /* 음계 훑기 */
  stage.querySelectorAll('[data-scale]').forEach(b => {
    b.onclick = () => {
      const same = (curBtn === b); stopAll(); if(same) return;
      const a = audio(); mark(b);
      const five = ['仲','林','無','潢','汰'];
      const seq = b.dataset.scale === '1'
        ? five.concat(five.slice(0, 4).reverse())
        : ORDER.slice();
      let t = a.currentTime + .1;
      seq.forEach(ch => {
        const y = YUL[ch] || YUL[ORDER[0]];
        danso(a, t, y.f, .52);
        const kb = stage.querySelector('.slide.on [data-note="' + ch + '"]');
        if(kb) timers.push(setTimeout(() => {
          document.querySelectorAll('.key.lit,.fingbox.lit').forEach(e => e.classList.remove('lit'));
          kb.classList.add('lit');
        }, (t - a.currentTime) * 1000));
        t += .55;
      });
      timers.push(setTimeout(clearLit, (t - a.currentTime) * 1000 + 300));
    };
  });

  /* 옥타브 비교 */
  stage.querySelectorAll('[data-pair]').forEach(b => {
    b.onclick = () => {
      const same = (curBtn === b); stopAll(); if(same) return;
      const a = audio(); mark(b);
      const p = b.dataset.pair.split('|');
      let t = a.currentTime + .1;
      p.forEach(ch => { const y = YUL[ch]; if(y){ danso(a, t, y.f, .95); t += 1.15; } });
      timers.push(setTimeout(clearLit, (t - a.currentTime) * 1000));
    };
  });

  /* 굿거리 */
  stage.querySelectorAll('[data-gut]').forEach(b => {
    b.onclick = () => {
      const same = (curBtn === b); stopAll(); if(same) return;
      const a = audio(); mark(b);
      const beat = .34, t0 = a.currentTime + .15;
      gutgeori(a, t0, beat); gutgeori(a, t0 + beat * 12, beat);
      const host = b.closest('.card').querySelector('.jang');
      for(let r = 0; r < 2; r++) for(let i = 0; i < 12; i++){
        timers.push(setTimeout(() => {
          host.querySelectorAll('.jcell').forEach(e => e.classList.remove('lit'));
          if(host.children[i]) host.children[i].classList.add('lit');
        }, (.15 + (r * 12 + i) * beat) * 1000));
      }
      timers.push(setTimeout(clearLit, (.15 + beat * 24) * 1000 + 300));
    };
  });

  /* 시김새 비교 */
  stage.querySelectorAll('[data-orn]').forEach(b => {
    b.onclick = () => {
      const same = (curBtn === b); stopAll(); if(same) return;
      const a = audio(); mark(b);
      const L = YUL['淋'].f, M = (YUL['潕'] || YUL['無']).f;
      let t = a.currentTime + .1, end;
      const phrase = (t0, sigim) => {
        /* 늴 리 리 야 */
        if(sigim){ danso(a, t0, M, .12, .17); danso(a, t0 + .10, L, .45); }
        else danso(a, t0, L, .52);
        danso(a, t0 + .55, L, .48);
        danso(a, t0 + 1.10, L, .48);
        danso(a, t0 + 1.65, YUL['㳞'] ? YUL['㳞'].f : YUL['仲'].f * 2, .80);
        return t0 + 2.6;
      };
      end = phrase(t, b.dataset.orn === 'sigim');
      timers.push(setTimeout(clearLit, (end - a.currentTime) * 1000));
    };
  });

  /* 장단 재생 */
  stage.querySelectorAll('[data-jplay]').forEach(b => {
    b.onclick = () => {
      const p = b.dataset.jplay.split('|');
      playJang([+p[0]], SPEED[p[1]], b, p[1] === 'full', 'one');
    };
  });
  stage.querySelectorAll('[data-aplay]').forEach(b => {
    b.onclick = () => {
      const sp = b.dataset.aplay;
      playJang([0,1,2], SPEED[sp], b, sp === 'full', 'all');
    };
  });
}
bindAll();

const slides = [...stage.querySelectorAll('.slide')];
let cur = 0;
function show(i){
  stopAll();
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, n) => s.classList.toggle('on', n === cur));
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + slides.length;
  const p = document.getElementById('prog');
  p.style.width = ((cur + 1) / slides.length * 100) + '%';
  p.style.background = getComputedStyle(slides[cur]).getPropertyValue('--acc');
}
function go(d){ show(cur + d); }
function fit(){
  const s = Math.min(window.innerWidth / 1280, (window.innerHeight - 46) / 720);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
function fs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
document.addEventListener('keydown', e => {
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(1); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
  if(e.key === 'Home') show(0);
  if(e.key === 'End') show(slides.length - 1);
  if(e.key === 'f' || e.key === 'F') fs();
});
document.getElementById('zl').onclick = () => go(-1);
document.getElementById('zr').onclick = () => go(1);

let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('resize', fit);
fit();
show(0);
</script>
</body>
</html>
