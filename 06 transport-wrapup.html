<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4단원 마무리 — 생활과 수송</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1c2430; --navy:#123a63; --navy2:#1d5b95;
  --red:#c0392b; --gold:#c8963e; --green:#2e7d5b; --plum:#7d4a86;
  --paper:#f6f2e9; --line:#d9d2c4; --muted:#6d6b66;
}

html,body{height:100%;background:#0d1520;font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}

#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;background:var(--paper);overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}

.slide{position:absolute;inset:0;padding:38px 52px;display:none;
  flex-direction:column;background:var(--paper);--acc:var(--navy2)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 12% 8%,rgba(29,91,149,.10),transparent 45%),
             radial-gradient(circle at 92% 95%,rgba(200,150,62,.10),transparent 45%)}
.slide>*{position:relative;z-index:1}

.eyebrow{display:inline-block;font-size:20px;font-weight:700;color:#fff;
  background:var(--acc);padding:5px 17px;border-radius:999px;margin-bottom:10px;align-self:flex-start}
h2.stitle{font-size:39px;font-weight:900;color:var(--acc);line-height:1.2;letter-spacing:-.02em;margin-bottom:4px}
h2.stitle.sm{font-size:33px}
.rule{width:92px;height:7px;border-radius:4px;
  background:linear-gradient(90deg,var(--navy2),var(--gold));margin:9px 0 17px}
p.body{font-size:26px;line-height:1.55;color:var(--ink);font-weight:500}
p.body+p.body{margin-top:12px}
.small{font-size:21px;line-height:1.5}
.tiny{font-size:18px;line-height:1.5}

b.hl{font-weight:900;color:var(--red);background:linear-gradient(transparent 62%,rgba(192,57,43,.20) 62%);padding:0 2px}
b.hn{font-weight:900;color:var(--navy2);background:linear-gradient(transparent 62%,rgba(29,91,149,.18) 62%);padding:0 2px}
b.hg{font-weight:900;color:var(--green);background:linear-gradient(transparent 62%,rgba(46,125,91,.18) 62%);padding:0 2px}

.cols{display:flex;gap:28px;flex:1;min-height:0;align-items:center}
.col{flex:1;min-width:0}

.term{background:#fff;border-left:9px solid var(--gold);border-radius:8px;padding:13px 17px;
  box-shadow:0 6px 16px rgba(30,25,15,.10)}
.term+.term{margin-top:12px}
.term .t{font-size:23px;font-weight:900;color:var(--gold);margin-bottom:3px}
.term .d{font-size:21px;font-weight:500;color:var(--ink);line-height:1.45}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;
  box-shadow:0 6px 16px rgba(30,25,15,.09)}
.card h3{font-size:22px;font-weight:900;color:var(--acc);margin-bottom:7px}
.card p{font-size:20px;line-height:1.45;font-weight:500;color:var(--ink)}
.cardrow{display:flex;gap:15px}
.cardrow>.card{flex:1}

.act{background:#fff;border:3px dashed var(--red);border-radius:18px;padding:18px 22px}
.act-h{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.act-badge{background:var(--red);color:#fff;font-weight:900;font-size:19px;
  padding:5px 14px;border-radius:999px;white-space:nowrap}
.act-t{font-size:25px;font-weight:900;color:var(--navy)}

.chip{display:inline-block;background:#fff;border:2px solid var(--acc);color:var(--acc);
  font-weight:900;font-size:22px;border-radius:999px;padding:10px 22px;margin:8px 10px 0 0}
.chipwrap{display:flex;flex-wrap:wrap}

.fig{display:flex;justify-content:center;align-items:center;flex:1;min-height:0}
.fig svg{max-width:100%;max-height:100%}
.figcap{font-size:18px;color:var(--muted);text-align:center;font-weight:600;margin-top:5px}

/* 사진 */
.ph{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;
  box-shadow:0 6px 16px rgba(30,25,15,.09);display:flex;flex-direction:column;align-items:center}
.ph img{width:100%;height:auto;display:block;border-radius:8px;object-fit:contain}
.ph .cap{font-size:18px;font-weight:900;color:var(--navy);margin-top:6px;text-align:center;line-height:1.3}
.ph .sub{font-size:16px;font-weight:500;color:var(--muted);text-align:center;line-height:1.35;margin-top:2px}
.phrow{display:flex;gap:15px;align-items:flex-start}
.phrow>.ph{flex:1;min-width:0}

/* 연표 */
.tl{display:flex;gap:11px;align-items:stretch;flex:1;min-height:0}
.tl>.ph{flex:1;min-width:0;justify-content:space-between}
/* 그림마다 세로 비율이 달라 캡션 줄이 들쭉날쭉해진다 — 높이를 묶어 준다 */
.tl .ph img{height:300px;object-fit:contain;background:#fff}
.tl .cap{font-size:17px}
.tlbar{height:8px;border-radius:5px;margin:12px 0 10px;
  background:linear-gradient(90deg,#c8963e,#1d5b95)}

.plan{display:flex;gap:15px;flex:1;min-height:0;align-items:stretch}
.pp{flex:1;background:#fff;border-radius:16px;border:1px solid var(--line);padding:16px 18px;
  box-shadow:0 6px 16px rgba(30,25,15,.09);display:flex;flex-direction:column}
.pp .pn{font-family:'Gaegu',sans-serif;font-size:33px;color:var(--navy2);line-height:1}
.pp .pt{font-size:23px;font-weight:900;color:var(--navy);margin:5px 0 7px}
.pp .pd{font-size:19px;line-height:1.45;color:var(--ink);font-weight:500}

.vs{display:flex;gap:0;flex:1;min-height:0;align-items:stretch;
  background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 6px 16px rgba(30,25,15,.09)}
.vs .vcol{flex:1;padding:15px 18px}
.vs .vcol+.vcol{border-left:2px solid var(--line)}
.vs .vh{font-size:24px;font-weight:900;margin-bottom:9px}
.vs .vi{font-size:21px;line-height:1.45;font-weight:500;color:var(--ink);
  padding:7px 0;border-bottom:1px dashed var(--line)}
.vs .vi:last-child{border-bottom:0}

/* 표 (자율주행 단계) */
.lv{display:grid;grid-template-columns:118px 1fr 1fr;
  background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 6px 16px rgba(30,25,15,.09)}
.lv>div{padding:9px 13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:19px;line-height:1.35;font-weight:500;display:flex;align-items:center}
.lv>div:nth-child(3n){border-right:0}
.lv>div:nth-last-child(-n+3){border-bottom:0}
.lv .th{background:#eef2f7;font-weight:900;font-size:20px;justify-content:center;color:var(--navy)}
.lv .rh{background:#faf7f0;font-weight:900;font-size:19px;color:var(--navy2);justify-content:center}
.lv .now{background:#fdf4e4}

.check{display:flex;flex-direction:column;gap:9px;flex:1;min-height:0;justify-content:center}
.check .ci{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px 18px;box-shadow:0 4px 12px rgba(30,25,15,.07)}
.check .cn{background:var(--navy2);color:#fff;font-weight:900;font-size:19px;width:34px;height:34px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.check .ct{font-size:23px;font-weight:700;color:var(--ink)}

.cover2{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#123a63,#1d5b95 70%)}
.cover2 .kicker{color:#ffe9b0;font-size:22px;font-weight:700;margin-bottom:15px}
.cover2 h1{color:#fff;font-size:48px;font-weight:900;line-height:1.28}
.cover2 .sub{color:#d6e4f2;font-size:22px;font-weight:500;margin-top:19px;max-width:940px}

.divider{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#1c5a45,#123a63 70%)}
.divider .num{color:#ffe9b0;font-size:25px;font-weight:900;margin-bottom:9px}
.divider h1{color:#fff;font-size:45px;font-weight:900;line-height:1.25}
.divider .sub{color:#cfe3d9;font-size:21px;font-weight:500;margin-top:16px}

.bar{position:fixed;left:0;right:0;bottom:0;height:46px;background:#0f1a29;color:#cfd8e6;
  display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;z-index:50}
.bar button{background:#1d3350;color:#e8eef7;border:0;border-radius:7px;padding:7px 13px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#prog{position:fixed;left:0;top:0;height:4px;background:var(--navy2);z-index:60;transition:width .18s}
.zone{position:fixed;top:0;bottom:46px;width:12%;z-index:40;cursor:pointer}
#zl{left:0}#zr{right:0}
</style>
</head>
<body>

<div id="prog"></div>
<div id="stage"></div>
<div class="zone" id="zl"></div>
<div class="zone" id="zr"></div>
<div class="bar">
  <button onclick="go(-1)">◀ 이전</button>
  <button onclick="go(1)">다음 ▶</button>
  <span id="counter">1 / 1</span>
  <span style="margin-left:18px;opacity:.7">← → 이동 · F 전체화면</span>
  <button style="margin-left:auto" onclick="fs()">⛶ 전체화면</button>
</div>

});
const slides = [...stage.querySelectorAll(".slide")];

let cur = 0;
function show(i){
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s,n) => s.classList.toggle("on", n === cur));
  document.getElementById("counter").textContent = (cur+1) + " / " + slides.length;
  const p = document.getElementById("prog");
  p.style.width = ((cur+1)/slides.length*100) + "%";
  p.style.background = getComputedStyle(slides[cur]).getPropertyValue("--acc");
}
function go(d){ show(cur + d); }
function fit(){
  const s = Math.min(window.innerWidth/1280, (window.innerHeight-46)/720);
  stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
}
function fs(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
document.addEventListener("keydown", e => {
  if (["ArrowRight","PageDown"," "].includes(e.key)) { e.preventDefault(); go(1); }
  if (["ArrowLeft","PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
  if (e.key === "Home") show(0);
  if (e.key === "End") show(slides.length-1);
  if (e.key === "f" || e.key === "F") fs();
});
document.getElementById("zl").onclick = () => go(-1);
document.getElementById("zr").onclick = () => go(1);
let tx=0, ty=0;
document.addEventListener("touchstart", e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, {passive:true});
window.addEventListener("resize", fit);
fit();
show(0);
</script>
</body>
</html>
