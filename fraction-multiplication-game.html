<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>분수의 곱셈 — 진로 체험관</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef3fa; --card:#ffffff; --ink:#16233a; --muted:#6b7c96; --line:#d6e0ee;
  --pri:#2f6df0; --pri2:#1b4fc4; --acc:#ff7a45; --ok:#12a06b; --bad:#e04b4b;
  --gold:#f5b524; --pink:#ef6ba6; --blue:#49a0ee; --purple:#8a5cd6;
}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--ink);
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
  font-size:17px; line-height:1.5; overflow-x:hidden;
}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 40px}
.screen{display:none}
.screen.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 공통 부품 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:12px 22px;border:none;border-radius:14px;
  font-family:inherit;font-size:18px;font-weight:700;color:#fff;background:var(--pri);
  cursor:pointer;box-shadow:0 3px 0 var(--pri2);transition:transform .06s;
}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--pri2)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.acc{background:var(--acc);box-shadow:0 3px 0 #d75b2a}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 #0b7d51}
.btn.sm{min-height:42px;padding:8px 16px;font-size:15px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(30,50,90,.07)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.muted{color:var(--muted);font-size:15px}
.eyebrow{display:inline-block;background:var(--pri);color:#fff;border-radius:999px;
  padding:4px 14px;font-size:14px;font-weight:700;letter-spacing:.5px}

/* ===== 분수 표기 ===== */
.fr{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;font-weight:700}
.fr .wn{font-size:1.5em;line-height:1}
.fr .fb{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;font-size:.92em}
.fr .fb b{font-weight:700;padding:0 3px}
.fr .fb i{font-style:normal;font-weight:700;padding:0 3px;border-top:2.5px solid currentColor}
.eq{font-size:26px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.eq .op{font-weight:900;color:var(--muted)}

/* ===== 홈 ===== */
.hero{background:linear-gradient(150deg,#2f6df0,#7b4cf0 70%);color:#fff;border-radius:22px;
  padding:24px 20px;text-align:center;box-shadow:0 6px 18px rgba(47,109,240,.28)}
.hero h1{margin:6px 0 4px;font-size:31px;font-weight:900;letter-spacing:-.5px}
.hero p{margin:0;opacity:.92;font-size:15px}
.starline{margin-top:12px;font-size:20px;font-weight:900}
.rank{display:inline-block;margin-top:6px;background:rgba(255,255,255,.2);
  border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
.room{background:#fff;border-radius:16px;padding:14px;border:3px solid transparent;
  cursor:pointer;position:relative;box-shadow:0 2px 8px rgba(30,50,90,.08);transition:transform .08s}
.room:active{transform:scale(.97)}
.room .rm-emo{font-size:32px;line-height:1}
.room .rm-name{font-weight:900;font-size:18px;margin-top:4px}
.room .rm-sub{font-size:13px;color:var(--muted);margin-top:2px;min-height:42px}
.room .rm-star{margin-top:6px;font-size:16px;letter-spacing:2px}
.room.lock{opacity:.55;background:#e9eef6}
.room.lock .rm-emo{filter:grayscale(1)}
.room .lockbadge{position:absolute;top:10px;right:12px;font-size:18px}
.room.done{border-color:var(--gold)}

/* ===== 관문 화면 ===== */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.topbar .back{background:#fff;border:2px solid var(--line);border-radius:12px;
  min-height:44px;padding:6px 14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.topbar .ttl{font-weight:900;font-size:19px;flex:1}
.gates{display:flex;gap:8px;margin-bottom:12px}
.gate{flex:1;background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;
  text-align:center;cursor:pointer;transition:transform .08s}
.gate:active{transform:scale(.97)}
.gate .g-emo{font-size:22px}
.gate .g-name{font-weight:900;font-size:15px;margin-top:2px}
.gate .g-sub{font-size:12px;color:var(--muted)}
.gate.cleared{border-color:var(--gold);background:#fffdf3}
.gate.locked{opacity:.5}
.progress{height:8px;background:#dbe4f0;border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.qbox{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(30,50,90,.07)}
.story{background:#f5f8ff;border-left:5px solid var(--pri);border-radius:10px;
  padding:10px 14px;font-size:16px;margin-bottom:14px}
.ask{font-size:19px;font-weight:700;margin:10px 0 12px}

/* ===== 띠·격자 SVG ===== */
.figwrap{width:100%;overflow-x:auto;padding:6px 0}
svg.fig{display:block;margin:0 auto;max-width:100%;height:auto;touch-action:manipulation}
.tapcell{cursor:pointer}
.countbar{display:flex;justify-content:center;gap:14px;margin-top:10px;font-weight:900;font-size:18px}
.countbar .cb{background:#f0f4fb;border-radius:12px;padding:6px 14px}

/* ===== 슬롯 · 키패드 ===== */
.slot{display:inline-flex;align-items:center;justify-content:center;
  min-width:46px;height:46px;padding:0 6px;background:#fff;border:3px solid var(--pri);
  border-radius:10px;font-weight:900;font-size:22px;cursor:pointer;color:var(--ink)}
.slot.act{background:#fff6e8;border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,122,69,.18)}
.slot.wrong{border-color:var(--bad);animation:shake .34s}
.slot.right{border-color:var(--ok);background:#eefaf4}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.frslot{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.frslot .bar{width:100%;height:3px;background:var(--ink);border-radius:2px}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:440px;margin:16px auto 0}
.kp button{min-height:52px;border:none;border-radius:12px;background:#fff;
  font-family:inherit;font-size:22px;font-weight:900;color:var(--ink);
  box-shadow:0 3px 0 var(--line);cursor:pointer}
.kp button:active{transform:translateY(3px);box-shadow:none}
.kp button.wide{grid-column:span 3;background:var(--ok);color:#fff;box-shadow:0 3px 0 #0b7d51;font-size:18px}
.kp button.del{grid-column:span 2;background:#fdecec;color:var(--bad);font-size:18px}

/* ===== 피드백 ===== */
.fb-box{margin-top:14px;border-radius:14px;padding:14px;font-size:16px;display:none}
.fb-box.on{display:block;animation:fade .2s}
.fb-box.good{background:#eafaf3;border:2px solid var(--ok)}
.fb-box.err{background:#fdeeee;border:2px solid var(--bad)}
.fb-box h4{margin:0 0 6px;font-size:17px}
.timer{font-weight:900;font-size:17px;background:#fff;border-radius:12px;padding:6px 14px;border:2px solid var(--line)}
.penalty{color:var(--bad);font-weight:900;animation:fade .3s}

/* ===== 검수실 · 보스 ===== */
.choice{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--line);
  border-radius:14px;padding:12px 16px;margin-bottom:10px;font-family:inherit;font-size:18px;
  font-weight:700;cursor:pointer;color:var(--ink)}
.choice:active{transform:scale(.99)}
.choice.sel{border-color:var(--acc);background:#fff7ef}
.choice.ok{border-color:var(--ok);background:#eefaf4}
.choice.no{border-color:var(--bad);background:#fdeeee}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.fcard{background:#fff;border:3px solid var(--line);border-radius:14px;padding:14px 6px;
  text-align:center;font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.fcard:active{transform:translateY(3px);box-shadow:none}
.fcard.sel{border-color:var(--acc);background:#fff7ef;box-shadow:0 3px 0 var(--acc)}
.fcard.taken{opacity:.3;pointer-events:none}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px}
.vs .side{background:#fff;border-radius:14px;padding:12px;text-align:center;border:3px solid var(--line)}
.vs .side.win{border-color:var(--gold);background:#fffdf3}
.vs .mid{font-weight:900;color:var(--muted)}
.scoreline{display:flex;justify-content:center;gap:18px;font-weight:900;font-size:18px;margin-top:10px}

/* ===== QR ===== */
.qrzone{margin-top:22px;text-align:center}
.qrzone .qrbtn{display:inline-block;background:#fff;border-radius:16px;padding:10px;
  border:3px solid var(--line);cursor:pointer;line-height:0}
.qrzone svg{width:104px;height:104px;display:block}
.overlay{position:fixed;inset:0;background:rgba(12,22,40,.86);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:99;padding:20px}
.overlay.on{display:flex}
.overlay .big{background:#fff;border-radius:22px;padding:18px;line-height:0}
.overlay .big svg{width:min(74vw,74vh);height:min(74vw,74vh);display:block}
.overlay .cap{color:#fff;font-size:15px;text-align:center;word-break:break-all;max-width:520px}
.soundbtn{position:fixed;right:12px;bottom:12px;z-index:50;width:50px;height:50px;border-radius:50%;
  border:none;background:#fff;box-shadow:0 3px 10px rgba(20,40,80,.2);font-size:22px;cursor:pointer}
@media(max-width:520px){
  body{font-size:16px}
  .hero h1{font-size:26px}
  .rooms{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .eq{font-size:22px}
}
</style>
</head>
<body>
<div class="wrap">

<!-- ================= 홈 ================= -->
<section id="s-home" class="screen on">
  <div class="hero">
    <div style="font-size:36px">🏫</div>
    <h1>분수의 곱셈 체험관</h1>
    <p>수학 5-2 · 2단원 · 방 8개를 열고 관장님과 겨루기</p>
    <div class="starline" id="homeStars">⭐ 0 / 24</div>
    <div class="rank" id="homeRank">견습</div>
  </div>
  <div class="rooms" id="roomList"></div>

  <div class="card center" style="margin-top:14px" id="bossCard">
    <div style="font-size:30px">🎴</div>
    <div style="font-weight:900;font-size:20px;margin-top:4px">관장님과 카드 대결</div>
    <div class="muted" id="bossHint">별 18개를 모으면 열려요</div>
    <div style="margin-top:10px"><button class="btn acc" id="bossBtn" onclick="openBoss()">도전하기</button></div>
  </div>

  <div class="qrzone">
    <div class="muted" style="margin-bottom:6px">📱 태블릿에서 바로 열기 · 눌러서 크게 보기</div>
    <div class="qrbtn" onclick="showQR()" id="qrHome"></div>
  </div>
  <div class="center" style="margin-top:18px">
    <button class="btn ghost sm" onclick="resetAll()">기록 처음부터</button>
  </div>
</section>

<!-- ================= 방(관문 고르기) ================= -->
<section id="s-room" class="screen">
  <div class="topbar">
    <button class="back" onclick="goHome()">← 체험관</button>
    <div class="ttl" id="roomTitle"></div>
  </div>
  <div class="card">
    <div class="story" id="roomStory"></div>
    <div class="gates" id="gateList"></div>
    <div class="muted center" id="roomBest"></div>
  </div>
</section>

<!-- ================= 문제 풀이 ================= -->
<section id="s-play" class="screen">
  <div class="topbar">
    <button class="back" onclick="quitPlay()">← 나가기</button>
    <div class="ttl" id="playTitle"></div>
    <div class="timer" id="playTimer" style="display:none">0.0초</div>
  </div>
  <div class="progress"><i id="playBar" style="width:0%"></i></div>
  <div class="qbox" id="playBody"></div>
</section>

<!-- ================= 결과 ================= -->
<section id="s-result" class="screen">
  <div class="card center">
    <div style="font-size:52px" id="resEmo">🎉</div>
    <h2 style="margin:6px 0 2px;font-size:26px" id="resTitle"></h2>
    <div class="muted" id="resSub"></div>
    <div style="font-size:30px;letter-spacing:4px;margin:12px 0" id="resStars"></div>
    <div id="resExtra" class="muted" style="margin-bottom:14px"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="resAgain">다시 도전</button>
      <button class="btn ghost" onclick="backToRoom()">관문 고르기</button>
      <button class="btn ghost" onclick="goHome()">체험관</button>
    </div>
  </div>
</section>

<!-- ================= 보스 ================= -->
<section id="s-boss" class="screen">
  <div class="topbar">
    <button class="back" onclick="goHome()">← 체험관</button>
    <div class="ttl">🎴 관장님과 카드 대결</div>
  </div>
  <div class="qbox" id="bossBody"></div>
</section>

</div>

<div class="overlay" id="qrOverlay" onclick="hideQR()">
  <div class="big" id="qrBig"></div>
  <div class="cap" id="qrCap"></div>
  <button class="btn ghost sm">닫기</button>
</div>
<button class="soundbtn" id="sndBtn" onclick="toggleSound()">🔊</button>

<script>
/* ============================================================
   분수의 곱셈 체험관
   수학 5-2 · 2단원 (교과서 34~57쪽)
   QR SVG 는 미리 만들어 박아 두었다(qrcode.js 55KB 를 안 넣으려고).
   URL 이 바뀌면 02 게임 파일의 qrcode.js 로 다시 뽑을 것.
   ============================================================ */

const GAME_URL = 'https://leixlix-pixel.github.io/toolbox/fraction-multiplication-game.html';

/* ===== 저장소 (사생활 모드 대비) ===== */
function load(k, def){ try{ const v=localStorage.getItem(k); return v===null?def:JSON.parse(v); }catch(e){ return def; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const K_SAVE = 'fracMulGame_v1';
let S = load(K_SAVE, { gates:{}, best:{}, boss:0 });
function persist(){ save(K_SAVE, S); }

/* ===== 소리 ===== */
const SND = {
  ctx:null, vol:0.55,
  init(){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  tone(f,dur,type,vol,delay,slide){
    if(!this.ctx||this.vol<=0) return;
    const t0=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime((vol??0.16)*this.vol, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0+dur+0.05);
  },
  noise(dur,vol,delay){
    if(!this.ctx||this.vol<=0) return;
    const t0=this.ctx.currentTime+(delay||0);
    const len=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const g=this.ctx.createGain(); g.gain.value=(vol??0.12)*this.vol;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start(t0);
  },
  click(){ this.tone(680,0.06,'square',0.10); },
  tap(){ this.tone(440,0.05,'triangle',0.09); },
  paint(){ this.tone(560,0.05,'sine',0.08); },
  ok(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,0.16,'triangle',0.15,i*0.075)); },
  bad(){ this.tone(220,0.22,'sawtooth',0.13,0,110); this.tone(160,0.26,'square',0.08,0.06,90); },
  get(){ [784,1047,1319].forEach((f,i)=>this.tone(f,0.14,'sine',0.18,i*0.06)); },
  fanfare(){ [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,0.22,'triangle',0.16,i*0.09)); this.noise(0.5,0.06,0.4); },
  tick(){ this.tone(1200,0.03,'square',0.05); }
};
function toggleSound(){
  SND.vol = SND.vol>0 ? 0 : 0.55;
  document.getElementById('sndBtn').textContent = SND.vol>0 ? '🔊' : '🔇';
}

/* ===== 유틸 ===== */
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}

/* ===== 분수 =====
   F = {w:정수부, n:분자, d:분모}  (자연수는 {w:n, n:0, d:1})
   imp() 은 가분수 {n,d} 로 편다 */
function F(w,n,d){ return {w:w|0, n:n|0, d:d||1}; }
function nat(n){ return F(n,0,1); }
function imp(f){ return { n: f.w*f.d + f.n, d: f.d }; }
function red(n,d){ const g=gcd(n,d); return {n:n/g, d:d/g}; }
function toMix(n,d){ const r=red(n,d); return F(Math.floor(r.n/r.d), r.n%r.d, r.d); }
function mulF(a,b){ const x=imp(a), y=imp(b); return toMix(x.n*y.n, x.d*y.d); }
function valF(f){ const i=imp(f); return i.n/i.d; }
function sameF(a,b){ const x=red(imp(a).n,imp(a).d), y=red(imp(b).n,imp(b).d); return x.n===y.n && x.d===y.d; }
function isNat(f){ return f.n===0 && f.d===1; }

/* 분수 HTML — 자연수면 그냥 숫자 */
function fh(f, cls){
  const c = cls? ' '+cls : '';
  if(isNat(f) || (f.n===0)) return '<span class="fr'+c+'"><span class="wn">'+f.w+'</span></span>';
  let s='<span class="fr'+c+'">';
  if(f.w) s+='<span class="wn">'+f.w+'</span>';
  s+='<span class="fb"><b>'+f.n+'</b><i>'+f.d+'</i></span></span>';
  return s+'';
}
/* 가분수 그대로 표기 (약분·대분수 변환 없이) */
function fhRaw(n,d){
  if(d===1) return '<span class="fr"><span class="wn">'+n+'</span></span>';
  return '<span class="fr"><span class="fb"><b>'+n+'</b><i>'+d+'</i></span></span>';
}
function fText(f){
  if(isNat(f)||f.n===0) return ''+f.w;
  return (f.w? f.w+' ':'') + f.n+'/'+f.d;
}

/* ===== 조사 고르기 =====
   아이들이 읽는 화면이라 「소하이는」·「3를」이 남으면 안 된다.
   분수는 「오분의 이」처럼 분자를 마지막으로 읽으므로 분자로 판정한다 */
function jongKo(s){ const c=s.charCodeAt(s.length-1)-0xAC00; return c>=0 && c<11172 && (c%28)!==0; }
function jongNum(n){ return [0,1,3,6,7,8].includes(Math.abs(n)%10); }        // 영·일·삼·육·칠·팔
function J(word, withB, no){ return word + (jongKo(word)? withB : no); }      // 이름 뒤
function jn(n, withB, no){ return jongNum(n)? withB : no; }                   // 숫자 뒤
function jf(f, withB, no){ return jn((isNat(f)||f.n===0)? f.w : f.n, withB, no); }  // 분수 뒤

/* ============================================================
   문제 만들기 — 하드코딩이 아니라 생성기
   small=true 면 「보이기」관문용(그림에 들어가는 크기로 제한)
   ============================================================ */
function makeProb(kind, small){
  let A,B, guard=0;
  while(guard++ < 400){
    if(kind==='fn'){
      const d=randInt(2, small?6:9), n=randInt(1,d-1), m=randInt(2, small?4:12);
      A=F(0,n,d); B=nat(m);
    } else if(kind==='mn'){
      const d=randInt(2, small?4:6), n=randInt(1,d-1), w=randInt(1, small?1:3), m=randInt(2, small?3:6);
      A=F(w,n,d); B=nat(m);
    } else if(kind==='nf'){
      const d=randInt(2, small?6:9), n=randInt(1,d-1), m=randInt(2, small?4:9);
      A=nat(m); B=F(0,n,d);
    } else if(kind==='nm'){
      const d=randInt(2, small?4:6), n=randInt(1,d-1), w=randInt(1, small?1:3), m=randInt(2, small?3:6);
      A=nat(m); B=F(w,n,d);
    } else if(kind==='uf'){
      const b=randInt(2, small?5:7), d=randInt(2, small?6:9), c=randInt(1,d-1);
      A=F(0,1,b); B=F(0,c,d);
    } else if(kind==='ff'){
      const b=randInt(2, small?6:9), a=randInt(1,b-1), d=randInt(2, small?6:9), c=randInt(1,d-1);
      A=F(0,a,b); B=F(0,c,d);
    } else if(kind==='mm'){
      const b=randInt(2, small?4:5), a=randInt(1,b-1), d=randInt(2, small?4:5), c=randInt(1,d-1);
      A=F(randInt(1, small?1:2), a, b); B=F(1, c, d);
    }
    const p = prob(A,B);
    if(!fits(p, kind, small)) continue;
    return p;
  }
  return prob(A,B);
}
function prob(A,B){
  const x=imp(A), y=imp(B);
  return { A:A, B:B, pn:x.n*y.n, pd:x.d*y.d, ans:toMix(x.n*y.n, x.d*y.d) };
}
/* 문제로 내놓는 분수는 기약분수여야 한다 — 약분은 「곱한 뒤에」 하는 것이고,
   교과서도 3/5·5/8처럼 이미 기약인 수만 제시한다. 4/6 같은 걸 내면 딴 이야기가 된다 */
function properFr(f){ return isNat(f) || f.n===0 || gcd(f.n,f.d)===1; }
/* 그림에 들어가는 크기인가 */
function fits(p, kind, small){
  if(!properFr(p.A) || !properFr(p.B)) return false;
  const barKind = (kind==='fn'||kind==='mn'||kind==='nf'||kind==='nm');
  if(!small){
    if(barKind) return p.pn/p.pd <= 30;
    return true;
  }
  if(barKind){
    const q = barUnit(p).q, n = barUnit(p).p;
    return q<=6 && n<=q*4 && n>q;              // 띠 4개 이하 · 1보다는 커야 볼 맛이 난다
  }
  const cols = gridDim(p).cols, rows = gridDim(p).rows;
  return cols<=12 && rows<=12 && cols*rows<=84;
}
/* 띠 모델: 분수쪽 분모 q 를 한 칸으로, 결과를 p칸으로 */
function barUnit(p){
  const fr = isNat(p.A) ? p.B : p.A;            // 분수인 쪽
  const nt = isNat(p.A) ? imp(p.A).n : imp(p.B).n;
  return { q: fr.d, p: imp(fr).n * nt, fr:fr, nt:nt };
}
/* 격자 모델: 가로=A(열), 세로=B(행). 대분수면 1단위씩 늘린다 */
function gridDim(p){
  const x=imp(p.A), y=imp(p.B);
  const cols = Math.ceil(x.n/x.d)*x.d, rows = Math.ceil(y.n/y.d)*y.d;
  return { cols, rows, cw:x.d, rh:y.d, selCol:x.n, selRow:y.n };
}

const KP = {
  slots:[], idx:0, onSubmit:null,
  html(){
    let s='<div class="kp">';
    for(let i=1;i<=9;i++) s+='<button onclick="KP.key(\''+i+'\')">'+i+'</button>';
    s+='<button onclick="KP.key(\'0\')">0</button>';
    s+='<button class="del" onclick="KP.key(\'del\')">지우기</button>';
    s+='<button class="wide" onclick="KP.submit()">확인</button>';
    return s+'</div>';
  },
  bind(root, onSubmit){
    this.slots=[...root.querySelectorAll('.slot')];
    this.slots.forEach((el,i)=>{ el.textContent=''; el.classList.remove('wrong','right'); el.onclick=()=>{ SND.tap(); KP.focus(i); }; });
    this.onSubmit=onSubmit; this.idx=0; this.paint();
  },
  focus(i){ this.idx=i; this.paint(); },
  paint(){ this.slots.forEach((el,i)=>el.classList.toggle('act', i===this.idx)); },
  key(ch){
    const el=this.slots[this.idx]; if(!el) return;
    if(ch==='del'){ SND.tap(); el.textContent = el.textContent.slice(0,-1);
      if(el.textContent==='' && this.idx>0){} return; }
    SND.click();
    el.classList.remove('wrong');
    if(el.textContent.length>=2) el.textContent='';
    el.textContent += ch;
    if(el.textContent.length>=2 && this.idx<this.slots.length-1) this.focus(this.idx+1);
  },
  vals(){ return this.slots.map(el=> el.textContent==='' ? null : parseInt(el.textContent,10)); },
  submit(){ if(this.onSubmit) this.onSubmit(this.vals()); }
};

  const w = withWhole!==false ? (v[0]||0) : 0;

}

let P = null;      // 진행 상태
let DS = null;     // 「보이기」조작 상태

function startGate(gk){
  SND.init(); SND.click();
  const r=curRoom;
  const n = gk==='speed' ? 5 : (r.kind==='check' ? 4 : 3);
  P = { room:r, gk:gk, i:0, n:n, wrong:0, items:[], elapsed:0, t0:0, timerId:null, locked:false };
  for(let k=0;k<n;k++) P.items.push(buildItem(r, gk, k));
  const gname = gatesOf(r).find(g=>g.key===gk).name;
  document.getElementById('playTitle').textContent = r.emo+' '+r.name+' · '+gname;
  const tm=document.getElementById('playTimer');
  if(gk==='speed'){ tm.style.display=''; P.t0=performance.now(); startTimer(); } else tm.style.display='none';
  show('s-play'); renderItem();
}
function buildItem(r, gk, k){
  if(r.kind==='check') return buildCheckItem(gk, k);
  if(gk==='draw'){
    /* 1번은 교과서 그 문제 그대로 — 책을 펴 놓고 대조하라고 */
    const p = (k===0 && r.book) ? prob(r.book.A, r.book.B) : makeProb(r.kind, true);
    return { type:'draw', p:p, fig:r.fig };
  }
  if(gk==='fill') return { type:'fill', p:makeProb(r.kind, k===0), kind:r.kind, three:(r.kind==='ff' && k===2) };
  return { type:'speed', p:makeProb(r.kind, false), kind:r.kind };
}
function quitPlay(){ stopTimer(); backToRoom(); }
function startTimer(){
  stopTimer();
  P.timerId = setInterval(()=>{
    const t = P.elapsed + (performance.now()-P.t0)/1000;
    document.getElementById('playTimer').textContent = t.toFixed(1)+'초';
  }, 100);
}
function stopTimer(){ if(P && P.timerId){ clearInterval(P.timerId); P.timerId=null; } }
function nowElapsed(){ return P.elapsed + (P.t0? (performance.now()-P.t0)/1000 : 0); }
function bumpBar(){
  document.getElementById('playBar').style.width = (P.i/P.n*100)+'%';
}

function paintDraw(){
  const it=P.items[P.i], p=it.p;
  const area=document.getElementById('drawArea');
  if(it.fig==='bar') area.innerHTML = barHTML(p);
  else               area.innerHTML = gridHTML(p);
  if(DS.phase===2){
    area.insertAdjacentHTML('beforeend',
      '<div class="ask center" style="margin-top:14px">그림이 말해 주는 답을 적어 봐</div>'
      + ansSlotsHTML(true) + KP.html() + '<div class="fb-box" id="fb"></div>');
    KP.bind(area, v=>checkDrawAns(v));
  }
}

/* ---- 띠 모델 (진분수·대분수 × 자연수) ---- */
function barHTML(p){
  const u=barUnit(p), q=u.q, total=u.p;
  const K=Math.ceil(total/q);
  if(DS.cells.length!==K*q) DS.cells = new Array(K*q).fill(false);
  const CW=Math.min(64, Math.floor(460/q)), CH=44, GAP=16;
  const W=q*CW, H=K*(CH+GAP)-GAP;
  let s='<div class="figwrap"><svg class="fig" viewBox="0 0 '+(W+4)+' '+(H+4)+'" width="'+(W+4)+'">';
  for(let b=0;b<K;b++){
    const y=2+b*(CH+GAP);
    for(let c=0;c<q;c++){
      const idx=b*q+c, on=DS.cells[idx];
      s+='<rect class="tapcell" x="'+(2+c*CW)+'" y="'+y+'" width="'+CW+'" height="'+CH+'" '
        +'fill="'+(on?'#ef6ba6':'#ffffff')+'" stroke="#b9c7db" stroke-width="1.5" '
        +'onclick="tapBar('+idx+')"/>';
    }
    s+='<rect x="'+2+'" y="'+y+'" width="'+W+'" height="'+CH+'" fill="none" stroke="#16233a" stroke-width="3"/>';
  }
  s+='</svg></div>';
  const filled=DS.cells.filter(Boolean).length;
  s+='<div class="countbar"><span class="cb">칠한 칸 <b style="color:var(--pink)">'+filled+'</b>칸</span>'
    +'<span class="cb">한 칸 = '+fhRaw(1,q)+'</span></div>';
  if(DS.phase===0){
    s+='<div class="ask center" style="margin-top:12px">'+drawPrompt(p)+'</div>'
      +'<div class="center"><button class="btn ok" onclick="submitBar()">다 칠했어요</button></div>'
      +'<div class="fb-box" id="fb"></div>';
  }
  return s;
}
function drawPrompt(p){
  const u=barUnit(p);
  const fr=u.fr, nt=u.nt;
  return fh(fr)+'씩 <b>'+nt+'번</b>이야. 그만큼 칠해 봐.';
}
function tapBar(i){
  if(DS.phase!==0) return;
  DS.cells[i]=!DS.cells[i]; SND.paint(); paintDraw();
}
function submitBar(){
  const p=P.items[P.i].p, u=barUnit(p);
  const filled=DS.cells.filter(Boolean).length;
  const fb=document.getElementById('fb');
  if(filled===u.p){
    SND.get(); DS.phase=2; paintDraw();
    const f2=document.getElementById('fb');
    f2.className='fb-box good on';
    f2.innerHTML='<h4>👏 딱 맞아!</h4>'+fh(u.fr)+'짜리 칸이 <b>'+u.p+'개</b> 모였어. '
      +'한 칸이 '+fhRaw(1,u.q)+'이니까 모두 '+fhRaw(u.p,u.q)+'이지.';
  } else {
    SND.bad(); P.wrong++;
    fb.className='fb-box err on';
    fb.innerHTML='<h4>아직이야</h4>지금 <b>'+filled+'칸</b> 칠했어. '
      + fh(u.fr)+jf(u.fr,'은','는')+' 한 번에 <b>'+imp(u.fr).n+'칸</b>이고, 그걸 <b>'+u.nt+'번</b> 하는 거야.';
  }
}

/* ---- 격자 모델 (분수 × 분수) : 이 앱에서 제일 중요한 화면 ---- */
function gridHTML(p){
  const g=gridDim(p);
  const cell=Math.min(46, Math.floor(500/g.cols), Math.floor(420/g.rows));
  const W=g.cols*cell, H=g.rows*cell;
  let s='<div class="figwrap"><svg class="fig" viewBox="0 0 '+(W+4)+' '+(H+4)+'" width="'+(W+4)+'">';
  /* 칸 */
  for(let r=0;r<g.rows;r++) for(let c=0;c<g.cols;c++){
    const inC=DS.cols.includes(c), inR=DS.rows.includes(r);
    let fill='#ffffff';
    if(inC&&inR) fill='#8a5cd6'; else if(inC) fill='#f6b8d4'; else if(inR) fill='#bcdcf7';
    s+='<rect x="'+(2+c*cell)+'" y="'+(2+r*cell)+'" width="'+cell+'" height="'+cell+'" '
      +'fill="'+fill+'" stroke="#c9d6e6" stroke-width="1"/>';
  }
  /* 1단위 굵은 선 */
  for(let c=0;c<=g.cols;c+=g.cw) s+='<line x1="'+(2+c*cell)+'" y1="2" x2="'+(2+c*cell)+'" y2="'+(2+H)+'" stroke="#16233a" stroke-width="3"/>';
  for(let r=0;r<=g.rows;r+=g.rh) s+='<line x1="2" y1="'+(2+r*cell)+'" x2="'+(2+W)+'" y2="'+(2+r*cell)+'" stroke="#16233a" stroke-width="3"/>';
  /* 누르는 자리 */
  if(DS.phase===0){
    for(let c=0;c<g.cols;c++)
      s+='<rect class="tapcell" x="'+(2+c*cell)+'" y="2" width="'+cell+'" height="'+H+'" fill="transparent" onclick="tapCol('+c+')"/>';
  } else if(DS.phase===1){
    for(let r=0;r<g.rows;r++)
      s+='<rect class="tapcell" x="2" y="'+(2+r*cell)+'" width="'+W+'" height="'+cell+'" fill="transparent" onclick="tapRow('+r+')"/>';
  }
  s+='</svg></div>';
  const over=DS.cols.length*DS.rows.length;
  s+='<div class="countbar">'
    +'<span class="cb" style="color:var(--pink)">세로 '+DS.cols.length+'/'+g.cols+'</span>'
    +'<span class="cb" style="color:var(--blue)">가로 '+DS.rows.length+'/'+g.rows+'</span>'
    +'<span class="cb" style="color:var(--purple)">겹친 칸 '+over+'</span></div>';
  if(DS.phase===0){
    s+='<div class="ask center" style="margin-top:12px">먼저 '+fh(p.A)+'만큼 <b style="color:var(--pink)">세로로</b> 칠해 봐</div>'
      +'<div class="center"><button class="btn ok" onclick="submitGrid(0)">칠했어요</button></div><div class="fb-box" id="fb"></div>';
  } else if(DS.phase===1){
    s+='<div class="ask center" style="margin-top:12px">이번엔 그 위에 '+fh(p.B)+'만큼 <b style="color:var(--blue)">가로로</b> 칠해 봐</div>'
      +'<div class="center"><button class="btn ok" onclick="submitGrid(1)">칠했어요</button></div><div class="fb-box" id="fb"></div>';
  }
  return s;
}
function tapCol(c){ if(DS.phase!==0) return; toggleIn(DS.cols,c); SND.paint(); paintDraw(); }
function tapRow(r){ if(DS.phase!==1) return; toggleIn(DS.rows,r); SND.paint(); paintDraw(); }
function toggleIn(arr,v){ const i=arr.indexOf(v); if(i<0) arr.push(v); else arr.splice(i,1); }
function submitGrid(step){
  const p=P.items[P.i].p, g=gridDim(p);
  const fb=document.getElementById('fb');
  const need = step===0 ? g.selCol : g.selRow;
  const got  = step===0 ? DS.cols.length : DS.rows.length;
  if(got!==need){
    SND.bad(); P.wrong++;
    fb.className='fb-box err on';
    fb.innerHTML='<h4>다시 세어 보자</h4>'+ (step===0
      ? '전체를 세로로 <b>'+g.cw+'칸</b>씩 나눴어. '+fh(p.A)+'만큼이면 몇 칸일까? (지금 '+got+'칸)'
      : '전체를 가로로 <b>'+g.rh+'칸</b>씩 나눴어. '+fh(p.B)+'만큼이면 몇 칸일까? (지금 '+got+'칸)');
    return;
  }
  SND.get();
  if(step===0){ DS.phase=1; paintDraw(); return; }
  DS.phase=2; paintDraw();
  const f2=document.getElementById('fb');
  f2.className='fb-box good on';
  f2.innerHTML='<h4>👀 보이지?</h4>겹친 칸이 <b>'+g.selCol+'×'+g.selRow+' = '+(g.selCol*g.selRow)+'칸</b>. '
    +'한 칸은 '+fhRaw(1, g.cw*g.rh)+'이야 (세로 '+g.cw+'× 가로 '+g.rh+'). '
    +'<b>분자끼리, 분모끼리 곱하는 이유가 이거야.</b>';
}
function checkDrawAns(v){
  const p=P.items[P.i].p;
  const ans=readAns(v,true);
  const fb=document.getElementById('fb');
  if(!ans){ alertBox('분자와 분모를 채워 줘'); return; }
  if(sameF(ans,p.ans)){
    SND.ok();
    const note=tidyNote(ans, p.ans);
    fb.className='fb-box good on';
    fb.innerHTML='<h4>정답!</h4>'+fh(p.A)+' × '+fh(p.B)+' = '+fh(p.ans)
      + (note? '<div style="margin-top:8px">✏️ '+note+'</div>' : '')
      +'<div style="margin-top:10px"><button class="btn ok" onclick="nextItem()">다음 →</button></div>';
    KP.slots.forEach(s=>s.classList.add('right'));
  } else {
    SND.bad(); P.wrong++;
    const d=diagnose(p, ans);
    fb.className='fb-box err on';
    fb.innerHTML='<h4>'+d.title+'</h4>'+d.msg+'<div class="muted" style="margin-top:8px">그림을 다시 보고 적어 봐.</div>';
    KP.slots.forEach(s=>s.classList.add('wrong'));
  }
}
function nextItem(){
  P.i++;
  if(P.i>=P.n) return finishGate();
  renderItem();
}

/* 값은 맞는데 「더 간단히」 쓸 수 있을 때 — 통과는 시키되 반드시 알려 준다.
   교과서는 답을 기약분수·대분수로 쓰므로 그냥 「정답!」만 하고 넘기면 습관이 안 든다.
   틀린 것이 아니므로 P.wrong 은 올리지 않는다(금별에 영향 없음) */
function tidyNote(ans, target){
  const a=imp(ans);
  const notReduced = gcd(a.n, a.d) > 1;
  const notMixed   = (target.w>0 && ans.w===0);
  if(!notReduced && !notMixed) return '';
  if(target.n===0)                                    // 답이 딱 떨어지는 자연수일 때
    return '이건 <b>'+target.w+'</b>'+jn(target.w,'이야','야')+'. 딱 떨어지니까 그냥 자연수로 쓰면 돼.';
  if(notReduced && notMixed)
    return '<b>약분</b>도 하고 <b>대분수</b>로도 고쳐서 '+fh(target)+'라고 쓰면 더 좋아.';
  if(notReduced)
    return '<b>약분할 수 있어</b> — 분자와 분모를 같은 수로 나누면 '+fh(target)+jf(target,'이','가')+' 돼.';
  return '가분수보다 <b>대분수</b> '+fh(target)+jf(target,'으로','로')+' 쓰는 게 좋아.';
}

/* ============================================================
   관문 B — 「잇기」: 교과서 식의 빈칸을 그대로 채운다
   ============================================================ */
function slot(){ return '<span class="slot"></span>'; }
function slotFrac(){ return '<span class="frslot">'+slot()+'<span class="bar"></span>'+slot()+'</span>'; }
function slotOver(dtext){ return '<span class="frslot">'+slot()+'<span class="bar"></span><span style="font-weight:700;font-size:22px">'+dtext+'</span></span>'; }

function fillSpec(it){
  const p=it.p, k=it.kind;
  const xa=imp(p.A), xb=imp(p.B);
  const P0=xa.n*xb.n, Q0=xa.d*xb.d, m=p.ans;
  const A=[];                    // 정답 순서
  let h='';
  const line=(inner)=>'<div class="eq" style="margin:5px 0">'+inner+'</div>';

  if(it.three){                  /* 세 분수의 곱 (교과서 47쪽) */
    const C=makeProb('ff',true).A;
    const xc=imp(C);
    const bigN=P0*xc.n, bigQ=Q0*xc.d, mm=toMix(bigN,bigQ);
    it.three3={C:C, n:bigN, q:bigQ, ans:mm};
    h+=line(fh(p.A)+'<span class="op">×</span>'+fh(p.B)+'<span class="op">×</span>'+fh(C));
    h+=line('<span class="op">=</span>'+slotFrac());  A.push(bigN,bigQ);
    h+=line('<span class="op">=</span>'+(mm.n===0? slot() : (mm.w? slot()+slotFrac() : slotFrac())));
    if(mm.n===0) A.push(mm.w); else if(mm.w) A.push(mm.w,mm.n,mm.d); else A.push(mm.n,mm.d);
    return {html:h, ans:A, target:mm};
  }

  h+=line(fh(p.A)+'<span class="op">×</span>'+fh(p.B));

  /* 1단계 — 대분수는 가분수로 (교과서 39·43·49쪽) */
  const mixA = !isNat(p.A) && p.A.w>0, mixB = !isNat(p.B) && p.B.w>0;
  if(mixA || mixB){
    h+=line('<span class="op">=</span>'
      + (mixA? slotOver(''+p.A.d) : fh(p.A))
      + '<span class="op">×</span>'
      + (mixB? slotOver(''+p.B.d) : fh(p.B)));
    if(mixA) A.push(xa.n);
    if(mixB) A.push(xb.n);
  }

  /* 2단계 — 곱하기 */
  const natSide = isNat(p.A) ? xb.n===0 : false;
  if(isNat(p.A) || isNat(p.B)){
    const fr = isNat(p.A)? p.B : p.A, nt = isNat(p.A)? p.A.w : p.B.w;
    const frn = imp(fr).n;
    h+=line('<span class="op">=</span><span class="frslot"><span>'+slot()+'<span class="op" style="font-size:20px">×</span>'+slot()+'</span>'
      +'<span class="bar"></span><span style="font-weight:700;font-size:22px">'+fr.d+'</span></span>');
    A.push(frn, nt);
    h+=line('<span class="op">=</span>'+slotOver(''+fr.d));
    A.push(P0);
  } else {
    h+=line('<span class="op">=</span><span class="frslot">'
      +'<span>'+slot()+'<span class="op" style="font-size:20px">×</span>'+slot()+'</span><span class="bar"></span>'
      +'<span>'+slot()+'<span class="op" style="font-size:20px">×</span>'+slot()+'</span></span>');
    A.push(xa.n, xb.n, xa.d, xb.d);
    h+=line('<span class="op">=</span>'+slotFrac());
    A.push(P0,Q0);
  }

  /* 3단계 — 가장 간단하게 */
  const need = !(m.w===0 && m.n===P0 && m.d===Q0);
  if(need){
    h+=line('<span class="op">=</span>'+(m.n===0? slot() : (m.w? slot()+slotFrac() : slotFrac())));
    if(m.n===0) A.push(m.w); else if(m.w) A.push(m.w,m.n,m.d); else A.push(m.n,m.d);
  }
  return {html:h, ans:A, target:m};
}

function renderFill(it){
  const spec = fillSpec(it);
  it.spec = spec;
  const body=document.getElementById('playBody');
  body.innerHTML = '<div class="muted">'+(P.i+1)+' / '+P.n+'</div>'
    + '<div class="ask center">빈칸을 채워 식을 완성해 봐</div>'
    + '<div id="fillArea">'+spec.html+'</div>'
    + KP.html() + '<div class="fb-box" id="fb"></div>';
  KP.bind(document.getElementById('fillArea'), v=>checkFill(v, spec));
}
function checkFill(v, spec){
  const fb=document.getElementById('fb');
  let bad=-1;
  for(let i=0;i<spec.ans.length;i++){
    if(v[i]===null){ bad=i; break; }
    if(v[i]!==spec.ans[i]){ bad=i; break; }
  }
  if(bad<0){
    SND.ok(); KP.slots.forEach(s=>{s.classList.remove('act');s.classList.add('right');});
    fb.className='fb-box good on';
    fb.innerHTML='<h4>완성!</h4>식이 딱 맞아떨어졌어.'
      +'<div style="margin-top:10px"><button class="btn ok" onclick="nextItem()">다음 →</button></div>';
    KP.onSubmit=null;
  } else {
    SND.bad(); P.wrong++;
    KP.slots.forEach((s,i)=>s.classList.toggle('wrong', i===bad));
    KP.focus(bad);
    fb.className='fb-box err on';
    fb.innerHTML='<h4>여기를 다시 보자</h4>'+fillHint(spec, bad);
  }
}
function fillHint(spec, i){
  const it=P.items[P.i], p=it.p;
  const xa=imp(p.A), xb=imp(p.B);
  if(it.three) return '세 분수도 똑같아. <b>분자는 분자끼리, 분모는 분모끼리</b> 셋을 다 곱해.';
  const mixA=!isNat(p.A)&&p.A.w>0, mixB=!isNat(p.B)&&p.B.w>0;
  let k=0;
  if(mixA){ if(i===k) return '대분수를 가분수로: '+fh(p.A)+' = (<b>'+p.A.w+'×'+p.A.d+'+'+p.A.n+'</b>)/'+p.A.d+' 이야.'; k++; }
  if(mixB){ if(i===k) return '대분수를 가분수로: '+fh(p.B)+' = (<b>'+p.B.w+'×'+p.B.d+'+'+p.B.n+'</b>)/'+p.B.d+' 이야.'; k++; }
  if(isNat(p.A)||isNat(p.B)){
    if(i===k||i===k+1) return '분자에는 <b>분수의 분자</b>와 <b>자연수</b>를 쓰는 거야. 분모는 그대로!';
    if(i===k+2) return '앞에서 곱한 값을 그대로 옮겨 적으면 돼.';
    return '가분수를 대분수로 고쳐 봐. 분자 ÷ 분모의 몫이 자연수 부분이야.';
  }
  if(i<=3) return '위 칸 두 개는 <b>분자끼리</b>, 아래 칸 두 개는 <b>분모끼리</b>야.';
  if(i<=5) return '곱셈을 마저 해 보자. '+xa.n+'×'+xb.n+'과 '+xa.d+'×'+xb.d+'.';
  return '더 간단히 할 수 있어. 분자와 분모를 같은 수로 나눠 봐(약분).';
}

/* ============================================================
   관문 C — 「빨리」: 답만. 틀리면 무엇을 착각했는지 짚어 준다
   ============================================================ */
function renderSpeed(it){

    + '<div id="spArea">'+ansSlotsHTML(true)+'</div>'
    + KP.html() + '<div class="fb-box" id="fb"></div>';

  KP.bind(document.getElementById('spArea'), v=>checkSpeed(v, it));
}
function checkSpeed(v, it){
  const p=it.p, fb=document.getElementById('fb');
  const ans=readAns(v,true);
  if(!ans){ alertBox('분자와 분모를 채워 줘'); return; }

      +'<div style="margin-top:10px"><button class="btn ok" onclick="nextItem()">다음 →</button></div>';

    fb.innerHTML='<h4>'+d.title+' <span class="penalty">+5초</span></h4>'+d.msg
      + (it.tries>=2 ? '<div style="margin-top:10px"><button class="btn ghost sm" onclick="peekFig()">🎨 그림으로 보기</button></div>' : '');
    KP.slots.forEach(s=>s.classList.add('wrong'));
    KP.focus(0);
  }
}
function peekFig(){
  const it=P.items[P.i];
  const fig = curRoom.fig==='grid' ? 'grid' : 'bar';
  document.getElementById('fb').innerHTML = staticFig(it.p, fig)
    + '<div class="muted center">그림에서 세어 보고 다시 적어 봐</div>';
}
/* 정답 상태를 그대로 그려 주는 읽기 전용 그림 */
function staticFig(p, fig){
  if(fig==='bar'){
    const u=barUnit(p), q=u.q, K=Math.ceil(u.p/q);
    const CW=Math.min(46, Math.floor(400/q)), CH=32, GAP=10;
    const W=q*CW, H=K*(CH+GAP)-GAP;
    let s='<div class="figwrap"><svg class="fig" viewBox="0 0 '+(W+4)+' '+(H+4)+'" width="'+(W+4)+'">';
    let left=u.p;
    for(let b=0;b<K;b++){
      const y=2+b*(CH+GAP);
      for(let c=0;c<q;c++){
        const on = (b*q+c) < u.p;
        s+='<rect x="'+(2+c*CW)+'" y="'+y+'" width="'+CW+'" height="'+CH+'" fill="'+(on?'#ef6ba6':'#fff')+'" stroke="#b9c7db"/>';
      }
      s+='<rect x="2" y="'+y+'" width="'+W+'" height="'+CH+'" fill="none" stroke="#16233a" stroke-width="2.5"/>';
    }
    return s+'</svg></div><div class="countbar"><span class="cb">'+fhRaw(1,q)+'짜리 '+u.p+'칸</span></div>';
  }
  const g=gridDim(p), cell=Math.min(30, Math.floor(400/g.cols));
  const W=g.cols*cell, H=g.rows*cell;
  let s='<div class="figwrap"><svg class="fig" viewBox="0 0 '+(W+4)+' '+(H+4)+'" width="'+(W+4)+'">';
  for(let r=0;r<g.rows;r++) for(let c=0;c<g.cols;c++){
    const inC=c<g.selCol, inR=r<g.selRow;
    let f='#fff'; if(inC&&inR) f='#8a5cd6'; else if(inC) f='#f6b8d4'; else if(inR) f='#bcdcf7';
    s+='<rect x="'+(2+c*cell)+'" y="'+(2+r*cell)+'" width="'+cell+'" height="'+cell+'" fill="'+f+'" stroke="#c9d6e6"/>';
  }
  for(let c=0;c<=g.cols;c+=g.cw) s+='<line x1="'+(2+c*cell)+'" y1="2" x2="'+(2+c*cell)+'" y2="'+(2+H)+'" stroke="#16233a" stroke-width="2.5"/>';
  for(let r=0;r<=g.rows;r+=g.rh) s+='<line x1="2" y1="'+(2+r*cell)+'" x2="'+(2+W)+'" y2="'+(2+r*cell)+'" stroke="#16233a" stroke-width="2.5"/>';
  return s+'</svg></div><div class="countbar"><span class="cb">겹친 칸 '+(g.selCol*g.selRow)+' · 한 칸 '+fhRaw(1,g.cw*g.rh)+'</span></div>';
}

/* ============================================================
   오답 진단 — 「틀렸어요」 한마디로 끝내지 않는다
   ============================================================ */
function diagnose(p, ans){
  const xa=imp(p.A), xb=imp(p.B);
  const P0=xa.n*xb.n, Q0=xa.d*xb.d;
  const natA=isNat(p.A), natB=isNat(p.B);
  const fr = natA? p.B : p.A, nt = natA? p.A.w : (natB? p.B.w : 0);

  /* 1. 분모에도 자연수를 곱함 → 약분하면 처음 분수가 된다 */
  if((natA||natB) && sameF(ans, fr))
    return {title:'분모에도 곱했구나', msg:
      '분모에 '+nt+jn(nt,'을','를')+' 곱하면 <b>칸의 크기가 달라져</b>. '+fh(fr)+jf(fr,'을','를')+' '+nt+'번 모으는 거니까 '
      +'<b>칸 수(분자)만</b> 늘어나야 해. 분모는 그대로 '+fr.d+'.'};

  /* 2. 대분수 × 자연수 — 정수 부분만 곱함 */
  if((natA||natB) && fr.w>0 && sameF(ans, F(fr.w*nt, fr.n, fr.d)))
    return {title:'자연수 부분만 곱했어', msg:
      fh(fr)+'에는 '+fh(F(0,fr.n,fr.d))+'도 붙어 있잖아. 그것도 '+nt+'번 늘어나야 해. '
      +'<b>가분수 '+fhRaw(imp(fr).n,fr.d)+jn(imp(fr).n,'으로','로')+' 바꿔서</b> 곱하면 실수가 없어.'};

  /* 3. 대분수 × 대분수 — 정수끼리, 분수끼리 따로 곱함 */
  if(!natA && !natB && p.A.w>0 && p.B.w>0 && sameF(ans, F(p.A.w*p.B.w, p.A.n*p.B.n, p.A.d*p.B.d)))
    return {title:'정수끼리·분수끼리 따로 곱했네', msg:
      '그건 안 돼. 넓이로 생각해 봐 — 가로 '+fh(p.A)+', 세로 '+fh(p.B)+'인 직사각형은 '
      +'네 조각으로 나뉘어. <b>가분수로 바꿔서 한 번에</b> 곱하는 게 안전해.'};

  /* 4. 분자·분모를 각각 더함 */
  if(sameF(ans, toMix(xa.n+xb.n, xa.d+xb.d)))
    return {title:'더한 것 같아', msg:'곱셈이야. 분자는 '+xa.n+'<b>×</b>'+xb.n+', 분모는 '+xa.d+'<b>×</b>'+xb.d+'.'};

  /* 5. 분자만 곱하고 분모는 한쪽만 씀 */
  if(!natA && !natB && (sameF(ans, toMix(P0, xa.d)) || sameF(ans, toMix(P0, xb.d))))
    return {title:'분모를 하나만 썼어', msg:
      '격자를 떠올려 봐. 세로로 '+xa.d+'칸, 가로로 '+xb.d+'칸 나누면 전체는 <b>'+xa.d+'×'+xb.d+'='+Q0+'칸</b>이 돼. '
      +'그래서 분모도 곱해야 해.'};

  /* 6. 분자와 분모를 뒤집음 */
  if(P0>0 && sameF(ans, toMix(Q0,P0)))
    return {title:'분자와 분모가 바뀌었어', msg:'위아래를 한 번 더 확인해 봐.'};

  /* 7. 그 밖 — 크기 감각으로 되돌린다 */
  const v=valF(ans), t=valF(p.ans), big=valF(p.A)>1||isNat(p.A), other=valF(p.B);
  let hint;
  if(other<1) hint='곱하는 수 '+fh(p.B)+jf(p.B,'은','는')+' <b>1보다 작아</b>. 그러면 답은 '+fh(p.A)+'<b>보다 작아져야</b> 해.';
  else        hint='곱하는 수 '+fh(p.B)+jf(p.B,'은','는')+' <b>1보다 커</b>. 그러면 답은 '+fh(p.A)+'<b>보다 커져야</b> 해.';
  return {title: (v>t? '너무 커':'조금 달라'), msg:'계산을 한 번만 더 확인해 보자. '+hint};
}

/* ============================================================
   방 8 — 검수실 (교과서 54~56쪽 「배운 내용을 확인해요」)
   계산이 아니라 눈으로 판단하는 문제만 모았다
   ============================================================ */
const NAMES = ['유담','진하','소하','채율','나원','도헌','시온','재율'];
const ALLKINDS = ['fn','mn','nf','nm','uf','ff','mm'];

/* 흔한 오답 하나를 만들어 낸다 (검수실 문제의 재료) */
function wrongOf(p){
  const xa=imp(p.A), xb=imp(p.B);
  const natA=isNat(p.A), natB=isNat(p.B);
  const fr = natA? p.B : p.A, nt = natA? p.A.w : (natB? p.B.w : 0);
  const c=[];
  if(natA||natB){
    c.push({f:toMix(imp(fr).n*nt, fr.d*nt), why:'분모에도 '+nt+jn(nt,'을','를')+' 곱했어. 칸 수만 늘어나야 하는데.'});
    if(fr.w>0) c.push({f:F(fr.w*nt,fr.n,fr.d), why:'자연수 부분만 곱했어. 분수 부분도 '+nt+'번 늘어나야지.'});
  } else {
    c.push({f:toMix(xa.n*xb.n, xa.d), why:'분모를 하나만 썼어. 격자로 보면 전체가 '+xa.d+'×'+xb.d+'칸이야.'});
    if(p.A.w>0&&p.B.w>0) c.push({f:F(p.A.w*p.B.w,p.A.n*p.B.n,p.A.d*p.B.d), why:'정수끼리·분수끼리 따로 곱했어. 가분수로 바꿔야 해.'});
  }
  c.push({f:toMix(xa.n+xb.n, xa.d+xb.d), why:'곱하지 않고 더했어.'});
  const ok=c.filter(x=>!sameF(x.f,p.ans) && valF(x.f)>0);
  return pick(ok.length? ok : c);
}
function buildCheckItem(gk, k){
  if(gk==='draw'){                       /* 틀린 사람 찾기 */
    const ps=[], names=shuffle(NAMES.slice()).slice(0,4);
    for(let i=0;i<4;i++) ps.push(makeProb(pick(ALLKINDS), false));
    const bad=randInt(0,3), w=wrongOf(ps[bad]);
    const rows=ps.map((p,i)=>({p:p, name:names[i], shown: i===bad? w.f : p.ans, bad:i===bad}));
    return { type:'check', mode:'bug', rows:rows, bad:bad, why:w.why };
  }
  if(gk==='fill'){                       /* 1보다 큰 것 모두 고르기 */
    let list, guard=0;
    do{
      list=[]; for(let i=0;i<4;i++) list.push(makeProb(pick(ALLKINDS), false));
      var big=list.filter(p=>valF(p.ans)>1).length;
    } while(++guard<200 && (big===0||big===4));
    return { type:'check', mode:'big1', list:list, sel:[] };
  }
  /* 크기 비교 — 가끔 교환법칙(값이 같은 짝)을 섞는다 (교과서 41쪽) */
  const same = Math.random()<0.25;
  const L=makeProb(pick(ALLKINDS), false);
  const R= same ? prob(L.B, L.A) : makeProb(pick(ALLKINDS), false);
  return { type:'check', mode:'cmp', L:L, R:R };
}

function pickBug(i){
  const it=P.items[P.i], fb=document.getElementById('fb');
  const el=document.getElementById('ch'+i);
  if(i===it.bad){
    SND.ok(); el.classList.add('ok');
    fb.className='fb-box good on';
    fb.innerHTML='<h4>찾았다!</h4>'+J(it.rows[i].name,'이는','는')+' '+it.why+'<br>바른 답은 '+fh(it.rows[i].p.ans)+jf(it.rows[i].p.ans,'이야','야')
      +'<div style="margin-top:10px"><button class="btn ok" onclick="nextItem()">다음 →</button></div>';
  } else {
    SND.bad(); P.wrong++; el.classList.add('no');
    fb.className='fb-box err on';
    fb.innerHTML='<h4>'+J(it.rows[i].name,'이는','는')+' 맞게 풀었어</h4>'
      + fh(it.rows[i].p.A)+' × '+fh(it.rows[i].p.B)+' = '+fh(it.rows[i].p.ans)+' — 맞지? 다른 사람을 봐.';
  }
}
function pickBig(i){
  const it=P.items[P.i], el=document.getElementById('ch'+i);
  SND.tap(); toggleIn(it.sel,i); el.classList.toggle('sel');
}
function submitBig(){
  const it=P.items[P.i], fb=document.getElementById('fb');
  const right=it.list.map((p,i)=>valF(p.ans)>1?i:-1).filter(i=>i>=0);
  const same = right.length===it.sel.length && right.every(i=>it.sel.includes(i));
  it.list.forEach((p,i)=>{
    const el=document.getElementById('ch'+i);
    el.classList.remove('sel');
    el.classList.add(valF(p.ans)>1?'ok':'no');
    el.innerHTML += ' &nbsp;→ '+fh(p.ans);
  });
  if(same){
    SND.ok(); fb.className='fb-box good on';
    fb.innerHTML='<h4>정확해!</h4><b>곱하는 수가 1보다 크면</b> 답도 커지고, <b>1보다 작으면</b> 작아져. 계산 안 해도 알 수 있지.'
      +'<div style="margin-top:10px"><button class="btn ok" onclick="nextItem()">다음 →</button></div>';
  } else {
    SND.bad(); P.wrong++;
    fb.className='fb-box err on';
    fb.innerHTML='<h4>다시 보자</h4>초록이 1보다 큰 것들이야. 요령은 이거야 — '
      +'<b>두 수 중 하나라도 1보다 작으면 그만큼 줄어든다.</b>'
      +'<div style="margin-top:10px"><button class="btn" onclick="nextItem()">다음 →</button></div>';
  }
}
function pickCmp(v){
  const it=P.items[P.i], fb=document.getElementById('fb');
  const a=valF(it.L.ans), b=valF(it.R.ans);
  const real = Math.abs(a-b)<1e-9 ? 0 : (a>b? 1 : -1);
  if(v===real){
    SND.ok(); fb.className='fb-box good on';
    fb.innerHTML='<h4>맞아!</h4>'+fh(it.L.ans)+' '+(real===0?'=':real===1?'>':'<')+' '+fh(it.R.ans)
      + (real===0? '<br>순서를 바꿔 곱해도 결과는 같아.' : '')
      +'<div style="margin-top:10px"><button class="btn ok" onclick="nextItem()">다음 →</button></div>';
  } else {
    SND.bad(); P.wrong++;
    fb.className='fb-box err on';
    fb.innerHTML='<h4>아니야</h4>왼쪽은 '+fh(it.L.ans)+', 오른쪽은 '+fh(it.R.ans)+jf(it.R.ans,'이야','야')+'.'
      +'<div style="margin-top:10px"><button class="btn" onclick="nextItem()">다음 →</button></div>';
  }
}

/* ============================================================
   관문 마무리 · 결과
   ============================================================ */
function finishGate(){
  stopTimer();
  const r=P.room, gk=P.gk;
  const star = P.wrong===0 ? 2 : 1;
  const prev = gateStar(r.id, gk);
  if(star>prev) S.gates[r.id+'_'+gk]=star;
  let newBest=false, t=0;
  if(gk==='speed'){
    t = nowElapsed();
    if(!S.best[r.id] || t < S.best[r.id]){ S.best[r.id]=t; newBest=true; }
  }
  persist();
  const first = !prev;
  document.getElementById('resEmo').textContent = P.wrong===0? '🏆' : '🎉';
  document.getElementById('resTitle').textContent = gatesOf(r).find(g=>g.key===gk).name+' 관문 통과!';
  document.getElementById('resSub').innerHTML = P.wrong===0
    ? '한 번도 안 틀렸어. 완벽해!' : '틀린 횟수 '+P.wrong+'번 — 다시 하면 ⭐금별을 받을 수 있어';
  document.getElementById('resStars').innerHTML = GATES.map(g=>{
    const v=gateStar(r.id,g.key);
    return v===2?'<span style="color:var(--gold)">★</span>':v===1?'<span style="color:#9fb0c8">★</span>':'<span style="color:#dde4ee">★</span>';
  }).join('');
  let extra='';
  if(gk==='speed'){
    extra = '기록 <b>'+t.toFixed(1)+'초</b>' + (newBest? ' &nbsp;🔥 <b style="color:var(--acc)">신기록!</b>' : ' (최고 '+S.best[r.id].toFixed(1)+'초)');
  }
  if(first) extra += (extra?'<br>':'')+'⭐ 별을 얻었어! 지금까지 '+totalStars()+'개';
  if(totalStars()===18) extra += '<br>🎴 <b>관장님과의 대결이 열렸어!</b>';
  document.getElementById('resExtra').innerHTML = extra;
  document.getElementById('resAgain').onclick = ()=>startGate(gk);
  if(P.wrong===0) SND.fanfare(); else SND.get();
  show('s-result');
}

const CARD_POOL = [F(0,1,2),F(0,1,3),F(0,2,3),F(0,1,4),F(0,3,4),F(0,1,5),F(0,2,5),F(0,4,5),

    + '<div class="center" style="margin-top:14px">'
    + (B.round>=2 ? '<button class="btn ok" onclick="endBoss()">최종 결과</button>'
                  : '<button class="btn" onclick="B.round++;nextRound()">다음 라운드 →</button>')
    + '</div>';
}
function tapCard(i){
  if(B.phase!=='pick') return;
  SND.tap();
  if(B.sel.includes(i)) B.sel=B.sel.filter(x=>x!==i);
  else if(B.sel.length<2) B.sel.push(i);
  renderBoss();
}
function lockCards(){
  if(B.sel.length!==2) return;
  SND.click();
  const g=GOALS[B.round];
  const a=B.cards[B.sel[0]], b=B.cards[B.sel[1]];
  const myV=mulF(a,b);
  /* 관장님 — 남은 카드에서 고른다. 최선 대신 2~3위를 골라 이길 틈을 준다 */
  const rest=B.cards.filter((c,i)=>!B.sel.includes(i));
  const combos=[];
  for(let i=0;i<rest.length;i++) for(let j=i+1;j<rest.length;j++){
    const v=mulF(rest[i],rest[j]);
    combos.push({a:rest[i], b:rest[j], v:v, s:g.sc(valF(v))});
  }
  combos.sort((x,y)=>y.s-x.s);
  const pickIdx = Math.random()<0.35 ? 0 : randInt(1,3);
  const ai = combos[Math.min(pickIdx, combos.length-1)];
  const ms=g.sc(valF(myV)), as=ai.s;
  const w = Math.abs(ms-as)<1e-9 ? 0 : (ms>as? 1 : -1);
  if(w===1){ B.my++; SND.fanfare(); } else if(w===-1){ B.ai++; SND.bad(); } else SND.get();
  let msg;
  if(w===1) msg='<h4>이겼다!</h4>'+g.tip+' — 제대로 골랐어.';
  else if(w===0) msg='<h4>비겼어</h4>같은 값이 나왔네.';
  else {
    const best=combos[0];
    msg='<h4>졌어</h4>남은 카드로는 '+fh(best.a)+'×'+fh(best.b)+' = '+fh(best.v)+'까지 만들 수 있었어. '+g.tip+'!';
  }
  B.result={ me:{a:a,b:b,v:myV}, ai:{a:ai.a,b:ai.b,v:ai.v}, w:w, msg:msg };
  B.phase='res';
  renderBoss();
}
function endBoss(){
  const won = B.my>B.ai;
  if(B.my>S.boss){ S.boss=B.my; persist(); }
  document.getElementById('resEmo').textContent = won? '🏆':'😤';
  document.getElementById('resTitle').textContent = won? '체험관장을 이겼다!' : '관장님이 한 수 위였어';
  document.getElementById('resSub').innerHTML = '나 '+B.my+' : '+B.ai+' 관장님';
  document.getElementById('resStars').innerHTML = won? '🏅🏅🏅' : '🎴';
  document.getElementById('resExtra').innerHTML = won
    ? '<b>계산이 아니라 수를 읽어 냈구나.</b> 1보다 큰 수·작은 수가 답을 어디로 밀어내는지 알면 이기는 놀이야.'
    : '카드를 고르기 전에 이걸 생각해 봐 — <b>1보다 작은 수를 곱하면 반드시 작아진다.</b>';
  document.getElementById('resAgain').onclick = openBoss;
  if(won) SND.fanfare(); else SND.get();
  show('s-result');
}
