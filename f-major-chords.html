<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>바장조 음계와 화음 — 이 ♭ 하나가 하는 일</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1c2430; --navy:#123a63; --navy2:#1d5b95;
  --red:#c0392b; --gold:#c8963e; --green:#2e7d5b; --plum:#7d4a86;
  --orange:#e2743a;
  --paper:#f6f2e9; --line:#d9d2c4; --muted:#6d6b66;
}

html,body{height:100%;background:#0d1520;font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}

#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;background:var(--paper);overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}

.slide{position:absolute;inset:0;padding:34px 50px;display:none;
  flex-direction:column;background:var(--paper);--acc:var(--navy)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 12% 8%,rgba(200,150,62,.10),transparent 45%),
             radial-gradient(circle at 92% 95%,rgba(18,58,99,.08),transparent 45%)}
.slide>*{position:relative;z-index:1}

.eyebrow{display:inline-block;font-size:20px;font-weight:700;color:#fff;
  background:var(--acc);padding:5px 17px;border-radius:999px;margin-bottom:10px;align-self:flex-start}
h1.title{font-size:56px;font-weight:900;color:var(--navy);line-height:1.16;letter-spacing:-.02em}
h2.stitle{font-size:38px;font-weight:900;color:var(--acc);line-height:1.2;letter-spacing:-.02em}
.rule{width:88px;height:7px;border-radius:4px;
  background:linear-gradient(90deg,var(--red),var(--gold));margin:8px 0 16px}
p.body{font-size:25px;line-height:1.5;color:var(--ink);font-weight:500}
p.body+p.body{margin-top:10px}
.small{font-size:21px;line-height:1.5}
.tiny{font-size:18px;line-height:1.45;color:var(--muted)}

b.hl{font-weight:900;color:var(--red);background:linear-gradient(transparent 62%,rgba(192,57,43,.20) 62%);padding:0 2px}
b.hn{font-weight:900;color:var(--navy2);background:linear-gradient(transparent 62%,rgba(29,91,149,.18) 62%);padding:0 2px}
b.hg{font-weight:900;color:var(--green);background:linear-gradient(transparent 62%,rgba(46,125,91,.18) 62%);padding:0 2px}
b.ho{font-weight:900;color:var(--orange);background:linear-gradient(transparent 62%,rgba(226,116,58,.20) 62%);padding:0 2px}

.cols{display:flex;gap:24px;flex:1;min-height:0;align-items:center}
.col{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:0}

.term{background:#fff;border-left:9px solid var(--gold);border-radius:8px;padding:12px 16px;
  box-shadow:0 6px 16px rgba(30,25,15,.10)}
.term .t{font-size:22px;font-weight:900;color:var(--gold);margin-bottom:2px}
.term .d{font-size:20px;font-weight:500;color:var(--ink);line-height:1.45}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;
  box-shadow:0 6px 16px rgba(30,25,15,.09)}

.act{background:#fffdf6;border:3px dashed var(--acc);border-radius:16px;padding:14px 20px}
.act-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.act-badge{background:var(--acc);color:#fff;font-weight:900;font-size:19px;
  padding:4px 14px;border-radius:999px;white-space:nowrap}
.act-t{font-size:24px;font-weight:900;color:var(--navy)}

.bubble{background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 6px 14px rgba(30,25,15,.10);
  font-size:20px;line-height:1.45;font-weight:600;color:var(--ink);border:2px solid var(--navy2)}

table.tbl{width:100%;border-collapse:collapse;font-size:21px;text-align:center}
table.tbl th{background:var(--acc);color:#fff;padding:8px 6px;font-weight:900}
table.tbl td{border:1px solid var(--line);padding:9px 8px;background:#fff;color:var(--ink);font-weight:700}
table.tbl td.dim{background:#efe9db;color:var(--muted);font-weight:500;font-size:19px}

/* ---------- 소리 장치 ---------- */
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.play{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:54px;padding:11px 20px;border:0;border-radius:14px;cursor:pointer;
  background:var(--navy2);color:#fff;font-family:inherit;font-size:22px;font-weight:900;
  box-shadow:0 5px 0 #0e3a63;transition:transform .06s,box-shadow .06s}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #0e3a63}
.play.gold{background:var(--gold);box-shadow:0 5px 0 #966b1f}
.play.plum{background:var(--plum);box-shadow:0 5px 0 #56305c}
.play.green{background:var(--green);box-shadow:0 5px 0 #1d5540}
.play.orange{background:var(--orange);box-shadow:0 5px 0 #a04b1e}
.play.grey{background:#5c6470;box-shadow:0 5px 0 #3b424b}
.play.sm{min-height:46px;font-size:19px;padding:9px 16px}
.play.on{background:var(--red)!important;box-shadow:0 5px 0 #8c2418!important}

/* 화음 고르기 */
.pick{display:inline-flex;align-items:center;justify-content:center;min-width:62px;
  min-height:48px;padding:8px 12px;border:3px solid var(--line);border-radius:12px;cursor:pointer;
  background:#fff;color:var(--navy);font-family:inherit;font-size:23px;font-weight:900}
.pick.sel{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.pick.ok{background:var(--green);color:#fff;border-color:var(--green)}
.pick.no{background:#e9d5d2;color:var(--red);border-color:var(--red)}

/* ---------- 건반 ---------- */
svg{display:block}
.wk{fill:#fff;stroke:#8d8577;stroke-width:2}
.wk.on{fill:#ffe6c4}
.bk{fill:#2b3340;stroke:#141a22;stroke-width:2}
.bk.on{fill:#c9772f}
.wk.mk{fill:#ddd7ca}
.bk.mk{fill:#c0392b}
.klab{font-size:19px;font-weight:900;fill:#3a4250;text-anchor:middle;pointer-events:none}
.klab2{font-size:17px;font-weight:700;fill:#7b8494;text-anchor:middle;pointer-events:none}
.klabw{font-size:17px;font-weight:900;fill:#fff;text-anchor:middle;pointer-events:none}
.kb g{cursor:pointer}

/* 간격 띠 */
.gapl{font-size:18px;font-weight:900;text-anchor:middle}
.gapbar{stroke-width:5;stroke-linecap:round;fill:none}

/* 가사 */
.lyr{display:flex;gap:2px;flex-wrap:wrap;font-size:24px;font-weight:700;color:var(--ink)}
.lyr span{padding:2px 5px;border-radius:6px}
.lyr span.lit{background:var(--gold);color:#fff}
.mbar{display:flex;gap:10px;width:100%}
.mcell{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.mcell .ch{font-size:30px;font-weight:900;color:var(--acc)}
.mcell .ly{font-size:19px;font-weight:700;color:var(--muted);margin-top:2px}
.mcell.lit{border-color:var(--gold);background:#fff8e8}

/* 화음칩 */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 14px;border-radius:999px;font-size:21px;font-weight:900;color:#fff}
.chip.i{background:var(--orange)}
.chip.iv{background:var(--green)}
.chip.v{background:var(--navy2)}
.chip.dim{background:#b9b2a4}

/* 7화음 판 */
.deg{display:flex;gap:8px;width:100%}
.degb{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;
  padding:10px 4px;text-align:center;cursor:pointer}
.degb .n{font-size:26px;font-weight:900;color:var(--navy)}
.degb .s{font-size:16px;font-weight:700;color:var(--muted)}
.degb.lit{background:#fff3dd;border-color:var(--gold)}

/* ---------- 하단 바 ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;height:46px;background:#0d1520;
  display:flex;align-items:center;gap:14px;padding:0 16px;z-index:50}
.bar button{background:#1d2836;color:#e7ecf3;border:0;border-radius:9px;
  min-height:32px;padding:6px 14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.bar .sp{flex:1}
#counter{color:#93a1b3;font-size:15px;font-weight:700;min-width:64px;text-align:center}
#progwrap{position:fixed;left:0;right:0;bottom:46px;height:5px;background:#0d1520;z-index:50}
#prog{height:100%;width:0;background:var(--navy);transition:width .2s}
#zl,#zr{position:fixed;top:0;bottom:46px;width:9%;z-index:40;cursor:pointer}
#zl{left:0} #zr{right:0}
</style>
</head>
<body>

<div id="stage"></div>
<div id="zl"></div><div id="zr"></div>
<div id="progwrap"><div id="prog"></div></div>
<div class="bar">
  <button onclick="go(-1)">◀ 이전</button>
  <button onclick="go(1)">다음 ▶</button>
  <span id="counter">1 / 1</span>
  <span class="sp"></span>
  <button onclick="stopAll()">■ 소리 멈춤</button>
  <button onclick="fs()">⛶ 전체화면</button>
</div>

<script>
/* ===================== 소리 재료 ===================== */
const F = {
  'E3':164.81,'F3':174.61,'G3':196.00,'A3':220.00,'Bb3':233.08,'B3':246.94,
  'C4':261.63,'Db4':277.18,'D4':293.66,'Eb4':311.13,'E4':329.63,'F4':349.23,'Gb4':369.99,
  'G4':392.00,'Ab4':415.30,'A4':440.00,'Bb4':466.16,'B4':493.88,
  'C5':523.25,'Db5':554.37,'D5':587.33,'Eb5':622.25,'E5':659.26,'F5':698.46,
  'Gb5':739.99,'G5':783.99,'A5':880.00,'Bb5':932.33,'B5':987.77,'C6':1046.50
};

/* 음계 */
const SCALES = {
  Cmaj : ['C4','D4','E4','F4','G4','A4','B4','C5'],           /* 다장조 */
  Ffake: ['F4','G4','A4','B4','C5','D5','E5','F5'],           /* 흰건반만 — 반음이 어긋난 것 */
  Fmaj : ['F4','G4','A4','Bb4','C5','D5','E5','F5']           /* 바장조 */
};

/* 바장조 주요 3화음 — 반주용 낮은 자리 */
const CH = {
  I : ['F3','A3','C4'],
  IV: ['Bb3','D4','F4'],
  V : ['C4','E4','G4']
};
/* 자리바꿈 — 손이 거의 안 움직인다 */
const CH_INV = {
  I : ['F3','A3','C4'],
  IV: ['F3','Bb3','D4'],
  V : ['E3','G3','C4']
};

/* 「숲속을 걸어요」 첫 줄 4마디 (교과서 62쪽) */
const MEL1 = [
  ['C4',1],['A4',1],['F4',1],['D4',.75],['F4',.25],
  ['D4',3],['E4',.5],['F4',.5],
  ['G4',1.5],['A4',.5],['Bb4',.5],['Bb4',.5],['A4',.5],['G4',.5],
  ['A4',3],[null,1]
];
const LYR1 = ['숲','속','을','걸','어','요','산','새','들','이','속','삭','이','는','길',''];
const ACC1 = [[0,'I'],[2,'IV'],[4,'I'],[8,'V'],[12,'I']];
const BAD1 = [[0,'V'],[2,'V'],[4,'IV'],[8,'I'],[12,'V']];

/* 마지막 줄 4마디 — 화음 기호가 비어 있는 그 줄 */
const MEL4 = [
  ['A4',3],['A4',.5],['G4',.5],
  ['F4',3],['E4',.5],['F4',.5],
  ['G4',1.5],['A4',.5],['Bb4',.5],['Bb4',.25],['Bb4',.25],['A4',.5],['G4',.5],
  ['F4',3],[null,1]
];
const LYR4 = ['운','얼','굴','로','우','리','모','두','숲','속','을','걸','어','요',''];
const ACC4 = [[0,'I'],[4,'IV'],[8,'V'],[12,'I']];
const ANS4 = ['I','IV','V','I'];

const BEAT = .60;          /* 한 박 = 0.6초 (보통 빠르게) */

/* ===================== 오디오 ===================== */
let ac = null, timers = [], curBtn = null;

function audio(){
  if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
function clearLit(){
  document.querySelectorAll('.lit').forEach(e => e.classList.remove('lit'));
  document.querySelectorAll('.play.on').forEach(e => {
    e.classList.remove('on');
    if(e.dataset.label) e.textContent = e.dataset.label;
  });
  curBtn = null;
}
function stopAll(){
  timers.forEach(clearTimeout); timers = [];
  clearLit();
  if(ac){ try{ ac.close(); }catch(e){} ac = null; }
}
function mark(btn){
  if(!btn) return;
  curBtn = btn;
  if(!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.classList.add('on');
  btn.textContent = '■ 멈춤';
}
/* 가락음 */
function tone(a, t, f, d, vol){
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  const v = vol === undefined ? .20 : vol;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(v, t + .015);
  g.gain.setValueAtTime(v, t + d * .72);
  g.gain.exponentialRampToValueAtTime(.0008, t + d * .99);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + d + .02);
}
/* 반주음 — 부드럽게 깔리는 소리 */
function pad(a, t, f, d, vol){
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = f;
  const v = vol === undefined ? .13 : vol;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(v, t + .04);
  g.gain.setValueAtTime(v, t + d * .70);
  g.gain.exponentialRampToValueAtTime(.0006, t + d * .98);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + d + .02);
}
function chordAt(a, t, name, d, vol, table){
  (table || CH)[name].forEach(n => pad(a, t, F[n], d, vol));
}
function end(a, t, btn){
  timers.push(setTimeout(clearLit, (t - a.currentTime) * 1000 + 200));
}

/* --- 건반 한 음 --- */
function hit(note, el){
  const a = audio();
  tone(a, a.currentTime + .01, F[note], .85);
  if(el){ el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 170); }
}

/* --- 음계 훑기 --- */
function playScale(key, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const a = audio(), sc = SCALES[key];
  let t = a.currentTime + .12;
  mark(btn);
  sc.forEach((n, i) => {
    tone(a, t, F[n], .40);
    const el = document.querySelector('[data-kb="' + key + '"] [data-note="' + n + '"]');
    if(el) timers.push(setTimeout(() => {
      el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 320);
    }, (t - a.currentTime) * 1000));
    t += .45;
  });
  end(a, t, btn);
}

/* --- 화음 쌓기 (한 음 → 두 음 → 세 음) --- */
function playStack(n, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const a = audio(); let t = a.currentTime + .1;
  mark(btn);
  const notes = ['F4','A4','C5'].slice(0, n);
  notes.forEach(x => { tone(a, t, F[x], 1.0, .17); t += .55; });
  t += .25;
  notes.forEach(x => tone(a, t, F[x], 1.6, .16));
  t += 1.8;
  end(a, t, btn);
}

/* --- 붙여 쌓기(도레미) ↔ 건너뛰어 쌓기(도미솔) --- */
function playClash(btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const a = audio(); let t = a.currentTime + .1;
  mark(btn);
  ['F4','G4','A4'].forEach(x => tone(a, t, F[x], 1.9, .16));   /* 도 레 미 — 부딪힌다 */
  t += 2.3;
  ['F4','A4','C5'].forEach(x => tone(a, t, F[x], 1.9, .16));   /* 도 미 솔 — 어울린다 */
  t += 2.2;
  end(a, t, btn);
}

/* --- 화음 하나 --- */
function playCh(name, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const a = audio(); let t = a.currentTime + .1;
  mark(btn);
  CH[name].forEach((x, i) => tone(a, t + i * .18, F[x], 1.5, .16));
  t += 2.0;
  end(a, t, btn);
}

/* --- 마침 느낌: V 에서 멈추기 / V → I --- */
function playCad(kind, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const a = audio(); let t = a.currentTime + .1;
  mark(btn);
  chordAt(a, t, 'I',  .85, .16); t += .95;
  chordAt(a, t, 'IV', .85, .16); t += .95;
  chordAt(a, t, 'V',  kind === 'stop' ? 2.4 : .85, .16); t += kind === 'stop' ? 2.6 : .95;
  if(kind === 'home'){ chordAt(a, t, 'I', 2.4, .16); t += 2.6; }
  end(a, t, btn);
}

/* --- 자리바꿈 비교 --- */
function playInv(kind, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const a = audio(); let t = a.currentTime + .1;
  const tb = kind === 'inv' ? CH_INV : CH;
  mark(btn);
  ['I','IV','V','I'].forEach(nm => { chordAt(a, t, nm, 1.0, .16, tb); t += 1.1; });
  end(a, t, btn);
}

/* --- 조옮김 비교: 첫 소절을 다장조 / 바장조로 --- */
const HEAD_F = [['C4',1],['A4',1],['F4',1],['D4',.75],['F4',.25],['D4',2]];
const HEAD_C = [['G3',1],['E4',1],['C4',1],['A3',.75],['C4',.25],['A3',2]];
function playTrans(key, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const a = audio(); let t = a.currentTime + .12;
  mark(btn);
  (key === 'C' ? HEAD_C : HEAD_F).forEach(([n, b]) => {
    if(n) tone(a, t, F[n] || (F[n.replace('3','4')] / 2), b * BEAT * .95);
    t += b * BEAT;
  });
  end(a, t, btn);
}

/* --- 노래 재생 --- */
/* mode: mel(가락만) acc(화음과 함께) bad(틀린 화음) noflat(시에 ♭ 없이) dyn(셈여림) flat(♭ 있이) */
function playSong(part, mode, btn){
  const same = (curBtn === btn); stopAll(); if(same) return;
  const a = audio();
  const mel = part === 4 ? MEL4 : MEL1;
  const lyr = part === 4 ? LYR4 : LYR1;
  const accs = mode === 'bad' ? BAD1 : (part === 4 ? ACC4 : ACC1);
  const box = btn ? btn.closest('.slide') : document;
  const cells = box.querySelectorAll('[data-m]');
  const lys = box.querySelectorAll('[data-ly]');
  mark(btn);

  const t0 = a.currentTime + .15;
  let beat = 0;

  /* 셈여림 — 마디별 크기 (마지막 줄용) */
  const DYN = [.13, .13, .19, .24];

  mel.forEach(([n, b], i) => {
    if(n){
      let nn = n;
      if(mode === 'noflat' && n === 'Bb4') nn = 'B4';
      let vol = .20;
      if(mode === 'dyn'){ vol = DYN[Math.min(3, Math.floor(beat / 4))] + .05; }
      if(mode === 'nodyn') vol = .20;
      tone(a, t0 + beat * BEAT, F[nn], b * BEAT * .92, vol);
    }
    if(lys[i]) timers.push(setTimeout(() => {
      lys.forEach(e => e.classList.remove('lit'));
      lys[i].classList.add('lit');
    }, (t0 - a.currentTime + beat * BEAT) * 1000));
    beat += b;
  });

  if(mode === 'acc' || mode === 'bad' || mode === 'dyn' || mode === 'nodyn'){
    accs.forEach(([bp, nm], i) => {
      const nextBp = (accs[i + 1] || [16])[0];
      let p = bp;
      while(p < nextBp){
        const len = Math.min(2, nextBp - p);
        let vol = .12;
        if(mode === 'dyn') vol = DYN[Math.min(3, Math.floor(p / 4))];
        chordAt(a, t0 + p * BEAT, nm, len * BEAT * .95, vol);
        p += len;
      }
    });
  }
  /* 마디 칸 켜기 */
  cells.forEach(c => {
    const mi = +c.dataset.m;
    timers.push(setTimeout(() => {
      cells.forEach(x => x.classList.remove('lit'));
      c.classList.add('lit');
    }, (t0 - a.currentTime + mi * 4 * BEAT) * 1000));
  });

  end(a, t0 + beat * BEAT + .4, btn);
}

/* --- 한 마디만 골라 들어 보기 (활동) --- */
let PICKED = [null, null, null, null];
function pickCh(mi, name, btn){
  stopAll();
  PICKED[mi] = name;
  const row = btn.parentElement;
  row.querySelectorAll('.pick').forEach(p => p.classList.remove('sel','ok','no'));
  btn.classList.add('sel');
  /* 그 마디만 화음과 함께 들려준다 */
  const a = audio();
  let beat = 0, t0 = a.currentTime + .12;
  const from = mi * 4, to = from + 4;
  MEL4.forEach(([n, b]) => {
    if(beat >= from && beat < to && n) tone(a, t0 + (beat - from) * BEAT, F[n], b * BEAT * .92);
    beat += b;
  });
  chordAt(a, t0, name, 2 * BEAT * .95, .13);
  chordAt(a, t0 + 2 * BEAT, name, 2 * BEAT * .95, .13);
  end(a, t0 + 4 * BEAT + .3, null);
}
function checkAns(btn){
  const box = btn.closest('.slide');
  box.querySelectorAll('.prow').forEach((row, mi) => {
    row.querySelectorAll('.pick').forEach(p => {
      p.classList.remove('sel','ok','no');
      if(p.dataset.ch === ANS4[mi]) p.classList.add('ok');
      else if(PICKED[mi] === p.dataset.ch) p.classList.add('no');
    });
  });
}

/* ===================== 건반 그리기 ===================== */
/* start: 'C' 또는 'F' — 한 옥타브 */
function kbd(key, opt){
  opt = opt || {};
  const W = opt.w || 68, H = opt.h || 132, BW = Math.round(W * .60), BH = Math.round(H * .62);
  const layouts = {
    Cmaj : { white:['C4','D4','E4','F4','G4','A4','B4','C5'],
             black:[['Db4',0],['Eb4',1],['Gb4',3],['Ab4',4],['Bb4',5]] },
    Ffake: { white:['F4','G4','A4','B4','C5','D5','E5','F5'],
             black:[['Gb4',0],['Ab4',1],['Bb4',2],['Db5',4],['Eb5',5]] },
    Fmaj : { white:['F4','G4','A4','B4','C5','D5','E5','F5'],
             black:[['Gb4',0],['Ab4',1],['Bb4',2],['Db5',4],['Eb5',5]] }
  };
  const L = layouts[key];
  const solC = ['도','레','미','파','솔','라','시','도'];
  const korC = ['다','라','마','바','사','가','나','다'];
  const korF = ['바','사','가','나','다','라','마','바'];
  const kor  = key === 'Cmaj' ? korC : korF;
  /* 바장조에서는 4번째 흰건반(B)이 아니라 검은건반 B♭이 '파' */
  const solF = ['도','레','미','','솔','라','시','도'];
  const sol  = key === 'Fmaj' ? solF : solC;

  let s = '<svg class="kb" data-kb="' + key + '" viewBox="0 0 ' + (W * 8) + ' ' + (H + (opt.lab === false ? 6 : 52)) + '" style="width:' + (opt.sw || 560) + 'px">';
  /* 흰건반 */
  L.white.forEach((n, i) => {
    const bad = (key === 'Fmaj' && n === 'B4');
    s += '<g onclick="hit(\'' + n + '\',this.querySelector(\'rect\'))">';
    s += '<rect class="wk' + (bad ? ' mk' : '') + '" data-note="' + n + '" x="' + (i * W) + '" y="0" width="' + W + '" height="' + H + '" rx="6"/>';
    if(opt.lab !== false){
      if(sol[i]) s += '<text class="klab" x="' + (i * W + W / 2) + '" y="' + (H - 14) + '">' + sol[i] + '</text>';
      s += '<text class="klab2" x="' + (i * W + W / 2) + '" y="' + (H + 24) + '">' + kor[i] + '</text>';
    }
    s += '</g>';
  });
  /* 검은건반 */
  L.black.forEach(([n, i]) => {
    const isBb = (key === 'Fmaj' && n === 'Bb4');
    s += '<g onclick="hit(\'' + n + '\',this.querySelector(\'rect\'))">';
    s += '<rect class="bk' + (isBb ? ' mk' : '') + '" data-note="' + n + '" x="' + (i * W + W - BW / 2) + '" y="0" width="' + BW + '" height="' + BH + '" rx="4"/>';
    if(isBb) s += '<text class="klabw" x="' + (i * W + W) + '" y="' + (BH - 12) + '">파</text>';
    s += '</g>';
  });
  s += '</svg>';
  return s;
}

/* 온음·반음 띠 — 흰건반 사이 간격 표시 */
function gaps(pattern, opt){
  opt = opt || {};
  const W = opt.w || 68, sw = opt.sw || 560;
  let s = '<svg viewBox="0 0 ' + (W * 8) + ' 44" style="width:' + sw + 'px;margin-top:2px">';
  pattern.forEach((g, i) => {
    const x1 = i * W + W / 2 + 7, x2 = (i + 1) * W + W / 2 - 7;
    const col = g === '반' ? '#c0392b' : '#1d5b95';
    s += '<line class="gapbar" x1="' + x1 + '" y1="14" x2="' + x2 + '" y2="14" stroke="' + col + '"/>';
    s += '<text class="gapl" x="' + ((x1 + x2) / 2) + '" y="38" fill="' + col + '">' + g + '</text>';
  });
  s += '</svg>';
  return s;
}

    <div class="act-h"><span class="act-badge">다음 시간</span>
      <span class="act-t">가락 악기로 화음 반주하며 「숲속을 걸어요」 부르기</span></div>
    <p class="body small">멜로디언·키보드로 I · IV · V 세 화음을 <b class="hn">자리바꿈해서</b> 짚어 보고,
      모둠을 나누어 노래와 반주를 맡는다.</p>
  </div>
</section>`

];

/* ===== 7음 → 화음 켜기 ===== */
const DEG_IN = [
  ['I','IV'],       /* 도 = 파  → I(도미솔) · IV(파라도) */
  ['V'],            /* 레 = 사  → V(솔시레) */
  ['I'],            /* 미 = 가  → I */
  ['IV'],           /* 파 = 나♭ → IV */
  ['I','V'],        /* 솔 = 다  → I · V */
  ['IV'],           /* 라 = 라  → IV */
  ['V']             /* 시 = 마  → V */
];
function lightDeg(i, el){
  stopAll();
  document.querySelectorAll('.degb').forEach(d => d.classList.remove('lit'));
  ['chI','chIV','chV'].forEach(id => {
    const c = document.getElementById(id);
    if(c){ c.style.borderColor = 'var(--line)'; c.style.background = '#fff'; }
  });
  el.classList.add('lit');
  const a = audio();
  const note = ['F4','G4','A4','Bb4','C5','D5','E5'][i];
  tone(a, a.currentTime + .02, F[note], .9);
  const COL = { I:'#e2743a', IV:'#2e7d5b', V:'#1d5b95' };
  DEG_IN[i].forEach((nm, k) => {
    const c = document.getElementById('ch' + nm);
    if(c){ c.style.borderColor = COL[nm]; c.style.background = '#fffaf2'; }
    chordAt(a, a.currentTime + .45 + k * .05, nm, 1.3, .13);
  });
}

/* ===================== 렌더링 ===================== */
const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.join('');

const slides = [...stage.querySelectorAll('.slide')];
let cur = 0;
function show(i){
  stopAll();
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, n) => s.classList.toggle('on', n === cur));
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + slides.length;
  const p = document.getElementById('prog');
  p.style.width = ((cur + 1) / slides.length * 100) + '%';
  p.style.background = getComputedStyle(slides[cur]).getPropertyValue('--acc');
}
function go(d){ show(cur + d); }

function fit(){
  const s = Math.min(window.innerWidth / 1280, (window.innerHeight - 46) / 720);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
function fs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener('keydown', e => {
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(1); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
  if(e.key === 'Home') show(0);
  if(e.key === 'End') show(slides.length - 1);
  if(e.key === 'f' || e.key === 'F') fs();
});
document.getElementById('zl').onclick = () => go(-1);
document.getElementById('zr').onclick = () => go(1);

let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('resize', fit);
fit();
show(0);
</script>
