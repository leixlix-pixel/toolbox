<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한가위 달 채우기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --night:#101a3a; --night2:#1b2a55; --moon:#ffe9a8; --gold:#e8a33d;
  --paper:#fdf6e6; --ink:#2a2418; --muted:#7b7263; --line:#e0d5bb;
  --ok:#2e8b57; --bad:#c0472f;
}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans KR',sans-serif; background:var(--night); color:var(--paper);
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
  min-height:100vh; font-size:17px; line-height:1.6;
  background-image:radial-gradient(circle at 20% 10%,#22336b 0,transparent 55%),
                   radial-gradient(circle at 85% 80%,#2a1f4a 0,transparent 50%);
  background-attachment:fixed;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 14px 40px}

header{display:flex;align-items:center;gap:10px;padding:14px 2px 10px}
header .ttl{font-family:'Gaegu',sans-serif;font-size:27px;letter-spacing:1px;color:var(--moon);flex:1}
.ic{min-width:46px;min-height:46px;border-radius:14px;border:1px solid #ffffff33;
    background:#ffffff14;color:var(--paper);font-size:19px;cursor:pointer}
.ic:active{background:#ffffff2b}

.card{background:var(--paper);color:var(--ink);border-radius:20px;padding:18px 16px 20px;
      box-shadow:0 10px 30px #0006;margin-bottom:14px}
.eye{font-size:14px;font-weight:700;color:var(--gold);letter-spacing:1px;margin-bottom:2px}
h2{font-size:23px;margin:0 0 8px;font-weight:900;line-height:1.35}
.lead{font-size:17px;margin:0 0 14px;color:#4a4436}
.small{font-size:15px;color:var(--muted);line-height:1.55}

/* 홈 */
.moonbox{text-align:center;padding:4px 0 2px}
.moonbox svg{max-width:260px;width:62vw;height:auto}
.phase{font-size:16px;color:var(--moon);margin-top:2px;font-weight:700}
.mlist{display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
      background:var(--paper);border:0;border-radius:18px;padding:13px 14px;min-height:64px;
      box-shadow:0 6px 18px #0005;font-family:inherit}
.mbtn:active{transform:translateY(1px)}
.mbtn .no{width:42px;height:42px;flex:none;border-radius:50%;background:#f0e6cd;color:#8a7a4e;
          display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900}
.mbtn.done .no{background:#2e8b57;color:#fff}
.mbtn .tx{flex:1;min-width:0}
.mbtn .tx b{display:block;font-size:18px;color:var(--ink)}
.mbtn .tx span{font-size:14px;color:var(--muted)}
.mbtn .go{font-size:20px;color:var(--gold)}

/* 공통 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
     min-height:50px;padding:12px 20px;border-radius:14px;border:0;cursor:pointer;
     font-family:inherit;font-size:17px;font-weight:700;background:var(--gold);color:#3a2a08}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#ffffff14;color:var(--paper);border:1px solid #ffffff33}
.btn.dark{background:var(--night2);color:var(--paper)}
.btn[disabled]{opacity:.45;pointer-events:none}
.navrow{display:flex;gap:10px;justify-content:space-between;margin-top:6px}

/* 칩·선택지 */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0}
.chip{min-height:50px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);
      background:#fff;color:var(--ink);font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.chip.sel{border-color:var(--gold);background:#fff6e0;box-shadow:0 0 0 3px #e8a33d44}
.chip.fix{background:#eef6ef;border-color:#2e8b5766;color:#25603c;pointer-events:none}
.chip.small{font-size:15px;min-height:44px;padding:8px 13px}
.opts{display:flex;flex-direction:column;gap:10px;margin:12px 0 4px}
.opt{text-align:left;padding:14px;border-radius:15px;border:2px solid var(--line);background:#fff;
     color:var(--ink);font-size:17px;line-height:1.5;cursor:pointer;font-family:inherit;min-height:54px}
.opt.right{border-color:var(--ok);background:#eef6ef}
.opt.wrong{border-color:var(--bad);background:#fbeeea}
.shake{animation:sh .34s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* 피드백 */
.fb{margin-top:12px;padding:13px 14px;border-radius:14px;font-size:16px;line-height:1.55;display:none}
.fb.on{display:block}
.fb.good{background:#eef6ef;border-left:5px solid var(--ok);color:#22513a}
.fb.nope{background:#fbeeea;border-left:5px solid var(--bad);color:#7d2e1c}
.fb.info{background:#f3edda;border-left:5px solid var(--gold);color:#5b4a20}
.fb b{color:inherit}

/* 낱말 잇기 */
.pairs{display:flex;gap:10px;margin:8px 0 2px}
.col{flex:1;display:flex;flex-direction:column;gap:9px}
.col .hd{font-size:14px;color:var(--muted);font-weight:700;text-align:center}

/* 길쌈 */
.gauge{height:26px;border-radius:13px;background:#eadfc4;overflow:hidden;margin:6px 0 12px;border:1px solid var(--line)}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8a33d,#d9822b);transition:width .12s}
.gauge.b i{background:linear-gradient(90deg,#7f8bbf,#5c6aa8)}
.glabel{display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:2px}
.tapbtn{width:100%;min-height:96px;border-radius:20px;border:0;background:#2b3c78;color:#fff;
        font-size:23px;font-weight:900;font-family:inherit;cursor:pointer;box-shadow:0 8px 0 #1c2a58}
.tapbtn:active{transform:translateY(5px);box-shadow:0 3px 0 #1c2a58}

/* 차례상 */
.table{background:#8b5e34;border-radius:14px;padding:12px 10px 16px;margin:10px 0 6px;
       box-shadow:inset 0 -6px 0 #6f4926}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:#f5ecd8;border:2px dashed #b99a6b;border-radius:12px;min-height:74px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-size:13px;color:#a08a63;cursor:pointer;padding:4px}
.slot.has{border-style:solid;border-color:#8b5e34;color:var(--ink);font-weight:700}
.slot .em{font-size:27px;line-height:1.1}
.food{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;padding:7px 4px;
      border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;
      font-size:13px;color:var(--ink);font-weight:700}
.food .em{font-size:25px;line-height:1.15}
.food.sel{border-color:var(--gold);background:#fff6e0}
.food.used{opacity:.32;pointer-events:none}
.foodgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}
.tag{display:inline-block;font-size:11px;background:#2e8b571f;color:#2e8b57;border-radius:6px;padding:0 5px;font-weight:700}

/* 송편 */
.stepno{font-size:14px;color:var(--gold);font-weight:700}
.songSvg{display:block;margin:2px auto 0}

/* 강강술래 */
.circlebox{position:relative;text-align:center}
.beatinfo{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:#4a4436;margin-bottom:4px}
.hitmsg{height:26px;font-size:17px;font-weight:900;color:var(--gold);text-align:center}

/* 짝 맞추기 */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mcard{min-height:76px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);
       font-size:15px;font-weight:700;line-height:1.35;padding:8px 6px;cursor:pointer;font-family:inherit}
.mcard.sel{border-color:var(--gold);background:#fff6e0}
.mcard.matched{border-color:var(--ok);background:#eef6ef;color:#25603c;pointer-events:none;opacity:.72}
.mcard small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:3px}

/* 마무리 */
textarea,input[type=text]{width:100%;font-family:inherit;font-size:17px;padding:12px;border-radius:12px;
  border:2px solid var(--line);background:#fff;color:var(--ink);resize:none;user-select:text;-webkit-user-select:text}
textarea:focus,input:focus{outline:0;border-color:var(--gold)}
.wishcard{display:block;width:100%;max-width:330px;margin:12px auto 0;border-radius:14px;box-shadow:0 8px 22px #0007}

/* 토스트·오버레이 */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:50;
  background:#1b2a55f2;color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;font-weight:700;
  opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#ovl{position:fixed;inset:0;background:#0b1330ee;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#ovl.on{display:flex}
.ovlbox{text-align:center;max-width:380px}
.ovlbox svg{width:190px;height:190px}
.ovlbox h3{font-family:'Gaegu',sans-serif;font-size:31px;color:var(--moon);margin:6px 0 4px}
.ovlbox p{font-size:17px;color:#d8d2c2;margin:0 0 16px;line-height:1.6}
.tbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
@media (max-width:360px){ body{font-size:16px} h2{font-size:21px} .foodgrid{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>
<svg id="stars" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
<div class="wrap">
  <header>
    <div class="ttl">🌕 한가위 달 채우기</div>
    <button class="ic" data-a="sound" id="sndbtn" title="소리">🔊</button>
    <button class="ic" data-a="reset" title="처음부터">↺</button>
  </header>
  <div id="view"></div>
</div>
<div id="toast"></div>
<div id="ovl"><div class="ovlbox" id="ovlbox"></div></div>

<script>
/* ═══════════════ 소리 (파일 없이 Web Audio) ═══════════════ */
const SND={
  ctx:null, vol:.55,
  init(){ if(this.ctx) return; try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  tone(f,dur,type,vol,delay,slide){
    if(!this.ctx||this.vol<=0) return;
    const t0=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t0+dur);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime((vol==null?.16:vol)*this.vol,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0+dur+.05);
  },
  noise(dur,vol,delay,freq){
    if(!this.ctx||this.vol<=0) return;
    const t0=this.ctx.currentTime+(delay||0), len=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const g=this.ctx.createGain(); g.gain.value=(vol==null?.12:vol)*this.vol;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start(t0);
  },
  click(){ this.tone(680,.06,'square',.10); },
  tap(){ this.tone(440,.05,'triangle',.09); },
  ok(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.16,'triangle',.15,i*.075)); },
  bad(){ this.tone(220,.22,'sawtooth',.13,0,110); this.tone(160,.26,'square',.08,.06,90); },
  get(){ [784,1047,1319].forEach((f,i)=>this.tone(f,.14,'sine',.18,i*.06)); },
  moon(){ [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.3,'sine',.14,i*.1)); },
  drum(){ this.tone(110,.16,'sine',.30,0,62); this.noise(.09,.07,0,260); },   /* 북 — 둥 */
  kkwang(){ this.noise(.28,.10,0,2600); this.tone(1046,.16,'triangle',.07); }, /* 꽹과리 */
  weave(){ this.tone(300+Math.random()*60,.05,'square',.07); this.noise(.05,.05,0,900); },
  ding(){ this.tone(1318,.45,'sine',.16); this.tone(1976,.35,'sine',.07,.02); }
};

/* ═══════════════ 상태 ═══════════════ */
const KEY='chuseok-hangawi-v1';
const MISSIONS=[
  {n:1,t:'이름을 찾아라',   s:'한가위·추석은 무슨 뜻일까',      em:'📜'},
  {n:2,t:'가배 겨루기',     s:'1800년 전, 추석이 시작된 날',    em:'🧵'},
  {n:3,t:'차례상 차리기',   s:'무엇을 올리고, 무엇을 안 올려도 될까', em:'🍚'},
  {n:4,t:'송편 빚기',       s:'왜 하필 반달 모양일까',          em:'🥟'},
  {n:5,t:'강강술래',        s:'달 아래 둥글게 돌아 보자',        em:'💃'},
  {n:6,t:'그때와 지금',     s:'변한 것과 남은 것',              em:'📱'}
];
let S={ view:'home', done:{}, wish:'', who:'' };
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({done:S.done,wish:S.wish,who:S.who})); }catch(e){} }
function load(){ try{ const o=JSON.parse(localStorage.getItem(KEY)||'{}');
  if(o.done) S.done=o.done; if(o.wish) S.wish=o.wish; if(o.who) S.who=o.who; }catch(e){} }
function count(){ return MISSIONS.filter(m=>S.done[m.n]).length; }

/* ═══════════════ 달 그리기 ═══════════════ */
function moonPath(cx,cy,r,p){
  p=Math.max(0,Math.min(1,p));
  const rx=Math.abs(r*(1-2*p)), sweep=p<.5?0:1;
  return `M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r} A ${rx.toFixed(2)} ${r} 0 0 ${sweep} ${cx} ${cy-r} Z`;
}
function moonSvg(p,size){
  const s=size||200, c=s/2, r=s*.40;
  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" aria-hidden="true">
    <defs><radialGradient id="mg"><stop offset="60%" stop-color="#ffe9a8"/><stop offset="100%" stop-color="#f6cf72"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <circle cx="${c}" cy="${c}" r="${r}" fill="#ffffff12"/>
    <path d="${moonPath(c,c,r,p)}" fill="url(#mg)" filter="url(#glow)"/>
    ${p>.55?`<g fill="#e3c071" opacity=".55">
      <ellipse cx="${c+r*.18}" cy="${c-r*.26}" rx="${r*.15}" ry="${r*.11}"/>
      <ellipse cx="${c-r*.20}" cy="${c+r*.10}" rx="${r*.12}" ry="${r*.16}"/>
      <ellipse cx="${c+r*.30}" cy="${c+r*.32}" rx="${r*.10}" ry="${r*.08}"/></g>`:''}
  </svg>`;
}
function starfield(){
  let s='';
  for(let i=0;i<46;i++){
    const x=(Math.random()*100).toFixed(1), y=(Math.random()*100).toFixed(1);
    const r=(Math.random()*.32+.1).toFixed(2), o=(Math.random()*.6+.25).toFixed(2);
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${o}"/>`;
  }
  document.getElementById('stars').innerHTML=s;
}

/* ═══════════════ 화면 전환 ═══════════════ */
let timers=[], raf=null;
function cleanup(){ timers.forEach(t=>clearInterval(t)); timers=[]; if(raf) cancelAnimationFrame(raf); raf=null; }
const V={};
function go(v){ cleanup(); S.view=v; render(); window.scrollTo(0,0); }
function render(){ document.getElementById('view').innerHTML=V[S.view](); if(V[S.view].after) V[S.view].after(); if(S.view==='home') drawQR(); }
function $(id){ return document.getElementById(id); }
function fb(html,kind){ const e=$('fb'); if(!e) return; e.className='fb on '+(kind||'info'); e.innerHTML=html; }
const PEND={};
function actBtn(label,action,payload){
  const e=$('fb'); if(!e) return;
  const b=document.createElement('button');
  b.className='btn'; b.style.cssText='width:100%;margin-top:12px';
  b.innerHTML=label; b.dataset.a=action; if(payload!=null) b.dataset.v=payload;
  e.parentNode.insertBefore(b,e.nextSibling);
}
function doneBtn(n,msg,label){ PEND[n]=msg; actBtn(label||'🌙 다 읽었어 · 달 채우기','finishnow',n); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2100); }

/* 미션 완료 → 달이 찬다 */
function finish(n,msg){
  if(S.done[n]) { go('home'); return; }
  S.done[n]=true; save();
  const c=count(), p=.06+.94*(c/6);
  SND.moon();
  $('ovlbox').innerHTML=`${moonSvg(p,190)}
    <h3>달이 ${c}/6 만큼 찼어!</h3><p>${msg||''}</p>
    <button class="btn" data-a="ovlclose">마을로 돌아가기</button>`;
  $('ovl').classList.add('on');
}
function ovlClose(){ $('ovl').classList.remove('on'); go(c6done()?'end':'home'); }
function c6done(){ return count()===6 && !S.endSeen; }

/* ═══════════════ 홈 ═══════════════ */
V.home=function(){
  const c=count(), p=.06+.94*(c/6);
  const names=['그믐달','초승달','눈썹달','반달','상현달','거의 보름달','보름달!'];
  return `
  <div class="moonbox">${moonSvg(p,220)}
    <div class="phase">${names[c]} · 미션 ${c} / 6</div></div>
  <div class="card" style="padding:14px 15px">
    <p class="lead" style="margin:0;font-size:16px">
      ${c===0?'2026년 <b>9월 25일</b>은 추석이야. 그런데 추석은 왜 생겼고, 무엇을 하는 날일까?<br>미션 여섯 개를 풀면 달이 꽉 찬다.'
             :(c<6?'달이 차오르고 있어. 남은 미션을 풀어 보자.':'달이 다 찼다! 마지막 이야기를 보러 가자.')}
    </p>
  </div>
  <div id="qrbox"></div>
  <div class="mlist">
    ${MISSIONS.map(m=>`
      <button class="mbtn ${S.done[m.n]?'done':''}" data-a="go" data-v="m${m.n}">
        <div class="no">${S.done[m.n]?'✓':m.em}</div>
        <div class="tx"><b>${m.n}. ${m.t}</b><span>${m.s}</span></div>
        <div class="go">${S.done[m.n]?'다시':'▶'}</div>
      </button>`).join('')}
    <button class="mbtn" data-a="go" data-v="end" ${c<6?'style="opacity:.5"':''}>
      <div class="no" style="background:${c<6?'#f0e6cd':'#e8a33d'};color:${c<6?'#8a7a4e':'#fff'}">${c<6?'🔒':'🌕'}</div>
      <div class="tx"><b>보름달 소원 카드</b><span>${c<6?'미션 여섯 개를 다 풀면 열려':'더도 말고 덜도 말고…'}</span></div>
      <div class="go">${c<6?'':'▶'}</div>
    </button>
  </div>`;
};

/* ═══════════════ 미션 1 — 이름을 찾아라 ═══════════════ */
const M1={
  pairs:[
    {w:'한', d:'크다',   why:'한가위의 <b>한</b>은 순우리말로 <b>크다</b>는 뜻. 한강·한길·한가운데의 그 「한」이야.'},
    {w:'가위',d:'가운데', why:'<b>가위</b>는 신라 말 <b>가배</b>에서 온 말로 <b>가운데</b>라는 뜻. 음력 8월의 한가운데(15일)!'},
    {w:'秋 추',d:'가을',  why:'<b>秋</b>는 가을 추. 벼(禾)와 불(火)이 들어 있어 — 곡식을 거두는 계절.'},

function m5tap(){

  else { SND.tap(); m.textContent='조금 이르네…'; m.style.color='#9a8f7a'; }

M6.shuffled=M6.pairs.slice().sort(()=>Math.random()-.5);
function m6pick(side,id){
  SND.tap();
  if(M6.matched[id]) return;
  const key=side+id;
  if(M6.sel===key){ M6.sel=null; render(); return; }
  if(!M6.sel){ M6.sel=key; render(); return; }
  const a=M6.sel, b=key;
  if(a[0]===b[0]){ M6.sel=key; render(); return; }        /* 같은 쪽을 두 번 — 선택만 바꾼다 */
  if(a.slice(1)===b.slice(1)){
    const p=M6.pairs.find(x=>x.id===id);
    SND.ok(); M6.matched[id]=true; M6.sel=null; render();
    fb(`✓ <b>${p.old}</b> — ${p.oldd}.<br>→ 오늘은 <b>${p.now}</b>. ${p.noww}`,'good');
    if(Object.keys(M6.matched).length===4){
      actBtn('마지막 물음으로 →','m6next');
    }
  } else {
    SND.bad(); M6.sel=null; render();
    fb('✗ 그 둘은 이어지지 않아. <b>무엇을 하려던 풍습인지</b>를 먼저 생각해 봐 — 만나려던 것인지, 거둔 것을 다루는 일인지, 함께 놀려던 것인지, 기억하려던 것인지.','nope');
  }
}
function m6keep(i){
  M6.keep=+i; SND.ok(); render();
  fb('✓ '+M6.keeps[i].w+'<br><br><b>모양은 바뀌어도 남는 것이 있어.</b> 1800년 전 신라 사람들이 한 달 동안 베를 짜고 다 같이 먹은 그 마음 — <b>감사</b>하고 <b>나누고</b> <b>만나는</b> 것. 그게 추석이야.','info');
  doneBtn(6,'변한 것과 남은 것을 모두 보았다. 이제 달이 꽉 찼어!');
}

/* 소원 카드 — canvas 에 직접 그린다 (외부 라이브러리 없음) */
function wrapText(ctx,text,x,y,maxW,lh){
  const words=String(text).split(/\s+/); let line='',yy=y;
  for(let i=0;i<words.length;i++){
    let test=line?line+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxW && line){
      ctx.fillText(line,x,yy); yy+=lh; line=words[i];
      while(ctx.measureText(line).width>maxW){         /* 한 덩어리가 길면 글자로 끊는다 */
        let cut=line.length;
        while(cut>1 && ctx.measureText(line.slice(0,cut)).width>maxW) cut--;
        ctx.fillText(line.slice(0,cut),x,yy); yy+=lh; line=line.slice(cut);
      }
    } else line=test;
  }
  if(line) ctx.fillText(line,x,yy);
  return yy;
}
function makeCard(){
  const who=($('who').value||'').trim(), wish=($('wish').value||'').trim();
  if(!wish){ toast('소원을 한 줄 적어 줘'); return; }
  S.who=who; S.wish=wish; save(); SND.ding();
  const W=660,H=920,c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0d1636'); g.addColorStop(.55,'#1b2a55'); g.addColorStop(1,'#2a1f4a');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){ x.globalAlpha=Math.random()*.7+.2; x.fillStyle='#fff'; x.beginPath();
    x.arc(Math.random()*W,Math.random()*H*.75,Math.random()*1.7+.4,0,7); x.fill(); }
  x.globalAlpha=1;
  /* 달 */
  const cx=W/2,cy=250,r=112;
  const mg=x.createRadialGradient(cx-20,cy-20,10,cx,cy,r); mg.addColorStop(0,'#fff6d5'); mg.addColorStop(1,'#f3ca6b');
  x.shadowColor='#ffe9a8aa'; x.shadowBlur=60; x.fillStyle=mg; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill(); x.shadowBlur=0;
  x.fillStyle='#e3c07188';
  [[.18,-.26,.15,.11],[-.20,.10,.12,.16],[.30,.32,.10,.08]].forEach(m=>{
    x.beginPath(); x.ellipse(cx+r*m[0],cy+r*m[1],r*m[2],r*m[3],0,0,7); x.fill(); });
  /* 산 */
  x.fillStyle='#16224a'; x.beginPath(); x.moveTo(0,H);
  x.lineTo(0,700); x.lineTo(120,610); x.lineTo(250,700); x.lineTo(390,585); x.lineTo(530,690); x.lineTo(W,620); x.lineTo(W,H); x.closePath(); x.fill();
  /* 글 */
  x.textAlign='center';
  x.fillStyle='#ffe9a8'; x.font='700 40px "Noto Sans KR",sans-serif';
  x.fillText('2026 한가위 소원', W/2, 452);
  x.fillStyle='#ffffff'; x.font='500 31px "Noto Sans KR",sans-serif';
  const endY=wrapText(x,wish,W/2,520,W-120,46);
  x.fillStyle='#d8d2c2'; x.font='400 24px "Noto Sans KR",sans-serif';
  x.fillText('더도 말고 덜도 말고 한가위만 같아라', W/2, Math.min(endY+70,800));
  if(who){ x.fillStyle='#e8a33d'; x.font='700 28px "Noto Sans KR",sans-serif'; x.fillText('— '+who, W/2, Math.min(endY+118,850)); }
  x.strokeStyle='#e8a33d55'; x.lineWidth=4; x.strokeRect(16,16,W-32,H-32);
  const url=c.toDataURL('image/png');
  $('cardbox').innerHTML=`<img class="wishcard" src="${url}" alt="소원 카드">
    <div class="tbar"><a class="btn dark" href="${url}" download="한가위-소원카드.png">💾 그림으로 저장</a>
    <button class="btn ghost" data-a="makecard" style="background:#0002;color:var(--ink);border-color:var(--line)">다시 만들기</button></div>
    <div class="small" style="text-align:center;margin-top:8px">저장이 안 되면 카드를 <b>길게 눌러</b> 이미지로 저장할 수 있어.</div>`;
  S.endSeen=true;
}

/* ═══════════════ 클릭 한 군데서 받기 ═══════════════ */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, v=b.dataset.v;
  SND.init();
  switch(a){
    case 'go': go(v); break;
    case 'home': SND.click(); go('home'); break;
    case 'ovlclose': ovlClose(); break;
    case 'sound':
      SND.vol=SND.vol>0?0:.55; $('sndbtn').textContent=SND.vol>0?'🔊':'🔇';
      toast(SND.vol>0?'소리 켬':'소리 끔'); break;
    case 'reset':
      if(b.dataset.sure){ localStorage.removeItem(KEY); location.reload(); }
      else { b.dataset.sure='1'; b.textContent='정말?'; toast('한 번 더 누르면 처음부터 시작해');
             setTimeout(()=>{ b.dataset.sure=''; b.textContent='↺'; },3000); }
      break;
    case 'm1w': m1pick('w',v); break;
    case 'm1d': m1pick('d',v); break;
    case 'm2start': M2.phase='play'; SND.click(); go('m2'); break;
    case 'm2tap': m2tap(); break;
    case 'm2ans': m2ans(v); break;
    case 'm3food': m3food(v); break;
    case 'm3slot': m3slot(+v); break;
    case 'm3check': m3check(); break;
    case 'm3ox': m3ox(v); break;
    case 'm4pick': m4pick(v); break;
    case 'm4done': finish(4,'반달 송편에는 「앞으로 더 좋아지기를」 하는 바람이 담겼다.'); break;
    case 'm5start': M5.round=1; M5.hit=0; M5.total=0; SND.click(); go('m5'); break;
    case 'm5tap': m5tap(); break;
    case 'm5done': finish(5,'앞도 뒤도 없는 둥근 원 — 강강술래.'); break;
    case 'm6o': m6pick('o',v); break;
    case 'm6n': m6pick('n',v); break;
    case 'm6keep': m6keep(v); break;
    case 'finishnow': finish(+v, PEND[v]); break;
    case 'm6next': M6.step='keep'; render(); window.scrollTo(0,0); break;
    case 'makecard': makeCard(); break;
    case 'qrbig':
      document.getElementById('ovlbox').innerHTML='<div style="background:#fff;padding:18px;border-radius:18px">'+
        QR.main.replace(/width="[0-9]+"/,'width="300"').replace(/height="[0-9]+"/,'height="300"')+'</div>'+
        '<button class="btn" data-a="ovljust" style="margin-top:14px">닫기</button>';
      document.getElementById('ovl').classList.add('on'); break;
    case 'ovljust': document.getElementById('ovl').classList.remove('on'); break;
  }
});

const origGo=go;
go=function(v){
  if(v==='m1'&&S.done[1]){ M1.got={}; M1.sel=null; }
  if(v==='m2'&&M2.phase!=='play'&&M2.phase!=='ask'){ M2.phase='intro'; }
  if(v==='m3'&&S.done[3]){ M3.step='set'; M3.slots=[null,null,null,null,null,null]; M3.ox={}; }
  if(v==='m4'&&S.done[4]){ M4.step=1; M4.so=null; M4.shape=null; M4.leaf=null; }
  if(v==='m5'&&S.done[5]&&M5.round>M5.rounds.length){ M5.round=0; M5.running=false; }
  if(v==='m6'&&S.done[6]){ M6.step='match'; M6.matched={}; M6.sel=null; M6.keep=null;
                           M6.shuffled=M6.pairs.slice().sort(()=>Math.random()-.5); }
  origGo(v);
};
