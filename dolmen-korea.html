<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>왜 한반도에 고인돌이 이렇게 많을까 — 형태와 구성으로 읽는 이유</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#1e2630; --stone:#3f4a58; --stone2:#5d6b7b;
  --moss:#2f7350; --earth:#a4652f; --rust:#b8442c; --gold:#bd8a24; --sky:#2c6a97;
  --paper:#f5f2ea; --line:#ddd6c7; --muted:#6e6c66;
}

html,body{
  height:100%;background:#101820;font-family:'Noto Sans KR',sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  user-select:none;overflow:hidden;
}

#stage{
  position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;background:var(--paper);overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.slide{position:absolute;inset:0;padding:34px 50px;display:none;
       flex-direction:column;background:var(--paper);--acc:var(--stone)}
.slide.on{display:flex}
.slide::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 10% 6%,rgba(189,138,36,.10),transparent 45%),
             radial-gradient(circle at 94% 96%,rgba(63,74,88,.10),transparent 48%)}
.slide>*{position:relative;z-index:1}

/* ===== 타이포 ===== */
.eyebrow{display:inline-block;font-size:20px;font-weight:700;letter-spacing:.02em;
         color:#fff;background:var(--acc);padding:5px 17px;border-radius:999px;margin-bottom:9px;align-self:flex-start}
h1.title{font-size:56px;font-weight:900;color:var(--stone);line-height:1.16;letter-spacing:-.02em}
h2.stitle{font-size:38px;font-weight:900;color:var(--acc);line-height:1.2;letter-spacing:-.02em}
.rule{width:88px;height:7px;border-radius:4px;
      background:linear-gradient(90deg,var(--rust),var(--gold));margin:9px 0 15px}
p.body{font-size:25px;line-height:1.56;color:var(--ink);font-weight:500}
p.body+p.body{margin-top:11px}
.small{font-size:21px;line-height:1.52}
.tiny{font-size:17px;line-height:1.48}
.mut{color:var(--muted)}
.src{font-size:16px;color:var(--muted);font-weight:600;margin-top:auto;padding-top:10px}

b.hl{font-weight:900;color:var(--rust);background:linear-gradient(transparent 62%,rgba(184,68,44,.20) 62%);padding:0 2px}
b.hn{font-weight:900;color:var(--sky);background:linear-gradient(transparent 62%,rgba(44,106,151,.18) 62%);padding:0 2px}
b.hg{font-weight:900;color:var(--moss);background:linear-gradient(transparent 62%,rgba(47,115,80,.18) 62%);padding:0 2px}

.cols{display:flex;gap:26px;flex:1;min-height:0;align-items:center}
.col{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}

/* ===== 카드류 ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;
      box-shadow:0 6px 16px rgba(30,25,15,.09)}
.card h3{font-size:23px;font-weight:900;color:var(--acc);margin-bottom:6px}
.card .d{font-size:20px;font-weight:500;color:var(--ink);line-height:1.45}

.term{background:#fff;border-left:9px solid var(--gold);border-radius:8px;padding:12px 16px;
      box-shadow:0 6px 16px rgba(30,25,15,.10)}
.term .t{font-size:22px;font-weight:900;color:var(--gold);margin-bottom:2px}
.term .d{font-size:20px;font-weight:500;color:var(--ink);line-height:1.45}

.why{display:flex;align-items:flex-start;gap:15px;background:#fff;border-radius:14px;
     border:1px solid var(--line);border-left:10px solid var(--wc);
     padding:12px 18px;box-shadow:0 5px 14px rgba(30,25,15,.09)}
.why .no{font-size:30px;font-weight:900;color:var(--wc);line-height:1.1;flex-shrink:0;width:42px}
.why .tx .t{font-size:22px;font-weight:900;color:var(--wc);margin-bottom:2px}
.why .tx .d{font-size:19px;font-weight:500;color:var(--ink);line-height:1.42}

.stat{display:flex;gap:12px}
.statbox{background:#fff;border-radius:14px;border:1px solid var(--line);padding:13px 10px;
         text-align:center;box-shadow:0 5px 14px rgba(30,25,15,.09);flex:1}
.statbox .n{font-size:42px;font-weight:900;color:var(--sc,var(--rust));line-height:1.05}
.statbox .n small{font-size:20px;font-weight:900}
.statbox .l{font-size:18px;font-weight:700;color:var(--ink);margin-top:4px;line-height:1.35}

.act{background:#fff;border:3px dashed var(--sky);border-radius:18px;padding:16px 20px}
.act-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.act-badge{background:var(--sky);color:#fff;font-weight:900;font-size:19px;
           padding:5px 15px;border-radius:999px;white-space:nowrap}
.act-t{font-size:24px;font-weight:900;color:var(--stone)}

.quote{background:#fff;border-left:9px solid var(--sky);border-radius:8px;padding:14px 18px;
       box-shadow:0 6px 16px rgba(30,25,15,.10)}
.quote .q{font-family:'Gaegu',sans-serif;font-size:29px;color:var(--sky);line-height:1.4;font-weight:700}

/* 원인 -> 결과 행 */
.irow{display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);
      border-radius:11px;overflow:hidden;box-shadow:0 4px 12px rgba(30,25,15,.08)}
.irow .see{flex:1;padding:10px 15px;font-size:20px;font-weight:700;color:var(--ink);
           display:flex;align-items:center;line-height:1.32}
.irow .arw{width:42px;background:#efeadd;display:flex;align-items:center;justify-content:center;
           font-size:21px;font-weight:900;color:var(--rust);flex-shrink:0}
.irow .kno{flex:1.1;padding:10px 15px;font-size:20px;font-weight:700;
           display:flex;align-items:center;line-height:1.32;background:#fbf9f4;color:var(--sky)}

/* 표 */
table.cmp{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;
          box-shadow:0 6px 16px rgba(30,25,15,.09);font-size:19px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:9px 11px;text-align:center;line-height:1.35}
table.cmp th{background:var(--stone);color:#fff;font-weight:900;font-size:20px}
table.cmp td.h{background:#f3efe4;font-weight:900;color:var(--stone);text-align:left}
table.cmp td b{color:var(--rust);font-weight:900}

/* 도해 박스 */
.fig{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 10px 6px;
     box-shadow:0 8px 20px rgba(30,25,15,.11)}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{font-size:17px;color:#5a5750;font-weight:700;text-align:center;padding:6px 4px 4px;line-height:1.35}

/* 표지 */
.cover{justify-content:center;background:linear-gradient(160deg,#22303d 0%,#38474f 55%,#4d5a52 100%)}
.cover::after{display:none}
.cover .kicker{color:#f0cf86;font-size:22px;font-weight:700;margin-bottom:12px}
.cover h1{color:#fff;font-size:58px;font-weight:900;line-height:1.16;letter-spacing:-.02em}
.cover h1 em{font-style:normal;color:#ffd071}
.cover .sub{color:#d6ddd8;font-size:23px;font-weight:500;margin-top:16px;line-height:1.5}
.cover .hint{position:absolute;right:50px;bottom:40px;font-size:17px;font-weight:500;
             color:#a9b6b0;letter-spacing:.01em}

/* 하단 바 */
.bar{position:fixed;left:0;right:0;bottom:0;height:46px;background:#141f2a;color:#cfd8e6;
     display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;z-index:50}
.bar button{background:#25384c;color:#e8eef7;border:0;border-radius:7px;padding:7px 13px;
            font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;min-height:34px}
#prog{position:fixed;left:0;top:0;height:4px;background:var(--stone2);z-index:60;transition:width .18s}
.zone{position:fixed;top:0;bottom:46px;width:12%;z-index:40;cursor:pointer}
#zl{left:0}#zr{right:0}
</style>
</head>
<body>

<div id="prog"></div>
<div id="stage"></div>
<div class="zone" id="zl"></div>
<div class="zone" id="zr"></div>
<div class="bar">
  <button onclick="go(-1)">◀ 이전</button>
  <button onclick="go(1)">다음 ▶</button>
  <span id="counter"></span>
  <span style="flex:1"></span>
  <span class="mut" style="color:#8fa0b3">← → 넘기기 · F 전체화면 · 화면 좌우 탭</span>
  <button onclick="fs()">전체화면</button>
</div>

<script>
const SLIDES = [

/* ===== 1. 표지 ===== */
`<section class="slide cover">
  <div class="kicker">사회 · 역사 탐구 | 청동기 시대 사람들이 남긴 돌</div>
  <h1>전 세계 고인돌의 절반 가까이가<br><em>한반도</em>에 서 있다</h1>
  <div class="sub">왜 하필 여기일까? — 고인돌의 <b style="color:#ffd071">생김새</b>와 <b style="color:#ffd071">구성</b>을 뜯어보면<br>그 이유가 그대로 나옵니다</div>
  <div class="hint">초등 사회 · 수업용 슬라이드 18장</div>
</section>`,

/* ===== 2. 숫자 ===== */
`<section class="slide" style="--acc:var(--rust)">
  <div class="eyebrow">먼저 숫자부터</div>
  <h2 class="stitle">세계에서 고인돌이 가장 빽빽한 땅</h2>
  <div class="rule"></div>
  <div class="stack" style="flex:1;justify-content:center;gap:20px">
    <div class="stat">
      <div class="statbox" style="--sc:var(--stone)"><div class="n">약 6만<small> 기</small></div><div class="l">전 세계 고인돌<br>(유럽·아시아 전체)</div></div>
      <div class="statbox" style="--sc:var(--rust)"><div class="n">약 4만<small> 기</small></div><div class="l">한반도 고인돌<br>(남한 약 3만 5천 기)</div></div>
      <div class="statbox" style="--sc:var(--moss)"><div class="n">3<small> 곳</small></div><div class="l">유네스코 세계유산<br>고창 · 화순 · 강화</div></div>
    </div>
    <p class="body">남한 땅 넓이는 지구 육지의 <b class="hn">0.07%</b>도 안 됩니다.<br>
    그런데 세계 고인돌의 <b class="hl">절반 가까이</b>가 이 좁은 땅에 몰려 있습니다.</p>
    <div class="quote"><div class="q">면적으로 따지면 세계에서 가장 촘촘한 &lsquo;돌무덤 밀집 지역&rsquo;이에요.</div></div>
  </div>
  <div class="src">※ 고인돌 수는 지표조사 기준 추정치 · 고창·화순·강화 고인돌 유적은 2000년 유네스코 세계유산 등재</div>
</section>`,

/* ===== 3. 고인돌이란 ===== */
`<section class="slide" style="--acc:var(--stone)">
  <div class="eyebrow">먼저 정의</div>
  <h2 class="stitle">고인돌 = &lsquo;고여 놓은 돌&rsquo;, 청동기 시대의 무덤</h2>
  <div class="rule"></div>
  <div class="cols">
    <div class="col stack">
      <div class="term"><div class="t">이름의 뜻</div><div class="d">돌을 <b class="hl">괴어(고여)</b> 놓았다 → 고인돌.<br>영어 dolmen도 &lsquo;돌 탁자&rsquo;라는 뜻입니다.</div></div>
      <div class="term" style="border-color:var(--moss)"><div class="t" style="color:var(--moss)">언제</div><div class="d">청동기 시대, 대략 <b class="hg">기원전 1000년 ~ 기원전 300년</b>.<br>700년 넘게 계속 만들어졌습니다.</div></div>
      <div class="term" style="border-color:var(--sky)"><div class="t" style="color:var(--sky)">무엇</div><div class="d">기본은 <b class="hn">무덤</b>입니다. 여기에 마을의 표지·제사 장소 역할이 겹쳤습니다.</div></div>
    </div>
    <div class="col" style="flex:.95">
      <div class="fig">
        <svg viewBox="0 0 320 210" role="img" aria-label="고인돌 기본 구조: 지면 아래 무덤방, 굄돌, 그 위 덮개돌">
          <rect x="0" y="140" width="320" height="70" fill="#e6d8bd"/>
          <path d="M0 140 H320" stroke="#b9a582" stroke-width="2"/>
          <path d="M0 140 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0 q10 -6 20 0" fill="none" stroke="#8fae76" stroke-width="3"/>
          <rect x="118" y="152" width="84" height="40" fill="#cbb896" stroke="#8a7a5c" stroke-width="2"/>
          <rect x="126" y="158" width="68" height="28" fill="#4a4238"/>
          <rect x="82" y="86" width="26" height="54" fill="#8c96a1" stroke="#5d6b7b" stroke-width="2"/>
          <rect x="212" y="86" width="26" height="54" fill="#8c96a1" stroke="#5d6b7b" stroke-width="2"/>
          <path d="M48 86 L272 86 L262 60 L58 60 Z" fill="#9aa5b0" stroke="#5d6b7b" stroke-width="2"/>
          <text x="160" y="50" font-size="15" font-weight="700" fill="#3f4a58" text-anchor="middle" font-family="Noto Sans KR">덮개돌 (상석)</text>
          <text x="60" y="120" font-size="14" font-weight="700" fill="#3f4a58" text-anchor="end" font-family="Noto Sans KR">굄돌</text>
          <text x="245" y="176" font-size="14" font-weight="700" fill="#7a5b32" text-anchor="start" font-family="Noto Sans KR">무덤방</text>
          <path d="M62 116 L80 110" stroke="#5d6b7b" stroke-width="2"/>
          <path d="M242 172 L204 172" stroke="#7a5b32" stroke-width="2"/>
        </svg>
        <div class="cap">▲ 가장 기본이 되는 구조 — 덮개돌 · 굄돌 · 무덤방</div>
      </div>
    </div>
  </div>
</section>`,

/* ===== 4. 구성 해부 ===== */
`<section class="slide" style="--acc:var(--gold)">
  <div class="eyebrow">구성 해부</div>
  <h2 class="stitle">고인돌은 &lsquo;돌 한 덩이&rsquo;가 아니다</h2>
  <div class="rule"></div>
  <div class="cols" style="gap:22px">
    <div class="col" style="flex:1.25">
      <div class="fig">
        <svg viewBox="0 0 460 250" role="img" aria-label="고인돌의 구성 요소 해부도">
          <rect x="0" y="150" width="460" height="100" fill="#e6d8bd"/>
          <path d="M0 150 H460" stroke="#b9a582" stroke-width="2"/>
          <ellipse cx="230" cy="150" rx="185" ry="16" fill="#d9c7a3" stroke="#b9a582" stroke-width="2"/>
          <g fill="#c3b291" stroke="#9d8a66" stroke-width="1.5">
            <circle cx="70" cy="150" r="9"/><circle cx="94" cy="156" r="7"/><circle cx="366" cy="152" r="9"/><circle cx="392" cy="157" r="7"/>
            <circle cx="120" cy="163" r="7"/><circle cx="340" cy="164" r="7"/>
          </g>
          <rect x="176" y="164" width="108" height="52" fill="#cbb896" stroke="#8a7a5c" stroke-width="2"/>
          <rect x="184" y="171" width="92" height="38" fill="#4a4238"/>
          <g stroke="#e8dcc0" stroke-width="2.5" fill="none">
            <path d="M198 200 L214 182"/><path d="M240 196 L262 196"/>
          </g>
          <circle cx="228" cy="188" r="4" fill="#c98c3c"/>
          <rect x="132" y="96" width="30" height="54" fill="#8c96a1" stroke="#5d6b7b" stroke-width="2"/>
          <rect x="298" y="96" width="30" height="54" fill="#8c96a1" stroke="#5d6b7b" stroke-width="2"/>
          <path d="M86 96 L374 96 L360 62 L100 62 Z" fill="#9aa5b0" stroke="#5d6b7b" stroke-width="2.5"/>
          <path d="M100 62 L374 96" stroke="#b6bfc8" stroke-width="1.5"/>
          <text x="230" y="84" font-size="16" font-weight="700" fill="#26313d" text-anchor="middle" font-family="Noto Sans KR">① 덮개돌</text>
          <text x="118" y="122" font-size="15" font-weight="700" fill="#3f4a58" text-anchor="end" font-family="Noto Sans KR">② 굄돌</text>
          <path d="M122 118 L134 116" stroke="#5d6b7b" stroke-width="2"/>
          <text x="352" y="196" font-size="15" font-weight="700" fill="#7a5b32" text-anchor="start" font-family="Noto Sans KR">③ 무덤방</text>
          <path d="M348 192 L286 192" stroke="#7a5b32" stroke-width="2"/>
          <text x="452" y="140" font-size="15" font-weight="700" fill="#5d6b7b" text-anchor="end" font-family="Noto Sans KR">④ 묘역시설</text>
          <path d="M414 144 L404 152" stroke="#5d6b7b" stroke-width="2"/>
          <text x="230" y="238" font-size="15" font-weight="700" fill="#b8442c" text-anchor="middle" font-family="Noto Sans KR">⑤ 껴묻거리(부장품)</text>
        </svg>
        <div class="cap">▲ 하나의 고인돌을 세로로 잘라 본 모습</div>
      </div>
    </div>
    <div class="col stack" style="gap:9px">
      <div class="card" style="padding:10px 15px"><h3 style="font-size:21px;margin-bottom:3px">① 덮개돌(상석)</h3><div class="d" style="font-size:18px">맨 위 큰 돌. 무게 <b class="hl">10~50톤</b>, 큰 것은 200톤이 넘습니다.</div></div>
      <div class="card" style="padding:10px 15px;--acc:var(--sky)"><h3 style="font-size:21px;margin-bottom:3px">② 굄돌(지석)</h3><div class="d" style="font-size:18px">덮개돌을 받치는 돌. <b class="hn">있느냐·몇 개냐</b>에 따라 형태 이름이 갈립니다.</div></div>
      <div class="card" style="padding:10px 15px;--acc:var(--earth)"><h3 style="font-size:21px;margin-bottom:3px">③ 무덤방</h3><div class="d" style="font-size:18px">시신을 눕힌 칸. 돌널·돌덧널·구덩이 등 여러 방식.</div></div>
      <div class="card" style="padding:10px 15px;--acc:var(--moss)"><h3 style="font-size:21px;margin-bottom:3px">④ 묘역시설</h3><div class="d" style="font-size:18px">둘레에 깐 돌·구획석. &ldquo;여기까지가 우리 무덤&rdquo; 표시.</div></div>
      <div class="card" style="padding:10px 15px;--acc:var(--rust)"><h3 style="font-size:21px;margin-bottom:3px">⑤ 껴묻거리</h3><div class="d" style="font-size:18px">간돌검, 돌화살촉, 붉은간토기, 대롱옥, 드물게 <b class="hl">비파형동검</b>.</div></div>
    </div>
  </div>
</section>`,

/* ===== 5. 탁자식 ===== */
`<section class="slide" style="--acc:var(--sky)">
  <div class="eyebrow">형태 ① 탁자식 (북방식)</div>
  <h2 class="stitle">굄돌 위에 얹은 &lsquo;돌 탁자&rsquo;</h2>
  <div class="rule"></div>
  <div class="cols">
    <div class="col" style="flex:1.05">
      <div class="fig">
        <svg viewBox="0 0 320 200" role="img" aria-label="탁자식 고인돌 단면">
          <rect x="0" y="130" width="320" height="70" fill="#e6d8bd"/><path d="M0 130 H320" stroke="#b9a582" stroke-width="2"/>
          <rect x="76" y="52" width="26" height="78" fill="#8c96a1" stroke="#5d6b7b" stroke-width="2"/>
          <rect x="218" y="52" width="26" height="78" fill="#8c96a1" stroke="#5d6b7b" stroke-width="2"/>

        <div class="act-h"><span class="act-badge" style="background:var(--moss)">활동 2</span><span class="act-t">20톤을 옮겨라</span></div>
        <p class="small">유담이네 마을이 20톤 덮개돌을 옮기려 합니다. 필요한 <b class="hg">사람 수·도구·걸리는 날</b>을 모둠에서 계획해 보세요.</p>
      </div>
    </div>
    <div class="col stack" style="gap:12px">
      <div class="act" style="border-color:var(--rust)">
        <div class="act-h"><span class="act-badge" style="background:var(--rust)">활동 3</span><span class="act-t">비교 토론</span></div>
        <p class="small">진하는 &ldquo;유럽이 훨씬 먼저 시작했으니 더 많아야 한다&rdquo;고 말했습니다.<br>진하에게 <b class="hl">두 가지 이유</b>를 들어 설명해 주세요.</p>

      <div class="quote" style="border-color:var(--gold)">
        <div class="q" style="color:var(--gold);font-size:27px">고인돌은 &lsquo;돌덩이&rsquo;가 아니라<br>청동기 사람들이 남긴<br><b>가장 큰 기록</b>입니다.</div>
      </div>
      <p class="tiny mut">가까운 고인돌 유적: 강화 부근리 · 고창 죽림리 · 화순 효산리와 대신리 (모두 세계유산)</p>
    </div>
  </div>
</section>`,

];


const stage = document.getElementById('stage');
stage.innerHTML = SLIDES.join('');
const slides = [...stage.querySelectorAll('.slide')];

let cur = 0;
function show(i){
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s,n) => s.classList.toggle('on', n === cur));
  document.getElementById('counter').textContent = (cur+1) + ' / ' + slides.length;
  const p = document.getElementById('prog');
  p.style.width = ((cur+1)/slides.length*100) + '%';
  p.style.background = getComputedStyle(slides[cur]).getPropertyValue('--acc');
}
function go(d){ show(cur + d); }

function fit(){
  const s = Math.min(window.innerWidth/1280, (window.innerHeight-46)/720);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
function fs(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener('keydown', e => {
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); go(1); }
  if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(slides.length-1);
  if (e.key === 'f' || e.key === 'F') fs();
});
document.getElementById('zl').onclick = () => go(-1);
document.getElementById('zr').onclick = () => go(1);

let tx=0, ty=0;
document.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('resize', fit);
fit();
show(0);
</script>
