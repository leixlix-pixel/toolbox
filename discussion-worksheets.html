<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>의견을 조정해요 학습지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --ink:#1b2a33; --navy:#1a3a52; --acc:#2f7d75; --red:#b83227;
  --line:#c8d3da; --muted:#6b7c88; --tint:#f1f7f6; --tint2:#fdf6ec;
}
html,body{margin:0;padding:0}
body{
  font-family:'Noto Sans KR',sans-serif; color:var(--ink);
  background:#e9edf0; -webkit-print-color-adjust:exact; print-color-adjust:exact;
}

/* ── 화면 안내 바 ── */
.topbar{
  position:sticky; top:0; z-index:9; background:var(--navy); color:#fff;
  padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}
.topbar h1{margin:0; font-size:17px; font-weight:700; letter-spacing:-.3px}
.topbar p{margin:0; font-size:13px; color:#b9cfdd; flex:1; min-width:240px; line-height:1.5}
.topbar button{
  font-family:inherit; font-size:15px; font-weight:700; color:var(--navy); background:#ffd76e;
  border:0; border-radius:8px; padding:11px 22px; min-height:44px; cursor:pointer;
}
.topbar button:active{transform:translateY(1px)}

/* ── A4 ── */
@page{size:A4; margin:0}
.page{
  width:210mm; height:297mm; overflow:hidden; position:relative;
  padding:13mm 15mm 12mm; background:#fff; margin:18px auto;
  display:flex; flex-direction:column;
  box-shadow:0 3px 14px rgba(0,0,0,.14);
  break-after:page; page-break-after:always;
}
.page:last-of-type{break-after:auto; page-break-after:auto}

/* ── 머리 ── */
.head{flex:0 0 auto; border-bottom:2.5px solid var(--navy); padding-bottom:7px; margin-bottom:11px}
.hrow{display:flex; align-items:flex-end; gap:11px}
.no{
  flex:0 0 auto; width:34px; height:34px; border-radius:9px; background:var(--navy); color:#fff;
  font-size:19px; font-weight:900; display:flex; align-items:center; justify-content:center;
}
.htxt{flex:1; min-width:0}
.unit{font-size:10.5px; color:var(--acc); font-weight:700; letter-spacing:1.5px; margin-bottom:1px}
.ttl{font-size:20px; font-weight:900; letter-spacing:-.7px; line-height:1.15}
.name{flex:0 0 auto; font-size:11px; color:var(--muted); padding-bottom:2px; white-space:nowrap}

/* ── 본문 ── */
.pbody{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:space-between; gap:9px}
.sec{display:flex; flex-direction:column; min-height:0}
.sh{display:flex; align-items:center; gap:7px; margin-bottom:5px; flex:0 0 auto}
.sn{
  width:19px; height:19px; border-radius:50%; background:var(--acc); color:#fff;
  font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.st{font-size:13.5px; font-weight:700; letter-spacing:-.3px}
.time{
  font-size:10px; font-weight:700; color:var(--acc); background:var(--tint);
  border:1px solid #cfe3e0; border-radius:20px; padding:2px 8px; margin-left:auto; white-space:nowrap;
}

.situ{
  font-size:12.5px; line-height:1.62; background:var(--tint2); border-left:3.5px solid #e0b96a;
  padding:8px 11px; border-radius:0 6px 6px 0; margin-bottom:6px; flex:0 0 auto;
}
.situ b{font-weight:700; color:var(--red)}
.ask{font-size:13px; font-weight:700; line-height:1.5; margin-bottom:6px; flex:0 0 auto; color:var(--navy)}

.opts{display:flex; flex-wrap:wrap; gap:5px 14px; margin-bottom:6px; flex:0 0 auto}
.opt{display:flex; align-items:center; gap:5px; font-size:12px; line-height:1.3}
.opt i{
  width:12px; height:12px; border:1.6px solid #8fa0ad; border-radius:2.5px;
  flex:0 0 auto; display:block;
}

.collab{display:flex; font-size:10.5px; color:var(--muted); font-weight:700; margin-bottom:2px; flex:0 0 auto}
.collab span:first-child{width:86px; flex:0 0 auto; padding-left:6px}
.collab span:last-child{padding-left:8px}
.hint{font-size:11px; color:var(--muted); line-height:1.5; margin-bottom:5px; flex:0 0 auto}

svg.grid{flex:1 1 0; width:100%; display:block}

/* 교과서 확인 */
.check{
  border:1.5px dashed #b8ccc9; background:#fafdfc; border-radius:7px;
  padding:8px 11px 9px; flex:0 0 auto;
}
.ci{display:flex; align-items:flex-end; gap:6px; font-size:12px; line-height:1.85; margin-top:1px}
.ci:first-child{margin-top:0}
.ci span{flex:0 0 auto}
.ci u{flex:1; min-width:30px; border-bottom:1px solid #b6c4cc; text-decoration:none; height:15px}
.ci em{flex:0 0 auto; font-style:normal; color:var(--muted); font-size:11px}

.more{
  font-size:11.5px; line-height:1.55; color:var(--navy); background:#f4f7fa;
  border-radius:6px; padding:7px 10px; margin-top:6px; flex:0 0 auto;
}
.more b{color:var(--red)}

/* ── 국어 4단원 전용 ── */

/* 1차시 · 토의로 정할 수 있나 가르기 */
.sort{border-collapse:collapse; width:100%; font-size:11.5px; flex:0 0 auto}
.sort th{background:var(--tint); font-size:10px; padding:4px 3px; border:1px solid #b6c5cd; line-height:1.25}
.sort td{border:1px solid #b6c5cd; padding:3px 7px; height:22px}
.sort td.c{text-align:center; width:52px; color:#c3cfd6; font-size:13px}
.sort td.q{font-size:11.5px}

/* 1차시 뒷쪽 · 옛 회의 카드 */
.hcards{flex:1; display:flex; flex-direction:column; gap:0}
.hc{flex:1; border:1.5px solid #9fb2bd; margin:-.75px; padding:9px 13px 10px; display:flex; flex-direction:column}
.hch{display:flex; align-items:baseline; gap:9px; border-bottom:1.5px solid var(--navy); padding-bottom:4px; margin-bottom:6px}
.hch b{font-size:16px; font-weight:900; color:var(--navy); letter-spacing:-.5px}
.hch em{font-style:normal; font-size:10.5px; color:var(--muted)}
.hrw{display:flex; gap:8px; font-size:11.5px; line-height:1.55; margin-bottom:3px}
.hrw span{flex:0 0 96px; font-weight:700; color:var(--acc); font-size:11px}
.hrw div{flex:1}
.hrw b{color:var(--red); font-weight:700}
.hbox{
  margin-top:5px; font-size:11px; line-height:1.55; background:#fdf1ef;
  border:1.2px solid #e8bfb8; border-radius:6px; padding:6px 9px;
}
.hbox b{color:var(--red)}
.hbox em{font-style:normal; color:var(--muted); font-size:10px}
.hmine{margin-top:auto; padding-top:7px; font-size:12px; font-weight:700; color:var(--navy)}
.hmine b{color:var(--red)}

/* 3차시 · 검토 기준 표 */
.crit{border-collapse:collapse; width:100%; font-size:11.5px; flex:0 0 auto}
.crit th{background:var(--tint); font-size:10.5px; padding:5px 4px; border:1px solid #b6c5cd; line-height:1.3}
.crit th.o{width:88px; font-size:11px}
.crit td{border:1px solid #b6c5cd; padding:5px 7px; height:30px; vertical-align:middle}
.crit td.k{font-size:11px; line-height:1.4}
.crit td.c{text-align:center; color:#c3cfd6}
.crit tr.me td{background:#fffdf5}
.crit td.blank{color:#aab8c0; font-size:10.5px}
.ideas{display:flex; gap:0; flex:0 0 auto; margin-bottom:6px}
.idea{flex:1; border:1.4px solid #b6c5cd; margin:-.7px; padding:7px 9px; display:flex; flex-direction:column; gap:3px}
.idea b{font-size:12.5px; color:var(--navy)}
.idea small{font-size:11px; line-height:1.5; color:var(--ink)}

/* 4차시 · 주제 문장 틀 */
.topic{border:1.5px solid #b6c5cd; border-radius:7px; padding:9px 11px; flex:0 0 auto; margin-bottom:6px}
.tline{display:flex; align-items:flex-end; gap:6px; font-size:14px; font-weight:700; color:var(--navy); line-height:1.6}
.tline u{flex:1; border-bottom:1.4px solid #93a6b1; text-decoration:none; height:22px}
.trow{display:flex; align-items:flex-end; gap:8px; font-size:11.5px; height:27px}
.trow span{flex:0 0 74px; font-weight:700; color:var(--acc); padding-bottom:3px}
.trow u{flex:1; border-bottom:1px solid #b6c4cc; text-decoration:none; height:100%}

/* 4차시 뒷쪽 · 집행 시뮬레이션 카드 */
.sims{flex:1; display:flex; flex-direction:column; gap:0}
.sim{flex:1; border:1.5px solid #9fb2bd; margin:-.75px; padding:8px 13px; display:flex; flex-direction:column}
.simh{display:flex; align-items:baseline; gap:9px; margin-bottom:3px}
.simn{
  width:21px; height:21px; border-radius:50%; background:var(--red); color:#fff; flex:0 0 auto;
  font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; align-self:center;
}
.simh b{font-size:13.5px; font-weight:900; color:var(--navy)}
.simq{font-size:11.5px; line-height:1.55; margin-bottom:4px}
.simq b{color:var(--red)}
.sima{display:flex; align-items:flex-end; gap:7px; font-size:10.5px; color:var(--muted); font-weight:700; margin-bottom:3px}

/* 5차시 · 학급 토의 기록 */
.rec{border-collapse:collapse; width:100%; font-size:11.5px}
.rec th{background:var(--tint); font-size:10.5px; padding:4px; border:1px solid #b6c5cd}
.rec td{border:1px solid #b6c5cd; padding:4px 7px; height:27px; vertical-align:middle}
.rec td.c{text-align:center; width:46px; color:#c3cfd6}
.rec td.n{width:96px; font-size:11px}
.big{
  border:1.5px solid #b6c5cd; border-radius:7px; background:#fafdfc;
  padding:8px 11px; flex:0 0 auto;
}
.big .bt{font-size:11px; font-weight:700; color:var(--acc); margin-bottom:3px}

.foot{
  flex:0 0 auto; margin-top:9px; padding-top:6px; border-top:1px solid var(--line);
  font-size:10px; color:var(--muted); line-height:1.5; display:flex; justify-content:space-between; gap:12px;
}

@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .page{margin:0; box-shadow:none}
}
</style>
</head>
<body>

<div class="topbar no-print">
  <h1>국어 4단원 의견을 조정해요 · 학습지 6차시</h1>
  <p>5학년 2학기 국어 나 4단원 · 교과서 178~207쪽 · 차시마다 <b>먼저 생각 → 교과서 읽기 → 다시 판단</b> 순서입니다. 교과서를 먼저 읽히면 효과가 줄어듭니다. 읽기 자료(198~199쪽)를 <b>2차시로 앞당겼습니다.</b> 1차시 뒤에 옛 회의 카드 1쪽, 4차시 뒤에 집행 카드 1쪽이 붙어 모두 8쪽.</p>
  <button onclick="window.print()">인쇄하기</button>
</div>

<div id="out"></div>

<script>
const SHEETS=[

/* ───────────────────────── 1차시 ───────────────────────── */

 checkTitle:'이제 다음 쪽 카드를 읽습니다 — 실제로 있었던 회의 셋',

 more:'아테네는 <b>절차를 정확히 지켜서</b> 사람을 쫓아냈습니다 — 정한 대로 했는데도 결과가 옳지 않을 수 있습니다. 그리고 세 회의 모두 <b>그 자리에 없던 사람</b>이 있었습니다.'

/* 1차시 뒷쪽 · 옛 회의 카드 */
{ special:'history', no:1, unit:'읽기 카드', pages:'178~181', title:'옛날 사람들은 어떻게 정했을까' },

/* ───────────────────────── 2차시 ───────────────────────── */

 ask2:'잘못한 사람이 없는데 문제가 생겼다면, 토의에서 <b>무엇을 정해야</b> 할까요? 그리고 우리 학교나 우리 동네에서 <b>이런 문제</b>를 하나 찾아 쓰세요.',

},

/* ───────────────────────── 3차시 ───────────────────────── */
{
 no:3, unit:'의견을 조정하는 방법', pages:'182~187',
 title:'무엇을 보고 고를까 — 검토 기준 만들기',
 t:[6,8,10,8], g1:.40, g2:.22,
 situ:'우리 반 문제 하나: <b>쉬는 시간에 교실이 너무 시끄럽다.</b> 세 사람이 각각 이런 방법을 냈어.',

function optsHTML(list){
  if(!list || !list.length) return '';
  return '<div class="opts">' + list.map(o=>'<span class="opt"><i></i>'+o+'</span>').join('') + '</div>';
}
function checkHTML(list){
  return '<div class="check">' + list.map(c=>
    '<div class="ci"><span>'+c[0]+'</span><u></u><em>'+c[1]+'</em></div>'
  ).join('') + '</div>';
}
function tm(s,i){ const d=[5,8,9,6]; return (s.t&&s.t[i])||d[i]; }

/* 1·2차시 · 가르기 표 */
function sortHTML(s){
  if(!s.sort) return '';
  const cols = s.sortCols || ['토의로<br>정할 수 있다','토의로<br>정하면 안 된다','모르겠다'];
  return '<table class="sort"><tr><th></th>'
   + cols.map(c=>'<th>'+c+'</th>').join('') + '</tr>'
   + s.sort.map(q=>'<tr><td class="q">'+q+'</td>'+cols.map(()=>'<td class="c">○</td>').join('')+'</tr>').join('')
   + '</table>'
   + (s.sortAsk?'<div class="ask" style="font-size:12px;margin:7px 0 4px">'+s.sortAsk+'</div>':'');
}
/* 3차시 · 의견 셋 + 기준 표 */
function ideasHTML(s){
  if(!s.ideas) return '';

}

      '<div class="sim"><div class="simh"><div class="simn">'+(i+1)+'</div><b>'+c[0]+'</b></div>'
      + '<div class="simq">'+c[1]+'</div>'

  + footHTML(s,'막힌 방법을 <b>버리지 마세요.</b> 어디서 막혔는지가 고칠 자리를 알려 줍니다.','모둠 카드')
  + '</div>';
}

/* 5차시 · 학급 토의 기록지 */

  + '<div class="pbody">'

  +   '<div class="hint" style="margin-top:4px">④ 칸에는 <b>3차시에 우리 반이 만든 기준</b>을 씁니다. 표시만 하지 말고, 왜 그 표시인지 한 번은 말로 해 보세요.</div></div>'

  + '<div class="sec" style="flex-grow:.28"><div class="sh"><div class="sn">3</div><div class="st">합의점 찾기 — 고쳐 쓴 의견</div><div class="time">10분</div></div>'
  +   '<div class="hint">모두가 동의할 만한 <b>하나의 의견</b>으로 고쳐 씁니다. 내 의견이 그대로 남지 않아도 됩니다. <b>어느 부분을 양보했는지</b>도 함께 쓰세요.</div>'

  +   '<div class="big"><div class="bt">결정한 의견 — 누가 · 언제 · 어떻게 하는지까지 씁니다</div>'
  +   '<svg class="grid" data-mode="lines" data-pitch="26" style="min-height:52px"></svg></div></div>'

  + '<div class="sec"><div class="sh"><div class="sn">5</div><div class="st">되돌아보기</div><div class="time">혼자 4분</div></div>'
  +   '<div class="ask" style="font-size:12.5px">오늘 토의에서 <b>한 번도 말하지 않은 사람</b>이 있었나요? 몇 명쯤이었나요? 그 사람들의 생각은 우리가 결정한 것에 들어갔나요?</div>'
  +   '<svg class="grid" data-mode="lines" data-pitch="27" style="min-height:52px"></svg>'

  + '</div>'
  + footHTML(s,'<b>내 의견이 채택되지 않아도</b> 절차를 함께 지켰다면 결정을 따릅니다(교과서 197쪽). 대신 다음에 고칠 수 있습니다 — 세종도 14년에 걸쳐 고쳤습니다.','')

document.getElementById('out').innerHTML = SHEETS.map(s=>
    s.special==='history'   ? historyPage(s)
  : s.special==='sim'       ? simPage(s)
  : s.special==='classroom' ? classroomPage(s)
  : pageHTML(s)).join('');

/* ── 격자는 SVG 선으로 긋는다 (CSS 테두리는 인쇄 시 세로선이 사라진다) ── */
function drawGrid(svg){
  const r = svg.getBoundingClientRect();
  const w = Math.round(r.width), h = Math.round(r.height);
  if(w < 20 || h < 20) return;
  const pitch = +svg.dataset.pitch || 28;
  const rows = Math.max(1, Math.round(h / pitch));
  const rh = h / rows;
  let s = '<rect x="0.8" y="0.8" width="'+(w-1.6)+'" height="'+(h-1.6)+'" rx="5" fill="none" stroke="#b6c5cd" stroke-width="1.6"/>';
  for(let i=1;i<rows;i++){
    const y = +(i*rh).toFixed(2);
    s += '<line x1="1.6" y1="'+y+'" x2="'+(w-1.6)+'" y2="'+y+'" stroke="#dce3e9" stroke-width="1.1"/>';
  }
  if(svg.dataset.mode === 'named'){
    s += '<line x1="86" y1="1.6" x2="86" y2="'+(h-1.6)+'" stroke="#dce3e9" stroke-width="1.1"/>';
  }
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('preserveAspectRatio','none');
  svg.innerHTML = s;
}
function drawAll(){ document.querySelectorAll('svg.grid').forEach(drawGrid); }

drawAll();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);
window.addEventListener('load', drawAll);
window.addEventListener('resize', drawAll);
window.addEventListener('beforeprint', drawAll);
</script>
